l."},{"do":"point at the closing line","group":"under all five: OWL open-world infers, SHACL closed-world validates — both run here"},{"say":"Which is the pattern under all five."},{"say":"OWL infers under an **open** world — it derives what must follow, never what is missing."},{"say":"SHACL validates under a **closed** one."},{"say":"Both run here: HermiT at build time, SHACL as a gate over the built graph in CI."},{"say":"Two of these five rows are SHACL's half of the job, not the reasoner's."}],"why":["10 to 11 is the hard turn in the deck — external proof to limits — and unmarked, the change of register reads as retreat. That is what the first sentence is for: it names the join before it names the limit.","Register is recommendations, not confession. Every row has a direction beside it. Neither of his decks carries a limitations slide — not even the one titled *Limits and solutions* — so the form itself is unfamiliar to him, and it only works if each limit arrives with what carrying it would take. His issue guide asks for exactly that pairing.","The omega-transaminase row is the one that must land. His lab screens amine transaminases — LARA advertises fully automated transaminase high-throughput screening — so if it is not on the slide he will construct it himself. Volunteered, it is a design answer, and it concedes the class name in passing rather than under pressure; extracted, it is a miss.","The five rows are not a slide-only concession. `schema.py` says the same thing in the `TransaminationReaction` docstring — that nothing there constrains atom transfer, mass balance, additional participants or PLP dependence, and that the mechanism is a datum on the enzyme. The slide is the shipped code read out loud.","Formula and charge are carried per entity in `reference_data.py` but are *not* emitted as triples, so the SHACL route to a balance check needs them in the graph first. A build-time check could read the reference data directly. Worth knowing before offering SHACL as the cheap option.","\"Both run\" is literal. `shacl-validation` in the verify stage runs `tacat build` and then pyshacl over the built graph and over `data/dataset.ttl`, against six node shapes in `data/shapes.ttl`, with `--metashacl` so a typo in the shapes file cannot pass green.","The test for what gets volunteered is whether a limit is conceptual, unsolved, and bears on the approach. All five rows pass it. The scanner defect does not — it is a solved implementation bug, orthogonal to whether this is the right way to represent catalysis reactions — and this slide is the place it would most easily be smuggled in."],"plan":["Second to drop if the clock has gone, after slide 5 — slide 13's drop order says the same, and it stops there: never the engineering section, never 18.","If it stays and the clock is tight, the omega-transaminase row alone carries the slide, and the closing OWL/SHACL line still works straight after it.","Nothing live here, so there is nothing to fall back on — the only failure mode is running long. This and slide 6 are the deck's two five-row tables and the two most likely to be rushed."],"ask":[{"q":"take an amine transaminase — does your reasoner classify it?","say":"No — **not as defined**; what I wrote is alpha-transamination, and the class name overclaims it.","then":["An omega-/amine transaminase runs amine plus keto acid, not amino acid plus 2-oxo acid.","So there is no amino-acid donor and no 2-oxo-acid product — two of the four conjuncts fail.","The three reactions I ship are alpha-transaminations, so the signature **does fit what it covers**.","Fix is a hierarchy: a broader transfer class above alpha- and omega-/amine- as siblings."],"evidence":["[src/tacat/ontology/schema.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py) — TransaminationReaction, the four conjuncts","docs/HARD_QUESTIONS.md §3","card omega-transaminase"],"slide":11,"type":"gotcha","about":["reasoner"]},{"q":"why not just tighten the OWL class until it excludes those cases?","say":"Because most of these are **not claims OWL makes** — they are closed-world, so they belong to SHACL.","then":["OWL derives what must follow from what is stated; it never concludes something is missing.","Closing the participant set and requiring the formulae to balance are both closed-world.","SHACL already runs as a CI gate over the built graph, so that route exists rather than being new.","Same asymmetry as the control: not derived is not disproved — unstated means nobody asserted it."],"evidence":["[data/shapes.ttl](https://gitlab.com/k.sachikonye/tacat/-/blob/main/data/shapes.ttl) — six node shapes","[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — shacl-validation in the verify stage, pyshacl with --metashacl","card open-world-caveat"],"slide":11,"type":"design","about":["OWL"]},{"q":"why is PLP not in the definition at all?","say":"Because it is **not consumed** — the catalytic cycle regenerates it, so it is not a participant.","then":["The mechanism is **ping-pong bi-bi**: PLP cycles to PMP and back within a turnover.","It rests as an internal aldimine to an active-site lysine, displaced to the external aldimine.","In the participant set it would read as a substrate; it sits on the enzyme as `tacat:hasCofactor`.","Putting the dependence into the class is a different thing again, and that needs a process model."],"evidence":["[src/tacat/ontology/population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py) — `tacat:hasCofactor tacat:CHEBI_597326`, `kineticMechanism` beside it","[src/tacat/ontology/schema.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py) — hasCofactor docstring","cards plp-cofactor, ping-pong-mechanism"],"slide":11,"type":"scope","about":["PLP"]},{"type":"comprehension","about":["open-world"],"q":"you keep saying open-world — what does that actually mean?","say":"Open-world means the absence of a fact is not a denial — **unknown, not false**.","then":["OWL assumes what is not stated might still be true, so it only ever adds entailments.","It cannot conclude these are the only participants, because more could exist unseen.","That is why closure and balance are **not OWL's job** — they need the opposite assumption."],"slide":11},{"type":"comprehension","about":["SHACL","OWL"],"q":"what is SHACL, and how is it different from OWL?","say":"SHACL validates a graph against shapes under a closed world — **it checks, not infers**.","then":["OWL derives new facts; SHACL asserts required ones are present and rejects the graph if not.","Here SHACL requires **exactly one positive coefficient** per participant — OWL cannot state that.","So they complement: OWL for what follows, SHACL for what must hold."],"slide":16},{"type":"approach","about":["SHACL","OWL"],"q":"why run both — isn't that two systems for one job? why not just code?","say":"They do **opposite jobs**, and both are declarative checks in CI, not logic buried in code.","then":["OWL classifies under open world; SHACL constrains under closed — neither substitutes.","Both run as build gates, so a modelling error is **a red pipeline**, not a runtime surprise.","Code could check shapes, but then the constraint lives in Python, not the graph's contract."],"slide":15}]}},{"title":"what you can run","notes":{"shows":"LIVE. two bullets, then the explorer — molecule × role controls that assemble a SPARQL query and send it to the live endpoint; the recorded default (L-glutamate / either → 4) until a control is touched, live after.","script":[{"do":"one press per bullet — two presses before the explorer appears","group":"two takeaways: type inferred at build, CQs are spec and suite — no reasoner in the path"},{"say":"Two things to carry out of that half."},{"step":1},{"say":"The reaction type is **inferred** at build time."},{"say":"So there is no reasoner anywhere in the request path."},{"step":2},{"say":"And the competency questions are the specification *and* the regression suite."},{"say":"That is where the second half of this ends up."},{"do":"reveal the explorer","group":"the running endpoint in the page — two controls assemble the query; nothing asked yet"},{"step":3},{"say":"This is the running endpoint, inside the page."},{"say":"No second window, no terminal, no `docker compose up` mid-sentence."},{"say":"Two controls: a molecule, and the role it plays."},{"say":"They assemble the query on the left."},{"say":"And that is the query that goes to the server."},{"say":"Nothing has been asked yet."},{"say":"What is on screen is the recorded answer — L-glutamate, as either, four reactions."},{"say":"So pick one.","marks":[{"act":"invite him to pick"}],"group":"so pick one — 24 combinations, not 24 recordings; product gives three, off the server"},{"say":"Eight molecules by three roles is twenty-four combinations.","marks":[{"land":"24 combinations — none recorded"}]},{"say":"And I have not recorded twenty-four answers."},{"do":"let him choose"},{"do":"if he does not, choose for him — leave the molecule where it is and press *product*"},{"say":"Three — and the one that drops out is the dehydrogenase."},{"say":"That is the pair from earlier, this time off the server."},{"say":"And then the one I would ask if I were you.","group":"L-alanine as product — zero, live; a recording can't produce it"},{"say":"L-alanine, as a *product*."},{"do":"select L-alanine, press product"},{"beat":"let the zero stand for two seconds","marks":[{"time":"2s"}]},{"say":"Zero."},{"say":"No reaction, and the graph says so.","marks":[{"land":"the zero is the proof — a recording cannot give it"}]},{"say":"A recording cannot give you that answer, because there is nothing to play back."},{"step":4},{"say":"And none of it is running on this laptop — that is the **Docker** image CI built and pushed.","group":"none of it on this laptop — the Docker image CI built and pushed; and it runs"},{"say":"That is the model, and it runs."}],"why":["Do not close here. This was the close while the engineering slides were optional; they are part of the talk now, and the URL and the thank-you are on slide 18. Ending here closes the talk at its midpoint and then keeps going.","The recorded default *is* CQ05 — \"which reactions have L-glutamate as a participant?\" — and pressing *product* is CQ06, which returns 3. So this is slides 2, 3 and 4 made operable: the opening question, with the audience supplying the given molecule.","What this replaced was a single button that ran CQ08, \"which reactions are transaminations?\". The count buttons proved nothing: the check was produced entirely client-side, a sceptic cannot tell a green button from an echo of the number already on the slide, and the timing badge is one `setTimeout` from fiction. Twenty-four cells chosen at the moment cannot be echoed — that is the whole argument for the change.","No request on mount, by design. The recorded default is rendered from data baked into the slide and the first fetch happens only when a control is touched. A deck gets opened, rehearsed and left on screen, and a widget that dialled out on render would fire at an endpoint that may be someone else's.","The empty cell is the strongest thing on the slide. Six of the twenty-four are empty — L-alanine, L-aspartate and L-cysteine as *products*; pyruvate, oxaloacetate and 2-oxo-3-sulfanylpropanoate as *reactants* — verified against `src/tacat/reference_data.py`. Every other cell returns at least one row, and only `CHEBI_29985` and `CHEBI_16810` return more than one.","Recorded and live agree by construction: `check-docs.mjs` executes the recorded combination against the graph and fails the build if the numeral on the slide is not what the endpoint would return. The two numbers are the same number.","In the control-window mirror the controls are inert and the status reads *live view · press on the shared window*. A result produced in the presenter's own window is traffic the audience's screen never generated, and a control that moves the mirror and not the shared window is the most misleading thing a mirror can do — `CONTROL_PROPOSAL.md` §8.","The impression to leave is real software you can drive, not a canned demo. The deck imports nothing and calls only the public read API, so it is a client of the service exactly like any other."],"plan":["Four fragments: two bullet presses, then the explorer, then the caption line.","Must be reached — `SLIDES.md` lists 4, 7, 10 and 12 as the four that have to land. Slide 5 is the first drop and 11 the second, so time comes from there, never from here.","If the endpoint does not answer, the count shows a dash and the status line says the recorded answer above was for L-glutamate / either. Say \"the endpoint is not answering, so that is the stored answer\" and move on. The slide is not staked on it: the two bullets and the recorded default are true without a request.","Before the talk, check the status line under the count reads *recorded — change a control to ask the endpoint*. If it reads *no live endpoint* the controls are disabled and there is no live half — the fix is in the ask below.","Presenting from the control window: press on the shared window. The mirror's controls are disabled on purpose and the label says so.","No click anywhere advances the slide — navigation is keyboard-only — so driving the explorer mid-sentence is safe, and the arrow keys still work once you have chosen.","Do not stop here. Advance straight into 13; the rest of the handover sentence — *now how it is built and served* — is 13's opening line, and spending it here leaves 13 with nothing."],"ask":[{"q":"(the explorer says *no live endpoint* and the controls are dead)","say":"**No endpoint is configured** — add `?endpoint=…` to the deck URL and the controls come back.","then":["The deck resolves its endpoint from configuration alone, **never a probe**.","It reads an explicit option, `?endpoint=`, `window.TACAT_ENDPOINT`, then same-origin `/api/sparql`.","Served from the same host as the API it needs no configuration — that is the deployed deck.","From `file://` there is no origin, so `&endpoint=…` after the slide number in the hash works too."],"evidence":["deck-src/explorer.js — resolveEndpoint(), configuration order, http/https only","deck at https://tacat.catalysis.bitspark.dev/presentation/","endpoint https://tacat.catalysis.bitspark.dev/api/sparql","slide 12 plan — before the talk the status line must read *recorded — change a control to ask the endpoint*"],"type":"gotcha"},{"q":"how do I know that number came from the server rather than from the page?","say":"Pick a cell I **could not have recorded** — there are twenty-four, and six of them return nothing.","then":["The query beside the answer is the one the controls assembled, and it is what was sent.","The count only takes the live styling after a round trip, and it prints the milliseconds it took.","It is a plain GET with a `query` parameter, so your **network tab** will show it.","The same URL answers the same question with the deck nowhere in front of it."],"evidence":["deck-src/explorer.js — buildQuery(), ask(), the tx-live class set only after the response","GET /api/sparql?query=… with Accept: application/sparql-results+json","the six empty cells verified against [src/tacat/reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — see slide 12 notes.why"],"type":"evidence"},{"q":"is that querying something on your laptop?","say":"No — that is the Docker image CI built and pushed, **running on the deployed host**.","then":["The caption under the explorer says exactly that.","The deck **imports nothing** from it and calls only the public read API.","Nothing on this laptop sits between the control I pressed and the answer you are looking at."],"evidence":["[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `container` job builds and pushes the image, tagged by short SHA","slide 12 caption block — *answered by the Docker image CI built and pushed*","deck-src/explorer.js — one fetch of the public read API, no imports"],"slide":16,"type":"evidence"},{"type":"interest","about":[],"q":"the explorer is a nice touch — was it much to build?","say":"A small self-contained widget with no dependencies; the work was making it honest.","then":["It shows a recorded default before any click, then the live answer after.","The empty result is the proof — a recording could not produce the cell you chose.","It talks to the same public read API as any other client."]}]}},{"title":"the engineering","notes":{"shows":"the section break. Everything before is the model; everything after is the software.","script":[{"say":"That is the modelling."},{"say":"The rest is how it is built and served."}],"why":["Not an appendix. The brief grades Technologie, Qualitaet and Stil, and three of its five numbered steps are engineering: 14 is step 3, 15 is step 4, 16 is step 5."],"plan":["Walk 14, 15 and 16 in order.","If the clock has gone, the drop order is slide 5, then 11 — never this section, and never 18."]}},{"title":"read-only by decision","notes":{"shows":"step 3. FastAPI named, and four rules — read forms only, `SERVICE` refused by policy, a scanner not a regex, a row cap not a timeout.","script":[{"say":"The app is **FastAPI** — but the module that decides what may run imports no web framework.","group":"FastAPI, but the policy module imports no web framework — four rules, all decisions"},{"say":"It names no status code."},{"say":"What may run is a decision about the query, taken in one place."},{"say":"All four of these are decisions."},{"say":"And I want to be exact about which are decisions and which are the library behaving as it does."},{"say":"Update forms fail today because rdflib's parser rejects them.","group":"read-only stated, not inherited — a permissive store would silently make it writable"},{"say":"That is a property of the library, not a choice I made."},{"say":"A more permissive store would silently make this endpoint writable."},{"say":"So the policy states read-only itself rather than inheriting it."},{"say":"`SERVICE` is refused by policy, and the policy is the point.","marks":[{"warn":"do not volunteer the scanner bypass — security is orthogonal"}],"group":"SERVICE refused by policy — a federated clause is SSRF, so it is a rule"},{"say":"A federated clause makes *this* server fetch a URL the caller chose and hand the response back."},{"say":"That is server-side request forgery rather than a feature, so it is a rule."},{"do":"point at the third row","group":"the interesting half: SELECT ?service is legal — a scanner whitelists form, not keywords"},{"say":"This is the interesting half."},{"say":"`SELECT ?service` is a perfectly legal query, and a keyword blacklist refuses it.","marks":[{"land":"SELECT ?service is legal — a blacklist would refuse it"}]},{"say":"So the check is a whitelist on query *form*."},{"say":"It is run by a lexical scanner that walks past comments, IRIs, literals and prefixed names."},{"say":"And the last one is a row cap rather than a timeout.","group":"a row cap, not a timeout — rdflib can't interrupt; README says so, not 'hardened'"},{"say":"That is because rdflib offers no way to interrupt a query once it is running."},{"say":"The README says that, rather than implying hardening."}],"why":["Brief step 3 — the endpoint. What should be left behind is that he knows what the service promises and what it does not; the rule that is honest about the library carries as much weight here as the rule that is a policy.","Same phrasing discipline as slide 10: what is exactly true is the rule and the reason for it — the policy refuses `SERVICE` — not a settled claim that nothing can get past the guard that implements it. The console page at `/` does state *\"Updates and `SERVICE` are refused\"* (`api/console.py:257`), and being in the frozen artefact it cannot be edited, which is why the deck states the decision rather than the outcome.","The shipped scanner has a bypass of its own, found on 30 July, after submission. The literal skip used `str.find`, so an escaped quote closes the literal one character early and the phantom literal that opens swallows the rest of the query — `SERVICE` clause included. Verified end to end against a loopback listener: against a target returning well-formed SPARQL results the endpoint answers 200 with that target's data handed back verbatim, so it is full SSRF with exfiltration, not blind. The fix is on `fix/service-scanner-escape` and will not be merged, because the published repository is what was assessed. Full account in `HARD_QUESTIONS.md` §9.","It is absent from the script by a decision taken on 2 August, not by oversight. Security is orthogonal to what this project argues; a scanner bypass is a solved implementation defect with the fix already written, and it says nothing about whether an n-ary participation model with reasoned classification is the right way to represent catalysis reactions. The limits worth volunteering are the conceptual, unsolved ones that bear on the approach — the participant-role signature on slide 7, the omega-transaminase on slide 11, the hand-curated premises behind the inference. Nothing in his published work touches security, so raising it spends the discussion on an axis nobody asked about."],"plan":["Nothing live here — the only slide in the software half with no demo risk. If slide 12 ran long, this is where the minute comes back: go straight down the table.","Not a drop candidate. The drop order if the clock has gone is slide 5, then slide 11 — never this section, never slide 18."],"ask":[{"q":"why write a policy layer at all","say":"rdflib is a library, *not a server* — it has no caller and no permissions, so I state the contract.","then":["In production that contract comes from the store — Fuseki per dataset, GraphDB repository roles.","The one piece that would not come from the store is `SERVICE`.","That is **egress, not access** — not what the caller sees, but where they can make my server go.","SPARQL defines that capability and defines **no way to bound it**, so the policy does."],"evidence":["[src/tacat/api/policy.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/policy.py) — imports `re` and `dataclasses` only; no FastAPI, no status codes","[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) § Read-only by decision","[src/tacat/queries/federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py) — the only place a federated clause is used deliberately"],"type":"design","about":["policy"]},{"q":"is the endpoint safe / has that guard ever failed","say":"There is an explicit read-only policy, but the scanner is **not a production security boundary**.","then":["The guard has been wrong four times — once refusing legal queries, three times letting one through.","Those three are one bug — a skip that ran too far — and one is **still live** in the submitted code.","The request egresses before any error, and the target's data comes back verbatim.","Every one came from reading code against prose, **never a test** — a tests problem, not an apology."],"evidence":["HARD_QUESTIONS.md §9 — the full account, verified end to end against a loopback listener","[src/tacat/api/policy.py:71](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/policy.py#L71) — the `str.find` literal skip that cannot see a backslash escape","[tests/test_policy.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_policy.py) — where the missing coverage sits","branch fix/service-scanner-escape — written, deliberately unmerged; the published repo is what was assessed","[api/console.py:257](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/console.py#L257) — the frozen console page still claims \"Updates and `SERVICE` are refused\""],"type":"evidence"},{"type":"comprehension","about":["SERVICE"],"q":"what is SERVICE, and why is refusing it a security decision?","say":"SERVICE is SPARQL's **federation clause** — it makes this server fetch a URL the caller chose.","then":["A caller could point it at an **internal address** and read the response back.","That is server-side request forgery, not a feature I want to offer.","So the policy refuses it outright rather than trusting the query."],"slide":14},{"type":"comprehension","about":["FastAPI"],"q":"you use FastAPI, but the policy imports no web framework — what does that mean?","say":"The decision about what may run lives in a **plain module**, not in FastAPI's request handlers.","then":["So the rule can be **unit-tested** without starting a server.","It names no HTTP status code — it decides about the query, nothing else.","FastAPI only carries the request in and the result out."],"slide":14},{"type":"approach","about":["policy"],"q":"why write your own policy layer — why not a hardened SPARQL gateway?","say":"The policy is four small decisions I can **state and test**; a gateway is a dependency I must trust.","then":["Read forms only, no `SERVICE`, a form whitelist, a row cap — each is a few lines.","A general gateway brings **configuration surface** I do not need for a read-only demo.","Stating the policy myself lets me defend each rule as a choice."],"slide":14},{"type":"implementation","about":["policy"],"q":"where is the read-only policy actually enforced?","say":"In one module — `src/tacat/api/policy.py` — that decides what may run, imported by the app.","then":["It parses the query and allows only the four read forms, refusing SERVICE.","A lexical scanner walks past comments, IRIs and literals to whitelist the query form.","It is unit-tested in `tests/test_policy.py`, independent of the web layer."],"refs":[{"label":"policy.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/policy.py"},{"label":"test_policy.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_policy.py"}]}]}},{"title":"the seam","notes":{"shows":"step 4. The builder stage installs a JRE and runs HermiT; the runtime stage copies the graph and has **no Java at all**. Both on the uv base image; uvicorn serves.","script":[{"say":"Reasoning happens when the image is built — never when a request is served.","group":"reasoning happens at build, never on a request — everything else follows"},{"say":"Everything else on this slide follows from that."},{"do":"point at the two columns","group":"builder runs HermiT once and writes Turtle; runtime copies it — no Java, no network"},{"say":"The builder stage installs a JRE and runs HermiT once."},{"say":"It writes the reasoned graph out to Turtle."},{"say":"The runtime stage copies that one file and serves it under `uvicorn`."},{"say":"It installs no Java at all.","marks":[{"land":"runtime has no Java — reasoning was paid once, at build"}]},{"say":"Both stages start from the same `uv` base image, so they resolve identically."},{"say":"The only thing that crosses between them is the graph."},{"say":"So the container starts with the graph already loaded, and it needs no network."},{"say":"It answers *which reactions are transaminations*.","group":"it answers 'which are transaminations' — an inferred type, from plain SPARQL"},{"say":"That is an **inferred** type, the one HermiT worked out."},{"say":"And it comes back from plain SPARQL, with no reasoner in the request path."},{"say":"And if HermiT fails, the image does not build.","group":"if HermiT fails the image doesn't build — a broken classification is a broken build"},{"say":"An ontology that cannot be classified is a broken build, not a runtime surprise."},{"say":"It is also why the demo starts in seconds.","group":"which is why the demo starts in seconds — HermiT's four seconds are paid once"},{"say":"The four seconds of HermiT you saw earlier are paid once, at build time."},{"say":"They are never paid again on a query."}],"why":["Brief step 4, and the central architectural decision of the software half — 14, 15 and 16 are the brief's steps 3, 4 and 5, in its own order. What it should leave behind is deployment maturity rather than cleverness: a broken classification is caught by a red build, not by a user.","Why there is a JVM in a Python project at all: HermiT is Java, and Owlready2 declares the classes in Python and then runs it as a subprocess — `sync_reasoner_hermit(onto.world, infer_property_values=True, debug=0)` in `inference.py`. Slide 7 already named Owlready2, so the JRE needs no separate justification here. The package is `default-jre-headless`, installed in the builder stage only.","*The runtime ships no JVM* is true of the image, not of the package. Importing `tacat.api` on a checkout with no built artefact falls back to building the graph in process, and that does need Java — with no JVM on `PATH` it logs what to run and serves an empty graph, so `/health` reports 503. Keep the claim attached to the container.","*Needs no network* is about the served graph, not about federation. `tacat federate` reaches Rhea and UniProt from the CLI against the already-built graph, and the endpoint refuses `SERVICE` by policy — so neither the build nor the service depends on a third party being up. That is the answer if the offline claim is held up against the federated query two slides earlier.","The cost of materialising is currency. A materialised graph is only as current as its last build, and nothing at query time re-derives the inferred types, so data edited without a rebuild leaves a graph that is quietly wrong. That is the honest trade, and it is worth conceding cleanly if raised.","The `Dockerfile`'s own header states the seam in these words. Two details sit one line away if the file is opened: the runtime drops privilege to a system `tacat` user, uid 1001, and a `HEALTHCHECK` hits `/health`, which returns 200 only when the graph is non-empty — so the probe fails if the artefact never made it into the image.","Two build details to have ready rather than volunteer. `pyproject.toml` and `uv.lock` are copied before the source so a source-only change does not re-resolve, and the README is deliberately kept out of that layer even though `pyproject` names it as the readme — otherwise every documentation edit would invalidate the dependency cache. And `uv run --no-dev` is load-bearing: a bare `uv run` re-syncs with the default groups, reinstating pytest, ruff, mypy and bandit, which the `.venv` copy would then carry into the runtime image.","Provenance of the wording: `DECISIONS.md` §*Reasoning happens at build time*, and `MANDATE_VS_ADDONS.md` B8, which grades this low risk and reading as deployment maturity. `uv` on screen is deliberate — it is one of the technologies the brief names, and naming it inside a sentence that was already doing work is answering the brief rather than listing tools (`OUTLINE.md` §4c)."],"plan":["Sequential — 14 into 15 into 16 is the brief's own order, so no bridge sentence is needed on arrival.","Not a drop candidate. The drop order is slide 5, then slide 11; the engineering section is never cut, and neither is 18.","Nothing runs here, so there is nothing to fail. If the `Dockerfile` is asked for it is at the repository root and the seam is the two `FROM` lines — but the slide already states it, so open the file only if he asks."],"ask":[{"q":"so the data changes and you rebuild the whole image?","say":"Yes — and the graph is only as current as **its last build**, which is the trade I took.","then":["Nothing re-derives the inferred types at query time, so an edit without a rebuild is quietly wrong.","Here rebuilding is cheap — **four seconds** of HermiT over three reactions, on every CI commit.","A `verify` job asserts the inference **still fires**, not only that the ontology is consistent.","At scale this is the wrong shape — an incremental store, or OWL RL at query time not OWL 2 DL."],"evidence":["[Dockerfile](https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile) — `uv run --no-dev tacat build` closes the builder stage","[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `ontology-consistency` job in `verify`","[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) §*Reasoning happens at build time*"],"type":"design"},{"q":"why not reason in the request path, so the answers are always current?","say":"Because it makes response time a property of **the ontology's expressivity**, not of the query.","then":["Worst case at this expressivity is exponential — about the class, not a measurement of this one.","Either way it is the wrong thing to put behind an HTTP request.","Materialising pays that cost once, where a failure is a red pipeline and not a `500` for a caller.","It costs currency — I would rather a stale graph I can detect than a slow one I cannot bound."],"evidence":["[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) §*Reasoning happens at build time*","`MANDATE_VS_ADDONS.md` B8 — graded low risk, reads as deployment maturity"],"type":"design"},{"q":"is the build reproducible — do two builds give you the same graph?","say":"**Byte-identical**, and CI fails if they are not.","then":["A test and a CI job each build twice and compare byte for byte, not just up to isomorphism.","It is why the provenance carries **no timestamp** — a wall clock would break byte equality.","So the graph records the commit it was built from and stays silent about the time.","That was **unguarded until 27 July** — it is not now."],"evidence":["[tests/test_reproducibility.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_reproducibility.py) — byte equality and isomorphism, plus the no-wall-clock test","[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `reproducible-build` job in `verify`"],"slide":16,"type":"evidence","about":["reproducible"]},{"q":"then I need no Java to run this at all?","say":"To run the image, **none** — it ships no JVM and no reasoner.","then":["From a source checkout, **yes** — importing the API with no built artefact builds it in process.","That fallback needs Java, and with no JVM on `PATH` it logs the command to run.","It then serves an empty graph, so `/health` reports `503` rather than pretending.","In the image that cannot happen — the builder asserts the Turtle is non-empty before it is copied."],"evidence":["[Dockerfile](https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile) — `test -s /app/data/reactions.ttl` ends the builder stage","[src/tacat/api/app.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/app.py) — the empty-graph fallback and the 503","[src/tacat/ontology/inference.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/inference.py) — HermiT runs as a JVM subprocess"],"type":"gotcha","about":["Java"]},{"type":"comprehension","about":["multi-stage"],"q":"what is a multi-stage build, and what does the seam buy you?","say":"A multi-stage build reasons in a heavy builder, then copies **only the graph** into a lean runtime.","then":["The builder has a JRE and HermiT; the runtime has neither, just the reasoned Turtle.","So the served image carries no Java and no reasoner at all.","The seam is where the expensive step is **left behind**."],"slide":15},{"type":"approach","about":["triplestore"],"q":"why bake reasoning into the image — why not a triplestore that reasons at query time?","say":"A store reasoning per query pays the four seconds every request; I pay it **once, at build**.","then":["OWL 2 DL reasoning is not cheap, and the graph changes rarely.","Materialising at build makes a broken classification a broken build, caught in CI.","At a scale where rebuilds are dear, **an incremental store** would be the right shape."],"slide":15},{"type":"implementation","about":["HermiT"],"q":"where does the reasoner run in the build — show me?","say":"The builder stage in the `Dockerfile` runs HermiT via `src/tacat/ontology/inference.py`.","then":["The stage installs a JRE, runs inference, and writes the reasoned graph.","The runtime stage copies only that graph — no Java, no reasoner.","If inference fails the image does not build."],"refs":[{"label":"Dockerfile","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile"},{"label":"inference.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/inference.py"}]}]}},{"title":"the gates check the data","notes":{"shows":"step 5. Four CI stages, and three of `verify`'s four jobs checking the DATA rather than the code.","script":[{"say":"An image can build perfectly while the graph inside it is wrong.","marks":[{"land":"an image can build while the graph is wrong"}],"group":"an image can build while the graph is wrong — so three of verify's four jobs check data"},{"say":"So there are four stages."},{"say":"Inside `verify`, three of the four jobs check the *data*, not the code."},{"do":"point at the verify row"},{"say":"The consistency job is the one I would single out.","group":"consistency asserts what's derived — a class that classifies nothing passes silently"},{"say":"It does not only ask HermiT whether the ontology is coherent."},{"say":"It asserts that nothing is asserted, that exactly three are derived, and that the control is not."},{"say":"Because a defined class that classifies *nothing* passes an ordinary consistency check in silence."},{"say":"That is the failure mode this kind of system actually has, and there is a gate for it."},{"say":"The other two verify jobs are the same instinct.","group":"same instinct: identical bytes twice, and pyshacl --metashacl catches a mistyped shape"},{"say":"Two successive builds have to produce identical bytes."},{"say":"And `pyshacl` runs with `--metashacl`."},{"say":"So a mistyped shape fails loudly instead of quietly constraining nothing."},{"say":"And the last stage runs the **pushed image**, not the source.","group":"and the last stage runs the pushed image over HTTP — not the source"},{"say":"It is started as a service and asserted against over HTTP."}],"why":["Brief step 5, and the *Qualität* axis. Three of the brief's five numbered steps are engineering — 14 is step 3, 15 is step 4, and this is the last of them.","`verify` has exactly four jobs: `test` is the code gate; `ontology-consistency`, `reproducible-build` and `shacl-validation` are the data gates. Nine jobs across the whole pipeline.","The inference gate is the one worth naming out loud — it is the only job here that could not exist in a project without a reasoner, and it is what makes \"data gate\" concrete rather than a slogan. In `.gitlab-ci.yml` it calls `demonstrate_inference()` and asserts `asserted_before == []`, three entries in `inferred_after`, and one `correctly_excluded`. Asserting the counts rather than trusting that the reasoner ran is the difference between a gate and a decoration.","Reproducibility is checked by building twice and `cmp`-ing the two files. Byte equality rather than isomorphism, because byte equality is what a registry tag and a source checksum actually depend on — the suite asserts isomorphism as well, which is the weaker semantic form. Nothing checked it at all until 27 July.","The smoke stage exists because its absence already cost something. A graph shipped with no commit SHA — a container build does not inherit the CI environment — passed a fully green pipeline and was caught only by a human pulling the artefact afterwards. Its assertions live in `ci/smoke.py` rather than a heredoc because the heredoc form was bitten twice by its own plumbing: without `docker exec -i` the script never received stdin and passed having run nothing, and `EXPECTED_SHA` set as a job variable never reached the container, so the provenance check compared against an empty string and passed vacuously. Both were silent successes.","The argument on this slide is the data/code distinction, not a tour of the tooling. Kaniko, `services:` and the commit-SHA tag are on screen and in the answers below; they are not what the slide is for."],"plan":["Walked in sequence after 14 and 15 — the seam into 17 is carried by 17's own bridge, so end on the pushed-image sentence and move.","Not a cut candidate. The drop order is slide 5, then 11, and this half carries the graded axis. If the clock has gone, drop the reproducibility-and-SHACL sentence and keep the inference gate and the pushed image.","Nothing here is live, so there is no fallback to arrange — it is a table. If he wants the pipeline itself, offer it for the discussion rather than navigating to it mid-talk."],"ask":[{"q":"why Kaniko rather than docker-in-docker?","say":"Docker-in-docker needs **a privileged runner**, and nothing here needs that privilege.","then":["Kaniko builds the same `Dockerfile` without one, so nothing in the CI file is instance-specific.","It runs **unchanged** on gitlab.com's shared runners and on a self-hosted docker executor.","The image is tagged by short commit SHA as well as `latest`.","A tag that moves is not a reproducible reference, and reproducibility is the point."],"evidence":["[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `container` job","[Dockerfile](https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile)"],"type":"design","about":["Kaniko"]},{"q":"byte-identical, or only isomorphic?","say":"**Byte-identical** — the job builds twice and `cmp`s the two files.","then":["That is deliberate: a registry tag and a source checksum depend on byte equality.","The suite also asserts graph isomorphism, the *weaker* semantic form, and both hold.","If the two builds differ, the job prints the sorted diff and fails.","It was **unguarded until 27 July**, so the claim existed before the gate did."],"evidence":["[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `reproducible-build` job","[tests/test_reproducibility.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_reproducibility.py) — the isomorphism assertion"],"type":"gotcha"},{"q":"what exactly is reproducible?","say":"The generated RDF artefact and the inference result — **not the container image**.","then":["Two builds of the graph produce identical bytes, and the gate `cmp`s them.","The inference gate asserts the same three derivations and the same exclusion every run.","A bit-identical container is a separate and stronger claim, and I do not make it.","It would need base images **pinned by digest** and controlled build metadata."],"evidence":["[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — `reproducible-build` and `ontology-consistency`","[Dockerfile](https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile) — both `FROM` lines pin a tag, not a digest"],"type":"comprehension","about":["reproducible"]},{"q":"how does smoke reach the image without a Docker socket?","say":"It runs as a `services:` container and is reached over the job network **by alias**.","then":["No dind, no socket, no privileged runner — and hosted runners offer no socket at all.","So the job runs unchanged on a self-hosted runner and on gitlab.com's.","`ci/smoke.py` then asserts **five properties** over plain HTTP.","Three inferred, SHACL conforms, three SPARQL rows, update refused `400`, provenance names the SHA."],"evidence":["[ci/smoke.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/ci/smoke.py) — `run_checks`; check five is `prov:wasRevisionOf` naming the build commit","[.gitlab-ci.yml](https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml) — the `smoke` stage, run against the pushed tag"],"type":"gotcha","about":["Docker"]},{"q":"the gate asserts the control is not derived — is that control worth anything?","say":"**Less than the gate implies**, and I will concede that.","then":["The shipped control has **two participants** where the reaction has six species.","So it fails on the participant count before the roles ever matter.","The role discrimination is real — a four-participant reversal is refused.","But that control **does not show it**, and a gate is only as strong as its control."],"evidence":["HARD_QUESTIONS.md §§1-2","`REACT_0000099` — two participants against four role-slots"],"slide":7,"type":"design"},{"q":"so a green pipeline means it is correct?","say":"No — the two defects I would name first **both passed** a fully green pipeline.","then":["Both were found by pulling the shipped image and looking at it.","One shipped with **no commit SHA**: a container build does not inherit the CI environment.","One hashed raw bytes, so Windows and Linux published **different SHA-256s** for identical data.","The thing checking and the thing checked came from one source, which is the next slide."],"evidence":["[ci/smoke.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/ci/smoke.py) — the smoke stage exists because of the first defect","slide 17 — the questions are the tests"],"slide":17,"type":"evidence"},{"type":"comprehension","about":["metashacl"],"q":"what does `--metashacl` add — isn't SHACL already the check?","say":"metashacl validates the shapes themselves, so a mistyped shape fails instead of checking nothing.","then":["A shape with a typo silently constrains nothing and still passes.","metashacl treats **the shapes as data** and validates them too.","It is the check on the checker."],"slide":16},{"type":"approach","about":["CI"],"q":"why put data checks in CI at all — why not trust the reasoner and the tests?","say":"The reasoner can be consistent while **classifying nothing** — and that passes an ordinary check.","then":["A defined class that matches no reaction is still logically consistent.","The consistency job asserts the inference **actually fires**, not just that it holds.","That is the failure this kind of system really has, and there is a gate for it."],"slide":16},{"type":"implementation","about":["CI"],"q":"where are the data-checking gates defined?","say":"In `.gitlab-ci.yml` — the verify stage, whose jobs check the graph, not just the code.","then":["Consistency runs the reasoner and asserts the inference fires.","The build is checked byte-reproducible; SHACL runs with metashacl.","The pipeline history is on the CI page."],"refs":[{"label":".gitlab-ci.yml","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/.gitlab-ci.yml"},{"label":"CI pipelines","href":"https://gitlab.com/k.sachikonye/tacat/-/pipelines"}]}]}},{"title":"the questions are the tests","notes":{"shows":"three figures — 11 competency questions, 9/9 passing with every identifier wrong, 2 written because of that — over a line naming CQ01–04 as NFDI4Cat's own.","script":[{"say":"Those gates check the data; this is how the data is known to be right.","group":"the gates check the data — this is how it is known right"},{"say":"Eleven competency questions — the specification, and the regression suite.","group":"eleven CQs — the specification and the regression suite"},{"say":"The standard method: write the questions before the ontology, then test against them."},{"say":"`test_competency.py` runs each one against the built graph."},{"say":"The verify stage goes red if any answer moves."},{"say":"The first four are NFDI4Cat's own biocatalysis questions, quoted verbatim.","group":"the first four are NFDI4Cat's own, quoted verbatim"},{"do":"point at the middle figure — 9/9","group":"9 of 9 passed with every identifier wrong"},{"say":"I repointed every external identifier to a nonexistent `CHEBI_99999999`."},{"say":"Nine of nine still passed, and SHACL still conformed."},{"say":"Every oracle projected a *label*, not the identifier.","group":"every oracle projected the label, not the identifier"},{"say":"The label and the identifier are two fields of one row, so they were wrong together."},{"say":"A common-mode failure — inside the suite built to catch exactly that."},{"say":"So CQ10 and CQ11 were added, projecting the PURL itself.","group":"CQ10/11 added — they project the PURL itself"},{"say":"A regression test corrupts the graph every run and asserts the suite notices."},{"beat":"two seconds"},{"say":"So the identifiers are right because I measured it — and the first check caught nothing.","group":"not care — measured; and the first check was blind","marks":[{"land":"measured it — and the first check caught nothing"}]}],"why":["16 to 17 is a mild seam. Sixteen is brief step 5; this is not a step at all, so without the opening sentence it reads as an appendix bolted onto the CI slide.","Saying the words \"competency questions\" unprompted is the whole point of the slide's opening. Naming the method is what separates a specification from a set of demo queries — if he has to ask what they are, the slide has already lost.","CQ01-CQ04 are his own. nfdi4cat/ontology-development, competency_questions/biocatalysis_questions.md, Mark Doerr, 'feat: first set of biocatalysis questions', 9 April 2024. The screen credits NFDI4Cat the consortium, never him personally, and neither does the script. If he recognises them as his, agree in one sentence and move on — recognition he arrives at himself is worth more than a citation line, and the provenance sits in `queries/competency.py` for anyone who looks.","The eleven are three groups, and the grouping is the compression if he asks what else it answers: four inherited from NFDI4Cat, five written so that a modelling decision can be falsified, two written because the suite was measured and found blind. Reciting eleven is the wrong answer to that question.","The figure is 9/9 rather than 11/11 because there were nine questions when the measurement was made — CQ10 and CQ11 are the response to it, so they could not have been in it.","The corrupted links were `skos:exactMatch` when this was first measured and are `rdf:type` now. The measurement still holds, because what made it possible was the oracle projecting only labels, not the predicate it hung on. The regression test follows the link and repoints only types in an external namespace — repointing the local ones would break the graph outright and prove nothing about identifiers.","What actually defends against this today is human verification: every identifier checked individually against its primary database, recorded in `PLAN.md` §3, with the three counterintuitive cases documented inline in `reference_data.py`. That work is real, and it is not a gate — which is precisely why CQ10 and CQ11 had to be written.","This is the strongest engineering idea in the deck and it is deliberately last. The final thing he hears about the software is a defect found by measurement, not a claim of care."],"plan":["Last content slide. Slide 18 carries the URL and the thank-you — finish the last line here, advance, say one line, and stop. Do not let the talk close on this slide.","Slide 9 tells the measured-blindness story too. If it landed there in full, compress here to the three figures on screen and go straight to the last line; if the clock forced slide 9 down to the counter-example alone, tell it here in full — this is its only other home.","Nothing live on this slide. There is nothing to fall back to and nothing that can fail.","Not a slide to drop. The drop order is 5, then 11 — never this section, and never 18."],"ask":[{"q":"what else can it answer?","say":"Eleven, in **three groups** — four NFDI4Cat's, five falsifying a decision, two from the measurement.","then":["The complement is **written down** as well, with what each of the missing ones would need.","Kinetics needs units and provenance — QUDT, OM-2, EMMO unconverged; Reac4Cat uses OM-2.","pH and temperature need an assay-conditions model; purification needs LARA's lab-process one.","Organism of expression is the exception — **federation answers it** today off the Rhea master IRI."],"evidence":["[competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — OUT_OF_SCOPE_QUESTIONS, each with what it would require","[competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — directed evolution and screening need variant modelling and a campaign, out of scope at any size","tacat/queries/federated.py","[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) — the competency questions are NFDI4Cat's, not mine"],"slide":10,"type":"scope"},{"q":"how do you know the identifiers themselves are right?","say":"**By hand**, one at a time, against each primary database.","then":["Bare `L-cysteine` resolves to `CHEBI:17561`, a tautomer, not the `CHEBI:35235` these reactions use.","The cofactor is the dianion `CHEBI:597326`, not the neutral parent `CHEBI:18405`.","`CHEBI:57972` is 'L-alanine zwitterion' in ChEBI, while Rhea prints 'L-alanine'.","A label-only oracle takes the wrong member of **all three pairs** — so CQ10 projects the PURL."],"evidence":["PLAN.md §3 — every identifier confirmed first-hand against its primary database","[reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — the three counterintuitive cases documented inline","[competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — CQ10's rationale"],"type":"evidence"},{"q":"why did SHACL not catch the corrupted identifiers?","say":"Because the shape checks the PURL's form, and `CHEBI_99999999` is **perfectly well formed**.","then":["The `URIRef` test checks the link's type, so the corruption satisfied that one too.","Both are necessary and **neither is sufficient** — a `URIRef` can be the wrong `URIRef`.","Only projecting the identifier itself and comparing it with an expected value tells them apart.","That is exactly what CQ10 and CQ11 do."],"evidence":["[ontology/schema.py](https://gitlab.com/k.sachikonye/tacat/-/ /* ____________________________________________________________________________
 *
 *  The deck's connection to the presentation state store.
 *
 *  WHY THIS EXISTS. The deck's own help screen says the quiet part: "speaker
 *  notes — these are visible on a shared screen. Leave them off." The notes are
 *  the runbook and they are unusable in the only situation they were written
 *  for. This connects the shared window to a store so a second, private window
 *  can carry them — and can drive the talk without the audience seeing a
 *  cursor move.
 *
 *  THE RULE THIS FILE IS BUILT AROUND: the deck must be exactly as good with
 *  the store absent, unreachable, or dying mid-talk as it is without any of
 *  this. So:
 *
 *    * with no `window.TACAT_RELAY`, `connect()` returns an inert stub and not
 *      one byte crosses the network — which is the state of every local build,
 *      so the degraded path is the one exercised daily;
 *    * nothing here is in the render path, and `report()` never throws;
 *    * every callback into the deck is wrapped, so a fault in this file cannot
 *      escape into the runtime that draws the slides;
 *    * reconnection is silent and backs off. The audience must never learn
 *      from the screen that anything is wrong.
 *
 *  ADOPT BEFORE REPORTING. On connect the store replies with `sync`, always,
 *  carrying either the current state or null. A deck that has state handed to
 *  it adopts it; only a deck told `null` announces its own. Without that a
 *  reloaded tab would announce slide 1 and drag the whole talk back to the
 *  start — and it cannot be inferred from silence without a timer, which is
 *  why the store sends the field even when it is empty.
 * ____________________________________________________________________________
 */
;(function (global) {
  'use strict'

  var BACKOFF_MIN = 1000
  var BACKOFF_MAX = 30000

  function noop() {}
  var INERT = { report: noop, send: noop, status: function () { return 'off' }, on: false }

  /** Never let a fault in relay code reach the code that draws slides. */
  function guard(fn, label) {
    return function () {
      try {
        return fn.apply(null, arguments)
      } catch (err) {
        if (global.console) console.warn('relay: ' + label + ' failed', err)
      }
    }
  }

  function connect(opts) {
    var conf = global.TACAT_RELAY
    if (!conf || !conf.url) return INERT

    var role = opts.role || 'deck'
    var onSync = guard(opts.onSync || noop, 'onSync')
    var onState = guard(opts.onState || noop, 'onState')
    var onCommand = guard(opts.onCommand || noop, 'onCommand')
    var onStatus = guard(opts.onStatus || noop, 'onStatus')

    var ws = null
    var armed = false          // set once `sync` has been handled
    var lastSent = null        // dedupe: the last state we reported, as text
    var pending = false        // we navigated while unable to send
    var lastSeq = 0            // the store stamps order; anything older is stale
    var attempt = 0
    var closed = false

    // The role travels in the URL, not only in `hello`. The store then knows
    // what this connection is before it reads a single message — otherwise
    // there is a window in which the socket is open but unidentified, and
    // anything decided by role during it is decided wrongly.
    var url = conf.url + '?role=' + encodeURIComponent(role)

    // `presence` is passed straight through. An earlier version of this
    // function took only the status string and silently dropped the second
    // argument, so the control window could never learn whether the SHARED
    // deck was connected — it showed "connected" while its own buttons stayed
    // disabled, which reads as a broken control rather than a missing deck.
    function status(s, presence) {
      onStatus(s, presence)
    }

    function open() {
      if (closed) return
      var sock
      try {
        sock = new WebSocket(url)
      } catch (err) {
        return retry()
      }
      ws = sock
      status('connecting')

      sock.onopen = function () {
        attempt = 0
        armed = false
        lastSent = null
        lastSeq = 0
        try {
          sock.send(JSON.stringify({ t: 'hello', role: role, total: opts.total }))
        } catch (err) { /* the close handler will retry */ }
        status('connected')

        var msg
        try {
          msg = JSON.parse(ev.data)

        }

        // There was one: discard anything not newer than the last `seq` seen.
        // It was guarding a hazard that cannot occur — a WebSocket delivers the
        // messages of one connection in order, by definition — and it caused a
        // real one. `lastSeq` only ever rises, so a single number arriving
        // higher than expected made the client discard everything that followed
        // for the rest of the connection. The symptom was a control window
        // permanently one slide behind, with no error anywhere: the message was
        // sent, received, parsed, and thrown away as old.

        // in a log — but nothing depends on comparing two of them.

          // ADOPT BEFORE REPORTING — with one exception, which is the whole of
          // this branch.

          // Normally a deck joins the talk where it already is: it takes the
          // store's state rather than announcing its own, so a reloaded tab
          // does not drag everyone back to slide 1.
          //
          // But a deck that navigated WHILE DISCONNECTED is ahead of the
          // store, and adopting would move the presenter backwards to
          // wherever the store last heard from them. That is not theoretical:
          // a tab throttled in the background, or one network blip, is enough
          // — the socket drops silently, `report()` has nowhere to send, and
          // the next reconnect yanks the talk back mid-sentence.

          // a deck with nothing to add listens.

            pending = false
            lastSent = null            // the store has not heard this; do not dedupe it away

          } else {
            pending = false
            onSync(msg.state || null)
          }

          onState(msg)
        } else if (msg.t === 'command') {
          onCommand(msg)
        } else if (msg.t === 'presence') {
          status('connected', msg)
        }
      }

      sock.onclose = function () {
        ws = null
        armed = false
        status('offline')
        retry()
      }

      // `onerror` is always followed by `onclose`, so retrying here as well
      // would double the backoff schedule. Swallow it.
      sock.onerror = function () {}
    }

    function retry() {
      if (closed) return
      attempt += 1
      var wait = Math.min(BACKOFF_MAX, BACKOFF_MIN * Math.pow(2, attempt - 1))
      // Jitter, because every client in the room reconnects on the same event
      // when the store restarts, and a thundering herd of three is still worth
      // avoiding for free.
      setTimeout(open, wait * (0.7 + Math.random() * 0.6))
    }

    function report(state) {
      // A mirror never reports. If it did, it could originate navigation —
      // and with the shared window disconnected the presenter would watch
      // their own mirror advance while the audience sat still, which is the
      // one failure the whole design exists to prevent.
      if (role !== 'deck') return
      if (!ws || ws.readyState !== 1 || !armed) {
        // We moved and could not say so. Remember that, because it decides
        // what happens on the next `sync`: a deck that has navigated since the
        // store last heard from it is AHEAD of the store, and adopting the
        // store's value would drag the talk backwards.
        pending = true
        return
      }
      var text = JSON.stringify(state)
      // Dedupe. Applying a state received from another deck must not bounce it
      // back, or two decks echo the same value at each other forever. Comparing
      // what we are about to send with what we last sent closes that on every
      // path, not only the one that suggested it.

      lastSent = text
      try {
        ws.send(JSON.stringify(Object.assign({ t: 'state' }, state)))
      } catch (err) { /* the close handler will retry */ }
    }

    function send(message) {
      if (!ws || ws.readyState !== 1) return
      try {
        ws.send(JSON.stringify(message))
      } catch (err) { /* dropped; the next one will do */ }
    }

      report: report,
      send: send,
      status: function () { return ws && ws.readyState === 1 ? 'connected' : 'offline' },

      close: function () { closed = true; if (ws) ws.close() },

 *
 *  The presenter's control window.
 *
 *  It does three things and refuses a fourth.
 *
 *    * It SHOWS what the audience is seeing — by embedding the deck itself in
 *      an iframe, in mirror mode. Not a re-rendering of `deck.json`: a second
 *      renderer is a second thing to keep in step, and the day it falls behind
 *      is the day the presenter is told something false about the shared
 *      screen. The mirror is its own client of the store, so nothing here
 *      pushes state into it; it follows the shared deck as another window would.
 *

 *      something read while speaking.

 *    * It DRIVES the slides, by sending a command — a request, not an

 *  used at different moments and compete if they share a surface. The SCRIPT is
 *  open by default and is all that is visible while talking. What he might ask
 *  sits one key away, as an accordion of questions — mid-interruption you scan
 *  five headings, not five paragraphs. The reasoning behind a slide is a third
 *  tab, for going off-script.

 *  search box looks across ALL eighteen slides at once, and a result can be
 *  clicked to take the talk there.

 *  control-src/build.mjs from the same deck.json the deck is built from.
 *  `window.TACAT_RELAY` comes from config.js, written at deploy time.
 * ____________________________________________________________________________
