    document.body.dataset.conn = conn;
    document.body.dataset.deck = deckPresent ? "1" : "0";
    document.body.dataset.mirror = mirrorOn ? "1" : "0";
    // The state this window last applied, on the element itself, so the
    // end-to-end test can tell "the message never arrived" from "it arrived
    // and the window painted it wrong" — different bugs, different fixes.
    document.body.dataset.slide = state && state.slide ? String(state.slide) : "";
    document.body.dataset.step = state && typeof state.step === "number" ? String(state.step) : "";

    const live = conn === "connected";
    $("status").textContent = !live ? "no connection to the store"
      : deckPresent ? "connected" : "connected — but the shared window is not";

    const warn = [];
    if (state && state.notes) warn.push(["", "the speaker notes are on the shared screen — press n there"]);
    if (state && state.overview) warn.push(["soft", "the overview grid is covering the shared screen"]);
    if (state && state.help) warn.push(["soft", "the keys overlay is covering the shared screen"]);
    const box = $("warnings");
    box.textContent = "";
    for (const [cls, text] of warn) {
      const el = document.createElement("div");
      el.className = "warn " + cls;
      el.textContent = text;
      box.appendChild(el);
    }

    const n = state ? state.slide : null;
    $("posnum").textContent = n ? String(n) : "—";
    $("steps").textContent = state && state.steps
      ? `  ·  ${state.step} of ${state.steps} revealed` : "";

    const live_idx = n ? n - 1 : -1;
    const idx = preview !== null ? preview : live_idx;
    paintingIdx = idx;
    // Only meaningful for the LIVE slide: while reading ahead, "the audience is
    // here" is a claim about a slide they are not looking at.
    paintingStep = (preview === null && state && typeof state.step === "number") ? state.step : null;
    const slide = SLIDES[idx] || null;
    const notes = notesOf(idx);
    document.body.dataset.preview = preview !== null ? "1" : "";
    const bar = $("previewbar");
    bar.textContent = "";
    if (preview !== null) {
      const label = document.createElement("span");
      label.textContent = `reading slide ${preview + 1} — the audience is on ${n || "—"}`;
      const show = document.createElement("button");
      show.className = "primary";
      show.textContent = `show slide ${preview + 1}`;
      show.onclick = () => { const t = preview; preview = null; send("goto", t + 1); };
      const back = document.createElement("button");
      back.textContent = "back to the talk";
      back.onclick = () => { preview = null; paint(); };
      bar.append(label, show, back);
    }
    $("notestitle").textContent = slide ? slide.title : "—";
    // Through `inline`, like every other note text: the shows line is written
    // in the same markup as the rest and would otherwise print its backticks.
    $("shows").textContent = "";
    $("shows").append(inline(notes.shows || ""));

    // NEXT is always about the LIVE talk, never about whatever is being
    // previewed — so both halves must come from live_idx. The title did and the
    // number did not, so while previewing another slide this read as, say,
    // "next 15. the seam" with 14 on screen: a number and a title describing
    // two different slides, in the one strip the presenter trusts to say where
    // the talk goes next.
    const nxt = SLIDES[live_idx + 1];
    $("nextup").innerHTML = "<b>next</b>";
    $("nextup").append(nxt ? `${live_idx + 2}. ${nxt.title}` : "end of the deck");

    // Position and reveals, beside the notes rather than only in the header
    // corner. `steps` is 0 on a slide with no fragments, and then it says
    // nothing rather than "0 of 0".
    const pos = state && state.slide ? `${state.slide} / ${SLIDES.length}` : "—";
    const rev = state && state.steps ? ` · ${state.step} of ${state.steps} revealed` : "";
    $("pacepos").innerHTML = `<b>${pos}</b>${rev}`;

    // The mirror is dimmed, not hidden, when there is nothing behind it: an
    // empty panel says "broken", a dimmed last-known frame says "stale", and
    // stale is the truth.
    $("mirror").classList.toggle("dim", !live || !deckPresent);
    $("mirrorlabel").textContent = !live ? "mirror — not connected"
      : deckPresent ? "what the audience is seeing" : "mirror — the shared window is not connected";

    paintTabs(notes);
    if (query) renderSearch($("notestext"), query);
    else {
      const box = $("notestext");
      const keep = box.scrollTop || notesScroll;
      renderTab(box, notes, tab);
      // Restoring after the rebuild, not before: the box has no height until
      // its children exist.
      box.scrollTop = keep;
      notesScroll = keep;
    }

    [...$("grid").children].forEach((el, i) => el.classList.toggle("cur", i === live_idx));
    ["first", "prev", "next", "last"].forEach((id) => { $(id).disabled = !live || !deckPresent; });
  }

  // ------------------------------------------------------------------ tabs --
  const TABS = [
    ["script", "script", (n) => (n.script || []).filter((b) => "group" in b).length || (n.script || []).length],
    ["ask", "if asked", (n) => (n.ask || []).length],
    ["why", "why", (n) => (n.why || []).length],
    ["plan", "plan", (n) => (n.plan || []).length],
  ];

  function paintTabs(notes) {
    const bar = $("tabs");
    bar.textContent = "";
    for (const [key, label, count] of TABS) {
      const b = document.createElement("button");
      b.className = "tab" + (key === tab && !query ? " on" : "");
      b.textContent = label;
      const c = count(notes);
      // The count is the point of showing an empty tab at all: it says
      // "there are three answers here" without costing a click to find out.
      if (c) {
        const badge = document.createElement("span");
        badge.className = "tcount";
        badge.textContent = String(c);
        b.appendChild(badge);
      } else {
        b.disabled = true;
      }
      b.onclick = () => { tab = key; query = ""; $("q").value = ""; paint(); };
      bar.appendChild(b);
    }
  }

  // `**bold**`, `*emphasis*` and `` `code` ``, built as nodes rather than
  // markup, so nothing in a note can inject anything into this window.
  // `about` — optional concept terms to highlight — is threaded through so a
  // question and its answer light up the concept they turn on. Defaulted off, so
  // every existing caller is unchanged.
  function inline(text, about) {
    const terms = (about || []).filter(Boolean);
    const frag = document.createDocumentFragment();
    const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/g;
    let at = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > at) hlText(frag, text.slice(at, m.index), terms);
      let el;
      if (m[4]) {   // [text](url) — a link, opened in a new tab
        el = document.createElement("a");
        el.textContent = m[4];
        el.href = m[5];
        el.target = "_blank";
        el.rel = "noopener";
      } else {
        el = document.createElement(m[1] ? "strong" : m[2] ? "em" : "code");
        el.textContent = m[1] || m[2] || m[3];
      }
      frag.append(el);
      at = m.index + m[0].length;
    }
    if (at < text.length) hlText(frag, text.slice(at), terms);
    return frag;
  }

  // Append plain text, wrapping any occurrence of a concept term in a <mark>.
  // Only the plain runs are scanned, so a term inside `code`/`strong` is left
  // alone. No terms → one text node, exactly as before.
  function hlText(frag, str, terms) {
    if (!terms.length) { frag.append(str); return; }
    // Whole-term only: a leading/trailing word-or-hyphen boundary, so a short
    // term (`OWL`) cannot light up inside a longer word (`knowledge`).
    const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(?<![\\w-])(" + terms.slice().sort((a, b) => b.length - a.length).map(esc).join("|") + ")(?![\\w-])", "ig");
    let at = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > at) frag.append(str.slice(at, m.index));
      const mk = document.createElement("mark");
      mk.className = "concept-hl";
      mk.textContent = m[0];
      frag.append(mk);
      at = m.index + m[0].length;
    }
    if (at < str.length) frag.append(str.slice(at));
  }

  function askItem(a, slideNo) {
    // <details> is the accordion: closed by default, one click to open, and it
    // needs no state of its own — which matters, because a repaint arrives
    // every time the deck moves and would close anything we tracked ourselves.
    const d = document.createElement("details");
    d.className = "ask";
    d.open = openAsks.has(a.q);
    d.addEventListener("toggle", () => {
      if (d.open) openAsks.add(a.q); else openAsks.delete(a.q);
    });
    const s = document.createElement("summary");
    // The TYPE badge — how to answer, at a glance. Only the two under-covered
    // kinds carry a colour; the peers are faint chrome. Absent on unclassified
    // questions, so this is additive.
    if (a.type) {
      const badge = document.createElement("span");
      badge.className = "atype a-" + a.type;
      badge.textContent = a.type;
      s.append(badge);
    }
    const qt = document.createElement("span");
    qt.className = "qtext";
    qt.append(inline(a.q, a.about));
    s.append(qt);
    if (slideNo) {
      const tag = document.createElement("span");
      tag.className = "fromslide";
      tag.textContent = String(slideNo);
      s.appendChild(tag);
    }
    d.append(s);
    // The concepts the question is about — chips below the summary.
    if ((a.about || []).length) {
      const cc = document.createElement("div");
      cc.className = "concepts";
      for (const c of a.about) {
        const chip = document.createElement("span");
        chip.className = "cchip";
        chip.textContent = c;
        cc.append(chip);
      }
      d.append(cc);
    }

    // An answer is three beats. The first is SPEECH, so it is drawn exactly as
    // a script line is — quoted, large, an accent rule down its edge. The eye
    // goes there and nowhere else while he is still finishing the question.
    if (a.say) {
      const p = document.createElement("p");
      p.className = "say";
      p.append(inline(a.say, a.about));
      d.appendChild(p);
    }
    // The support, only if he is still looking at you.
    if ((a.then || []).length) {
      const ul = document.createElement("ul");
      ul.className = "then";
      for (const line of a.then) {
        const li = document.createElement("li");
        li.append(inline(line, a.about));
        ul.appendChild(li);
      }
      d.appendChild(ul);
    }
    // Where it lives. Never spoken — this is for when he wants to go and read
    // it, and a file name read aloud is noise.
    if ((a.evidence || []).length) {
      const box = document.createElement("div");
      box.className = "evidence";
      for (const e of a.evidence) {
        // An entry is "path — prose" and the prose carries its own `code`, so it
        // is rendered through inline() rather than shown as one literal string.
        const line = document.createElement("div");
        line.className = "evline";
        line.append(inline(e));
        box.appendChild(line);
      }
      d.appendChild(box);
    }
    // Links into the frozen source or the CI pipeline — what an implementation
    // answer points at. Resolved to {label, href} by the build; open in a new
    // tab so the talk is never navigated away from underneath the presenter.
    if ((a.refs || []).length) {
      const box = document.createElement("div");
      box.className = "refs";
      for (const r of a.refs) {
        const link = document.createElement("a");
        link.className = "reflink";
        link.href = r.href;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = r.label;
        link.onclick = (ev) => ev.stopPropagation();
        box.appendChild(link);
      }
      d.appendChild(box);
    }
    // Offers to move the audience. It never does so on its own — same rule as
    // a search hit, and for the same reason.
    if (a.slide) {
      const b = document.createElement("button");
      b.className = "hitshow";
      b.textContent = "show slide " + a.slide;
      b.onclick = (ev) => { ev.stopPropagation(); preview = null; send("goto", a.slide); };
      d.appendChild(b);
    }
    // The paragraph form, until the last of them is converted.
    if (!a.say && a.a) {
      const p = document.createElement("p");
      p.append(inline(a.a));
      d.appendChild(p);
    }
    return d;
  }

  // A mark is a glance-rider on a line — never part of the sentence, and in two
  // cases the OPPOSITE of it ("do not volunteer the scanner bypass"). It is
  // drawn as a chip below the line, in its own colour, so it cannot be read
  // aloud by mistake. It exists only here: the deck artefact carries the
  // `shows:` line and nothing else, so a mark cannot reach the shared screen.
  const MARK_KINDS = ["land", "raise", "warn", "time", "act"];

  function markRow(entry) {
    const marks = entry.marks || [];
    if (!marks.length) return null;
    const row = document.createElement("div");
    row.className = "marks";
    for (const m of marks) {
      const kind = MARK_KINDS.find((k) => typeof m[k] === "string" && m[k]);
      if (!kind) continue;
      const chip = document.createElement("span");
      chip.className = "mark m-" + kind;
      const tag = document.createElement("b");
      tag.textContent = kind;
      chip.append(tag, m[kind]);
      row.appendChild(chip);
    }
    return row.children.length ? row : null;
  }

  /** One script entry, drawn by kind, with its marks under it. */
  function scriptLine(b) {
    const wrap = document.createDocumentFragment();
    if (typeof b.beat === "string") {
      const d = document.createElement("div");
      d.className = "beat";
      const t = document.createElement("span");
      t.append(inline(b.beat));
      d.appendChild(t);
      wrap.appendChild(d);
    } else if (typeof b.do === "string") {
      const d = document.createElement("div");
      d.className = "do";
      const tag = document.createElement("span");
      tag.className = "dotag";
      tag.textContent = "do";
      d.append(tag);
      const t = document.createElement("span");
      t.append(inline(b.do));
      d.appendChild(t);
      wrap.appendChild(d);
    } else {
      const p = document.createElement("p");
      p.className = "say";
      p.append(inline(b.say || ""));
      wrap.appendChild(p);
    }
    const m = markRow(b);
    if (m) wrap.appendChild(m);
    return wrap;
  }

  /** Split a script into runs, each opened by an entry carrying `group`.
   *  The build guarantees the first entry opens one whenever a slide groups at
   *  all, so the runs partition the script and nothing is orphaned above the
   *  first bullet — which is what makes collapsing to bullets lossless. */
  /** Split a script into top-level nodes: step markers, and runs of lines.
   *
   *  A marker cannot live inside a bullet's <details>, or collapsing to bullets
   *  would hide the one thing that says where the audience is. */
  function segments(script) {
    const out = [];
    for (const b of script) {
      if (typeof b.step === "number") { out.push({ mark: b.step }); continue; }
      const last = out[out.length - 1];
      if ("group" in b || !last || last.mark !== undefined) {
        out.push({ group: b.group, lines: [b] });
      } else {
        last.lines.push(b);
      }
    }
    return out;
  }

  /** The rule itself. Bright on the reveal the audience is looking at now,
   *  faint on the ones already passed, fainter still on those ahead. */
  function stepRule(n) {
    const d = document.createElement("div");
    const state = paintingStep;
    d.className = "steprule" +
      (state === null ? "" : n === state ? " now" : n < state ? " past" : " ahead");
    const tag = document.createElement("span");
    tag.textContent = state === n ? "step " + n + " \u00b7 on screen now" : "step " + n;
    d.append(tag);
    return d;
  }

  function runs(script) {
    const out = [];
    for (const b of script) {
      if ("group" in b || !out.length) out.push({ group: b.group, lines: [] });
      out[out.length - 1].lines.push(b);
    }
    return out;
  }

  function renderTab(boxEl, notes, which) {
    boxEl.textContent = "";
    if (which === "script") {
      const list = notes.script || [];
      if (!list.length) { boxEl.textContent = "—"; return; }
      const grouped = list.some((b) => "group" in b);

      if (grouped) {
        const bar = document.createElement("div");
        bar.className = "viewbar";
        for (const [key, label] of [["bullets", "bullets"], ["full", "full script"]]) {
          const b = document.createElement("button");
          b.className = "viewbtn" + (scriptView === key ? " on" : "");
          b.textContent = label;
          b.onclick = () => { scriptView = key; paint(); };
          bar.appendChild(b);
        }
        boxEl.appendChild(bar);
      }

      if (!grouped || scriptView === "full") {
        for (const seg of segments(list)) {
          if (seg.mark !== undefined) { boxEl.appendChild(stepRule(seg.mark)); continue; }
          if (seg.group && grouped) {
            const h = document.createElement("div");
            h.className = "grouphead";
            h.append(inline(seg.group));
            boxEl.appendChild(h);
          }
          for (const b of seg.lines) boxEl.appendChild(scriptLine(b));
        }
        return;
      }

      // Bullets: the prompts alone, each expanding to its own run. <details>
      // keeps that state in the DOM, which matters because a repaint arrives
      // every time the deck moves and would close anything tracked in JS.
      segments(list).forEach((r, ri) => {
        if (r.mark !== undefined) { boxEl.appendChild(stepRule(r.mark)); return; }
        const d = document.createElement("details");
        d.className = "bullet";
        // Keyed by slide and run, not by index into a rebuilt DOM.
        const key = paintingIdx + ":" + ri;
        d.open = openBullets.has(key);
        d.addEventListener("toggle", () => {
          if (d.open) openBullets.add(key); else openBullets.delete(key);
        });
        const s = document.createElement("summary");
        if (r.group) s.append(inline(r.group));
        else { d.classList.add("cont"); s.append("continues"); }
        d.appendChild(s);

        // HOIST EVERY MARK IN THE RUN.
        //
        // Collapsing to bullets hides the lines, and the marks were attached to
        // the lines — so the first version of this view hid 23 of 31 marks,
        // including BOTH `warn`s and all three `raise`s. One of them is "never
        // say the endpoint refuses SERVICE as settled fact", invisible in the
        // view the presenter actually speaks from. That is the precise harm the
        // marks exist to prevent, reintroduced by the feature meant to help.
        //
        // The rule is therefore absolute and testable rather than tasteful: a
        // mark is never hidden, in any density. check-marks.mjs enforces it.
        const body = document.createElement("div");
        body.className = "bulletlines";
        for (const b of r.lines) body.appendChild(scriptLine(b));
        d.appendChild(body);
        boxEl.appendChild(d);

        // OUTSIDE the <details>, deliberately. Anything inside it that is not
        // the <summary> is hidden while it is closed — so the first attempt at
        // this fix appended the hoisted row inside and hid it exactly as before.
        // The gate caught that, which is the argument for the gate: the render
        // was wrong in a way reading the code did not reveal, twice.
        const hoisted = markRow({ marks: r.lines.flatMap((b) => b.marks || []) });
        if (hoisted) { hoisted.classList.add("hoisted"); boxEl.appendChild(hoisted); }
      });
    } else if (which === "ask") {
      for (const a of notes.ask || []) boxEl.appendChild(askItem(a));
    } else {
      const ul = document.createElement("ul");
      ul.className = which === "plan" ? "plan" : "why";
      for (const w of notes[which] || []) {
        const li = document.createElement("li");
        li.append(inline(w));
        ul.appendChild(li);
      }
      boxEl.appendChild(ul);
    }
  }

  // ---------------------------------------------------------------- search --
  // Across every slide, because the question that arrives while you are on
  // slide 14 is usually about slide 9. A hit can be clicked to take the talk
  // to the slide it came from.
  function renderSearch(boxEl, q) {
    boxEl.textContent = "";
    const needle = q.toLowerCase();
    let hits = 0;
    SLIDES.forEach((s, i) => {
      const n = (s.notes || {});
      const found = (n.ask || []).filter((a) =>
        [a.q, a.say, a.a, ...(a.then || []), ...(a.evidence || [])]
          .filter(Boolean).join(" ").toLowerCase().includes(needle));
      const why = (n.why || []).filter((w) => w.toLowerCase().includes(needle));
      const script = (n.script || []).filter((b) => (lineOf(b) + " " + (b.group || "")).toLowerCase().includes(needle));
      if (!found.length && !why.length && !script.length) return;
      hits += found.length + why.length + script.length;

      const h = document.createElement("div");
      h.className = "n-label hit";
      // Opens the notes HERE. It does not touch the shared window — that is
      // what the button beside it is for, and keeping them separate is the
      // difference between looking something up and interrupting the talk.
      h.textContent = `${i + 1} · ${s.title}`;
      h.onclick = () => { preview = i; query = ""; $("q").value = ""; paint(); };
      const jump = document.createElement("button");
      jump.className = "hitshow";
      jump.textContent = "show it";
      jump.onclick = (ev) => { ev.stopPropagation(); preview = null; send("goto", i + 1); };
      h.appendChild(jump);
      boxEl.appendChild(h);
      for (const a of found) boxEl.appendChild(askItem(a, i + 1));
      for (const w of why.concat(script.map(lineOf))) {
        const p = document.createElement("p");
        p.className = "hitline";
        p.append(inline(w));
        boxEl.appendChild(p);
      }
    });
    if (!hits) {
      const p = document.createElement("p");
      p.className = "hitline";
      p.textContent = `nothing matches "${q}"`;
      boxEl.appendChild(p);
    }
  }

  // --------------------------------------------------------------- commands --
  function send(action, slide) {
    if (!relay.on) return;
    relay.send({ t: "command", action, slide });
    // Deliberately no optimistic update. This window shows what the deck
    // reported, so a command that vanished looks like nothing happening rather
    // than like success.
  }

  $("first").onclick = () => send("first");
  $("prev").onclick = () => send("prev");
  $("next").onclick = () => send("next");
  $("last").onclick = () => send("last");
  $("gridtoggle").onclick = () => $("grid").classList.toggle("on");
  $("mirrortoggle").onclick = () => { mirrorOn = !mirrorOn; paint(); };
  $("q").oninput = () => { query = $("q").value.trim(); paint(); };

  SLIDES.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "gitem";
    b.innerHTML = `<span class="gn">${i + 1}</span> `;
    b.append(s.title);
    b.onclick = () => send("goto", i + 1);
    $("grid").appendChild(b);
  });

  // Keyboard, for a presenter who would rather not aim a mouse mid-sentence.
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
      if (e.key === "Escape") { $("q").value = ""; query = ""; preview = null; $("q").blur(); paint(); }
      return;
    }
    if (e.key === "Escape") { preview = null; query = ""; $("q").value = ""; paint(); return; }
    if (e.key === "b" || e.key === "B") {
      scriptView = scriptView === "bullets" ? "full" : "bullets"; paint(); return;
    }
    if (e.key === "m" || e.key === "M") { mirrorOn = !mirrorOn; paint(); return; }
    if (e.key === "/") { e.preventDefault(); $("q").focus(); return; }
    if (["1", "2", "3", "4"].includes(e.key)) {
      tab = TABS[+e.key - 1][0]; query = ""; $("q").value = ""; paint(); return;
    }
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); send("next"); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); send("prev"); }
    else if (e.key === "Home") send("first");
    else if (e.key === "End") send("last");
  });

  // ------------------------------------------------------------------ timer --
  // Elapsed time is this window's OWN state — not shared, not reported. A
  // different owner for different data.
  let elapsed = 0, startedAt = null;
  function tick() {
    const ms = elapsed + (startedAt ? Date.now() - startedAt : 0);
    const s = Math.floor(ms / 1000);
    $("timer").textContent =
      `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }
  $("timer").onclick = () => {
    if (startedAt) { elapsed += Date.now() - startedAt; startedAt = null; }
    else { startedAt = Date.now(); }
    tick();
  };
  setInterval(tick, 500);

  // ------------------------------------------------------------------ store --
  const relay = window.TacatRelay.connect({
    role: "control",
    onSync: (s) => { state = s; paint(); },
    onState: (s) => { state = s; paint(); },
    onStatus: (s, presence) => {
      conn = s;
      if (presence) deckPresent = !!presence.deck;
      if (s !== "connected") deckPresent = false;
      paint();
    },
  });

  // Two seams for check-marks.mjs, and nothing else uses them.
  //
  // The alternative was a probe that reimplements the render and then agrees
  // with itself — which is how the hidden-marks bug survived being "obviously
  // fine". Driving the real renderer and reading the real DOM is the only test
  // that could have caught it, and that needs a way in.
  window.__setView = (v) => { scriptView = v; tab = "script"; paint(); };
  // A repaint that changes NOTHING else — what an arriving relay message
  // causes, and the only way to test that a repaint preserves what the
  // presenter had open.
  window.__repaint = () => paint();
  window.__gotoSlide = (i) => { preview = i; tab = "script"; paint(); };

  if (!relay.on) $("status").textContent = "no store configured — config.js is missing";
  paint();
})();

</script>
</body>
</html>
