/* WHERE THE AUDIENCE IS, drawn across the script. A rule rather than a chip:
   it is a boundary between what they have seen and what they have not, and a
   boundary is a line. Bright on the reveal that is on screen; the ones already
   passed stay legible but recede. */
.steprule {
  display: flex; align-items: center; gap: 10px;
  margin: 16px 0 12px; color: var(--faint);
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
}
.steprule::before, .steprule::after {
  content: ""; height: 1px; background: var(--line); flex: 1 1 auto;
}
.steprule::before { flex: 0 0 18px; }
.steprule span { flex: 0 0 auto; }
.steprule.now { color: var(--accent); }
.steprule.now::before, .steprule.now::after { background: var(--accent); height: 2px; }
.steprule.past { opacity: .45; }
.steprule.ahead { opacity: .7; }

/* The tail of a bullet that a step marker split. It is not a prompt, so it does
   not compete with one — but it stays clickable, because the lines under it are
   what the presenter is actually saying at that reveal. */
details.bullet.cont > summary { color: var(--faint); font-size: 15px; font-style: italic; }
details.bullet.cont > summary::before { opacity: .5; }

</style>
</head>

<script>
const SLIDES = [{"title":"title","notes":{"shows":"the cover — `tacat`, the subtitle, and one line naming three PLP-dependent transaminase reactions, an OWL ontology reasoned at build time, served over SPARQL 1.1, with your name under it.","script":[{"say":"This is `tacat` — a transaminase catalysis knowledge graph."},{"say":"Three PLP-dependent transaminase reactions, as an OWL ontology."},{"say":"It is reasoned at build time, and served over SPARQL 1.1."},{"say":"I'll start with the question it was built to answer."},{"do":"advance to slide 2 without pausing"}],"why":["There is no agenda slide, and that is a decision rather than an omission. Both of his own decks open on a concrete use case — the BfR one spends five slides on motivation before any architecture — so the instance comes first and the framing never arrives at all.","Those three sentences are the whole scope statement, and they are near-verbatim the README's opening paragraph. The deck and the repository say this in the same words on purpose.","The name, the event and the date are already on the slide, and the footer carries them on every slide after this one. Reading them out is exactly the padding this slide exists to avoid.","What it has to leave behind is that this person knows precisely what they built and is not going to pad — and that is bought by stopping, not by saying so.","Naming transaminases in the first breath is why the scope lands without argument: they are his standing worked example for the problem of modelling reactions in an ontology, and slide 9 of his Onto4Chem talk of 11 November 2025 is titled *modelling reactions* over a transaminase reaction. None of that is on screen and none of it is in the script — the deck shows the convergence, these notes hold the provenance, and the repository holds the citation."],"plan":["Twenty seconds, then straight on. Pacing for the whole deck is about a slide a minute — eighteen slides, roughly seventeen minutes, of which three minutes are live software.","Not a drop candidate, and nothing here is trimmable: twenty seconds buys the scope for the entire talk. The drop order elsewhere is slide 5, then 11.","Share one application window, never the desktop. The private working repository is one directory above the submission, and an editor tab strip, a file-explorer window or a stray browser tab showing it is unrecoverable. Cheat sheet on a phone or tablet, not on a second monitor of the presenting machine.","Before this slide is on screen: the container already up from a pre-built image, the environment activated so `tacat` is on the path, and the repository open in a tab of the shared window."],"ask":[{"q":"why these three reactions?","say":"They are **the brief's own three** — and they share one acceptor, so they form one graph.","then":["Aspartate, alanine and cysteine transaminase — EC `2.6.1.1`, `2.6.1.2`, `2.6.1.3`.","Rhea 21824, 19453 and 17441 respectively.","Each transfers an amino group from an L-amino-acid donor onto the same acceptor, 2-oxoglutarate.","There is a fourth, glutamate dehydrogenase — **the negative control**."],"evidence":["[src/tacat/reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py)","HARD_QUESTIONS.md section 2 — the control fails on arity, not on role"],"slide":7,"type":"scope"},{"q":"PLP-dependent — so where is the PLP?","say":"**On the enzyme**, not in the reaction — it is a prosthetic group, regenerated rather than consumed.","then":["It is held as an internal aldimine on an active-site lysine, then displaced to the external.","It cycles PLP to PMP and back within the ping-pong bi-bi mechanism, so it never balances.","All three Rhea equations have exactly four participants, and **none of them is PLP**.","Modelling it as a fourth substrate would validate and query, and still lie about stoichiometry."],"evidence":["`test_plp_is_not_a_reaction_participant` in [tests/test_competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_competency.py)","UniProt `COFACTOR` annotation — on the protein, not on the reaction","[src/tacat/reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — four participants each"],"type":"gotcha","about":["PLP"]},{"q":"SPARQL 1.1 — all of it?","say":"No — **the read subset** of the protocol; updates and `SERVICE` are refused by policy.","then":["`SELECT`, `ASK`, `CONSTRUCT` and `DESCRIBE`, over one default graph.","By GET or POST, with the result serialisations content-negotiated.","That refusal is a decision, *not an accident* — it is slide 14."],"evidence":["[src/tacat/api/negotiation.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/negotiation.py)","[src/tacat/api/policy.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/policy.py)","[tests/test_policy.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_policy.py)","[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) — read-only by decision"],"slide":14,"type":"gotcha","about":["SPARQL"]},{"q":"why only three positive reactions?","say":"It is **a demonstrator** of the modelling and delivery pattern, not a coverage claim.","then":["Three is enough to show one graph, one defined class, and a control that stays out.","Scaling is **an ingestion problem**, not a modelling one.","I would need a pipeline over Rhea, running the same inference, SHACL and competency-question gates.","The gates are the thing that scales, not the three reactions."],"evidence":["MANDATE_VS_ADDONS.md B1","HARD_QUESTIONS.md section 4 — the reasoner's premises are hand-written lists","[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) — known limitations"],"slide":16,"type":"scope"},{"type":"comprehension","about":["ontology"],"q":"what actually is an ontology — how is it not just a database?","say":"An ontology writes meaning down as logic, so a machine can **derive facts nobody stored**.","then":["A database answers what you put in; an ontology states classes and relations as axioms.","Nothing here records that a reaction is a transamination — HermiT derives it from the pattern.","So the schema has consequences: it can classify, and it can be inconsistent."],"slide":1},{"type":"comprehension","about":["OWL"],"q":"why OWL specifically — what does it buy you over a plain schema?","say":"OWL lets me define **a class by conditions** and have a reasoner decide membership.","then":["`TransaminationReaction` is a defined class of four participant conjuncts, not a label I attach.","That is what makes the type *derived* — a JSON or SQL schema cannot express it.","OWL 2 DL runs at build time; the endpoint is plain SPARQL over the result."],"slide":8},{"type":"approach","about":["reasoner"],"q":"three reactions and a reasoner — isn't this over-engineered? why not a spreadsheet?","say":"For three rows a spreadsheet does the lookup, but **not the question** the brief asks.","then":["The point is **roles and derivation** — produces versus has — which a flat table cannot check.","The same axioms classify a fourth reaction with no new code.","The size is the demo; the method is the deliverable."]},{"type":"interest","about":["transaminase"],"q":"what drew you to transaminases for this?","say":"They are the brief's own three, and they share one acceptor, so they form a single graph.","then":["A shared acceptor connects the reactions, which is what lets role show at all.","The family is small and well characterised — ideal for a focused demo.","The scope was given; I made it a connected example rather than three isolated ones."]}]}},{"title":"one question","notes":{"shows":"the question — *\"which reactions involve a given molecule as a reactant or product?\"* — and the molecule it is asked about: **L-glutamate**, `CHEBI:29985`.","script":[{"say":"One question first — and everything after this slide is answering it.","group":"the one question — everything after answers it"},{"say":"Which reactions involve a given molecule as a reactant or product?","marks":[{"warn":"his own question — never attribute it on screen"},{"land":"a requirement, not a demo"}]},{"beat":"one second — let him read it off the screen"},{"do":"point at the molecule line","group":"L-glutamate: no modelling in the question — a requirement I'll be held to"},{"say":"The molecule I picked is L-glutamate."},{"say":"There is no modelling in that question."},{"say":"It is a requirement — and it is the one I would like to be held to."}],"why":["This is almost verbatim his own competency question, from the Ontologies4Chem talk of 11 Nov 2025. The deck poses it as ours, with no attribution on screen and none in the script.","The attribution is absent by decision, not by oversight. Recognition he arrives at himself is worth more than a citation line, and quoting a talk of his in the first minute reads as reverse-engineering him rather than as knowing the field — `OUTLINE.md` §4a. The written record stays complete either way: `queries/competency.py` carries the citation for the NFDI4Cat question set, four of whose questions are quoted verbatim.","If he does recognise it, one sentence of agreement and straight on. Dwelling on it turns a shared requirement into flattery; denying it would be worse than never having borrowed it.","The slide's whole job is that this reads as a real requirement rather than a demo script — which is why it is posed before anything is modelled and why nothing about the ontology appears on it.","It is CQ05 and CQ06 in the suite. CQ05 is the participant form and expects four rows; CQ06 is the directional form — *which reactions PRODUCE L-glutamate, in the left-to-right orientation* — and expects three. That pair is the reason participation is an n-ary bridge node rather than a `hasSubstrate`/`hasProduct` property pair, which is slide 5.","L-glutamate was chosen because it participates in all four reactions in the graph, including the negative control — which is exactly why slide 4's two answers can be 4 and 3. Saying that here would pre-announce slide 4's first number, so it stays out of the script.","Slide 12 comes back to this same question against the running endpoint — the *given molecule* made operable. The script does not promise it, because slide 12's live view is not guaranteed to answer."],"plan":["Fifty seconds. The title ends at 0:20 and this slide at 1:10 — `OUTLINE.md` §4.","Not a cut. The drop order is slide 5, then 11; this is the setup that slides 3 through 12 pay off.","Static — no build, nothing live, nothing that can fail. If the screen share is still settling or he joined late, this is the safe slide to hold on."],"ask":[{"q":"where does that question come from?","say":"**It is yours** — near-verbatim the competency question from your Ontologies4Chem talk.","then":["It is also CQ05 and CQ06 in my suite, so it is what the modelling is tested against.","Four of the eleven, CQ01 to CQ04, are quoted verbatim from NFDI4Cat's own biocatalysis set.","The citation sits in `queries/competency.py` rather than on the slide."],"evidence":["[queries/competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — NFDI4CAT_QUESTION_SET, CQ05, CQ06","Ontologies4Chem, 11 Nov 2025 — 10.5281/zenodo.18022171","presentation/OUTLINE.md §4a — why no attribution is on the slide","presentation/meta/QUESTIONS.md — all eleven, with why each exists"],"slide":17,"type":"provenance"},{"q":"(he says that is my question)","say":"**It is yours**, and it is also CQ05 and CQ06 here — so it is what the model is tested against.","then":["It was **the specification**, written first, not a question I picked to flatter the demo.","One sentence is the whole answer — dwelling turns a shared requirement into flattery."],"evidence":["[queries/competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — CQ05, CQ06","presentation/meta/QUESTIONS.md — one question, five forms","presentation/OUTLINE.md §4a"],"type":"provenance"},{"q":"why L-glutamate rather than some other molecule?","say":"Because it is the only molecule in all four of my reactions, so the role clause changes the answer.","then":["That includes **the negative control**, which is why the two forms of the question differ.","A molecule in one reaction returns the same row both ways, which proves nothing."],"evidence":["[queries/competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — CQ05 expects four rows, CQ06 three","presentation/meta/QUESTIONS.md — CQ05, CQ06"],"slide":4,"type":"design"},{"type":"comprehension","about":["ChEBI"],"q":"what is `CHEBI:29985` — what does that identifier point at?","say":"CHEBI is a **public ontology** of chemical entities; 29985 is its identifier for L-glutamate.","then":["It is a resolvable, shared identifier — anyone can look it up.","Using it means I **did not invent** a name for glutamate.","That reuse is what makes the later join to Rhea possible."],"slide":2}]}},{"title":"two queries","notes":{"shows":"the same query twice, side by side — differing by one highlighted line, `tacat:participantRole tacat:Product`.","script":[{"say":"Here is that question, twice.","group":"the question twice — left: has it at all, right: produces it"},{"do":"point at the two column headings"},{"say":"On the left, which reactions have L-glutamate in them at all."},{"say":"On the right, which reactions *produce* it."},{"do":"point at the highlighted clause in the right-hand query","group":"one clause apart — the role must be `Product`"},{"say":"Same graph, same molecule — one line apart."},{"say":"That clause is the entire difference: the participant's role has to be `Product`.","marks":[{"land":"one line is the whole difference"}]},{"beat":"two seconds — let the one line sit there.","marks":[{"time":"2s"}]},{"beat":"then advance."}],"why":["Do not explain the difference here. Slide 4 is the answer and slide 5 is the reason it was possible; this slide only has to make the one line visible.","Query slide, then result slide, is his own documented idiom — the shape of the pair carries as much as its content does.","These are CQ05 and CQ06 in substance — *which reactions have L-glutamate as a participant*, and *which reactions produce it, left to right* — but not in text. The suite's form pins the local entity node and projects `rdfs:label`; the slide's form counts distinct reactions and reaches the molecule through its `rdf:type`, the ChEBI PURL. That second form is what slide 9 is about, and the label projection is the blindness slide 9 concedes.","`check-docs.mjs` builds the graph into a temp directory and executes both queries on screen whenever `docs/` is staged, asserting they return 4 and 3 in that order. The expected pair is written in the checker rather than read off slide 4, so the oracle and the subject do not share a source — that is the exact defect this project found in its own competency suite. Before that gate existed, nothing checked the SPARQL on screen was even syntactically valid, and a mistyped prefix would have been discovered in front of him."],"plan":["Nothing runs on this slide. The queries are static text; the recorded answers are on slide 4.","3 and 4 are one pair and must not be split. If an interruption lands here, finish slide 4 before answering — the payoff is in the second slide.","Ends about 2:00.","If he asks to watch one run, paste it into the console's query box at `/`. The console's one-click buttons are the six `EXAMPLE_QUERIES` in `api/examples.py` and neither of these is among them; the eleven CQs are listed further down that page, read-only. Without a browser, `tacat query -f <file>`."],"ask":[{"q":"are these your competency questions, or queries written for the slide?","say":"Both — the questions are CQ05 and CQ06, but **I rewrote the text** for the slide.","then":["They are CQ05 and CQ06 in `queries/competency.py`, which pytest runs — four rows and three.","The text is **not verbatim** — the suite pins the local entity node and projects a label.","This form counts distinct reactions and reaches the molecule through its `rdf:type`.","The doc checker runs the two on screen against the same graph and asserts four and three."],"evidence":["[queries/competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — CQ05 and CQ06, with their expected rows","[tests/test_competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_competency.py) — runs both against the built graph","check-docs.mjs — the deck SPARQL gate, SPINE {'two queries': [4, 3]}"],"slide":3,"type":"provenance","about":["competency"]},{"q":"where are the PREFIX lines?","say":"**Stripped deliberately** — four PREFIX lines on a two-column slide and neither query is readable.","then":["They are attached from one list in the deck build, so all four live in one place.","The doc checker supplies those same namespaces when it executes both queries.","So the text on the screen is **checked to run**, prefixes and all."],"evidence":["deck-src/build.mjs — the PREFIXES list","check-docs.mjs — supplies the same four namespaces before executing the slide's queries"],"slide":3,"type":"gotcha","about":["PREFIX"]},{"q":"why is a ChEBI term standing where the `rdf:type` goes?","say":"Because in **ChEBI's own RDF** it is an `owl:Class`, so our node is an instance of it.","then":["Class membership is the relation that is **exactly true** — it needs no predicate of my own.","That is the identity decision, and it has a slide of its own a few along.","You are seeing it here before I explain it."],"evidence":["[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) — 'Reuse identifiers; mint nothing that exists'","slide 9 — reuse external terms, mint local instances"],"slide":9,"type":"design","about":["ChEBI","rdf:type"]},{"type":"comprehension","about":["SPARQL"],"q":"what is SPARQL — how is a query like this different from SQL?","say":"SPARQL matches graph patterns — you draw the shape you want and it finds every subgraph fitting it.","then":["The triples are the shape, with variables like `?r` and `?e` as the blanks.","The engine returns every binding of the variables that makes all the triples true.","It is the standard query language for RDF, as SQL is for tables."],"slide":3},{"type":"approach","about":["SPARQL"],"q":"why expose SPARQL at all — why not a simpler REST or GraphQL API?","say":"A REST endpoint answers the questions I anticipated; SPARQL answers **the ones I did not**.","then":["The assessor can run a query **I never wrote**, against the live graph — the FAIR promise.","A fixed API would freeze the questions to whatever I had coded.","The read-only policy is what makes an open query surface safe to expose."],"slide":14},{"type":"implementation","about":["competency"],"q":"where do these two queries actually live?","say":"`src/tacat/queries/competency.py` — they are CQ05 and CQ06, quoted verbatim.","then":["`tests/test_competency.py` runs both against the built graph.","The verify stage fails if either count moves.","The deck's check-docs also executes them, so the slide cannot drift from the code."],"refs":[{"label":"competency.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py"},{"label":"test_competency.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_competency.py"}]}]}},{"title":"two answers","notes":{"shows":"two numerals, large — 4 and 3, one for reactions that *have* L-glutamate and one for reactions that *produce* it — and a line below them: the one that drops out is glutamate dehydrogenase.","script":[{"beat":"Two seconds, look at the camera.","marks":[{"time":"2s"}],"group":"four have it, three produce it — glutamate dehydrogenase drops out"},{"beat":"Let the gap do the work."},{"say":"Four reactions have L-glutamate."},{"say":"Three produce it."},{"say":"The one that drops out is glutamate dehydrogenase."},{"say":"Same graph, same molecule, one line apart — and the answer changes by a whole reaction.","marks":[{"land":"the answer moves by a whole reaction"}],"group":"role is modelled, not assumed — so what tells having from producing?"},{"say":"The role is *modelled* here, not assumed."},{"say":"So the question worth asking is what it is in the model that makes the difference."},{"say":"What can tell *having* a molecule from *producing* one?"}],"why":["The payoff of the pair. Slides 3 and 4 are query then result — his own documented idiom — so this slide has to land a number, not an explanation.","What it must leave behind is that the model distinguishes something a naïve one cannot. Everything on screen serves that and nothing else.","Why the dehydrogenase drops out is slide 5's only job, and 4 to 5 is the strongest causal join in the deck. It holds because the question is left open here — answering it now spends the next slide.","The two numerals are recorded, and they are true before anything is pressed: nothing on this slide fetches. They are also checked — `check-docs.mjs` executes slide 3's two queries against the graph and fails the docs build unless they return 4 and 3. That pair is the deck's spine, not two numbers typed into a file.","They are CQ05 and CQ06 without saying so. `competency.py` expects exactly those four labels and those three, `test_competency.py` asserts them and the verify stage gates them. No caption names them, because putting the method on screen at minute two spends slide 17's material eleven slides early.","Until the explorer landed, each numeral sat behind a `run it` button that re-ran slide 3's query against the live endpoint and went green when the live answer agreed — about three seconds each. The buttons were removed deliberately: a button that only re-displays a number already on the slide proves nothing, so the live proof moved to slide 12, where the molecule and the role are chosen in the moment out of twenty-four combinations.","The control is modelled partially — L-glutamate consumed, 2-oxoglutarate produced, two participants of a six-species reaction, the redox cofactors left out because their ChEBI identifiers were not independently verified. None of that touches these two counts; it is conceded on slide 7, where the reasoner is what is being claimed.","If the *why not two predicates* question arrives here rather than on slide 5, give the one-sentence version — it works until you need the stoichiometric coefficient — and hand the rest forward. Slide 5 is built to answer it properly."],"plan":["Must be reached. 4, 7, 10 and 12 are the four that cannot be cut.","3 and 4 are one pair — query, then result. If a question lands between them, finish this slide before answering; the payoff is in the second slide of the pair.","Nothing here is live, so there is nothing to fall back on and a dead endpoint costs this slide nothing."],"ask":[{"q":"are those numbers live, or recorded?","say":"Recorded — and **the docs build fails** if the graph stops returning them.","then":["`check-docs.mjs` executes both of the queries you just saw and asserts they come back 4 and 3.","Two of the competency questions expect those same answers, so if either moved verify would go red.","There is a **live view later** where you choose the molecule and role, and the endpoint answers."],"evidence":["check-docs.mjs §14g","[queries/competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — CQ05, CQ06","[test_competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_competency.py)"],"slide":12,"type":"evidence"},{"q":"why is glutamate dehydrogenase in the graph at all?","say":"It is **the negative control** — same two molecules as the transaminations, roles reversed.","then":["It carries both headline molecules: L-glutamate consumed, 2-oxoglutarate produced.","A model keyed on which molecules are present could not tell it from a transaminase.","This one drops it the moment you **ask about role** — that is the whole point of it.","It is modelled partially — two participants, not six — and I concede what that costs on slide 7."],"evidence":["[src/tacat/ontology/population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py) — REACT_0000099, two participants","HARD_QUESTIONS.md §2"],"slide":7,"type":"design"},{"q":"why L-glutamate in particular?","say":"Because it is the one molecule that **crosses all four reactions**.","then":["It is the amino acid produced by all three transaminations and the one consumed by the control.","So it is the single choice that makes the contrast visible at all.","2-oxoglutarate would give you the **mirror image** of the same slide."],"evidence":["[src/tacat/reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — CHEBI_29985 in all four reactions"],"type":"design"},{"type":"comprehension","about":["modelled"],"q":"what do you mean the role is modelled, not assumed?","say":"Modelled means the role is **data on each participant**, not something the query assumes.","then":["A naive model has one 'involves' link and cannot separate the two.","Here the role hangs on the participation, queryable directly.","That is why the same molecule gives four answers or three."],"slide":4}]}},{"title":"participation is n-ary","notes":{"shows":"the `nary` figure — a binary predicate spending its only slot on the predicate name, beside the bridge node carrying entity, role and coefficient.","script":[{"do":"point at the left panel","group":"a binary spends its one slot on the name — nowhere for role or count"},{"say":"A binary predicate spends its only slot on the predicate name."},{"say":"`hasSubstrate` tells you *that* alanine is a substrate."},{"say":"But it gives you nowhere to say it is one of several, or that there is one of it.","marks":[{"land":"the binary has nowhere to attach role or count"}]},{"say":"So the participation becomes a node of its own.","marks":[{"warn":"standard W3C pattern — do not present as novel"}],"group":"so participation is its own node — role and coefficient hang where they belong"},{"say":"Now the role and the coefficient hang off the participation, where they belong."},{"say":"They are facts about this molecule *in this reaction*, not facts about the molecule."},{"say":"That is the whole reason the two queries two slides ago could differ by one line."}],"why":["The standard W3C n-ary pattern, Use Case 1 — BioPAX and SBML both do it. Say so if he asks; presenting it as novel would be the wrong claim."],"ask":[{"q":"why not `hasReactant` and `hasProduct` as separate predicates?","say":"It works until you need the coefficient — and then there is **nowhere to put it**.","then":["The role would live in the *vocabulary* instead of in the *data*.","So you could not ask for participants irrespective of role without naming every predicate.","The SBO term is a class assertion; a predicate name is a string I chose.","It is the **standard W3C n-ary pattern** — BioPAX and SBML both do the same."],"evidence":["[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) § Participation is an n-ary relation","[schema.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py) — ReactionParticipant, participantRole, stoichiometricCoefficient","[data/shapes.ttl](https://gitlab.com/k.sachikonye/tacat/-/blob/main/data/shapes.ttl) — SHACL constrains both on the participant node","MANDATE_VS_ADDONS.md B3 — the Reac4Cat comparison, if he prefers the role pattern"],"slide":5,"type":"design","about":["n-ary"]},{"type":"comprehension","about":["n-ary"],"q":"what does n-ary actually mean here?","say":"A relation among **more than two things** at once — here entity, role and coefficient.","then":["An RDF triple is **binary**: subject, predicate, object — exactly two ends.","A participation relates three, so it becomes its own node the three hang off.","That node is the bridge in the figure."],"slide":5},{"type":"comprehension","about":["reification","n-ary"],"q":"isn't this just reification — is it a standard pattern?","say":"Yes — it is the **W3C n-ary relations pattern**, and I would not claim it as novel.","then":["The bridge node is the standard way RDF carries a fact with more than two participants.","What is mine is modelling participation this way, **not the pattern itself**."]},{"type":"approach","about":["property graph"],"q":"a property graph puts attributes on the edge — why RDF instead of Neo4j?","say":"A property graph would carry role and coefficient on the edge — I chose **RDF for reuse**.","then":["RDF gives global IRIs, so the join to Rhea and UniProt works against servers I do not own.","OWL reasoning over RDF derives the type; property graphs have **no standard reasoner**.","The n-ary node is the cost of that choice, paid once."],"slide":10},{"type":"implementation","about":["n-ary"],"q":"where is the n-ary participation modelled in code?","say":"`src/tacat/ontology/schema.py` — the `ReactionParticipant` class with role and coefficient.","then":["The participation node carries `participantRole` and `stoichiometricCoefficient`.","`data/shapes.ttl` constrains both on every participant.","`tests/test_shapes.py` checks the constraints hold."],"refs":[{"label":"schema.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py"},{"label":"shapes.ttl","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/data/shapes.ttl"}]},{"type":"interest","about":["n-ary"],"q":"the n-ary node is a neat idea — would you reach for it again?","say":"Yes — wherever a relationship has more than two parties or needs its own attributes.","then":["It is the standard W3C pattern, not something I invented.","Here it is what makes role and coefficient first-class rather than lost.","The cost is one extra node, paid once."]}],"plan":["First slide to drop if the clock has gone. It explains why slide 4 worked, and slide 4 has already landed."]}},{"title":"modelling reactions","notes":{"shows":"five rows — reactants/products, stoichiometry, class–instance, conditions, stereochemistry — each with where it lives here, and the last two marked **not carried**.","script":[{"say":"That is the one decision the question forced.","group":"from the one decision the question forced, to the whole checklist a model faces"},{"say":"Here is the rest of what a reaction model has to account for."},{"do":"one press per row — the three carried, then the two not carried together"},{"step":1},{"say":"Reactants and products are not two predicates here.","group":"roles: one property to an SBO class, not two predicates I named"},{"say":"They are one property, `participantRole`, pointing at an SBO term."},{"say":"So the role is a class assertion, where a predicate name would have been a string I chose."},{"step":2},{"say":"Stoichiometry hangs on the same bridge node, as `stoichiometricCoefficient`.","group":"stoichiometry rides the same bridge node — a slot only the n-ary buys"},{"say":"It is a slot that exists at all only because the participation is a node."},{"step":3},{"say":"The class–instance relation is the one I would draw your eye to.","marks":[{"land":"the class–instance relation is the one to land"}],"group":"class–instance — rdf:type IS the ChEBI class, no hasChebiIdentifier"},{"say":"The node's `rdf:type` *is* the ChEBI class."},{"say":"There is no `hasChebiIdentifier` property anywhere in this model."},{"say":"I will come back to why that matters."},{"step":4},{"do":"point at the two muted rows","group":"the two not carried — conditions and stereochemistry"},{"say":"The last two I do not carry, and I would rather say so now than be asked.","marks":[{"raise":"name the two gaps before he asks"},{"raise":"name the two gaps before he asks"}]},{"say":"Conditions are not in the graph at all — no pH, no temperature, no buffer.","group":"conditions: not carried — that is a process model, LARA's domain"},{"say":"A measured value means nothing without the conditions it was measured under."},{"say":"So carrying them is modelling the experiment rather than the reaction."},{"say":"That is a process model."},{"say":"It is the natural direction of extension."},{"say":"It is not something this should have pretended to do."},{"say":"Stereochemistry is in the data but not in the reasoning.","group":"stereochemistry: in the data through the microspecies, not in the reasoning"},{"say":"Every participant is carried as the ChEBI microspecies."},{"say":"The microspecies pins the stereocentre — L-alanine, not alanine."},{"say":"But no property in the model expresses it, so nothing here would notice a D- species."}],"why":["The five concerns are his own annotation set. Ontologies4Chem, 11 November 2025, his slide 9 — also titled *modelling reactions* — annotates a transaminase reaction in red with reactants · products · conditions · stoichiometry factors · stereo chemistry, and in orange with class – instance relation. The slide is built to match it and never says so; present it as what any reaction model must account for.","The highest-value slide in the deck (`OUTLINE.md` §4), and naming the two not carried before he asks is the whole point of it — his own limits framing turned on ourselves. Volunteering the boundary is worth more than any completeness claim, because it shows the model's edges were chosen rather than reached.","Mild seam from slide 5: the zoom-out from the one decision the question forced to the whole landscape. Without the opening sentence this reads as a new topic rather than as the widening of the last one.","Slide 11 is the other five-row table, and the two are about different things: that one is what the *defined class* does not constrain, this one is what the *graph* does not hold. Keeping them distinct is what stops the second reading as a repeat.","What \"the ChEBI microspecies pins it\" means: every participant is the species that predominates at Rhea's reference pH 7.3 — L-alanine is the zwitterion `CHEBI:57972`, not the neutral parent `CHEBI:16977`. The convention is followed throughout `reference_data.py`, but the number 7.3 appears nowhere in the submitted tree."],"plan":["One of the two densest slides — 6 and 11 are the five-row tables, one in each half, and the two most likely to be rushed. Read the table down, not across.","The three carried rows all reappear later — roles and coefficients in the graph figure on 8, the `rdf:type` on 9. So if the clock is short, the two **not carried** rows are the half that must survive; the rest can go fast.","Drop order is decided in advance, not in the moment: slide 5 first, then 11. Slide 6 is only in question after both, and 4, 7, 10 and 12 must be reached whatever happens.","Nothing live here, but slide 7 is the first live block — have the terminal window up and `tacat` ready before leaving this slide."],"ask":[{"q":"that list is mine — those are my slides","say":"It is, yes — from **your Ontologies4Chem talk**, the slide called modelling reactions.","then":["It was the most complete statement of the problem I found, so I used it as the checklist.","I would rather borrow yours than invent my own.","So I will not elaborate — the two rows I do not carry are the half worth your time."],"evidence":["Ontologies4Chem, 11 Nov 2025 — his slide 9, same title","deck.json slide 6 — notes.why"],"type":"provenance"},{"q":"why not carry conditions?","say":"Because a measured value is **meaningless without the conditions** it was measured under.","then":["Carrying pH, temperature and buffer means modelling the *experiment*, not the *reaction*.","That is protocols, steps, materials and equipment — a laboratory-process model.","That is **LARA's domain** rather than a reaction ontology's, and the natural extension.","So *optimal pH or temperature of enzyme X* is one this cannot answer, not one it answers badly."],"evidence":["[competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — OUT_OF_SCOPE_QUESTIONS","MANDATE_VS_ADDONS.md — LARA"],"type":"scope"},{"q":"stereochemistry is the whole point of a transaminase — how is it not carried?","say":"It is carried **by the identifier** and by nothing else.","then":["Every participant is the ChEBI microspecies — L-alanine is `CHEBI:57972`, the zwitterion.","Rhea writes it at its reference pH, and that class fixes the stereocentre — **the graph is right**.","No property expresses it and the defined class never refers to it, so nothing notices a D- species.","Doing it needs stereo-descriptors as data or atom-level structure, then atom mapping — Rhea's job."],"evidence":["[reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — CHEBI:57972","[competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/competency.py) — the microspecies note","HARD_QUESTIONS.md §3"],"slide":11,"type":"scope","about":["stereochemistry"]},{"q":"every coefficient in your graph is 1.0 — so what does that slot buy you?","say":"All fourteen are — the pattern is **demonstrated, not exercised**.","then":["These three Rhea equations are one-to-one, and I would say so before claiming otherwise.","What it buys is the place the number goes when it is not one — a binary `hasSubstrate` has none.","SHACL requires exactly one positive `xsd:decimal` on every participant — **decimal, not double**.","Ratios are exact, floats cannot hold a third, and silent rounding is a bug nobody finds."],"evidence":["[data/shapes.ttl](https://gitlab.com/k.sachikonye/tacat/-/blob/main/data/shapes.ttl) — the participant shape's sh:message","[population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py)","HARD_QUESTIONS.md §6"],"slide":8,"type":"design","about":["stoichiometry"]},{"type":"comprehension","about":["SBO"],"q":"what is SBO, and why point `participantRole` at it?","say":"SBO is the Systems Biology Ontology — a controlled vocabulary of roles like reactant and product.","then":["Pointing at an SBO term makes the role **a resolvable class**, not a string I coined.","So 'product' here means the same 'product' anyone else using SBO means.","It is reuse applied to the role, as ChEBI is reuse applied to the molecule."],"slide":6},{"type":"comprehension","about":["microspecies"],"q":"what is a microspecies, and why carry that rather than the plain molecule?","say":"A microspecies is one **protonation and charge state** of a molecule at a given pH.","then":["L-alanine at Rhea's reference pH is the zwitterion `CHEBI:57972`, not the neutral parent.","Carrying it **pins the stereocentre** and the charge the reaction actually balances on.","It is how the graph is right about stereochemistry even though no property states it."],"slide":6},{"type":"approach","about":["BioPAX","SBML"],"q":"why model reactions yourself — why not reuse BioPAX or SBML?","say":"Those carry pathway structure and kinetics this deliberately does not; I reused Rhea for identity.","then":["The reaction identity here comes from Rhea's master IRIs, not from me.","What I added is **the OWL classification** over participant roles.","Reusing a heavier model imports scope I would then have to justify not using."],"slide":11}]}},{"title":"nothing is asserted","notes":{"shows":"The matrix: four reactions against the four slots the definition requires, and the verdict — three classified, the control short by two.","script":[{"say":"Everything on that list is something I either carry or deliberately do not.","group":"unlike the rest of the list, nothing writes this one down at all"},{"say":"This one is different — nothing writes it down at all."},{"do":"step the figure — the definition, then what each fills, then the verdict","group":"HermiT, under four seconds — three classified, in no source file"},{"step":1},{"say":"This is HermiT.","marks":[{"time":"~4s"}]},{"say":"Under four seconds, and I timed it this morning."},{"step":2},{"beat":"let the last frame land, then two seconds of silence","marks":[{"time":"2s"}]},{"step":3},{"say":"Three reactions classified."},{"say":"Nothing in any source file says so."},{"say":"And I want to be exact about what the reasoner decided, because it is less than it looks.","group":"a shape, not chemistry — atom mapping settles it, which is Rhea's"},{"say":"It decided a *shape*: an amino acid and a 2-oxo acid on each side, in those roles.","marks":[{"land":"a shape, not chemistry"}]},{"say":"It is not deciding chemistry."},{"say":"A reaction whose products were identical to its reactants would satisfy that definition."},{"say":"Atom mapping is what would settle it, and that is Rhea's job."},{"say":"It is the limit you have written about."}],"why":["The biggest jump in the deck: slide 6 was what the model CARRIES, this is what it works out for itself.","Volunteer the limit rather than waiting for it. With this slide up he can construct the counterexample himself — volunteered it reads as fluency, extracted it reads as having overclaimed.","Verified: alanine + 2-oxoglutarate to 2-oxoglutarate + alanine does classify."],"ask":[{"q":"how does HermiT know 2-oxoglutarate is a 2-oxo acid?","say":"**Hand-asserted** — it comes from a curated list in `reference_data.py`, not from ChEBI.","then":["`population.py` types each entity from those tuples; there is no `owl:imports` of ChEBI.","So the inference sits one assertion from its premises — the two predicates it tests.","Importing ChEBI would fix it and pull **forty thousand classes** into a three-reaction demo.","The honest middle is a build-time SHACL check that asserted types agree with ChEBI's hierarchy."],"evidence":["[population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py)","[reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — TWO_OXO_ACIDS, AMINO_ACIDS","HARD_QUESTIONS.md §4"],"type":"gotcha","about":["HermiT"]},{"q":"does the negative control show what you claim?","say":"No — and I will concede that; it **fails on the count** before the roles matter.","then":["It carries two participants of a six-species reaction, so it cannot fill four role-slots.","So it proves a partial reaction fails the complete definition, which is a weaker claim.","The role discrimination is real — a **four-participant reversal** is correctly refused.","So role discrimination is carried by that reversal test, not by the control I shipped."],"evidence":["HARD_QUESTIONS.md §1-2","[population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py) — _add_negative_control, REACT_0000099","negative-control.json"],"type":"evidence","about":["negative control"]},{"q":"what about the disjointness axiom?","say":"It is **too strong** — as a general chemical claim it is simply false.","then":["`schema.py` carries `AllDisjoint([TwoOxoAcid, AminoAcid])` as a global axiom.","**Omega-amino 2-oxo acids** are both, so the axiom is false of real chemistry.","It is load-bearing for the wrong reason — it keeps classification clean on nine molecules.","It should be a *local* closure over the nine entities I carry, not a global claim."],"evidence":["[schema.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py)","HARD_QUESTIONS.md §5","disjointness-axiom.json"],"type":"gotcha","about":["disjointness"]},{"q":"what exactly is inferred, and what is asserted?","say":"**One thing is inferred** — membership in `TransaminationReaction`; everything else is asserted.","then":["Nothing asserts the reaction's type — HermiT derives it from the **four role facts**.","Participant roles and stoichiometric coefficients are asserted in `population.py`.","So are the external links to ChEBI, Rhea and UniProt, which `linking.py` writes.","And the chemical categories — amino acid, 2-oxo acid — are *curated*, not imported."],"evidence":["[population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py), [linking.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/linking.py)","[reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — the curated tuples","slide 8 — blue inferred, black asserted"],"slide":8,"type":"comprehension","about":["inferred","asserted"]},{"q":"why not import ChEBI?","say":"Because a three-reaction demonstrator should **stay bounded** — ChEBI is forty thousand classes.","then":["The ontology stays small enough to read, and the reasoner stays fast enough to run live.","The cost is that the category types are curated today rather than derived from ChEBI.","The next quality gate is a **build-time check** of those types against ChEBI's hierarchy.","That validates the premises without importing them, which is the honest middle here."],"evidence":["[reference_data.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py) — the curated tuples","no `owl:imports` anywhere in src/tacat","HARD_QUESTIONS.md §4"],"slide":9,"type":"design","about":["ChEBI"]},{"type":"comprehension","about":["reasoner"],"q":"what does a reasoner actually do here?","say":"It reads the axioms and derives what must be true — like classifying a reaction nobody labelled.","then":["Given a defined class and the graph, HermiT computes which individuals satisfy it.","It is **deduction over logic**, not a query or pattern match.","The derived type is added to the graph; no source file asserted it."],"slide":7},{"type":"comprehension","about":["defined class"],"q":"what does necessary and sufficient mean for a defined class?","say":"It means the conditions both must hold for a member and are **enough to conclude membership**.","then":["An ordinary class says its members have these properties.","A defined class says having the properties **makes you a member**.","That two-way link is what lets the reasoner classify rather than only check."],"slide":7},{"type":"approach","about":["reasoner"],"q":"why use a reasoner at all — why not just assert the type on each reaction?","say":"Because an asserted type is a claim I could get wrong; a derived one is **forced by the data**.","then":["Asserting 'this is a transamination' on three rows is easy and unchecked.","Deriving it means the definition and the participants must actually agree.","The reasoner turns a label into a **consequence I cannot fake**."],"slide":7},{"q":"can you show the reasoner actually running?","say":"Not in the browser — HermiT is a Java process and the runtime image has **no JVM**.","then":["It runs in the builder stage, and the build **fails if it derives nothing**.","What is on screen is the graph it produced, which the endpoint serves.","`tacat infer` takes under four seconds if you want to watch it afterwards."],"evidence":["[Dockerfile](https://gitlab.com/k.sachikonye/tacat/-/blob/main/Dockerfile) — the builder installs default-jre-headless; the runtime installs nothing","deck-src/make-figures.mjs — this figure is queried from the graph, not drawn"],"type":"evidence","about":["reasoner"]},{"type":"implementation","about":["HermiT"],"q":"where is the defined class and the reasoner call in code?","say":"`src/tacat/ontology/schema.py` declares the defined class; `inference.py` runs HermiT.","then":["The class is necessary-and-sufficient over chemical classes and roles.","`inference.py` calls HermiT as a subprocess and writes the reasoned graph.","The consistency gate asserts the type is derived, not asserted."],"refs":[{"label":"schema.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/schema.py"},{"label":"inference.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/inference.py"}]},{"type":"interest","about":[],"q":"what was the trickiest part of getting the definition right?","say":"Necessary-and-sufficient — too loose and everything classifies, too tight and nothing does.","then":["The participant-role signature was the balance that fit these three and only these.","A reaction whose products equalled its reactants would still satisfy it — the honest limit.","Atom mapping would settle that, and that is Rhea's job."]}],"plan":["The output printed on the slide is the fallback if the live run fails. Carry on from 'three reactions classified'."]}},{"title":"the artefact the build produces","notes":{"shows":"the generated `graph` figure — one reaction's whole neighbourhood as served, the inferred type in blue at the top, everything asserted in black below it.","script":[{"do":"point at the blue box at the top","group":"the blue box is in no file — HermiT put it there, the four below entail it"},{"say":"Everything black on this slide is asserted."},{"say":"The blue box at the top is in no source file.","marks":[{"land":"the blue box is in no source file — HermiT put it there"}]},{"say":"HermiT put it there, because the four things below entail it."},{"do":"trace bottom-up with a finger, left to right along the four entity boxes","group":"the four conjuncts — amino/2-oxo acid, consumed and produced — force the type"},{"say":"L-aspartate is an amino acid consumed, 2-oxoglutarate a 2-oxo acid consumed."},{"say":"Oxaloacetate is a 2-oxo acid produced, L-glutamate an amino acid produced."},{"say":"Those are the definition's four conjuncts, and that is why the type appears."},{"do":"point at one of the dashed boxes in the middle row","group":"the dashed boxes are the n-ary nodes — role and coefficient hang on them"},{"say":"These are the n-ary bridge nodes from the earlier slide."},{"say":"This is what they buy."},{"say":"The role and the coefficient hang on the participation, not on the molecule."},{"say":"And the picture itself is generated, not drawn.","group":"generated, not drawn — every node came back out of the endpoint over SPARQL"},{"say":"Every node and every label in it came back out of the endpoint over SPARQL."}],"why":["Slide 7 made the claim in a terminal; this slide is the artefact. The seam needs no bridge sentence — the graph on screen is the same three reactions HermiT has just classified, and the join reads as claim then artefact.","What it should leave behind: the inference is not a log line, it is in the graph you can query.","The reaction is `tacat:REACT_0000001`, aspartate transaminase, Rhea 21824 — the primer's own worked example. All three reactions classify identically, so nothing turns on which one is drawn.","`rhea:21824` and `obo:CHEBI_29991` are on screen here standing where a type goes, and go unexplained on purpose. Slide 9 names that decision rather than introducing identity cold — the 8 to 9 seam is inverted, the decision is *seen* before it is *explained*.","The limit on what the reasoner decided — a participant-role signature, not chemistry — was volunteered out loud on slide 7 and is not repeated here.","Provenance: `deck-src/make-figures.mjs` queries a running endpoint over SPARQL and only lays out what comes back. The SVG is committed under `deck-src/figures/` and inlined by `build.mjs`, because the deck asserts its own self-containment and a remote image would fail that gate. Regeneration against unchanged data is byte-identical, so a `git diff` after a regen means the data moved.","The generator carries a guard — exactly three reactions typed `TransaminationReaction` — and that guard is what protects this figure's *INFERRED — asserted nowhere* line. A hand-drawn diagram of a graph is a claim nothing checks, and a stale diagram is believed more readily than stale prose.","Every coefficient on screen reads `1.0`, and every coefficient in the shipped graph is: fourteen participants, one distinct value. The bridge node's capacity to carry stoichiometry is a design argument, not something this graph demonstrates, so it is never offered as evidence. HARD_QUESTIONS.md §6."],"plan":["Thirty seconds. Slide 7 ends at 6:40 and this one at 7:10 — it is the payoff of 7, not a new argument.","Nothing live here. The figure is a committed SVG inlined in the deck, so there is nothing on this slide that can fail. If `tacat infer` did not run on slide 7, this slide is the evidence — give it the extra time and read the blue box more slowly.","If slide 5 was dropped for the clock, \"the n-ary bridge nodes from the earlier slide\" has no referent. Say \"these dashed boxes are the participations themselves — one per molecule, carrying its role\" instead.","Not on the drop list — 5 goes first, then 11. It is short, and it is where slide 7's claim becomes checkable."],"ask":[{"q":"you argued the bridge node exists to carry stoichiometry — show me a coefficient that isn't 1","say":"**There isn't one** — fourteen participants, every coefficient `1.0`.","then":["All three reactions are one-to-one, so there is nothing else to show you.","The bridge node is a structural affordance these three reactions do not exercise.","I would rather have the pattern that **survives the fourth reaction** than one rewritten for it.","But you are right that nothing in this graph forces it."],"evidence":["HARD_QUESTIONS.md §6","verified: distinct coefficients in the shipped graph: ['1.0']","nary-vs-reac4cat.json overstates this — it implies the capacity is exercised"],"slide":5,"type":"gotcha","about":["bridge node","stoichiometry"]},{"type":"comprehension","about":["graph"],"q":"what am I actually looking at in this graph?","say":"**One reaction's neighbourhood** as served — every node came back from the endpoint over SPARQL.","then":["The boxes are participants and their bridge nodes; the edges are the properties.","The type at the top is the one HermiT derived, set apart from what is asserted.","It is the graph **you can query**, not a diagram I drew."],"slide":8}]}},{"title":"reuse external terms, mint local instances","notes":{"shows":"external identifiers standing where a type goes — Rhea, ChEBI, UniProt — and the v0 counter-example beside them.","script":[{"say":"You just saw those external names in the graph.","group":"those external names ARE the rdf:type — the term a class, our node its instance"},{"say":"That is one decision, and it is the one that makes the next slide possible."},{"say":"The identifier *is* the `rdf:type`."},{"say":"In all three vocabularies the external term is a class, and our node is an instance of it."},{"do":"point at the counter-example on the right","group":"the counter-example: a PURL as a string — resolvable, unjoinable, zero rows"},{"say":"That is what I did first: the PURL carried as a string."},{"say":"Well-formed, resolvable — and unjoinable."},{"say":"It returns zero rows, silently.","marks":[{"land":"well-formed, resolvable — and unjoinable"}]},{"say":"For a while I couldn't tell a right identifier from a wrong one, so I measured it.","group":"so I measured it — wrong CHEBI everywhere, suite green; now CQ10/11 name the PURLs"},{"say":"I repointed every identifier in the graph to a nonexistent `CHEBI_99999999`."},{"say":"The whole suite stayed green."},{"say":"Every oracle was projecting a label — and the label and the identifier are two fields of one row."},{"say":"So CQ10 and CQ11 name the PURLs directly."},{"say":"And a regression test corrupts the graph and asserts that the suite notices."}],"why":["Eleven competency questions in total, CQ01-CQ11."],"ask":[{"q":"where is BRENDA?","say":"In the README table and as `dcterms:source` on the dataset — **not as a link** in the graph.","then":["BRENDA is indexed by EC number, and that number is in the graph as a UniProt `up:Enzyme` class.","So the join key is there and it resolves — there is just no BRENDA triple to show.","I minted no `brenda-enzymes.org` IRI because BRENDA **publishes no RDF identifier** to reuse.","Minting one would be the same mistake as the literal on the right."],"evidence":["[README.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/README.md) — the EC-number table, each row linking to brenda-enzymes.org","[provenance.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/provenance.py) — `dcterms:source` \"ChEBI; Rhea; UniProtKB; BRENDA\" on the dataset","OUTLINE.md §4c — do not volunteer this; there is no BRENDA triple to show"],"slide":9,"type":"scope","about":["BRENDA"]},{"q":"(he clicks one of our IRIs and gets a 404)","say":"That's **deliberate**, and `DECISIONS.md` says so.","then":["A w3id namespace is **a commitment to persistence** through the W3C Permanent Identifier group.","Claiming one for a demonstrator nobody will maintain squats a permanent identifier.","And what it would name is explicitly impermanent.","The shape is your ecosystem's — Voc4Cat is `w3id.org/nfdi4cat/voc4cat_0000123`."],"evidence":["[DECISIONS.md](https://gitlab.com/k.sachikonye/tacat/-/blob/main/DECISIONS.md) § The w3id namespace is used but not registered","HARD_QUESTIONS.md §7 — w3id.org/bitspark/tacat/ 404s, the ChEBI PURL 200s","HARD_QUESTIONS.md §7 — if this became real, the perma-id/w3id.org PR is step one"],"slide":9,"type":"gotcha","about":["IRI"]},{"q":"why create a local node instead of using the ChEBI IRI directly?","say":"Because `obo:CHEBI_57972` is a *class*, and what I need in the graph is an **instance** of it.","then":["The ChEBI IRI denotes the chemical class; my local node denotes the entity used in this graph.","`rdf:type` connects the two without ever treating a class as the occurrence.","Class membership is the relation that is exactly true, so it needs no predicate of its own.","Rhea and UniProt publish their terms as classes too, so the same move works there."],"evidence":["[linking.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/linking.py) — `graph.add((node, RDF.type, target))` and the docstring arguing it","[population.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py) — the Rhea master and the EC class attached as `rdf:type`","[test_competency.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_competency.py)::test_no_identifier_is_carried_as_a_literal"],"slide":9,"type":"design","about":["ChEBI","IRI"]},{"type":"comprehension","about":["IRI"],"q":"what is an IRI, and why does it matter that these are IRIs?","say":"An IRI is a **globally unique** web identifier — a name for a thing, not a page.","then":["Because it is global, my `CHEBI_57972` and Rhea's are **literally the same node**.","That is what lets a join happen across endpoints I do not control.","A local string ID would be unique to me and joinable to nothing."],"slide":9},{"type":"comprehension","about":["instance"],"q":"why is our node an instance of the ChEBI class rather than the class itself?","say":"ChEBI defines L-alanine as a class; a participant is **one occurrence**, so it is an instance.","then":["`rdf:type` is the membership link — exactly true, and native to RDF.","It needs no invented `hasChebiId` predicate, which is where the predecessor went wrong.","Membership stays joinable; a string does not."],"slide":9},{"type":"approach","about":[],"q":"why not just store the ChEBI ID as a string field — isn't that simpler?","say":"That is exactly **what the predecessor did**, and it returns zero rows, silently.","then":["A string is well-formed and resolvable, but unjoinable — nothing links it to Rhea.","The failure is silence: the query runs and finds nothing, with no error.","**CQ10 and CQ11** exist to catch precisely that."],"slide":9},{"type":"implementation","about":["IRI"],"q":"where is the external identifier attached as rdf:type?","say":"`src/tacat/ontology/linking.py` — it adds `(node, RDF.type, external_class)` for each term.","then":["The docstring argues why membership, not a string property, is the right link.","`population.py` attaches the Rhea master and EC class the same way.","A competency test asserts no identifier is carried as a literal."],"refs":[{"label":"linking.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/linking.py"},{"label":"population.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/ontology/population.py"}]},{"type":"interest","about":[],"q":"did you consider minting your own vocabulary at all?","say":"Briefly — but the whole point is joinability, and a local vocabulary joins to nothing.","then":["The predecessor carried identifiers as strings and got zero rows, silently.","Reusing ChEBI, Rhea and UniProt is what makes the later federation possible.","Minting local terms would have been easier and useless."]}],"plan":["The measured-blindness half is the strongest material here and the longest. If the clock is short, the counter-example alone carries the slide."]}},{"title":"the identifier is the join key","notes":{"shows":"LIVE. The `federation` figure — tacat to Rhea to UniProt, joined on an IRI — and 15 / 27 / 91 reviewed proteins.","script":[{"say":"Which proteins catalyse these reactions is a question this graph cannot answer.","group":"the graph can't answer this — but every reaction carries a Rhea IRI as a node"},{"say":"It knows three reactions and their participants."},{"say":"It knows nothing about organisms, or proteins, or who expresses what."},{"say":"But every one of those reactions carries a Rhea master identifier — as a node, not as a string."},{"say":"So I can put the question to someone who does know."},{"do":"step the three panes, then press \"run it live\"","group":"out to Rhea and UniProt, about a second — 15 / 27 / 91 reviewed"},{"say":"The first pane asks this system which Rhea identifiers it carries."},{"say":"About a second.","marks":[{"time":"~1s — never the --detail query"}]},{"beat":"let the rows land, then two seconds of silence","marks":[{"time":"2s"}]},{"say":"Fifteen, twenty-seven and ninety-one reviewed proteins."},{"beat":"two seconds on the three numbers before saying why they are there"},{"say":"None of that is in my graph.","group":"none copied, no import, no sync — the join ran on servers I don't control"},{"say":"I did not copy it, there is no import step, and there is nothing to keep in sync."},{"say":"The join happened at UniProt, over HTTP, on a server I do not control.","marks":[{"land":"the join runs on servers you do not control"}]},{"say":"And it works for exactly one reason, which is the decision on the previous slide.","group":"and only because the identifier is an IRI — mint your own and it comes back empty"},{"say":"The Rhea identifier is an IRI, so it is a join key on their endpoint as well as mine."},{"say":"Had I minted my own it comes back empty, which is the second line."},{"say":"Interoperability is the one thing you cannot assert."},{"say":"Either somebody else's endpoint can join to you or it cannot."},{"say":"One word about where this runs.","group":"this is the CLI, not the served endpoint — the served graph never needs a third party"},{"say":"It is not the served endpoint, and nothing we serve needs federation."},{"say":"Nothing we serve needs federation, so it is a CLI operation and never sits in the request path.","marks":[{"warn":"never say the endpoint \"refuses SERVICE\" as settled fact"}]},{"say":"That also means the served graph never depends on a third party being up."}],"why":["The 9 to 10 seam is causal and needs no bridge sentence — the join works *because* the identifiers are nodes, and slide 9's closing line has already set it up. This is the second half of a pair, and the payoff is here.","The question on screen is one of NFDI4Cat's own biocatalysis competency questions — *which organism / strain is used for the production of enzyme X?* It is recorded in `OUT_OF_SCOPE_QUESTIONS` in `competency.py` as one the local graph cannot answer alone and federation answers today. If he recognises it, agree in one sentence and carry on.","The figure states the *architecture*, not the guard's efficacy, and the script follows it. \"The endpoint refuses `SERVICE`\" is not exactly true — the shipped scanner has a verified escaped-quote bypass — and that one phrasing would turn a good design decision into an overclaim. What is exactly true is what is on screen: federation is a CLI operation and never sits in the request path, so the served graph does not depend on anyone else being up.","One fact worth holding without using: the console page at `/` does state *\"Updates and `SERVICE` are refused\"* (`api/console.py:257`). It is in the frozen artefact and cannot be edited, which is precisely why the deck does not repeat the claim as settled fact.","Security is orthogonal to what this talk argues, and none of it is in the script. The server-side request forgery rationale below is an answer to a direct question, not slide content — settled 2 August, and the reasoning outranks the instinct to volunteer it here.","If he reads the query off the terminal: it says `?rhea rdfs:subClassOf rh:Reaction`, not `?rhea a rh:Reaction`. Rhea models reactions as OWL *classes*, and getting that wrong returns an empty result with no error — the same silent-failure shape as the previous slide's literal.","Provenance of the three numbers: measured against the live endpoints on 27 July 2026 — 15 / 27 / 91 for RHEA:17441 / 19453 / 21824 — and the summary query is timed at roughly 1.1 seconds. The cached snapshot holds exactly those rows, captured the same day."],"plan":["Summary query only. It is about a second; the detail query is measured at ~43 s, it has no cached fallback, and the uplink is competing with the video stream — so a failure there is a very long silence followed by an error.","Read the banner before speaking: the CLI prints `[LIVE]` or `[CACHED - NOT LIVE]`. If it is cached, say **\"that is the cached snapshot, captured on the twenty-seventh of July\"** out loud, then carry on from the numbers — they are the same three.","Must be reached. Slides 4, 7, 10 and 18 are the four that cannot be lost; the drop order if the clock has gone is slide 5, then 11.","9 and 10 are a pair and must not be split — identity, then the join it buys. If an interruption lands on slide 9, finish this slide before answering it."],"ask":[{"q":"why doesn't the endpoint federate?","say":"Because `SERVICE` makes my server fetch a URL the caller chose — that is **request forgery**.","then":["The proper name is server-side request forgery, and it is not a feature.","Nothing we serve needs it, so federation runs from the CLI instead.","So the served graph never depends on a third party being up.","The scanner enforcing that has a **verified escaped-quote bypass** — I claim design, not proof."],"evidence":["[api/policy.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/policy.py) — the `SERVICE` scanner, `_bare_keywords`","[queries/federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py) — federation is a CLI operation, never in the request path","[api/console.py:257](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/console.py#L257) — the console page states the refusal, frozen in the artefact"],"slide":14,"type":"design","about":["federation"]},{"q":"what does *reviewed* mean here, and are those counts stable?","say":"Reviewed is Swiss-Prot — **manually curated** — and no, the count moves between UniProt releases.","then":["It is the curated half of UniProtKB; TrEMBL is the automatic-annotation half.","The query filters `?protein up:reviewed true`; without it, machine predictions flood in.","Reviewed does not mean correct or complete — it is a count **at query time**.","Which is the argument for querying it rather than copying it into my graph."],"evidence":["[queries/federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py) — the `up:reviewed true` filter in the summary query"],"type":"comprehension","about":["reviewed"]},{"q":"why join on the master identifier rather than a directional child?","say":"Because UniProt's `Reaction=` line **cites the master** — a child returns nothing, silently.","then":["Rhea mints **four IRIs** per reaction: master 19453, then 19454, 19455, 19456.","The children are left-to-right, right-to-left and bidirectional; the master is undirected.","The graph anchors on masters; children are *derived* on `Reaction`, never written in.","A test asserts no child identifier ever reaches the federated query."],"evidence":["[reference_data.py:131](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/reference_data.py#L131) — the `Reaction` dataclass, children as derived properties","[tests/test_federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_federated.py) — `test_query_targets_master_identifiers_only`"],"type":"design"},{"q":"what happens if SIB is down?","say":"It falls back to **the cached summary** and says so loudly — the banner reads `CACHED - NOT LIVE`.","then":["**Only a complete result** is cached — the summary is exactly one row per reaction.","Anything else logs a warning and leaves the cache — a partial outage must not clobber it.","The detail query has no cache and refuses — summary rows answer a different question.","An unjoinable graph raises `NotJoinable` instead — a different problem, different handler."],"evidence":["[queries/federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py) — `run()`, `_write_cache`, `NotJoinable`","[tests/test_federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_federated.py) — `test_cache_is_not_clobbered_by_an_incomplete_live_result`","[tests/test_federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_federated.py) — `test_a_failed_detail_query_refuses_rather_than_serving_the_summary`"],"type":"design","about":["SIB"]},{"q":"how fresh are the external counts?","say":"The caption carries the date the figure was built; a live query today **may differ**.","then":["Rhea and UniProt keep curating, so the counts are a snapshot, **not a constant**.","The date is read off the figure file at build time, never typed in by hand.","That is why I ran it live; the banner tells you whether it was live or cached.","The cached rows were captured on 27 July 2026 — the same three numbers."],"evidence":["deck-src/build.mjs — `figureDate`, taken from the figure's mtime, not hand-typed","the figure caption on this slide — \"live counts may change as Rhea and UniProt do\"","[queries/federated_cache.json](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated_cache.json) — `captured_at` 2026-07-27"],"type":"evidence"},{"q":"is that really live, or a recording?","say":"The line names the host, the status and the bytes — and you can **check it yourself** right now.","then":["The endpoint is public, unauthenticated and CORS-open, and the URL is on the last slide.","Open it on your laptop and you get **the same JSON** this page got.","The table above is the recorded answer and it never gets overwritten, so you can see both."],"evidence":["[api/app.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/api/app.py) — `allow_origins=[\"*\"]`, and /api carries no basic auth","deck-src/probe.js — the live line is assembled only inside the fetch success branch"],"type":"evidence"},{"q":"why not run the actual federated query, through Rhea?","say":"Rhea has been **timing out** for me all week, so I do not put it on the live path.","then":["The CLI does exactly that, and its recorded result is the table above.","What the button shows is the half that proves the point: our IRIs join at a server we do not run.","The identifiers are read out of our endpoint first, so it is **our graph** supplying the key."],"evidence":["[queries/federated.py](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py) — SUMMARY_QUERY, the SERVICE clause and the 120 s default timeout","[queries/federated_cache.json](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated_cache.json) — the recorded rows, captured 27 July"],"type":"design","about":["Rhea"]},{"q":"what would have happened if you had minted your own identifiers?","say":"**Nothing would come back** — the same query with a locally minted IRI returns no rows.","then":["I can run it if you like, but it is not surprising: a made-up identifier matches nothing.","The point is the other direction — I did not have to make anything up.","**Reusing the Rhea master** is what makes someone else's data attachable at all."],"evidence":["deck-src/deck.json — the probe reads the IRIs from this graph before sending them","[queries/federated_cache.json](https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated_cache.json) — the recorded rows, captured 27 July"],"type":"design"},{"type":"comprehension","about":["federation"],"q":"what is federation here — where does the query actually run?","say":"Federation is **one endpoint querying another** mid-query and joining the results.","then":["The CLI asks Rhea's endpoint, which reaches UniProt, and the joins happen on their side.","It works because the Rhea IRI is **a shared key** on both graphs.","Nothing is copied; the answer is assembled live across servers."],"slide":10},{"type":"comprehension","about":["FAIR"],"q":"you call this FAIR — what does that actually mean?","say":"FAIR is Findable, Accessible, **Interoperable**, Reusable — and the I is what this shows.","then":["Interoperable means another system can join to yours with **nothing agreed in advance**.","The shared IRI is what makes that join possible across independent endpoints.","It is FAIR *shown* by a working query, not asserted in prose."],"slide":10},{"type":"implementation","about":["federation"],"q":"where is the federated query implemented?","say":"In `src/tacat/queries/federated.py` — a CLI operation, never on the served request path.","then":["It sends the summary query to Rhea and joins UniProt on their side.","It falls back to a labelled cache when SIB is down.","It is tested in `tests/test_federated.py`."],"refs":[{"label":"federated.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/src/tacat/queries/federated.py"},{"label":"test_federated.py","href":"https://gitlab.com/k.sachikonye/tacat/-/blob/main/tests/test_federated.py"}]},{"type":"interest","about":["federation"],"q":"the live join is impressive — have you tried it against other endpoints?","say":"Rhea and UniProt here; the same IRI-as-key idea works against any endpoint sharing the identifier.","then":["Nothing is special about these two — they publish the Rhea and protein data.","Any SPARQL endpoint keyed on the same IRI would join the same way.","That generality is the FAIR promise, not a trick of this demo."]}]}},{"title":"what it does not constrain","notes":{"shows":"five limits, each paired with what carrying it would take. Closes on OWL open-world against SHACL closed-world.","script":[{"say":"That join is the strongest thing I can show you.","group":"the join is the strongest thing — and what the definition does not claim"},{"say":"Which makes it worth being exact about what the definition behind it does not claim."},{"say":"The four conjuncts are a participant-role *signature*.","group":"the four conjuncts are a participant-role signature — every limit paired with its fix"},{"say":"They say which chemical classes turn up in which roles — and that is the whole of what they say."},{"do":"point at the right-hand column — every limit is paired with what carrying it would take"},{"say":"Nothing here says a group actually moved.","group":"nothing says a group moved — that needs atom mapping, a different kind of object"},{"say":"Carrying that means atom mapping — reaction-centre alignment."},{"say":"That is a different kind of object from a participant set."},{"say":"The donor row is the one where my definition is narrower than the word.","marks":[{"raise":"raise the omega row yourself — his lab screens them"}],"group":"the omega row — amine/keto acid, two conjuncts fail, doesn't classify"},{"say":"What I defined is *alpha*-transamination, between an amino acid and a 2-oxo acid."},{"say":"Which is exactly what these three reactions are."},{"say":"An omega-transaminase runs an amine and a keto acid.","marks":[{"raise":"his lab screens amine transaminases — raise it yourself"}]},{"say":"So there is no amino-acid donor, and no 2-oxo-acid product."},{"say":"Two of the four conjuncts fail, and it does not classify."},{"beat":"one second — let that sit before offering the fix"},{"say":"The fix is a hierarchy, not a wider definition.","group":"the fix is a hierarchy not a wider def — alpha/omega siblings; the name should say alpha"},{"say":"Alpha- and omega-transamination become siblings under a parent."},{"say":"That parent requires only the amino-group transfer."},{"say":"And the class name is wrong for the same reason: it should say alpha."},{"say":"Mass and charge balance is not constrained either.","group":"balance isn't constrained — a dropped atom still classifies; cheapest fix, SHACL at build"},{"say":"A reaction that dropped an atom would still classify."},{"say":"That is the cheapest of the five — SHACL over the formulae, or a balance check at build time."},{"say":"And nothing closes the participant set.","group":"nothing closes the set — add three species and OWL still calls it transamination"},{"say":"Take everything the definition asks for and add three further species."},{"say":"As far as OWL is concerned, that is still a transamination."},{"say":"The last one is the one people expect to find *in* the definition: PLP dependence.","group":"PLP is on the enzyme, not the class — the cofactor is regenerated"},{"say":"It is carried — on the enzyme, as a datum — and not in the class."},{"say":"That is because the cofactor is regenerated inside the catalytic cycle."},{"say":"It is not consumed by the reaction."},{"say":"And stating that properly needs a process mode
