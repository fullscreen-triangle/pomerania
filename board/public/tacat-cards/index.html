cate and object rather than on tables and columns. Most hold quads — a triple plus the named graph it belongs to. A production store persists to disk, plans queries and speaks the SPARQL protocol over HTTP; an in-process library that keeps triples in memory does the same job at a different scale.",glossary:["triplestore"],heard:["triplestore","RDF store","quad store","RDF database"],warn:'rdflib is a library, not a triplestore. Calling the endpoint "a triplestore"…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/memory.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/store/repository.py"}],see:["rdflib-scaling","def-triplestore-products","def-graphrepository","def-rdflib","def-sparql","def-named-graph","def-graph"],points:["There is no triplestore. rdflib holds the graph in memory inside the service process — the brief named rdflib — and the README says that plainly rather than claiming parity with Fuseki. The `GraphRepository` protocol states the three operations the service needs, for legibility rather than portability."]},dp={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"turnover / catalytic cycle — what is it?",short:"one complete pass of an enzyme through its states, ending in the state it started",say:"A catalytic cycle is the sequence of states an enzyme passes through to convert substrate into product and return to its starting form; one turnover is one such pass. Anything restored within the cycle has a net change of zero over it, and therefore does not enter the reaction's stoichiometry. Turnover number (kcat) counts how many passes an enzyme completes per second.",glossary:["turnover-catalytic-cycle"],heard:["turnover / catalytic cycle","one turnover","catalytic cycle","turnover number"],warn:"Turnover is about returning to a starting state, not about speed. kcat is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["plp-cofactor","ping-pong-mechanism","def-plp","def-pmp","def-internal-external-aldimine","def-prosthetic-group","def-ping-pong-bi-bi","def-km-kcat-catalytic-efficiency"],points:["The load-bearing claim about PLP: it ends the cycle as it started, so it never enters the equation — why Rhea's equations have four participants and none is PLP. The submitted docstring says PLP cycles while covalently bound to a lysine: the resting state only. The aldimine correction is in the primer, not the code."]},lp={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"Turtle — what is it?",short:"the readable RDF syntax — triples with prefixes, semicolons and commas",say:"Turtle is the human-readable serialisation of RDF: `subject predicate object .`, with `@prefix` declarations shortening IRIs, `;` repeating the subject and `,` repeating subject and predicate. It is a syntax, not a data model — the same graph can be written in Turtle, N-Triples, RDF/XML or JSON-LD and is the same graph in all four.",glossary:["turtle"],heard:["Turtle",".ttl","Terse RDF Triple Language","Turtle syntax"],warn:"Two Turtle files differing byte for byte can carry the same graph — blank node…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/negotiation.py"}],see:["sparql-protocol","def-n-triples","def-rdf-xml","def-json-ld","def-graph-isomorphism-vs-byte-equality","def-rdf","def-prefixed-name-local-part"],points:["The format every data artefact is written in. `data/shapes.ttl` and `data/dataset.ttl` are committed; `data/reactions.ttl`, the reasoned graph, is generated by `tacat build` and gitignored — it ships in the container image, not in a clone. `text/turtle` is also what the endpoint returns for a CONSTRUCT.",'tacat:REACT_0000001 a tacat:BiochemicalReaction ; rdfs:label "aspartate transaminase reaction"^^xsd:string .']},hp={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"typed literal / language tag — what is it?",short:"a literal's datatype, or its natural language — a literal carries one or the other, never both",say:'An RDF literal is a lexical form plus either a datatype IRI (`"1.0"^^xsd:decimal`) or a language tag (`"water"@en`). The two are exclusive: a tagged literal\'s datatype is always `rdf:langString`. Two literals are the same term only when lexical form, datatype and tag all match, so `"1"^^xsd:integer` and `"1"^^xsd:string` are different terms and a query written for one will not match the other.',glossary:["typed-literal-language-tag"],heard:["typed literal / language tag","^^xsd:string","@en","rdf:langString","xsd:decimal","plain literal"],warn:'`"x"` and `"x"^^xsd:string` are the same term in RDF 1.1, but `"x"@en` is…',see:["def-literal","def-rdf","def-lexical-form","def-turtle","def-sh-pattern","def-object-property-vs-data-property"],points:["Individual labels are `^^xsd:string` and coefficients `xsd:decimal` — but `data/reactions.ttl` is not tag-free: four `@en` literals sit in the ontology header and the PROV block (`dcterms:title`, and the `rdfs:label`s on the build, the agent and the inputs). `data/dataset.ttl` tags throughout, as DCAT expects.",'rdfs:label "reversible"^^xsd:string   vs   dcterms:title "Transaminase reaction knowledge graph"@en']},fp={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"UniProt — what is it?",short:"Protein sequence and annotation database, and the source of the canonical EC class IRIs",say:"UniProt is the reference database of protein sequences and their annotation, run by a consortium including the SIB and the EBI. An accession such as `P24298` identifies one protein in one organism. It also publishes the EC hierarchy as real `up:Enzyme` OWL classes under `purl.uniprot.org/enzyme/`, with the four levels materialised as `rdfs:subClassOf`, and serves everything over a public SPARQL endpoint.",glossary:["uniprot"],heard:["UniProt","UniProt Consortium","UniProtKB accession","up:"],warn:"The RDF PURL is `/uniprot/`; the web REST path is `/uniprotkb/`. Using the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"}],see:["federated-payoff","mint-vs-reuse","def-up-enzyme","def-swiss-prot-trembl","def-sib","def-ec-number","def-accession","def-federation"],points:["Used twice over: EC classes are the enzyme anchors, since there is no OBO ontology for EC numbers, and representative reviewed accessions are linked with `up:enzyme` in UniProt's own direction. The federated query joins `sparql.uniprot.org` for organism information the local graph cannot supply.","?enzyme rdfs:subClassOf+ <http://purl.uniprot.org/enzyme/2.6.1.->"]},pp={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"unique name assumption — what is it?",short:"the assumption that distinct names denote distinct things — OWL does not make it",say:"A system makes the unique name assumption when two different identifiers are taken to refer to two different things. Relational databases assume it; OWL does not. Under OWL a reasoner is free to conclude that two individuals are one and the same, and it will whenever that is needed to satisfy the axioms. Distinctness is a claim like any other and has to be asserted, with `owl:differentFrom` or `owl:AllDifferent`.",glossary:["unique-name-assumption"],heard:["unique name assumption","UNA","no unique name assumption","non-UNA"],warn:"The weakness is in the definition, not in the shipped data. Against this A-Box…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","disjointness-axiom","open-world-caveat","def-alldifferent","def-open-world-assumption","def-owl-sameas","def-defined-class","def-reasoner","def-owl-alldisjoint-disjointness"],points:["`AllDifferent([reactant, product])` exists only because of this. Without it a reasoner may identify the Reactant role with the Product role, and under that identification the defined class's four conjuncts collapse into two: one participant could satisfy both 'consumes an amino acid' and 'produces an amino acid'.","AllDifferent([reactant, product])"]},$p={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"universal vs particular — what is it?",short:"a kind of thing versus one specific thing — and which of the two a record is modelled as",say:"A universal is a kind, something many things can be instances of; a particular is one specific thing. In OWL the distinction is class versus individual, and it decides which relation applies: an individual instantiates a class (`a`), a class is subsumed by another (`rdfs:subClassOf`). The same subject matter can honestly be modelled either way — what matters is that a consumer knows which was chosen.",glossary:["universal-vs-particular"],heard:["universal vs particular","class vs individual","type vs token","universal","particular"],warn:"Two models meeting on the same IRI. `tacat:REACT_0000001` is an *instance of*…",refs:[{kind:"code",rel:"decided-in",at:"DECISIONS.md"}],see:["rhea-four-ids","mint-vs-reuse","def-owl-namedindividual","def-subsumption","def-rhea","def-a-box","def-t-box","def-biochemicalreaction"],points:["Rhea models a reaction as a class of chemical events, so its entries relate by `rdfs:subClassOf`. This project models its three reactions as `owl:NamedIndividual`s, because they are specific curated records rather than universals. Both are defensible; the divergence is worth being able to name.","tacat:REACT_0000001 a owl:NamedIndividual, <http://rdf.rhea-db.org/21824> ."]},up={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"up:enzyme — what is it?",short:"UniProt's own property relating a protein to the EC activity it has",say:"`up:enzyme` is a property of UniProt's core vocabulary at `purl.uniprot.org/core/`, relating a protein record to an enzyme class: `<protein> up:enzyme <ec-class>`. It says the protein *has* that catalytic activity — a relation that is many-to-many, since one protein can carry several EC numbers and one EC number many proteins.",glossary:["up-enzyme"],heard:["up:enzyme","UniProt core vocabulary","purl.uniprot.org/core/enzyme","core:enzyme"],warn:"It replaced `skos:closeMatch`, which entailed those proteins were…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_every_protein_link_uses_uniprots_own_property_and_direction"}],see:["exactmatch-vs-sameas","mint-vs-reuse","def-uniprot","def-ec-number","def-skos-mapping-property","def-swiss-prot-trembl","def-got1-p17174","def-pytest-marker"],points:["The one link written with someone else's predicate in their own direction, so the triple asserted is the same triple UniProt asserts rather than a mirror needing reconciliation. A `network`-marked test re-runs every one of them against `sparql.uniprot.org` and fails if UniProt does not also assert it.","<...uniprot/P17174> up:enzyme <...enzyme/2.6.1.1>"]},yp={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"up:mnemonic — what is it?",short:"UniProt's readable entry name, PROTEIN_ORGANISM — memorable, but not the stable identifier",say:"`up:mnemonic` carries a UniProt entry's *entry name*: a readable code of the form PROTEIN_ORGANISM, such as `AAT_ECOLI` or `AATM_HUMAN`. It is built to be recognised at a glance, and it can change when curators rename or reclassify an entry. The accession — `P00509` — is the stable identifier; the mnemonic is a convenience.",glossary:["up-mnemonic"],heard:["up:mnemonic","entry name","UniProt entry name","UniProt ID","mnemonic","PROTEIN_ORGANISM"],warn:"Never join on a mnemonic. It is not stable, and UniProt's IRIs are not built…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/cli.py"}],see:["federated-payoff","def-uniprot","def-accession","def-opaque-identifier","def-p00509","def-ncbi-taxonomy-up-organism-up-scientificname","def-federation"],points:["Projected by `DETAIL_QUERY` and used as its sort key, and printed as the middle column of `tacat federate --detail`. Mnemonics are therefore what is on screen if the detail query is ever shown live, while every identifier the graph itself carries is an accession.","`?protein up:mnemonic ?mnemonic .` binds `AAT_ECOLI` for `P00509`"]},mp={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"upper ontology — what is it?",short:"a domain-neutral ontology of very general categories that domain ontologies align beneath",say:"An upper ontology fixes the most general categories — object, process, quality, role, and how they relate — so that domain ontologies built under it are mutually comparable. BFO and EMMO are the two this field meets. Importing one is not free: every axiom comes with it, so either the importing model honours those commitments or it is quietly inconsistent with the thing it imported.",glossary:["upper-ontology"],heard:["upper ontology","top-level ontology","foundational ontology","upper-ontology commitments"],warn:"NOT USED HERE — Not the same as declining to reuse vocabulary. Every chemical…",refs:[{kind:"code",rel:"decided-in",at:"DECISIONS.md"}],see:["why-not-emmo","nary-vs-reac4cat","def-emmo","def-bfo","def-ontology","def-reac4cat","def-owl-imports","def-obo-foundry"],points:["None is imported. DECISIONS.md records the model as standalone, not aligned to Reac4Cat or EMMO: for a three-reaction demonstration, inheriting a large upper ontology's commitments would be decoration, and saying so in the decision record is more honest than importing it unused."]},gp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"URIRef — what is it?",short:"rdflib's type for an IRI-valued node — the thing a look-alike string literal is not",say:"In rdflib every RDF term is an object of a specific class: `URIRef` for an IRI, `Literal` for a value, `BNode` for a blank node. The distinction is the RDF data model rather than Python housekeeping — a `URIRef` denotes a resource that other graphs can join on, while a `Literal` holding the same characters is a string that merely looks like one and links to nothing.",glossary:["uriref"],heard:["URIRef","rdflib.URIRef","URIRef vs Literal","isinstance(t, URIRef)"],warn:"Necessary, not sufficient. Repointing each link to a nonexistent…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_no_identifier_is_carried_as_a_literal"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["identifiers-verified","mistake-owned","def-iri","def-literal","def-rdflib","def-test-oracle","def-competency-question","def-skos-mapping-property"],points:["The v0 defect was exactly that: external identifiers carried as `xsd:string` literals. The regression test now asserts the object of each external link *is* a `URIRef`, not that some well-formed string is present.","`assert all(isinstance(t, URIRef) for t in targets)` — tests/test_competency.py"]},wp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"uv — what is it?",short:"The Rust-implemented Python package manager: resolve, lock, sync, run, build",say:"One tool covering what pip, pip-tools, virtualenv and pipx did separately. It resolves dependencies, writes a cross-platform `uv.lock`, creates and syncs a `.venv` to match that lock exactly, and runs commands inside it. Locking is what makes an install reproducible rather than merely satisfiable: two syncs of the same lock file give the same versions.",glossary:["uv"],heard:["uv","uv sync","uv run","astral-sh/uv","uv_build"],warn:"`uv sync --no-dev` does not survive a later bare `uv run` — the flag has to be…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"},{kind:"code",rel:"implemented-in",at:"uv.lock"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["uv-lockfile","def-lock-file","def-pep-735-dependency-groups","def-dependency-group-no-dev","def-build-backend","def-multi-stage-build","def-container-image"],points:["Chosen because it is what Dörr's own packages use, as are the `uv_build` backend and the `astral-sh/uv` base image. `uv run --no-dev tacat build` is load-bearing: a bare `uv run` re-syncs with the default groups, reinstating the dev group and copying pytest, ruff, mypy and bandit into the image.","`RUN uv run --no-dev tacat build && test -s /app/data/reactions.ttl`"]},bp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"uvicorn — what is it?",short:"The ASGI server that runs the FastAPI application — FastAPI is not itself a server",say:"An ASGI web server for Python. FastAPI, like Starlette beneath it, defines an application object; it does not listen on a socket. Uvicorn does: it accepts connections, drives the asynchronous request and response cycle, and calls the application. The two are routinely conflated because a tutorial starts them on one line.",glossary:["uvicorn"],heard:["uvicorn","uvicorn[standard]","ASGI server","uvicorn tacat.api:app"],warn:"One uvicorn worker is one process with one event loop. That is why the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/cli.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["def-fastapi","def-event-loop-and-thread-pool","def-api","def-liveness-probe","def-container-image"],points:['`uvicorn[standard]>=0.32` is a runtime dependency. `tacat serve` calls `uvicorn.run("tacat.api:app", …)`, and the image\'s `CMD` is the same entry point without the CLI — which is why `app.py` exposes a module-level `app` built by `build_app()`.','`CMD ["uvicorn", "tacat.api:app", "--host", "0.0.0.0", "--port", "8000"]`']},vp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"vendored — what is it?",short:"A copy of someone else's code or documents kept inside your tree rather than resolved",say:"Vendoring is committing a copy of an external artefact — a library, a specification, a reference dataset — into your own repository instead of fetching it at build time. It buys availability and a frozen version at the cost of updates: the copy does not move when upstream does, and nothing tells you. A vendored *dependency* is imported or compiled; vendored *reference material* is only read.",glossary:["vendored"],heard:["vendored","vendoring","refs/","vendored dependency","vendored reference material"],warn:"Nothing in the submission is vendored — every dependency is resolved and locked…",see:["why-not-emmo","def-lock-file","def-emmo","def-dcat-ap-plus","def-lara-larasuite","def-uv"],points:["`refs/` in the private workspace holds DCAT-AP+, EMMO and Dörr's own packages (`lara`, `opensourcelab`) as material to read against. It sits outside `nfdi4cat-v1/` and is not part of the submitted repository."]},_p={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"vitamin B6 vitamers — what is it?",short:"B6 is a family of six interconverting forms; only PLP is the working cofactor",say:"Vitamin B6 is not one molecule but six: pyridoxine, pyridoxal and pyridoxamine, each also as its 5'-phosphate. They interconvert in the cell — a kinase phosphorylates, an oxidase converts pyridoxine 5'-phosphate to pyridoxal 5'-phosphate — and only pyridoxal 5'-phosphate is the catalytically competent form. Pyridoxamine 5'-phosphate is the aminated state it cycles through.",glossary:["vitamin-b6-vitamers"],heard:["vitamin B6 vitamers","vitamin B6","B6","pyridoxine","pyridoxal","pyridoxamine","vitamer"],warn:"BACKGROUND — Neither the vitamers nor their interconversion are modelled. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"}],see:["plp-cofactor","def-plp","def-pmp","def-chebi","def-cofactor","def-dianion-and-neutral-parent","def-hascofactor"],points:[`The precision to add when PLP is called "the vitamin-B6 cofactor". What the three enzymes require is CHEBI:597326, pyridoxal 5'-phosphate as the dianion — one vitamer in one protonation state, not a vitamin.`]},kp={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"voc4cat — what is it?",short:"NFDI4Cat's SKOS vocabulary — opaque numeric identifiers under w3id, the shape copied here",say:"voc4cat is NFDI4Cat's own controlled vocabulary for catalysis: a SKOS thesaurus published under `w3id.org/nfdi4cat/`, in which each concept is an opaque numeric identifier such as `voc4cat_0000123` and the readable name is carried as a label. The numbering is deliberate — a label can be corrected, translated or superseded without breaking anyone's data.",glossary:["voc4cat"],heard:["voc4cat","nfdi4cat/voc4cat","w3id.org/nfdi4cat/","NFDI4Cat vocabulary"],warn:"BACKGROUND — Copying the shape is not adopting the vocabulary: no voc4cat…",refs:[{kind:"code",rel:"decided-in",at:"DECISIONS.md"}],see:["opaque-iris","weak-namespace","def-opaque-identifier","def-nfdi4cat","def-w3id-org","def-skos","def-purl","def-dereference"],points:["The precedent this project's IRI shape is copied from. `DECISIONS.md` cites `w3id.org/nfdi4cat/voc4cat_0000123` as the ecosystem's convention, which is why reactions are `REACT_0000001` rather than `AlanineTransaminaseReaction`.","`w3id.org/nfdi4cat/voc4cat_0000123` is the precedent; `tacat:REACT_0000001` is the copy"]},qp={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"w3id.org — what is it?",short:"Community-run persistent-identifier redirect service; namespaces registered by pull request",say:"w3id.org is a redirect service run by the W3C Permanent Identifier Community Group, for people who need a persistent namespace but do not operate an institution to host one. A namespace is claimed by pull request against the `perma-id/w3id.org` repository, which then owns the redirect rules — so the identifier survives whatever happens to the site behind it.",glossary:["w3id-org"],heard:["w3id.org","w3id","perma-id/w3id.org","W3C Permanent Identifier Community Group"],warn:"A conceded gap, not a hidden one — say it before a reviewer finds it. An IRI is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/namespaces.py"}],see:["weak-namespace","opaque-iris","def-purl","def-dereference","def-iri","def-voc4cat","def-opaque-identifier","def-owl-ontology-header"],points:["Every locally minted IRI sits under `https://w3id.org/bitspark/tacat/`, and that namespace is deliberately *not* registered: claiming one for an assessment demonstrator nobody will maintain would be squatting. The IRIs therefore do not dereference — follow one and you get a 404.","https://w3id.org/bitspark/tacat/REACT_0000001"]},Ip={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"water as a reaction participant — what is it?",short:"why the three transaminations carry no H2O and the negative control does",say:"Water is written into an equation only when the reaction consumes or produces it on balance. A hydrolysis does; a group transfer does not. Water taken up and released within one catalytic cycle cancels and never appears, so the absence of H2O from an equation is a statement about the net reaction, not about the chemistry going on inside the enzyme.",glossary:["water-as-a-reaction-participant"],heard:["water as a reaction participant","H2O","water","no water in the equation","CHEBI:15377"],warn:"That docstring equation drops the H+ from the product side. The water is there…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["negative-control","ping-pong-mechanism","def-glutamate-dehydrogenase","def-half-reaction","def-mass-balance-charge-balance","def-ping-pong-bi-bi","def-negative-control","def-stoichiometric-coefficient"],points:["None of the three transaminations has water — each is four participants and a net swap of an amino group for a keto group. The control does: its docstring reads `L-glutamate + H2O + NAD+ = 2-oxoglutarate + NH4+ + NADH`. Only two of its species are modelled, so no water individual exists in the graph at all.","`L-alanine + 2-oxoglutarate = pyruvate + L-glutamate` — four participants, no H2O"]},Ap={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"whitelist vs keyword blacklist — what is it?",short:"Naming what is permitted, versus hunting for what is forbidden — the second is unsound both ways",say:"Two ways of deciding whether input is acceptable. A whitelist enumerates what is allowed and refuses everything else, so an unforeseen input fails closed. A blacklist searches for forbidden markers and admits the rest, so anything the search misses is admitted. Over raw text a blacklist fails in both directions at once: it matches the forbidden word where it is harmless, and misses it where it is hidden.",glossary:["whitelist-vs-keyword-blacklist"],heard:["whitelist vs keyword blacklist","allowlist vs denylist","READ_ONLY_FORMS","positive vs negative filtering"],warn:"The whitelist is on the query *form*, not the whole query. SERVICE remains a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_the_word_service_outside_a_clause_is_not_refused"}],see:["why-own-policy-layer","scanner-guard-failures","weak-readonly","def-querypolicy","def-query-form","def-scanner-tokeniser","def-bare-keyword","def-policyviolation","def-ssrf"],points:["`query_form` returns the first bare keyword only if it is one of `READ_ONLY_FORMS` — SELECT, ASK, CONSTRUCT, DESCRIBE. Its docstring gives the argument; the `SERVICE` guard one function away was a keyword regex and failed that way — over-refusing `SELECT ?service`, under-refusing `SERVICE` inside a comment or an IRI.","`SELECT ?insert WHERE { … }` is legal SPARQL that a blacklist on `INSERT` wrongly refuses"]},Cp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"World (Owlready2) — what is it?",short:"Owlready2's quadstore holding several ontologies — and where reasoner output actually lands",say:"In Owlready2 a `World` is the store; an `Ontology` is one named graph inside it. Loading, reasoning and querying happen against the world, and a reasoner's conclusions are not written back into the ontology that stated the premises: Owlready2 files them into a separate internal ontology, `http://inferrences/`, in the same world. Saving the ontology saves the assertions and none of the inferences.",glossary:["world-http-inferrences"],heard:["World (Owlready2)","owlready2.World","http://inferrences/","onto.world","onto.save()"],warn:"Serialising the world drags in Owlready2's own bookkeeping ontologies. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["build-time-reasoning","def-owlready2","def-hermit","def-materialise","def-deductive-closure","def-ontology","def-owl-ontology-header"],points:["`build_schema()` opens a `World()` and takes the ontology from it. `build_reasoned_graph` serialises `onto.world.as_rdflib_graph()` rather than calling `onto.save()` — which would have written a perfectly valid file with no inferred types in it, silently discarding the thing the project exists to demonstrate.","`for triple in onto.world.as_rdflib_graph(): graph.add(triple)` — builder.py; `inferrences` is Owlready2's own spelling"]},xp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"YASGUI / YASQE — what is it?",short:"The browser SPARQL editor and result viewer most public endpoints get demonstrated through",say:"YASQE is a JavaScript SPARQL query editor — syntax highlighting, prefix and keyword completion. YASR renders the results. YASGUI is the two together as a page you point at any endpoint URL. Because it runs entirely in the browser, its requests are subject to the same-origin policy: an endpoint that returns no CORS headers cannot be used from it, however correct its answers are.",glossary:["yasgui"],heard:["YASGUI / YASQE","YASGUI","YASQE","YASR","Yet Another SPARQL GUI"],warn:"Open CORS is a browser-compatibility decision, not a security posture in either…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_a_browser_client_can_read_the_response"}],see:["sparql-protocol","def-cors","def-sparql-1-1-protocol","def-sparql-clients","def-api","def-sparql"],points:['The CORS middleware in `app.py` exists for these clients — `allow_origins=["*"]`, methods GET/POST/OPTIONS. Open deliberately: CORS restricts what a browser does with *ambient credentials*, and there are none here — no cookies, no auth, a read-only policy. It grants a page nothing curl does not already have.']},Tp={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"zwitterion — what is it?",short:"one positive site and one negative site, net charge zero — not the uncharged form",say:"A zwitterion carries both a positive and a negative charge within the same molecule, summing to zero. Free amino acids in water are zwitterions at physiological pH: the carboxyl is deprotonated and the amino group protonated. It is a distinct species from the uncharged form of the same formula, and chemical databases give the two different identifiers.",glossary:["zwitterion"],heard:["zwitterion","dipolar ion","inner salt","L-alanine zwitterion","L-cysteine zwitterion"],warn:"A zwitterion and its uncharged form are tautomers, not a conjugate acid/base…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:57972"}],see:["microspecies","tautomer-trap","identifiers-verified","def-tautomer","def-microspecies","def-conjugate-acid-base","def-chebi-accepted-name","def-accepted-name-vs-display-name","def-dianion-and-neutral-parent"],points:['Two of the nine chemical entities are recorded
