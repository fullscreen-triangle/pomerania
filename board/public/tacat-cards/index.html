e between owl and shacl","open world closed world"],refs:[{kind:"code",rel:"implemented-in",at:"data/shapes.ttl"},{kind:"ci",rel:"verified-by",at:"shacl-validation"}],see:["open-world-caveat"],glossary:["shacl","cardinality","domain-and-range","node-shape-vs-property-shape","entailment","pyshacl"]},Lr={area:"context",stance:"tradeoff",icon:"pipeline",q:"Why is there no SiLA?",short:"A reaction ontology has no device surface to talk to",say:"SiLA’s backbone is device communication, and a reaction model has nothing to say to a device",points:["The SiLA-shaped work needs a lab-process model","Deferred in OUT_OF_SCOPE_QUESTIONS, not forgotten","He is first author of the Python SiLA 2 reference impl","Say why — silence reads as not having noticed"],warn:"Conspicuous absence. Raise it before he has to",heard:["why no sila","what about device integration","does this talk to instruments","where would sila fit"],see:["what-the-role-is"],glossary:["sila"]},Nr={area:"modelling",stance:"tradeoff",icon:"subsumption",q:"Why not import EMMO or Reac4Cat?",short:"Importing an upper ontology means inheriting every axiom",say:"Importing an upper ontology means inheriting every axiom — honour them, or be quietly inconsistent",points:["Inheriting an upper ontology means honouring every axiom","EMMO has ZERO reaction, catalysis or enzyme concepts","Alignment buys scaffolding, not chemistry","Known limitations: clarity beat alignment"],heard:["why not emmo","why not reuse an upper ontology","why not import reac4cat","why build your own vocabulary"],refs:[{kind:"doc",rel:"decided-in",at:"DECISIONS.md § “Known limitations”"},{kind:"source",rel:"cited-as",at:"EMMO",url:"https://github.com/emmo-repo/EMMO"}],see:["nary-vs-reac4cat"],glossary:["emmo","upper-ontology","bfo","axiom"]},Dr={area:"engineering",stance:"tradeoff",icon:"shield",q:"Why write your own query policy at all?",short:"rdflib is a library — it has no caller, so no permissions",say:"rdflib is a library, not a server — no caller y",at:"docker compose up --build"}],see:["step-2-infer","build-time-reasoning"]},Hr={kind:"procedure",area:"delivery",stance:"move",icon:"terminal",n:2,q:"Demo 2 — the reasoner moment",short:"tacat infer — nothing asserted, three derived",say:"tacat infer — nothing is asserted as a transamination, and HermiT derives all three",points:['Point at "none — nothing was asserted"',"Then the three derived","Then the control that was NOT derived","This is what a plain database cannot do"],warn:"Slow down here. This is the moment the whole thing rests on",heard:["show the reasoner","run tacat infer","the inference demo","prove the inference"],refs:[{kind:"run",rel:"demonstrated-by",at:"tacat infer"}],see:["step-3-roles","defined-class"],glossary:["realisation"]},zr={kind:"procedure",area:"delivery",stance:"move",icon:"terminal",n:3,q:"Demo 3 — four versus three",short:"Same molecule by role: four have it, three produce it",say:"Same molecule filtered by role: four reactions have L-glutamate, three of them produce it",points:["Run CQ05 → 4 rows","Add the role filter → 3 rows","The dehydrogenase drops out","One line of SPARQL is the whole n-ary case"],heard:["show four versus three","run cq05","run cq06","the role query demo"],see:["step-4-federate","nary-vs-reac4cat"]},Fr={kind:"procedure",area:"delivery",stance:"move",icon:"federate",n:4,q:"Demo 4 — the live join",short:"Live UniProt join on shared Rhea identifiers",say:"This joins my graph to live UniProt on shared Rhea IDs — it works only because I reused identifiers",points:["Use the SUMMARY query — about a second","15 / 27 / 91 reviewed proteins","If SIB is down it serves cache and says so","Never run the detail query live — 43 s"],heard:["show the federated query","the uniprot demo","the live join","federation demo"],refs:[{kind:"run",rel:"demonstrated-by",at:"tacat federate"}],see:["step-5-validate","federated-payoff"]},Ur={kind:"procedure",area:"delivery",stance:"move",icon:"shield",n:5,q:"Demo 5 — validation",short:"SHACL rejects what OWL accepts — a participant with no role",say:"SHACL rejects data an OWL reasoner accepts happily — here is a participant with no role",points:["Run pyshacl against an invalid fixture","Twelve negative cases already exist, one parametrised test","sh:message on every constraint","metashacl catches a typo in the shapes file"],heard:["show shacl","the validation demo","run the invalid fixture","show a violation"],refs:[{kind:"run",rel:"demonstrated-by",at:"pytest tests/test_shapes.py"}],see:["step-6-pipeline","why-both-owl-shacl"],glossary:["metashacl"]},Gr={kind:"procedure",area:"delivery",stance:"move",icon:"gate",n:6,q:"Demo 6 — the pipeline",short:"Quality, data gates, image, smoke — science gates it",say:"Four stages — quality, verify, build, smoke — the image builds only if the science passes",points:["Show the green pipeline badge","The gate asserts 3 derived and 1 excluded","Image tagged by commit SHA, not just latest","Smoke pulls the pushed tag and asserts against it"],heard:["show the pipeline","the ci demo","show gitlab","show the build"],refs:[{kind:"ci",rel:"verified-by",at:"reproducible-build"}],see:["step-7-broken","ci-data-gates"],glossary:["kaniko","smoke-test","services"]},Wr={kind:"procedure",area:"delivery",stance:"move",icon:"lifebuoy",n:7,q:"Demo 7 — if it breaks",short:"Pull the tagged image; narrate, never debug live",say:"The image is in the registry — let me pull the tagged build rather than debug this live",points:["Pull registry.gitlab.com/k.sachikonye/tacat — login first","Fallback 2: pytest — 182 green","Fallback 3: walk the code instead","Narrate and move on — never debug live"],warn:"Decide this in advance. Do not improvise it on the call",heard:["the demo broke","it failed","docker wont start","nothing is working","what if it crashes"],see:["blanked"]},Kr={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"2-oxo acid — what is it?",short:"carboxylic acid with a ketone at carbon 2 — the amino-group acceptor in transamination",say:"A carboxylic acid carrying a keto group on the carbon next to the carboxyl — position 2, the α-carbon. In transamination it is the acceptor: it takes an amino group and becomes the corresponding amino acid. Pyruvate, oxaloacetate and 2-oxoglutarate are the 2-oxo acids paired with alanine, aspartate and glutamate; where an amino acid has such a partner it is unique, though proline, a cyclic secondary amine, has none.",glossary:["2-oxo-acid"],heard:["2-oxo acid","TwoOxoAcid","α-keto acid","alpha-keto acid","keto acid","oxo acid"],warn:"A 2-oxo acid is a chemical class, not a role. Being one does not make a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["defined-class","why-three-reactions","def-2-oxoglutarate","def-chemicalentity","def-defined-class","def-amino-acid","def-amino-donor-amino-acceptor","def-substrate-product","def-transaminase"],points:["`TwoOxoAcid` is an OWL subclass of `ChemicalEntity` in `schema.py`, declared disjoint from `AminoAcid`. Membership is asserted from a curated list, `reference_data.TWO_OXO_ACIDS` — HermiT is *told* which molecules are 2-oxo acids, not shown their structures. There is no `owl:imports` of ChEBI.","TWO_OXO_ACIDS = (TWO_OXOGLUTARATE, PYRUVATE, OXALOACETATE, MERCAPTOPYRUVATE)"]},Qr={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"2-oxoglutarate — what is it?",short:"the 2-oxo acid all three reactions use as amino acceptor; ChEBI:16810, charge −2",say:"A five-carbon 2-oxo acid, the keto counterpart of glutamate and an intermediate of the citric acid cycle. It is the near-universal amino acceptor of α-transamination: it takes the amino group from a donor amino acid and leaves as L-glutamate, which is how nitrogen from many different amino acids is funnelled into one pool.",glossary:["2-oxoglutarate"],heard:["2-oxoglutarate","α-ketoglutarate","alpha-ketoglutarate","2-OG","CHEBI:16810","oxoglutarate(2−)"],warn:"ChEBI's accepted name is `2-oxoglutarate(2−)`, whose charge suffix uses U+2212…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"source",rel:"identified-as",at:"CHEBI:16810"}],see:["why-three-reactions","negative-control","minus-sign","def-minus-sign-vs-hyphen","def-2-oxo-acid","def-chebi","def-negative-control","def-amino-donor-amino-acceptor","def-competency-question"],points:["All three reactions take it as a reactant and yield L-glutamate, so specificity becomes a question about the *donor* rather than the substrate set — the rationale recorded on CQ03. In the negative control the roles are reversed and 2-oxoglutarate is the product. Carried as `TWO_OXOGLUTARATE`, C5H4O5, charge −2.","http://purl.obolibrary.org/obo/CHEBI_16810"]},Vr={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"3-mercaptopyruvate downstream (MPST, H2S) — what is it?",short:"what the cysteine product is for — sulfur donation, and a route to hydrogen sulfide",say:"3-Mercaptopyruvate sulfurtransferase (MPST) strips the sulfur from 3-mercaptopyruvate and passes it to an acceptor thiol, leaving pyruvate behind. Coupled to cysteine transamination this is one of the routes by which cells generate hydrogen sulfide, a signalling gas alongside nitric oxide and carbon monoxide, and it also feeds sulfur into iron-sulfur cluster and thiosulfate chemistry.",glossary:["3-mercaptopyruvate-downstream"],heard:["3-mercaptopyruvate downstream (MPST, H2S)","MPST","3-mercaptopyruvate sulfurtransferase","hydrogen sulfide","H2S","gasotransmitter","sulfur transfer"],warn:"BACKGROUND — Not in the tree and not inferable. The submission carries three…",refs:[{kind:"source",rel:"identified-as",at:"CHEBI:57678"}],see:["why-three-reactions","def-mercaptopyruvate-naming","def-2-oxo-acid","def-transaminase","def-amino-donor-amino-acceptor","def-chemicalentity"],points:["The graph stops at the product. `tacat:CHEBI_57678` is a product of the cysteine reaction and nothing downstream is modelled — no sulfurtransferase, no pathway, no ordering between reactions. It is the answer to 'why does this reaction exist?' for the least familiar of the three.","`tacat:PART_0000003_03` — 2-oxo-3-sulfanylpropanoate as product, and the graph's last word on it"]},Jr={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"A-Box — what is it?",short:"the instance layer of an ontology — the individuals and the facts asserted about them",say:"An ontology splits in two: the T-Box holds the vocabulary of classes and properties, the A-Box holds the individuals and what is asserted about them. The A-Box is the data — which things exist, what they are, how they relate. The schema/rows analogy is close, with one difference that matters: nothing rejects an A-Box contradicting its T-Box, because an ontology is not a write gate.",glossary:["a-box"],heard:["A-Box","ABox","assertional box"],warn:"An individual is not automatically distinct from another, and a fact is never…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["def-t-box","def-ontology","def-owl-namedindividual","def-reasoner","def-defined-class","def-open-world-assumption"],points:["Built by `src/tacat/ontology/population.py` — three transaminase reactions and the negative control, with their participant bridge nodes, chemical entities and enzymes. The role individuals Reactant and Product are the exception: they sit in the T-Box, because the defined class restricts on them by value.","tacat:PART_0000002_01 tacat:participantRole tacat:Reactant ."]},Yr={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"accepted name vs display name — what is it?",short:"a curator's one preferred label versus the string another database prints for the same entry",say:"An accepted name is the single preferred label the curating database assigns to an entry. A display name is whatever a consuming database prints for that same entry in its own equations and interfaces. Both hang off one identifier, and they diverge whenever two curation teams made naming choices independently. Neither is a key: only the identifier is.",glossary:["accepted-name-vs-display-name"],heard:["accepted name vs display name","display name","Rhea display string","display_name"],warn:"Carrying both is not resolving the conflict. The submission records which names…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["identifiers-verified","def-chebi-accepted-name","def-chebi","def-rhea","def-literal","def-microspecies"],points:["`ChemicalEntity` in `reference_data.py` carries both fields, and the graph labels individuals with `display_name` while `accepted_name` is kept beside it. Recording the divergence rather than silently picking one is the stated point.",'`ChemicalEntity(57972, "L-alanine zwitterion", "L-alanine", "C3H7NO2", 0)`']},Xr={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"accession — what is it?",short:"the bare identifier a database issues inside its own namespace, before any IRI is built round it",say:"An accession is the key a database assigns within its own namespace — `29985`, `P0A959`, `2.6.1.2` — with no scheme, host or prefix attached. It is stable by policy: an entry can be re-curated or relabelled and the accession still designates it. An IRI, a CURIE and a web page URL are three different wrappings of one accession.",glossary:["accession"],heard:["accession","accession number","chebi_id","bare identifier","database key"],warn:"An accession is unique only inside its issuing database. `29985` on its own…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["identifiers-verified","mint-vs-reuse","def-up-mnemonic","def-iri","def-curie","def-prefixed-name-local-part","def-opaque-identifier","def-chebi","def-uniprot"],points:["`ChemicalEntity.chebi_id` is an `int` and `Reaction.uniprot` a tuple of strings; the IRI is built by concatenating a namespace constant at the point of use. That keeps one namespace per database in `reference_data.py` instead of a full IRI repeated in every record.",'`URIRef(f"{ref.UNIPROT}{accession}")` -> `http://purl.uniprot.org/uniprot/P0A959`']},Zr={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"active site — what is it?",short:"the pocket on an enzyme where substrate binds and the chemistry happens",say:"The small region of an enzyme — a pocket formed by residues that may be far apart in the sequence — where the substrate binds and the reaction is catalysed. Specificity comes from physical fit in that pocket, which is why an enzyme accelerates one transformation rather than any. A handful of residues do the chemistry; the rest of the protein holds them in position.",glossary:["active-site"],heard:["active site","active-site lysine","catalytic pocket","binding pocket"],warn:'BACKGROUND — The lysine linkage is the *resting* state. Saying PLP "stays…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["plp-cofactor","def-internal-external-aldimine","def-plp","def-hascofactor","def-prosthetic-group","def-turnover-catalytic-cycle","def-cofactor"],points:["Not modelled. It enters the submission as prose only: the `hasCofactor` docstring places PLP on the enzyme because the cofactor is bound to an *active-site lysine*, which is the argument for domaining that property on `Enzyme` rather than on `BiochemicalReaction`."]},ec={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"AlaA / ALT1 — what is it?",short:"two alanine-transaminase proteins on one Rhea master — only one has a recorded direction",say:"AlaA is *Escherichia coli*'s alanine transaminase, UniProt `P0A959`. ALT1 is the human one, UniProt `P24298`. Both catalyse EC 2.6.1.2 and both are annotated against Rhea master 19453 — the same reaction. Only AlaA carries a `PhysiologicalDirection`: right-to-left (RHEA:19455), consuming L-glutamate to make alanine biosynthetically. P24298 has none, so its direction is unrecorded, not opposite.",glossary:["alaa-alt1"],heard:["AlaA / ALT1","P0A959","P24298","alanine transaminase proteins","alaA"],warn:"Not two names for one protein. Different organisms, different sequences, one EC…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"UniProt:P0A959"}],see:["direction-alaa","weak-direction","def-uniprot","def-rhea-master-and-directional-children","def-ec-number","def-n-ary-relation","def-reactionparticipant","def-got1-p17174"],points:["Both accessions sit in `ALANINE_TRANSAMINASE.uniprot`, with an inline comment marking AlaA as the interesting case. It is the fact behind the n-ary node: L-glutamate is a product in the master's left-to-right orientation and consumed in AlaA's physiological direction, so the role is not a property of the molecule.",'`uniprot=("P24298", "P0A959", "P77434")` on the alanine reaction']},tc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"AllDifferent — what is it?",short:"asserts that a set of named individuals denote pairwise distinct things",say:"OWL does not assume two names denote two things, so a reasoner is free to conclude that any two individuals are the same one. `owl:AllDifferent` — `AllDifferent` in Owlready2 — states that every member of a listed set is pairwise distinct, and closes exactly that freedom for those names. It is an axiom about identity, and nothing else in the model implies it.",glossary:["alldifferent"],heard:["AllDifferent","owl:AllDifferent","owl:differentFrom"],warn:"It repairs the definition, not the data: against the shipped A-Box the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","disjointness-axiom","def-unique-name-assumption","def-owl-alldisjoint-disjointness","def-defined-class","def-conjunct","def-owl-namedindividual","def-hasvalue-restriction"],points:["`AllDifferent([reactant, product])` in the T-Box. Without it a reasoner may identify the Reactant role with the Product role, and under that identification the defined class's four conjuncts collapse into two — one participant could satisfy both 'consumes an amino acid' and 'produces an amino acid'.","AllDifferent([reactant, product])"]},ac={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"α-carbon (C2) — what is it?",short:"the carbon beside the carboxylate — position 2, and where transamination happens",say:"In a carboxylic acid the α-carbon is the one bonded to the carboxyl carbon, numbered C2 because the carboxyl carbon is C1. In an α-amino acid it carries the amino group, a hydrogen and the side chain, so it is the stereocentre distinguishing L from D. In a 2-oxo acid it carries a keto oxygen instead. Transamination exchanges exactly that substituent and leaves the skeleton alone.",glossary:["alpha-carbon"],heard:["α-carbon (C2)","alpha carbon","C2","position 2","2-position","alpha-C"],warn:"The α of α-transaminase names this carbon. An ω-transaminase moves an amino…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["omega-transaminase","defined-class","def-2-oxo-acid","def-amino-acid","def-amino-group","def-omega-transaminase-vs-alpha-transaminase","def-chirality-chiral-amine","def-systematic-name"],points:["It is what the `2-` names in every label the graph carries — `2-oxoglutarate`, `2-oxo-3-sulfanylpropanoate` — and what the `L-` prefix qualifies. No property in the model expresses position or stereochemistry; both survive only inside label strings and ChEBI identifiers.","`L-alanine:2-oxoglutarate aminotransferase` — the `2-` is the α-carbon of the glutarate skeleton"]},sc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ALT / AST — what is it?",short:"alanine and aspartate transaminase — two of the three enzymes, and blood-panel markers",say:"Alanine transaminase (ALT, EC 2.6.1.2) and aspartate transaminase (AST, EC 2.6.1.1). Both are α-transaminases that hand an amino group to 2-oxoglutarate. ALT is concentrated in liver cells, AST also in heart and muscle, so damaged cells leak them into the bloodstream and an elevated ALT/AST on a blood panel reads as a liver-damage signal — the same enzymes measured for an unrelated reason.",glossary:["alt-ast"],heard:["ALT / AST","ALT","AST","SGPT","SGOT","liver function markers"],warn:"ALT and AST name *activities* by EC number, not proteins. In humans AST is two…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["why-three-reactions","explain-to-biochemists","def-transaminase","def-alaa-alt1","def-got1-p17174","def-ec-number","def-2-oxoglutarate","def-rhea"],points:["Two of the three modelled reactions: `ASPARTATE_TRANSAMINASE` (Rhea master 21824) and `ALANINE_TRANSAMINASE` (19453) in `reference_data.py`. The third is cysteine transaminase, EC 2.6.1.3, which has no clinical assay of its own.","EC 2.6.1.2 = ALT, RHEA:19453  ·  EC 2.6.1.1 = AST, RHEA:21824"]},nc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"amino acid — what is it?",short:"carboxylic acid carrying an amino group — the amino-group donor in transamination",say:"A carboxylic acid carrying an amino group. In an α-amino acid that group sits on the carbon next to the carboxyl — position 2 — and it is those that transaminate: the amino acid is the donor, giving the group up and becoming the corresponding 2-oxo acid. In water at physiological pH the free form is a zwitterion, which is the species a chemical database identifies rather than the neutral structure in a textbook.",glossary:["amino-acid"],heard:["amino acid","AminoAcid","tacat:AminoAcid","AMINO_ACIDS","α-amino acid","alpha-amino acid"],warn:"The disjointness with `TwoOxoAcid` is false as general chemistry — an ω-amino…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["defined-class","disjointness-axiom","def-2-oxo-acid","def-chemicalentity","def-amino-donor-amino-acceptor","def-zwitterion","def-owl-alldisjoint-disjointness","def-defined-class"],points:["`AminoAcid` is an OWL subclass of `ChemicalEntity` in `schema.py`, declared disjoint from `TwoOxoAcid`. Membership is asserted from the curated `reference_data.AMINO_ACIDS`, never derived — there is no `owl:imports` of ChEBI, so HermiT is told which molecules are amino acids.","AMINO_ACIDS = (L_ALANINE, L_ASPARTATE, L_CYSTEINE, L_GLUTAMATE)"]},oc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"amino donor / amino acceptor — what is it?",short:"which side gives the amino group and which takes it, in a given direction",say:"In a transamination the *donor* loses its amino group and the *acceptor* gains it. In α-transamination the donor is an amino acid and the acceptor a 2-oxo acid; each becomes the other's counterpart, so the two labels swap when the reaction runs the other way. Donor and acceptor are roles held in a direction, not classes of molecule.",glossary:["amino-donor-amino-acceptor"],heard:["amino donor / amino acceptor","amino donor","amino acceptor","amine donor","keto acceptor"],warn:"Distinct from reactant/product. Donor and acceptor are chemical roles; the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["why-three-reactions","defined-class","def-amino-acid","def-2-oxo-acid","def-substrate-product","def-participantrole","def-transaminase","def-2-oxoglutarate"],points:['All three reactions share the acceptor 2-oxoglutarate and differ only in the donor, which is why "substrate specificity" (CQ03) is a question about the donor. The defined class encodes the pairing as four role conjuncts: amino acid in, 2-oxo acid in, 2-oxo acid out, amino acid out.']},ic={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"amino group — what is it?",short:"−NH2, the nitrogen-containing group a transaminase moves between molecules",say:"A nitrogen atom bonded to two hydrogens and to a carbon skeleton, −NH2. It is what makes an amino acid an amino acid, and it is the unit transferred in transamination: it leaves the donor and is attached to the acceptor, so the carbon skeletons stay where they are and only the nitrogen moves. At physiological pH it is usually protonated.",glossary:["amino-group"],heard:["amino group","−NH2","amine group"],warn:"The defined class does not check that an amino group moved. It checks which…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["signature-not-mechanism","defined-class","def-transaminase","def-amino-donor-amino-acceptor","def-atom-mapping","def-defined-class","def-signature","def-2-oxo-acid"],points:["Nothing in the graph represents the group itself. The transfer is expressed only as the four-way participant-role signature of `TransaminationReaction` — which is exactly why that class is a signature and not chemistry: nothing in it tracks the nitrogen.","L-alanine + 2-oxoglutarate ⇌ pyruvate + L-glutamate"]},rc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ammonia / ammonium — what is it?",short:"free NH3 / NH4+ — an amino group released rather than transferred",say:"Ammonia is NH3; ammonium, NH4+, is its conjugate acid and the form that predominates at physiological pH. When an enzyme strips an amino group and releases it free rather than handing it to an acceptor, the reaction is an oxidative deamination and not a transamination — the nitrogen leaves the pair of carbon skeletons entirely.",glossary:["ammonia-ammonium"],heard:["ammonia / ammonium","ammonia","ammonium","NH4+","NH3","azane"],warn:"BACKGROUND — With those species omitted the control has two participants, so it…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["negative-control","def-conjugate-acid-base","def-glutamate-dehydrogenase","def-negative-control","def-redox-cofactor","def-arity","def-amino-group"],points:["The chemical reason glutamate dehydrogenase is the negative control: the amino group is released, not transferred. NH4+ is not in the graph — `_add_negative_control` models only L-glutamate in and 2-oxoglutarate out, naming NAD+, NADH and NH4+ as omitted for unverified identifiers; H2O and H+ it does not name at all."]},cc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"API — what is it?",short:"a fixed set of requests a program accepts, plus a promise about the responses",say:"A fixed set of requests a program accepts, together with a promise about the responses it returns. The promise is the contract: callers write code against those shapes and status codes, so changing them breaks work that was already correct. A web API states the contract over HTTP — paths, methods, media types, status codes.",glossary:["api"],heard:["API","application programming interface","HTTP API"],refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["sparql-protocol","def-sparql-1-1-protocol","def-openapi","def-content-negotiation","def-fastapi","def-querypolicy"],points:["The service is `src/tacat/api/`: HTTP wiring in `app.py`, the read-only rules in `policy.py`, result rendering in `negotiation.py`, the browser console in `console.py`. It implements the read subset of the SPARQL 1.1 Protocol rather than a bespoke JSON API, so stock clients work unmodified."]},dc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"apoenzyme — what is it?",short:"the cofactor-free protein — folded but inactive until the cofactor binds",say:"A cofactor-dependent enzyme without its cofactor: the polypeptide alone, correctly folded but catalytically dead. Add the cofactor and it becomes the holoenzyme, the working form. Preparing the apo form and restoring activity by adding the cofactor back is the standard demonstration that a cofactor is required rather than merely present, and for PLP enzymes it is how B6 dependence is shown.",glossary:["apoenzyme"],heard:["apoenzyme","apo form","apoprotein","apo-enzyme","cofactor-free enzyme"],warn:"BACKGROUND — The model cannot express apo versus holo and does not try.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["plp-cofactor","def-cofactor","def-hascofactor","def-plp","def-prosthetic-group","def-enzyme","def-active-site"],points:["The distinction the `hasCofactor` domain decision rests on: the property is domained on `Enzyme`, so PLP is something an enzyme *has*, not something a reaction consumes. Neither state is represented — an enzyme individual here is an EC class instance, so it names an activity, and an activity has no cofactor-free form."]},lc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"application factory / injectable dependency — what is it?",short:"a function that builds the app and takes its collaborators as arguments",say:"An application factory is a function that constructs the application object and returns it, instead of building one at import time. Its parameters are the collaborators the app needs — a store, a policy, a connection — so a caller can hand it a substitute. That is dependency injection: the object does not reach out for what it depends on, it is given it.",glossary:["application-factory-injectable-dependency"],heard:["application factory / injectable dependency","create_app()","app factory","dependency injection"],warn:"The CS primer shows the signature as `create_app(graph)`. The submitted one…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_health_503_when_graph_is_empty"}],see:["def-fastapi","def-graphrepository","def-querypolicy","def-pytest-fixture","def-seam"],points:["`create_app(repository=None, *, policy=None, graph=None)` in `src/tacat/api/app.py`. Tests build an app over a fixture graph — `TestClient(create_app(graph=graph))` — with no filesystem, no reasoner and no network. The module-level `app` that `uvicorn` imports comes from `build_app()`, which calls the same factory."]},hc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"arity — what is it?",short:"how many things a relation relates, or how many slots a pattern needs filled",say:"The arity of a relation is the number of arguments it takes: a binary relation relates two things, an n-ary relation n. Applied to matching, arity is a counting question — are there enough distinct participants to fill every slot the pattern demands — and it is settled before any question about what those participants are.",glossary:["arity"],heard:["arity","number of arguments","role-slot count"],warn:"Do not cite the control as proof that role discrimination works — it fails on…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["negative-control","defined-class","def-n-ary-relation","def-conjunct","def-negative-control","def-defined-class","def-bridge-node","def-glutamate-dehydrogenase"],points:["The negative control REACT_0000099 is modelled with two participants, L-glutamate in and 2-oxoglutarate out, of a seven-species reaction — RHEA:15133, whose H+ the submitted docstring drops. The defined class needs four role-slots filled, so the reasoner excludes it on the count, never reaching the role comparison."]},fc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"-ate vs -ic acid (glutamate vs glutamic acid) — what is it?",short:"the anion is named -ate, the neutral acid -ic — two species, two identifiers",say:"A carboxylic acid and the anion left after it gives up its proton get different names: pyruvic acid and pyruvate, glutamic acid and glutamate, aspartic acid and aspartate. The pair differ by one proton and one unit of charge, so they are distinct chemical species and a chemical database gives each its own identifier. Near neutral pH the -ate form is overwhelmingly the one present.",glossary:["ate-vs-ic-acid"],heard:["-ate vs -ic acid (glutamate vs glutamic acid)","glutamate vs glutamic acid","-ate","-ic acid","aspartate vs aspartic acid","pyruvate vs pyruvic acid","anion naming"],warn:"The convention stops at the charge suffix. ChEBI writes `L-aspartate(1−)`, but…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:16015"}],see:["identifiers-verified","minus-sign","def-conjugate-acid-base","def-chebi-accepted-name","def-minus-sign-vs-hyphen","def-microspecies","def-zwitterion","def-chebi"],points:["Every chemical label in the graph is an -ate form — `L-aspartate`, `pyruvate`, `2-oxoglutarate`, `L-glutamate` — and every entity in `reference_data.py` carries the charge that goes with it. Saying 'glutamic acid' aloud over a slide reading `L-glutamate` names a different ChEBI entity.","`L-glutamic acid` CHEBI:16015  ⇄  `L-glutamate(1−)` CHEBI:29985 — one proton apart, two entries"]},pc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"atom mapping — what is it?",short:"recording which atom in a reactant becomes which atom in a product",say:"A stated correspondence between the atoms of a reaction's reactants and those of its products, so that *this* nitrogen going to *that* carbon is recorded rather than assumed. It is what lets a database say a group was transferred, as opposed to saying only that both molecules were present on the right sides.",glossary:["atom-mapping"],heard:["atom mapping","atom-atom mapping","atom transfer","reaction mapping"],warn:"BACKGROUND — Do not say the reasoner recognises a transamination *chemically*.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["signature-not-mechanism","defined-class","def-signature","def-defined-class","def-rhea","def-mass-balance-charge-balance","def-amino-group","def-transaminationreaction"],points:["The submission does none. `TransaminationReaction` is a participant-role signature — four conjuncts over classes and roles, constraining nothing about atom transfer, mass balance or extra participants — so a reaction whose products equalled its reactants satisfies it. Rhea is where the atom mapping lives."]},$c={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"axiom — what is it?",short:"one formal statement an ontology asserts and a reasoner takes as given",say:"An axiom is a single statement asserted true — a subclass relation, a disjointness, a domain, an equivalence, a property characteristic. An ontology is a set of axioms, and a reasoner's job is to work out what else must follow from them and whether they can all hold at once. Nothing checks an axiom against the world: it is a premise, not an observation.",glossary:["axiom"],heard:["axiom","OWL axiom","logical axiom"],warn:"Importing an upper ontology means inheriting every axiom in it and honouring…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["why-not-emmo","owl-vs-rdfs","def-ontology","def-owl-alldisjoint-disjointness","def-domain-and-range","def-t-box","def-reasoner","def-upper-ontology"],points:["The axioms live in `src/tacat/ontology/schema.py` — two `AllDisjoint` declarations, `domain` and `range` on every property, `FunctionalProperty` where a value must be unique, `AllDifferent` on the role individuals, and the `equivalent_to` that makes TransaminationReaction a defined class."]},uc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"bandit — what is it?",short:"a static scanner for common security mistakes in Python source",say:"A static analysis tool that reads Python source and reports patterns associated with security defects — `eval` on caller input, `subprocess` with `shell=True`, hard-coded passwords, weak hashes, disabled certificate checks. It reads code rather than running it, so it finds shapes, not exploits: false positives are routine and a clean run is not a proof.",glossary:["bandit"],heard:["bandit","B101","security linter"],warn:"A green bandit run means no known pattern matched. It says nothing about the…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["ci-data-gates","def-ci-cd","def-ruff","def-mypy","def-ssrf","def-scanner-tokeniser"],points:["The `security` job runs `bandit -c pyproject.toml -r src`. `tests` is excluded and B101 (assert used) is skipped, because pytest tests are written with bare `assert` and flagging every one of them would bury the real findings."]},yc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"bare keyword — what is it?",short:"a keyword-shaped run of letters occurring outside IRIs, string literals and comments",say:"In query or program text, an occurrence of a keyword that really is the keyword, rather than the same letters sitting inside some other token. `SERVICE` inside an IRI path segment, a quoted literal, a comment or a variable name is not a keyword. Deciding which is which needs a scanner that tracks token boundaries, because those tokens can contain each other's delimiters.",glossary:["bare-keyword"],heard:["bare keyword","_bare_keywords","keyword outside a token"],warn:'Backslash escapes are not handled: a literal containing `\\"` ends early, the…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_the_word_service_outside_a_clause_is_not_refused"}],see:["scanner-guard-failures","weak-readonly","def-scanner-tokeniser","def-query-form","def-iriref","def-whitelist-vs-keyword-blacklist","def-ssrf","def-querypolicy"],points:["`_bare_keywords()` in `src/tacat/api/policy.py` yields them upper-cased in source order. The first one is the query form; a `SERVICE` among them is refused. `PREFIX` and `BASE` are consumed whole up to their closing `>`, or the scanner would resume on the prefix label and read `tacat:` as a keyword of its own.",'SELECT * WHERE { FILTER(?x = "a\\"b") SERVICE <http://evil.example/> { ?s ?p ?o } }']},mc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"base image / digest pinning — what is it?",short:"the image a build starts FROM, and naming it by content hash instead of a movable tag",say:"A base image is what a Dockerfile's `FROM` line starts from; every later layer sits on it. A tag such as `:python3.13-bookworm-slim` is a mutable label the publisher can repoint at new content, so the same Dockerfile can build from different bytes on different days. Pinning by digest — `FROM image@sha256:…` — names the content itself and cannot move.",glossary:["base-image-digest-pinning"],heard:["base image / digest pinning","FROM","pinned by digest","image digest"],warn:"The `reproducible-build` job compares two builds inside one job. It cannot see…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["weak-reproducibility","def-container-image","def-container-registry-image-tag-latest","def-multi-stage-build","def-lock-file","def-commit-sha-and-checksum"],points:["Both stages start `FROM ghcr.io/astral-sh/uv:python3.13-bookworm-slim` — a tag, not a digest. That bounds the reproducibility claim honestly: the pipeline proves two builds on one runner produce identical graph bytes, not that a rebuild next year starts from the same base."]},gc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"BFO — what is it?",short:"the upper ontology most OBO Foundry ontologies align to, splitting continuants from occurrents",say:"BFO is a small upper ontology, standardised as ISO/IEC 21838-2, dividing everything into continuants — things that persist through time, such as objects, qualities and roles — and occurrents, things that happen, such as processes. OBO Foundry membership expects alignment to it, and its role category is how a BFO-aligned model says what part a thing plays in a process.",glossary:["bfo"],heard:["BFO","Basic Formal Ontology","ISO/IEC 21838-2","BFO-style role pattern"],warn:"NOT USED HERE — 'A BFO-style role pattern' describes Reac4Cat, not this…",refs:[{kind:"source",rel:"cited-as",at:"BFO — ISO/IEC 21838-2"}],see:["why-not-emmo","nary-vs-reac4cat","def-upper-ontology","def-reac4cat","def-emmo","def-n-ary-relation","def-participantrole","def-obo-foundry"],points:["Not imported, and not aligned to. NFDI4Cat's Reac4Cat took the BFO-style role route with educt-mixture and product-component-set groupings; this model uses the W3C n-ary pattern instead, because a bridge node carries a stoichiometric coefficient and a role pattern does not. Recorded in DECISIONS.md."]},wc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"BiochemicalReaction — what is it?",short:"the root reaction class — participants, enzyme and reversibility all hang off it",say:"A reaction model needs one class for the reaction event itself, separate from the molecules taking part: the node that participation, catalysis and directionality attach to. Everything else in the graph is reached from it, and a class that recognises a kind of reaction is written as a subclass of it.",glossary:["biochemicalreaction"],heard:["BiochemicalReaction","tacat:BiochemicalReaction","reaction individual"],warn:"It is not a Rhea reaction and not an EC class. The Rhea identifier is attached…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","def-transaminationreaction","def-chemicalentity","def-reactionparticipant","def-reversibilitykind","def-enzyme","def-owl-alldisjoint-disjointness"],points:["`tacat:BiochemicalReaction` in `src/tacat/ontology/schema.py`, 'a chemical reaction catalysed by an enzyme'. It is the domain of `hasParticipant`, `catalysedBy` and `hasReversibility`, disjoint from ReactionParticipant and ChemicalEntity, and the parent of the defined class. Four individuals instantiate it.","tacat:REACT_0000002 a rhea:19453, tacat:BiochemicalReaction, tacat:TransaminationReaction ."]},bc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"BioPAX / SBML — what is it?",short:"the two pathway-exchange standards that both reify participation as its own node",say:"BioPAX is an OWL vocabulary for exchanging biological pathway data; SBML is an XML format for exchanging systems-biology models. Both hit the same problem — the link from a reaction to a molecule has to carry a stoichiometric coefficient — and both solve it the same way, with an intermediate object: BioPAX's `Stoichiometry`, SBML's `SpeciesReference`.",glossary:["biopax-sbml"],heard:["BioPAX / SBML","BioPAX","SBML","Stoichiometry (BioPAX)","SpeciesReference"],warn:"BACKGROUND — SBML is not RDF. The shared point is the modelling shape, not the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","def-n-ary-relation","def-bridge-node","def-reac4cat","def-reactionparticipant","def-stoichiometric-coefficient","def-reversibilitykind"],points:["Cited as precedent for the bridge node, in the `ReactionParticipant` docstring and in DECISIONS.md. Neither is imported. BioPAX also supplies the argument for `ReversibilityKind`: a boolean cannot express its three-way directionality distinction."]},vc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"blank node — what is it?",short:"an RDF node with no IRI — existential, local to one document, not citable from outside",say:"RDF allows a subject or object with no identifier: a blank node, written `_:b0` in Turtle. It asserts that something with these properties exists, without naming it. The label is scoped to the document, so two blank nodes in two files are never the same node, and merging graphs duplicates them instead of unifying them.",glossary:["blank-node"],heard:["blank node","bnode","_:b0","anonymous node"],warn:"Blank nodes are not a defect everywhere. The property shapes inside…",see:["blank-nodes","def-iri","def-bridge-node","def-reactionparticipant","def-shacl","def-node-shape-vs-property-shape","def-graph-isomorphism-vs-byte-equality"],points:["`ReactionParticipantShape` sets `sh:nodeKind sh:IRI`, so every participant bridge node must be named. The `sh:message` gives the reason verbatim: blank nodes duplicate silently across graph merges and cannot be cited in a validation report.","sh:nodeKind sh:IRI ;    # ReactionParticipantShape"]},_c={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"BLAST — what is it?",short:"sequence-similarity search — the statistical foil to a reasoner's deduction",say:"BLAST (Basic Local Alignment Search Tool) finds regions of local similarity between a query sequence and every sequence in a database, ranking hits by an alignment score and an E-value — how many matches that good would be expected by chance. It is a heuristic: it answers *what does this resemble*, and the answer is statistical, so a hit can be spurious and a real homologue missed.",glossary:["blast"],heard:["BLAST","Basic Local Alignment Search Tool","BLASTp","sequence similarity search","E-value"],warn:"BACKGROUND — Nothing in the submission runs BLAST, and there are no sequences…",see:["explain-to-biochemists","build-time-reasoning","def-reasoner","def-hermit","def-entailment","def-deductive-closure"],points:["Used only as an analogy for the reasoner: submitting an uncharacterised sequence and getting a family assignment back resembles submitting a reaction and getting a type back. The primer states the limit in the same breath — BLAST answers by similarity, HermiT by deduction, and a deduction cannot be a bit right."]},kc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"branch coverage — what is it?",short:"counts which way each conditional went, not merely which lines executed",say:"A coverage metric that asks, at every branch point, whether both outcomes were taken — not just whether the line ran. Line coverage calls an `if` with no `else` fully covered after one test that takes the true path; branch coverage records the false path as missing. It is strictly stronger, and it is what exposes an untested error path.",glossary:["branch-coverage"],heard:["branch coverage","line coverage","statement coverage","--cov"],warn:"Coverage measures which code ran, never whether the assertions were right. A…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["ci-data-gates","def-mutation-testing","def-pytest","def-property-based-test","def-regression-test","def-ci-cd"],points:["`[tool.coverage.run] branch = true` in `pyproject.toml`, with `--cov=tacat --cov-report=term-missing` in the default pytest options. The CI `test` job also emits a Cobertura XML report and a JUnit file as artefacts, so GitLab renders both."]},qc={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"BRENDA — what is it?",short:"manually curated enzyme-function database, organised by EC number",say:"BRENDA — the BRaunschweig ENzyme DAtabase — is the main curated collection of enzyme functional data: for each EC number it records the reaction, substrates and products, organisms, kinetic parameters such as KM and kcat, assay conditions, and the literature each value came from. It is where a biochemist looks up what an enzyme does and under what conditions.",glossary:["brenda"],heard:["BRENDA","BRaunschweig ENzyme DAtabase","brenda-enzymes.org"],warn:"No BRENDA identifier appears on any entity in the graph. BRENDA was read during…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/provenance.py"}],see:["identifiers-verified","def-ec-number","def-chebi","def-rhea","def-uniprot","def-km-kcat-catalytic-efficiency","def-reference-data-checksum"],points:["The fourth curation source, and the only one that is not an identifier authority here. It is named in `dcterms:source` and `prov:used` on the dataset self-description and in the reference-data docstring; the README links each EC number to its BRENDA page for a human reader.",'`dcterms:source "ChEBI; Rhea; UniProtKB; BRENDA"`']},Ic={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"bridge node — what is it?",short:"an intermediate node carrying a relationship's own attributes, because an RDF edge cannot",say:"An RDF triple has three slots and no room for anything else, so a relationship with attributes of its own — a coefficient, a role, a timestamp — cannot be one edge. The fix is to make the relationship a node: both ends point at it and its attributes hang off it. A join table with columns, in relational terms; the W3C published it as the n-ary relation pattern.",glossary:["bridge-node"],heard:["bridge node","n-ary bridge node","reified relationship","join table with columns"],warn:"It costs a join on every query — name that trade-off. Rhea avoids the join by…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","blank-nodes","def-n-ary-relation","def-reactionparticipant","def-biopax-sbml","def-reac4cat","def-stoichiometric-coefficient","def-blank-node"],points:["`ReactionParticipant` is that node: a reaction reaches it with `hasParticipant`, and it carries `participatingEntity`, `participantRole` and `stoichiometricCoefficient`. A direct `hasSubstrate` edge would have nowhere to put the coefficient.","tacat:REACT_0000002 tacat:hasParticipant tacat:PART_0000002_01 ."]},Ac={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"build backend (uv_build) — what is it?",short:"the library that turns a source tree into a wheel, named in [build-system]",say:"Under PEP 517 a Python project declares which library builds it. The frontend — pip, uv — reads `[build-system]` in `pyproject.toml`, installs the named backend into an isolated environment, and calls it to produce the wheel and sdist. setuptools, hatchling, flit and `uv_build` are interchangeable at that interface; the choice affects packaging, not the code.",glossary:["build-backend"],heard:["build backend (uv_build)","[build-system]","PEP 517 backend"],refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["def-uv","def-lock-file","def-pep-735-dependency-groups","def-src-layout","def-conventional-commits"],points:['`requires = ["uv_build>=0.9.0,<0.12.0"]` with `build-backend = "uv_build"`. Dörr\'s own packages cap at `<=0.10.0`, which predates the uv in use here and would warn on every build — so the bound was moved rather than copied. Matching the intent, not the digits.']},Cc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"carbon-count pairing (C3/C4/C5) — what is it?",short:"each amino acid pairs with the 2-oxo acid of the same carbon count — only the nitrogen moves",say:"Transamination rearranges one substituent and nothing else, so a donor amino acid and the 2-oxo acid it becomes share a carbon skeleton: three carbons for alanine and pyruvate, four for aspartate and oxaloacetate, five for glutamate and 2-oxoglutarate. Counting carbons is enough to say which keto acid partners which amino acid, and it makes visible the claim that only the amino group moves.",glossary:["carbon-count-pairing"],heard:["carbon-count pairing (C3/C4/C5)","carbon skeleton","C3/C4/C5","skeleton count","keto-acid partner","same carbon skeleton"],warn:"Formula, not structure. The model holds no atom-level representation and no…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["why-three-reactions","explain-to-biochemists","def-2-oxo-acid","def-amino-acid","def-amino-donor-amino-acceptor","def-atom-mapping","def-mass-balance-charge-balance","def-2-oxoglutarate"],points:["Readable straight off the formulae in `reference_data.py` — C3H7NO2/C3H3O3, C4H6NO4/C4H2O5, C5H8NO4/C5H4O5 — with cysteine the C3 pair carrying a sulfur, C3H7NO2S to C3H3O3S. The pairing is nowhere asserted: it is a property of the formula strings, not a triple.","`C3H7NO2` L-alanine ⇄ `C3H3O3` pyruvate  ·  `C5H8NO4` L-glutamate ⇄ `C5H4O5` 2-oxoglutarate"]},xc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"cardinality — what is it?",short:"how many values a property may or must have on one individual",say:"A cardinality constraint bounds the number of distinct values a property takes for an individual: at most one licence, at least one participant, exactly one role. OWL and SHACL both express it and draw opposite conclusions from an overrun. OWL, open-world, reconciles it by inferring that two of the values are the same thing; SHACL, closed-world, reports a violation.",glossary:["cardinality"],heard:["cardinality","owl:maxCardinality","owl:minCardinality","cardinality restriction"],warn:"An OWL cardinality is not a check. Asserting `maxCardinality 1` does not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"}],see:["why-both-owl-shacl","def-open-world-assumption","def-unique-name-assumption","def-shacl","def-owl","def-owl-sameas","def-node-shape-vs-property-shape"],points:["The worked example, in `validation.py` and at the head of `data/shapes.ttl`: `owl:maxCardinality 1` on a licence with CC-BY and CC0 both asserted makes a reasoner infer `owl:sameAs` between them, declaring the two licences the same thing. SHACL reports it. Same data, opposite outcome.","sh:minCount 1 ; sh:maxCount 1 ;   # exactly one role per participant"]},Tc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"catalysedBy — what is it?",short:"object property joining a reaction to the enzyme catalysing it — the one link between them",say:"An object property relating a reaction to the catalyst that brings it about. Keeping catalysis as a relation of its own, rather than making the catalyst one more participant of the reaction, records that a catalyst is not consumed and carries no stoichiometry: it stands outside the equation while making it go. The reaction is the subject, so the property reads from the transformation towards the thing performing it.",glossary:["catalysedby"],heard:["catalysedBy","tacat:catalysedBy","catalyzedBy","catalysed by","reaction-to-enzyme link","enzyme link"],warn:"Not functional, and no part of the defined class: `TransaminationReaction` is a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["defined-class","negative-control","def-object-property-vs-data-property","def-enzyme","def-biochemicalreaction","def-transaminationreaction","def-catalyst-role-declared-and-unused","def-negative-control"],points:["Declared in `src/tacat/ontology/schema.py` with `domain = [BiochemicalReaction]` and `range = [Enzyme]`, and asserted on all four reactions — the three transaminations and the negative control alike. CQ03 traverses it to join an enzyme's label to the substrates of the reaction it catalyses.","tacat:REACT_0000001 tacat:catalysedBy tacat:EC_2_6_1_1 ."]},Ec={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"catalyst role (SBO:0000013), declared and unused",short:"an SBO catalyst role the reference data defines and no triple in the graph ever uses",say:"SBO supplies a participant-role term for a catalyst beside those for reactant and product, so a reaction model may represent the enzyme as one more participant carrying that role. The alternative is a direct relation from reaction to catalyst. The choice is not cosmetic: a participant node has a slot for a stoichiometric coefficient, and a catalyst — regenerated every turnover — has no meaningful value to put in it.",glossary:["catalyst-role-declared-and-unused"],heard:["catalyst role (SBO:0000013), declared and unused","ROLE_CATALYST","catalyst role","unused catalyst role","catalyst participant"],warn:"NOT USED HERE — The constant is live code, not a comment. A reader grepping the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"source",rel:"identified-as",at:"SBO:0000013"}],see:["nary-vs-reac4cat","def-participantrole","def-sbo","def-reactionparticipant","def-catalysedby","def-stoichiometric-coefficient","def-enzyme"],points:["`reference_data.py` defines `ROLE_CATALYST` beside `ROLE_REACTANT` and `ROLE_PRODUCT`, and nothing reads it: `linking.py` mints role individuals for the first two only. The enzyme is attached by `catalysedBy` instead, so no participant node exists for it and no coefficient must be invented for a thing not consumed.",'ROLE_CATALYST: Final = f"{SBO}0000013"']},Rc={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"catalytic promiscuity / secondary activity — what is it?",short:"one protein catalysing a second, weaker reaction alongside the one it is named for",say:"Catalytic promiscuity is an enzyme's ability to catalyse reactions beyond the one it is named for, usually more slowly. An active site evolved for one chemistry often tolerates a neighbouring one, so this is common rather than exceptional. Such activities are curated separately, so a single protein can hold several EC numbers, and a weak promiscuous activity is a usual starting point for directed evolution.",glossary:["catalytic-promiscuity-secondary-activity"],heard:["catalytic promiscuity / secondary activity","secondary activity","promiscuous enzyme","enzyme promiscuity","side activity","substrate promiscuity"],warn:"Not moonlighting — that is a second *non-catalytic* function. Promiscuity is a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_every_protein_link_uses_uniprots_own_property_and_direction"}],see:["weak-got1","why-three-reactions","def-got1-p17174","def-p13221","def-p00505","def-ec-number","def-up-enzyme","def-directed-evolution-engineered-enzyme"],points:["The phenomenon the GOT1 entry describes as one case. EC 2.6.1.3 is not a distinct mammalian gene product but a secondary activity of the aspartate transaminase GOT1, so `linking.py` emits two `up:enzyme` triples for `P17174`. `P00505` carries EC 2.6.1.7 the same way, and the project does not model that one.","`uniprot:P17174 up:enzyme ec:2.6.1.1, ec:2.6.1.3 .`"]},Sc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"catalytic triad (serine protease) — what is it?",short:"a protease that cuts peptide bonds using a Ser-His-Asp catalytic triad",say:"Serine proteases — chymotrypsin, trypsin, subtilisin — hydrolyse peptide bonds using three residues held in a fixed geometry: a serine whose hydroxyl attacks the carbonyl carbon, a histidine that deprotonates it, and an aspartate that orients and stabilises the histidine. The triad is the family's diagnostic feature, and it has arisen independently in unrelated protein folds.",glossary:["catalytic-triad"],heard:["catalytic triad (serine protease)","catalytic triad","Ser-His-Asp catalytic triad","serine protease","chymotrypsin","trypsin","subtilisin"],warn:"BACKGROUND — There are no proteases in this graph. It is an analogy for the…",see:["defined-class","explain-to-biochemists","def-necessary-and-sufficient-conditions","def-defined-class","def-primitive-class","def-transaminationreaction","def-active-site","def-subsumption"],points:['The primer\'s bridge into necessary and sufficient conditions. "All serine proteases have the triad" only checks a known one; "any hydrolase with that triad, attacking a peptide bond, is a serine protease" runs both ways — which is what `equivalent_to` buys over `subclass_of` for `TransaminationReaction`.']},Oc={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"CC BY 4.0 — what is it?",short:"content licence permitting any reuse on the single condition of attribution",say:"Creative Commons Attribution 4.0 International: a public licence letting anyone copy, redistribute, adapt and commercialise a work provided the source is credited and changes indicated. It is written for content — data, text, images — rather than software. There is no share-alike clause, but the attribution obligation travels with every downstream copy, so a derivative cannot drop it.",glossary:["cc-by-4-0"],heard:["CC BY 4.0","Creative Commons Attribution 4.0","CC-BY","creativecommons.org/licenses/by/4.0/"],warn:"Two licences, one repository: code is MIT (`LICENSE`), graph content is CC BY…",refs:[{kind:"code",rel:"decided-in",at:"README.md"}],see:["dcat-undocumented","def-spdx-licence-iri","def-dcat-ap-plus","def-chebi","def-rhea","def-uniprot","def-fair"],points:["The data licence, deliberately not the repository's MIT. ChEBI, Rhea and UniProt are each CC BY 4.0, and a derived dataset cannot be relicensed more permissively than its sources. `data/dataset.ttl` had claimed MIT — a freedom that was not this project's to grant, in the field a reuser acts on automatically.","`dcterms:license <http://creativecommons.org/licenses/by/4.0/>`"]},Pc={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"ChEBI accepted name — what is it?",short:"ChEBI's one preferred label per entry — a label, never a key",say:"Each ChEBI entry carries exactly one accepted name plus any number of synonyms. The accepted name follows ChEBI's own conventions — charge suffixes written with U+2212, explicit `zwitterion` qualifiers — so it often differs from the friendly string other databases print for the same entry. It identifies nothing on its own, and the bare name of a compound frequently belongs to its neutral parent or to a tautomer.",glossary:["chebi-accepted-name"],heard:["ChEBI accepted name","NAME_DIVERGENCES","accepted name","accepted_name"],warn:"The bare accepted name `L-cysteine` is CHEBI:17561, a tautomer of the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:35235"}],see:["tautomer-trap","minus-sign","identifiers-verified","def-accepted-name-vs-display-name","def-chebi","def-minus-sign-vs-hyphen","def-mercaptopyruvate-naming","def-tautomer","def-microspecies"],points:["`NAME_DIVERGENCES` in `reference_data.py` lists the three of the nine participants where ChEBI's accepted name and Rhea's printed string differ: the two zwitterions, and 3-mercaptopyruvate, which Rhea prints as 2-oxo-3-sulfanylpropanoate.",'`57678: ("3-mercaptopyruvate", "2-oxo-3-sulfanylpropanoate")`']},jc={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"ChEBI — what is it?",short:"the identifier authority for molecules — one number per distinct chemical species",say:"Chemical Entities of Biological Interest: an open chemical ontology curated at the EBI that gives every distinct chemical species a number. Distinct includes each protonation state and each tautomer, so a compound and its physiological microspecies are separate entries. It is an OBO Foundry ontology, so entries sit in a subsumption hierarchy and are joined by typed relations such as `is_tautomer_of`.",glossary:["chebi"],heard:["ChEBI","Chemical Entities of Biological Interest","CHEBI:29985","obo:CHEBI_"],warn:"Never resolve a ChEBI identifier from a name string. The bare name usually…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:29985"}],see:["microspecies","tautomer-trap","identifiers-verified","def-microspecies","def-tautomer","def-purl","def-ebi","def-chebi-accepted-name","def-kegg","def-obo-foundry"],points:["Every chemical individual is typed as its ChEBI class through the OBO PURL `http://purl.obolibrary.org/obo/CHEBI_<accession>`; the namespace constant is `CHEBI` in `reference_data.py`. The nine participants were each checked against the live database individually rather than resolved by name.","`http://purl.obolibrary.org/obo/CHEBI_29985` — L-glutamate(1−)"]},Lc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"ChemicalEntity — what is it?",short:"the class of the molecules that react — anchored on a ChEBI identifier, not a name",say:"A reaction model needs a class for the things that react, kept separate from the reaction and from the role a thing plays in it. Making that class the anchor for an external chemical identifier is what stops molecules being modelled as strings: identity comes from the identifier, and the name is only a label on it.",glossary:["chemicalentity"],heard:["ChemicalEntity","tacat:ChemicalEntity","ChemicalEntityShape"],warn:"Two things carry the name. `tacat:ChemicalEntity` is the OWL class in the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["disjointness-axiom","def-chebi","def-2-oxo-acid","def-biochemicalreaction","def-frozen-dataclass","def-owl-alldisjoint-disjointness","def-defined-class"],points:["`tacat:ChemicalEntity` in `schema.py`, with `TwoOxoAcid` and `AminoAcid` as disjoint subclasses; the defined class is written over those two, never over a molecule. `ChemicalEntityShape` targets it and requires the ChEBI anchor, which sits on `rdf:type` rather than on a string property.","tacat:CHEBI_57972 a tacat:AminoAcid, obo:CHEBI_57972 ."]},Nc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"chirality / chiral amine — what is it?",short:"handedness — a carbon with four different neighbours exists in two mirror-image forms",say:"A molecule is chiral when it cannot be superimposed on its mirror image, typically because a carbon carries four different substituents. The two forms, enantiomers, are identical in an achiral environment but behave differently in a biological one, so usually only one is the active drug. Ordinary synthesis gives a 50/50 mixture that then has to be separated.",glossary:["chirality-chiral-amine"],heard:["chirality / chiral amine","chiral","chirality","chiral amine","enantiomer","stereochemistry","handedness"],warn:"BACKGROUND — The chiral amines industry wants are made by ω-transaminases, run…",see:["omega-transaminase","ask-lara-or-alongside","def-omega-transaminase-vs-alpha-transaminase","def-sitagliptin","def-directed-evolution-engineered-enzyme","def-lara-larasuite","def-chebi","def-transaminase"],points:["The reason the enzyme choice is not incidental: enzymes are themselves chiral, so a transaminase makes one enantiomer of an amine and not the other, which is what industry buys them for. Stereochemistry is carried by identifier alone — the L- species ChEBI names — and no property in the model expresses it."]},Dc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"CI/CD — what is it?",short:"a server rebuilds and re-checks the project on every change, and can ship the result",say:"Continuous integration: a server rebuilds the project and re-runs its checks on every change, so a defect is found by the machine rather than by the next person to clone it. Continuous delivery extends that to producing and publishing the artefact from the same run, so what ships is what was checked rather than something built by hand afterwards.",glossary:["ci-cd"],heard:["CI/CD","continuous integration","continuous delivery"],warn:"A green pipeline is evidence only about the gates that exist. The provenance…",see:["ci-data-gates","def-smoke-test","def-kaniko","def-gitlab-runner","def-services","def-data-gate-vs-code-gate","def-commit-sha-and-checksum"],points:["`.gitlab-ci.yml`, four stages: `quality` (ruff, mypy, bandit), `verify` (tests, HermiT consistency, byte reproducibility, SHACL), `build` (Kaniko pushes the image), `smoke` (runs the pushed image). Three verify gates check the data, because an image can build while the graph inside it is wrong."]},Bc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"CITATION.cff — what is it?",short:"a machine-readable file at a repository root saying how to cite the software",say:"The Citation File Format: a YAML file named `CITATION.cff` at a repository root giving authors, title, version, release date and identifiers in a form tools can read. GitLab and GitHub render it as a cite-this-repository control, and archives use it when minting a DOI. It exists because software is a research output that otherwise gets cited badly or not at all.",glossary:["citation-cff"],heard:["CITATION.cff","Citation File Format","cff-version"],refs:[{kind:"code",rel:"decided-in",at:"CITATION.cff"}],see:["def-fair","def-cc-by-4-0","def-competency-question","def-conventional-commits","def-build-backend"],points:['CFF 1.2.0, MIT, `date-released: "2026-07-27"`, plus a `references:` block crediting ChEBI, Rhea, UniProtKB and the NFDI4Cat competency-question set the CQs are quoted from. CFF requires `authors` on every reference, so each database is credited to its maintaining institution.']},Mc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"citric acid cycle (TCA) intermediates — what is it?",short:"the central carbon-oxidation cycle — two of the graph's 2-oxo acids are steps in it",say:"The citric acid cycle, also called the Krebs or TCA cycle, oxidises acetyl-CoA to carbon dioxide and feeds reduced cofactors to the respiratory chain. Its intermediates are also biosynthetic hubs: oxaloacetate and 2-oxoglutarate are cycle members and are equally the amino-group acceptors of transamination, which is what makes transamination the hinge between nitrogen and carbon metabolism.",glossary:["citric-acid-cycle-intermediates"],heard:["citric acid cycle (TCA) intermediates","TCA cycle","Krebs cycle","tricarboxylic acid cycle","citric acid cycle","TCA intermediate"],warn:"BACKGROUND — A pathway is a different kind of object from a reaction. The…",see:["why-three-reactions","explain-to-biochemists","def-2-oxoglutarate","def-2-oxo-acid","def-transaminase","def-amino-donor-amino-acceptor","def-biochemicalreaction"],points:["Two of the graph's four 2-oxo acids sit in the cycle — `tacat:CHEBI_16810` (2-oxoglutarate) and `tacat:CHEBI_16452` (oxaloacetate). The model says nothing about it: no pathway, no cycle and no ordering between reactions, so this is why the reactions matter, not something the graph can be asked."]},Hc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"Cleland notation — what is it?",short:"the shorthand `bi-bi` belongs to — a naming scheme for multi-substrate kinetics",say:"W.W. Cleland's shorthand for multi-substrate enzyme mechanisms, introduced in 1963. Prefixes count the substrates and then the products — uni, bi, ter — so bi-bi means two in and two out. Substrates are lettered A and B, products P and Q; E is the free enzyme and F the substituted form carrying a group between stages. Mechanisms are drawn as a horizontal line with arrows for binding and release.",glossary:["cleland-notation"],heard:["Cleland notation","uni-uni","ter-ter","Cleland shorthand","Cleland diagram","W.W. Cleland"],warn:"BACKGROUND — The bi-bi counts substrates and products, not steps. A…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["ping-pong-mechanism","def-kineticmechanism","def-ping-pong-bi-bi","def-half-reaction","def-arity","def-literal"],points:['The literal `"ping-pong bi-bi"` carried on all three enzymes is Cleland\'s. It is a curated string: `tacat:kineticMechanism` is a functional data property with range `xsd:string`, so nothing in the model constrains the value to that notation or to any vocabulary.','`tacat:EC_2_6_1_1 tacat:kineticMechanism "ping-pong bi-bi"^^xsd:string`']},zc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"cofactor — what is it?",short:"a non-protein molecule an enzyme needs in order to work",say:"A non-protein chemical an enzyme requires for catalysis — a metal ion, or an organic molecule such as a vitamin derivative. Two kinds behave differently in an equation: a co-substrate is consumed and reappears as a product, while a prosthetic group stays bound to the enzyme and is regenerated within each catalytic cycle, so it never balances into the equation.",glossary:["cofactor"],heard:["cofactor","coenzyme","co-substrate","COFACTOR annotation","holoenzyme"],warn:"Not every cofactor is a prosthetic group. NAD+ in the control is a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["plp-cofactor","ping-pong-mechanism","def-plp","def-prosthetic-group","def-hascofactor","def-redox-cofactor","def-turnover-catalytic-cycle","def-ping-pong-bi-bi"],points:["`hasCofactor` is domained on `Enzyme`, not on `BiochemicalReaction`, because PLP is a prosthetic group. All three enzymes carry it to CHEBI:597326, and CQ04 answers mechanism and cofactor together — the placement is only correct because the mechanism is ping-pong bi-bi.","tacat:EC_2_6_1_2 tacat:hasCofactor tacat:CHEBI_597326 ."]},Fc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"commit SHA / source checksum — what is it?",short:"two hashes: which revision built the artefact, and which inputs went into it",say:"A commit SHA is git's hash over a commit — its tree, parents, author and message — so it names one exact state of a repository and cannot be reassigned to another. A source checksum is a hash over the input data itself. They answer different questions: which revision produced this, and are the inputs the ones I hold.",glossary:["commit-sha-and-checksum"],heard:["commit SHA / source checksum","CI_COMMIT_SHA","short SHA","sha256:"],warn:"The checksum normalises CRLF to LF before hashing. On raw bytes it was a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/provenance.py"},{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["weak-provenance","weak-reproducibility","def-reference-data-checksum","def-prov-o","def-graph-isomorphism-vs-byte-equality","def-container-registry-image-tag-latest","def-ci-cd"],points:["`add_provenance()` writes `prov:wasRevisionOf` a commit URL from `CI_COMMIT_SHA`, and `dcterms:identifier` a `sha256:` over `reference_data.py`. No wall-clock timestamp, which would break byte reproducibility. The commit reaches the image build as a `--build-arg`: a container build inherits no CI environment."]},Uc={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"common-mode failure — what is it?",short:"one shared cause makes several independent-looking checks wrong in the same direction",say:"A failure in which two or more things that should fail independently share a cause, so they go wrong together and a check comparing one against the other cannot see it. Redundancy buys safety only when the redundant paths can fail for different reasons; when both are generated from the same input the redundancy is decorative, and the suite is green for a reason unrelated to correctness.",glossary:["common-mode-failure"],heard:["common-mode failure","common mode failure","correlated failure","shared-cause failure"],warn:"Not a flaky test. A common-mode failure is silent and green — the suite is not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"test",rel:"verified-by",at:"tests/test_reproducibility.py::test_reference_data_checksum_is_independent_of_line_endings"}],see:["identifiers-verified","competency-questions","def-test-oracle","def-competency-question","def-regression-test","def-chebi-accepted-name","def-reference-data-checksum"],points:["Every question before CQ10 projected labels only, and label and identifier come from the same `reference_data` row, so a wrong identifier still produced a consistent answer. Measured: repointing all 15 identifier links to a fake `CHEBI_99999999` left nine of nine questions green. CQ10/CQ11 project the IRI itself.","`?entity rdfs:label ?label` cannot see a wrong IRI; `?entity a ?identifier` can"]},Gc={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"competency question — what is it?",short:"a question the ontology must answer, written before the model is built",say:"A question the ontology must be able to answer, written down before the model is built. It is the standard way to specify and validate an ontology: state the questions, then check that the finished model answers them. Because each one can be written as a query with an expected answer, the specification and the regression suite become the same artefact rather than two documents that drift apart.",glossary:["competency-question"],heard:["competency question","CQ","competency questions","CQ01","CQ10","CQ11"],warn:"Listing only the questions a model happens to answer is marketing — the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_competency_question"}],see:["competency-questions","def-neon-methodology","def-out-of-scope-questions","def-sparql","def-common-mode-failure","def-test-oracle","def-nfdi4cat"],points:["Eleven, in `src/tacat/queries/competency.py`, each carrying the question, its SPARQL, the expected answer set and a rationale; `tests/test_competency.py` runs them. CQ01-CQ04 are quoted verbatim from NFDI4Cat's own biocatalysis set, and `OUT_OF_SCOPE_QUESTIONS` records what the model deliberately cannot answer.","CQ03 — *what is the substrate specificity of enzyme X ?*"]},Wc={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"conjugate acid / base — what is it?",short:"two species differing by exactly one proton — different charge, different ChEBI id",say:"An acid and the species left after it donates a hydrogen ion form a conjugate pair: the same skeleton, one H+ and one unit of charge apart. Which member predominates depends on the pH and on the group's pKa. They are chemically distinct species with distinct formulae and charges, and chemical databases give them separate identifiers.",glossary:["conjugate-acid-base"],heard:["conjugate acid / base","conjugate acid","conjugate base","acid–base pair","deprotonated form"],warn:"Not the same as a tautomer pair. Conjugate acid and base differ by a proton…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"}],see:["microspecies","identifiers-verified","def-tautomer","def-zwitterion","def-chebi","def-dianion-and-neutral-parent","def-microspecies","def-plp"],points:["Why identifiers cannot be swapped for one another: ChEBI names the species it identifies, so `pyruvate` is CHEBI:15361 at charge −1, `L-aspartate(1−)` is CHEBI:29991, and the PLP dianion CHEBI:597326 is a different entity from its neutral parent CHEBI:18405. Every entity in `reference_data.py` carries its charge.","CHEBI:597326 pyridoxal 5'-phosphate(2−)  vs  CHEBI:18405 pyridoxal 5'-phosphate"]},Kc={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"conjunct — what is it?",short:"one of the terms joined by AND — every one of them must hold",say:"A conjunction is a logical AND, and each thing it joins is a conjunct. In a class definition written as an intersection, every conjunct is a separate condition an individual must satisfy, and failing any one is enough to fall outside the class. Owlready2 writes intersection as Python's `&`, so the conjuncts are its operands.",glossary:["conjunct"],heard:["conjunct","conjunction","logical AND"],warn:"Four conjuncts do not force four distinct participants. Each is an existential…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","signature-not-mechanism","def-defined-class","def-existential-restriction-and-v
