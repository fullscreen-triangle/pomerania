hon with Owlready2 in `src/tacat/ontology/schema.py`, populated from the curated constants in `reference_data.py`, reasoned over once at build time, and exported to `data/reactions.ttl` — one file carrying vocabulary, individuals and inferred types together."]},ah={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"OOPS! pitfall — what is it?",short:"A numbered defect from the OOPS! ontology-scanner catalogue, cited as the reason for a rule",say:"OOPS! (OntOlogy Pitfall Scanner!) is a web service that scans an ontology against a catalogue of numbered modelling pitfalls, from missing labels to a missing licence. The numbers are shared shorthand in ontology engineering: citing P08 says *terms lack annotations* without restating it. The catalogue is advisory — nothing in it is a formal error.",glossary:["oops-pitfall"],heard:["OOPS! pitfall","OOPS!","OntOlogy Pitfall Scanner!","P08","P38/P39","P41"],warn:"OOPS! itself is never run — not in CI, not anywhere in the submission. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"},{kind:"source",rel:"cited-as",at:"Poveda-Villalon et al., OOPS! pitfall catalogue"}],see:["why-both-owl-shacl","def-owl-ontology-header","def-spdx-licence-iri","def-ontology","def-shacl","def-obo-foundry-fp-005","def-dcat-ap-plus"],points:["Four numbers are cited as the justification for a rule. P08, missing annotations, on the two label rules at `data/shapes.ttl:176` and `:198`; P41, no licence declared, at `:316`; and P38/P39 for the missing `owl:versionIRI` that `builder.py` injects because Owlready2 will not carry it.",'sh:message  "Every entity needs a label (OOPS! P08)."@en']},sh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"opaque identifier — what is it?",short:"A local name carrying no meaning, so a label can be corrected without breaking data",say:"An opaque identifier is a local name chosen to say nothing — a zero-padded number rather than a word — so nothing downstream depends on reading it. The meaning lives in an `rdfs:label`, which can be corrected, retitled or translated without invalidating a single stored triple or query. The cost is that the raw IRI is unreadable to a human, which is why every such term carries a label.",glossary:["opaque-identifier"],heard:["opaque identifier","REACT_0000001","numeric local name","non-semantic IRI","voc4cat_0000123"],warn:"Opaqueness is about the local name, not the namespace.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["opaque-iris","def-voc4cat","def-prefixed-name-local-part","def-chebi","def-up-mnemonic","def-iri","def-w3id-org","def-dereference"],points:["Reactions are minted `REACT_0000001` and participant bridge nodes `PART_0000001_01` from a 1-based index in `population.py`, each with an `rdfs:label` — not `AlanineTransaminaseReaction`. The convention is copied from NFDI4Cat's own voc4cat (`w3id.org/nfdi4cat/voc4cat_0000123`).",'tacat:REACT_0000001 rdfs:label "aspartate transaminase reaction"']},nh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"open-world assumption — what is it?",short:"a fact not stated is unknown, not false — how OWL reasons, and why it cannot validate",say:"Under the open-world assumption a graph is a partial view of the world, so the absence of a statement means only that nobody said it. A reasoner may therefore never conclude “no” from silence: it derives what follows from what is asserted and nothing from what is missing. Databases assume the opposite — a missing row is a false fact — which is what makes a `NOT EXISTS` check meaningful there and meaningless here.",glossary:["open-world-assumption"],heard:["open-world assumption","OWA","open world"],warn:"Never say the reasoner proved the negative control is not a transamination. It…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"}],see:["open-world-caveat","why-both-owl-shacl","negative-control","def-owl","def-shacl","def-unique-name-assumption","def-reasoner","def-negative-control","def-entailment"],points:["This is why SHACL runs alongside OWL. HermiT not classifying the glutamate dehydrogenase control is a failure to prove membership, not a proof of non-membership; `data/shapes.ttl` supplies the closed-world “this value is required” checks OWL cannot make."]},oh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"OpenAPI — what is it?",short:"a machine-readable description of an HTTP API, from which docs and clients are generated",say:"A specification for describing an HTTP API as a machine-readable document — paths, parameters, request and response schemas — that tooling can turn into documentation, client libraries or contract tests. Formerly called Swagger. The document is the artefact; Swagger UI is one renderer of it, not the specification.",glossary:["openapi"],heard:["OpenAPI","Swagger","Swagger UI","/openapi.json","/docs"],warn:"Do not demo `/docs` offline. It fetches Swagger UI from a CDN and renders blank…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["sparql-protocol","def-fastapi","def-api","def-sparql-1-1-protocol","def-content-negotiation","def-liveness-probe","def-container-image"],points:["FastAPI derives the document from the route signatures and serves it at `/openapi.json`, with Swagger UI at `/docs`; the service index lists both. `/docs` is annotated as needing network, because FastAPI loads Swagger UI from a CDN — which is why the browser console at `/` is hand-written and self-contained.","`GET /openapi.json` — the generated document; `GET /docs` renders it"]},ih={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"orthologue / paralogue — what is it?",short:"two kinds of homologue — orthologues split by speciation, paralogues by duplication",say:"Homologous genes share an ancestor. Orthologues are the copies separated by a speciation event: the same gene in two organisms, usually with the same function. Paralogues are copies produced by duplication within one lineage and are free to diverge, which is how one genome comes to hold more than one enzyme for a reaction. Both relations are inferred from sequence, not observed directly.",glossary:["orthologue-paralogue"],heard:["orthologue / paralogue","ortholog","paralog","homologue","homology","gene duplication","speciation"],warn:"Sharing an EC number is not evidence of homology — unrelated proteins can…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["direction-alaa","def-p77434","def-isozyme-isoenzyme","def-alaa-alt1","def-gene-symbol-vs-protein-accession","def-ec-number","def-blast"],points:["Both sit on the alanine reaction alone. `P0A959` (AlaA) and `P77434` (AlaC) are *E. coli* paralogues — one genome, two of them — while human `P24298` is their orthologue. `P17174` and `P00505` (GOT1, GOT2) are a second paralogue pair. The graph records neither relation, only that each carries the EC number.","`P0A959` and `P77434` — paralogues. `P0A959` and `P24298` — orthologues."]},rh={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"OUT_OF_SCOPE_QUESTIONS — what is it?",short:"The five in-domain questions the model does not answer, each with what it would need",say:"A recorded list of questions inside the domain that an ontology deliberately does not answer, each paired with what the model would have to grow in order to answer it. Stating the boundary is part of the competency-question method: a specification listing only the questions a model happens to answer specifies nothing.",glossary:["out-of-scope-questions"],heard:["OUT_OF_SCOPE_QUESTIONS","out-of-scope questions","the recorded boundary"],warn:"Not five things the project cannot do. The organism entry says the answer…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","ask-lara-or-alongside","def-competency-question","def-federation","def-qudt-om-2","def-reac4cat","def-lara-larasuite","def-km-kcat-catalytic-efficiency"],points:["A tuple of (question, reason) pairs at `src/tacat/queries/competency.py:423`. Five entries: kinetic constants, expressing organism, pH and temperature optima, purification and immobilisation, directed-evolution strategy. The organism one is answerable today — by federation, not by adding to the graph.",'"which organism / strain is used for the production of enzyme X ?"']},ch={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"OWL 2 DL — what is it?",short:"the OWL 2 profile with decidable reasoning, bought by rules on how names may be used",say:"OWL 2 defines several profiles. OWL 2 DL is the largest one that stays decidable — reasoning always terminates, and reasoners are written against it. The price is restrictions on use: every entity must be declared, object and data properties may not be conflated, and one IRI names two kinds of thing only under OWL 2's limited *punning*. Break them and it is OWL 2 Full, on which no reasoner gives guarantees.",glossary:["owl-2-dl"],heard:["OWL 2 DL","OWL DL","DL profile","Description Logic profile","OWL 2 Full"],warn:"Staying inside DL is about declaration, not about being small. One undeclared…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["owl-vs-rdfs","build-time-reasoning","def-owl","def-description-logic","def-reasoner","def-hermit","def-object-property-vs-data-property","def-axiom"],points:["`_type_as` in `src/tacat/ontology/linking.py` writes two triples per external link, not one: the class membership, and `?external a owl:Class`. Without the second the artefact types an individual against an IRI nothing declares, which is outside OWL 2 DL.","`graph.add((node, RDF.type, target)); graph.add((target, RDF.type, OWL.Class))`"]},dh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"owl:AllDisjoint / disjointness — what is it?",short:"an axiom that two classes share no member, so a thing typed as both is a contradiction",say:"Disjointness states that classes have no individual in common: `owl:disjointWith` for a pair, `owl:AllDisjointClasses` for a set at once. It is one of the few OWL axioms that can make an ontology *inconsistent* rather than merely add inferences — assert an individual into two disjoint classes and the reasoner reports unsatisfiability, not a warning. It is also what makes a class discriminate at all.",glossary:["owl-alldisjoint-disjointness"],heard:["owl:AllDisjoint / disjointness","owl:AllDisjointClasses","owl:disjointWith","disjoint classes"],warn:"Do not defend the amino-acid/2-oxo-acid disjointness as chemistry. It keeps…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["disjointness-axiom","omega-transaminase","defined-class","def-axiom","def-alldifferent","def-defined-class","def-chemicalentity","def-reasoner","def-omega-transaminase-vs-alpha-transaminase"],points:["`src/tacat/ontology/schema.py` asserts two: the four top classes pairwise, and `TwoOxoAcid` against `AminoAcid`. The second is false as a general claim about chemistry — an ω-amino 2-oxo acid is both — and is volunteered as a weakness; the next step named is a local closure over the nine curated entities.","`AllDisjoint([TwoOxoAcid, AminoAcid])`"]},lh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"owl:imports — what is it?",short:"an axiom pulling another ontology's axioms into yours, so a reasoner treats both as one",say:"`owl:imports` sits on an ontology header and names another ontology whose axioms become part of this one for reasoning. It is transitive and all-or-nothing: importing a vocabulary brings its whole hierarchy, and the reasoner then works over the union. It is the standard way to reuse external terms *as premises* rather than merely as identifiers.",glossary:["owl-imports"],heard:["owl:imports","imports","ontology import","import closure"],warn:"NOT USED HERE — Reusing an IRI is not importing it. Nothing ChEBI asserts about…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["mint-vs-reuse","build-time-reasoning","def-owl","def-obo-foundry-fp-005","def-reasoner","def-chebi","def-owl-ontology-header","def-shacl"],points:["There is none. The graph reuses ChEBI, Rhea, UniProt and SBO IRIs and imports nothing, so “alanine is an amino acid” is hand-asserted from `reference_data.py`, not derived. Importing ChEBI means tens of thousands of classes for nine molecules; the alternative named is a build-time SHACL check."]},hh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"owl:NamedIndividual — what is it?",short:"the declaration marking an IRI as an individual rather than a class or a property",say:"OWL 2 DL requires every entity IRI to be declared, and mostly keeps the vocabularies apart — though it allows *punning*, one IRI naming both a class and an individual. `owl:NamedIndividual` is that declaration for an individual. It carries no information about what the individual *is*; a tool reading the graph uses it to tell an individual apart from a class whose IRI would otherwise look the same.",glossary:["owl-namedindividual"],heard:["owl:NamedIndividual","NamedIndividual","individual declaration"],warn:"It is bookkeeping, not meaning. Reading it aloud as a type of the thing — “this…",see:["def-owl-2-dl","def-a-box","def-universal-vs-particular","def-turtle","def-owlready2","def-iri"],points:["Owlready2 writes it on every individual it exports, so each node in `data/reactions.ttl` carries `owl:NamedIndividual` beside its real types — the local class and the external ChEBI, Rhea, SBO or UniProt class it reuses. It is one of the six triples the RDF primer walks a reader through.","`tacat:REACT_0000001 a rhea:21824, owl:NamedIndividual, tacat:BiochemicalReaction, tacat:TransaminationReaction .`"]},fh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"owl:versionIRI / owl:Ontology header — what is it?",short:"the triples declaring a graph to be an ontology and naming this one version of it",say:"An ontology header is a subject typed `owl:Ontology` carrying the graph's own metadata — title, licence, `owl:versionInfo`, `owl:versionIRI`. The ontology IRI names the ontology across all its versions; the version IRI names one release, so a consumer can pin to it. A well-formed OWL document has exactly one such subject: where there are several, tools pick one and which one is undefined.",glossary:["owl-ontology-header"],heard:["owl:versionIRI / owl:Ontology header","owl:Ontology","versionIRI","owl:versionInfo","ontology header"],warn:"There is a `versionIRI` and no release process behind it — no versioned…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["weak-namespace","def-owl","def-oops-pitfall","def-w3id-org","def-dereference","def-world-http-inferrences","def-owlready2"],points:["`builder.py` injects the header after flattening, because Owlready2 will not carry `owl:versionIRI` — it is an ontology property, not an annotation property. Flattening also exported Owlready2's `http://anonymous` and `http://inferrences` headers, so the artefact declared three and tooling picked the wrong one.","`<https://w3id.org/bitspark/tacat> owl:versionIRI <https://w3id.org/bitspark/tacat/0.1.0/> .`"]},ph={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"owl:sameAs — what is it?",short:"an assertion that two IRIs denote one and the same individual",say:"`owl:sameAs` says two names refer to the same thing. It is an equivalence relation with full substitution: whatever a reasoner holds of one end it then holds of the other, in both directions. It is a claim about individuals — not about classes, and not about two terms being merely similar — and it is the strongest identity statement OWL offers.",glossary:["owl-sameas"],heard:["owl:sameAs","sameAs","identity link","same individual"],warn:"NOT USED HERE — `owl:sameAs` propagates what a reasoner already holds; it does…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["exactmatch-vs-sameas","mint-vs-reuse","def-skos-mapping-property","def-skos","def-iri","def-reasoner","def-cardinality","def-shacl","def-unique-name-assumption"],points:["Rejected as the external-identifier link: it would license a reasoner to pull everything ChEBI asserts into this graph. `rdf:type` is used instead — the external term is a class, the local node an instance. It survives in `validation.py` as what a reasoner infers from `owl:maxCardinality 1` where SHACL fails."]},$h={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"OWL — what is it?",short:"Web Ontology Language — the description-logic layer above RDF that a reasoner computes over",say:"OWL is the W3C standard for writing ontologies as RDF, with a formal semantics taken from description logic. Beyond RDFS's subclass and domain/range it adds class expressions — intersection, restriction on a property, cardinality, disjointness, equivalence — which is what lets a class be *defined* rather than merely declared. Every construct is triples, so an OWL ontology answers SPARQL like any other graph.",glossary:["owl"],heard:["OWL","Web Ontology Language","OWL 2","owl:"],warn:"OWL is not a schema language. Its axioms are premises for inference, never…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["owl-vs-rdfs","build-time-reasoning","def-owl-2-dl","def-defined-class","def-rdfs","def-shacl","def-rdf","def-description-logic","def-reasoner"],points:["The vocabulary is written with Owlready2's Python DSL and reasoned with HermiT in the Docker builder stage. The exported `data/reactions.ttl` carries the axioms and the materialised inferences together, so the runtime image serves inferred types with no reasoner and no Java in the request path."]},uh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"Owlready2 — what is it?",short:"the Python library used to author the OWL ontology and drive HermiT",say:"A Python library for writing OWL ontologies as Python classes and for driving a description-logic reasoner over them. Classes, properties, restrictions and individuals are declared in Python rather than in Turtle or OWL/XML; the library serialises them, runs a bundled Java reasoner as a subprocess, and reads the inferred hierarchy back onto the same objects.",glossary:["owlready2"],heard:["Owlready2","owlready2.Ontology","owlready"],warn:"It keeps everything in a `World`, and reasoner output lands in a separate…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"}],see:["build-time-reasoning","def-hermit","def-world-http-inferrences","def-jvm-java-runtime","def-owl","def-reasoner","def-pellet-elk"],points:["Build-time only, in `src/tacat/ontology/`: `schema.py` declares the T-Box, `population.py` the individuals, and `inference.py` calls `sync_reasoner_hermit`. The runtime image imports neither it nor a JVM — it serves the Turtle the builder wrote.","`sync_reasoner_hermit(onto.world, infer_property_values=True, debug=0)`"]},yh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"oxaloacetate instability — what is it?",short:"oxaloacetate decarboxylates to pyruvate on standing — a bench problem, not a graph one",say:"Oxaloacetate is unstable in solution: the β-keto acid arrangement lets it lose CO2 without an enzyme, giving pyruvate, at a rate that depends on pH, temperature and trace metals. Solutions are therefore made fresh and kept cold, and assays that produce or consume it are read continuously rather than after an incubation.",glossary:["oxaloacetate-instability"],heard:["oxaloacetate instability","spontaneous decarboxylation","OAA decarboxylation","fresh oxaloacetate"],warn:"BACKGROUND — Do not let it become a claim about the graph. The decay is…",see:["def-oxaloacetate","def-pyruvate","def-coupled-enzyme-assay","def-2-oxo-acid","def-km-kcat-catalytic-efficiency"],points:["Nothing in the submission can express it. Oxaloacetate is a product of `REACT_0000001` and a `tacat:TwoOxoAcid` individual; there is no property for stability, conditions or half-life, and no place one could go — the same scope boundary that leaves out kinetics and units."]},mh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"oxaloacetate — what is it?",short:"the product of aspartate transaminase — ChEBI:16452, C4H2O5, charge −2",say:"The four-carbon 2-oxo acid paired with aspartate, and the molecule that accepts acetyl-CoA at the start of every turn of the citric acid cycle. Transaminating aspartate produces it, which is why that reaction is the hinge between nitrogen metabolism and central carbon metabolism. Both carboxyls are deprotonated at physiological pH, so the species carried is the dianion.",glossary:["oxaloacetate"],heard:["oxaloacetate","CHEBI:16452","OAA","oxaloacetate(2−)","oxaloacetic acid","oxalacetate"],warn:"The (2−) suffix uses U+2212 MINUS SIGN, so an ASCII-hyphen version of the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:16452"}],see:["identifiers-verified","minus-sign","why-three-reactions","def-2-oxo-acid","def-oxaloacetate-instability","def-minus-sign-vs-hyphen","def-l-aspartate","def-citric-acid-cycle-intermediates","def-alt-ast"],points:["`OXALOACETATE`, CHEBI:16452, C4H2O5, charge −2 — the product of `REACT_0000001`, typed `tacat:TwoOxoAcid`, and one of the three entities at charge −2 along with 2-oxoglutarate and the PLP dianion. Its ChEBI accepted name is `oxaloacetate(2−)`; Rhea prints the bare form.",'`ChemicalEntity(16452, "oxaloacetate(2−)", "oxaloacetate", "C4H2O5", -2)`']},gh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"P00505 (GOT2) — what is it?",short:"human mitochondrial aspartate transaminase, and the isozyme partner of cytosolic GOT1",say:"`P00505` is the UniProt accession for human aspartate aminotransferase, mitochondrial — entry name `AATM_HUMAN`, gene symbol `GOT2`. It catalyses EC 2.6.1.1, the same activity as cytosolic GOT1, in a different compartment, and the two together run the malate-aspartate shuttle. UniProt also annotates it with EC 2.6.1.7, kynurenine aminotransferase.",glossary:["p00505"],heard:["P00505 (GOT2)","GOT2","AATM_HUMAN","mitochondrial AST","mAspAT","KYAT4"],warn:"GOT2 is not another name for GOT1. Different gene, different sequence…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_competency_question"},{kind:"source",rel:"identified-as",at:"UniProt:P00505"}],see:["weak-got1","def-got1-p17174","def-isozyme-isoenzyme","def-p00509","def-catalytic-promiscuity-secondary-activity","def-up-mnemonic","def-alt-ast"],points:["Asserted as `uniprot:P00505 up:enzyme ec:2.6.1.1` and carried third in `ASPARTATE_TRANSAMINASE.uniprot`. It is the concrete case behind the isozyme point, and the reason the network test's docstring says a subset is expected: UniProt records EC 2.6.1.7 for it and the project does not claim that activity.","`uniprot:P00505 up:enzyme ec:2.6.1.1 .`"]},wh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"P00509 (aspC) — what is it?",short:"the E. coli aspartate transaminase, and the accession the reference data calls the cleanest join",say:"`P00509` is the UniProt accession for aspartate aminotransferase of *Escherichia coli* K12 — entry name `AAT_ECOLI`, gene `aspC`, EC 2.6.1.1. Bacterial entries of this kind tend to be annotated narrowly: one catalytic-activity block, one reaction cited, no secondary activities. That makes them far easier to join against than a human entry carrying several.",glossary:["p00509"],heard:["P00509 (aspC)","aspC","AAT_ECOLI","AspAT","E. coli aspartate transaminase","Transaminase A"],warn:"*aspC* is a gene symbol, in a comment only — the graph carries `P00509`. And…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"UniProt:P00509"}],see:["federated-payoff","mint-vs-reuse","def-accession","def-gene-symbol-vs-protein-accession","def-p00505","def-up-mnemonic","def-rhea-master-and-directional-children","def-swiss-prot-trembl"],points:["First in `ASPARTATE_TRANSAMINASE.uniprot`, singled out by an inline comment as *the cleanest join target: a single catalytic block citing RHEA:21824 only. The human entries carry several activities.* The accession held up to demonstrate the join is the one with the least to explain.","`uniprot:P00509 up:enzyme ec:2.6.1.1 .`"]},bh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"P13221 (rat Got1) — what is it?",short:"the rat cytosolic aspartate transaminase — the second accession on the cysteine reaction",say:"`P13221` is the UniProt accession for cytoplasmic aspartate aminotransferase of *Rattus norvegicus* — entry name `AATC_RAT`, gene `Got1`. UniProt annotates it with both EC 2.6.1.1 and EC 2.6.1.3 and lists *cysteine aminotransferase, cytoplasmic* among its alternative names. It is the rat counterpart of human GOT1, carrying the same pair of activities.",glossary:["p13221"],heard:["P13221 (rat Got1)","AATC_RAT","rat GOT1","cysteine aminotransferase","cCAT","Got1"],warn:"Not a dedicated cysteine transaminase. Like `P17174` it is primarily an…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"UniProt:P13221"}],see:["weak-got1","why-three-reactions","def-got1-p17174","def-catalytic-promiscuity-secondary-activity","def-orthologue-paralogue","def-up-mnemonic","def-ec-number","def-up-enzyme"],points:['The second accession on the cysteine reaction, `uniprot=("P17174", "P13221")`, and the only one in the graph with no explanatory comment beside it in `reference_data.py`. It sits next to `P17174` rather than replacing it because it is the same protein in another organism, not a distinct cysteine transaminase.',"`uniprot:P13221 up:enzyme ec:2.6.1.3 .`"]},vh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"P77434 (alaC) — what is it?",short:"the second E. coli alanine transaminase — AlaA's paralogue, third on the alanine reaction",say:"`P77434` is the UniProt accession for glutamate--pyruvate aminotransferase AlaC of *Escherichia coli* K12 — entry name `ALAC_ECOLI`, gene `alaC`, formerly called `yfdZ`. It catalyses EC 2.6.1.2, the same activity as AlaA (`P0A959`): *E. coli* carries more than one alanine transaminase, so the two are paralogues rather than competing annotations of one protein.",glossary:["p77434"],heard:["P77434 (alaC)","alaC","ALAC_ECOLI","yfdZ","AlaC","E. coli alanine transaminase"],warn:"Do not read `alaC` as `avtA`. AvtA is *E. coli*'s valine-pyruvate…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"UniProt:P77434"}],see:["direction-alaa","def-gene-symbol-vs-protein-accession","def-accession","def-alaa-alt1","def-orthologue-paralogue","def-up-mnemonic","def-ec-number"],points:["Third in `ALANINE_TRANSAMINASE.uniprot`, after human ALT1 and *E. coli* AlaA, and unexplained in the tree — the comment there discusses `P0A959` only. Its presence is what puts both homology relations on one reaction: a paralogue pair inside *E. coli*, and an orthologue across to human.","`uniprot:P77434 up:enzyme ec:2.6.1.2 .`"]},_h={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"parametrised test — what is it?",short:"one test function run once per case, with the cases supplied as data",say:"One test function run once per case, with the cases given as a list rather than written out as separate functions. Each case gets its own name and its own pass or fail, so a failure identifies the input that broke it without a debugger, and adding a case is a line in a list. In pytest this is the `@pytest.mark.parametrize` decorator.",glossary:["parametrised-test"],heard:["parametrised test","@pytest.mark.parametrize","parameterized test","table-driven test","ids="],warn:"The `why` string is a failure message, not an assertion. Nothing checks *which*…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_query_form"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_competency_question"}],see:["def-pytest","def-property-based-test","def-mutation-testing","def-pytest-fixture","def-shacl","def-competency-question","def-pytest-marker"],points:["It carries the twelve negative SHACL fixtures in `tests/test_shapes.py`, each with an explicit `ids=` label and a `why` string printed if the assertion trips. The same decorator drives the competency-question tests and the policy tests over allowed and refused SERVICE queries.",'`@pytest.mark.parametrize(("turtle", "why"), [...], ids=["no_role", "blank_node", ...])`']},kh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"ParticipantRole — what is it?",short:"the class whose individuals are the roles — reactant, product — a bridge node carries",say:"A role class models the part a thing plays as a first-class entity rather than as a string on the relation. Its members are named individuals, so they can be typed, linked to a controlled vocabulary and joined on — two datasets can check that they mean the same role instead of hoping two strings match.",glossary:["participantrole"],heard:["ParticipantRole","tacat:ParticipantRole","tacat:Reactant","tacat:Product","role individual"],warn:"They are individuals but they are vocabulary; moving them to the A-Box breaks…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["what-the-role-is","defined-class","def-sbo","def-alldifferent","def-reactionparticipant","def-hasvalue-restriction","def-t-box","def-defined-class"],points:["`schema.py` declares `ParticipantRole` with two individuals, `Reactant` and `Product`, in the T-Box rather than with the data: the defined class restricts on them by value, so they must exist when it is declared. Each is typed with its SBO class during linking — SBO:0000010, SBO:0000011 — not given an SBO string.","`tacat:Reactant a sbo:SBO_0000010, owl:NamedIndividual, tacat:ParticipantRole .`"]},qh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"Pellet / ELK — what is it?",short:"the other OWL reasoners a reader will meet; neither is used here",say:"Two other OWL reasoners. Pellet is a tableau reasoner for OWL 2 DL, the same expressive family HermiT covers, and reaches the same conclusions on an ontology both accept. ELK is a consequence-based reasoner for the OWL 2 EL profile: far faster, and standard for very large biomedical ontologies, but it ignores axioms outside EL rather than refusing them.",glossary:["pellet-elk"],heard:["Pellet / ELK","Pellet","ELK","sync_reasoner_pellet","OWL 2 EL reasoner"],warn:'BACKGROUND — "Another reasoner would answer differently" is not a defence of a…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"}],see:["def-hermit","def-reasoner","def-owlready2","def-owl-2-dl","def-description-logic","def-deductive-closure"],points:["Neither is used. Owlready2 bundles HermiT and Pellet; `src/tacat/ontology/inference.py` calls `sync_reasoner_hermit`. ELK could not serve this ontology anyway: `schema.py` declares `participatingEntity`, `participantRole` and `hasReversibility` as functional OBJECT properties, which the EL profile excludes.","`sync_reasoner_pellet()` — Owlready2's other entry point, not called here"]},Ih={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"PEP 735 dependency groups — what is it?",short:"named groups of development dependencies in pyproject.toml, not shipped with the wheel",say:"A Python standard for declaring named sets of development dependencies in `pyproject.toml`, under a top-level `[dependency-groups]` table. Unlike `[project.optional-dependencies]` — extras, which are published with the distribution and installable by anything that depends on it — groups are local to the source tree and never appear in the built wheel. Installers select them explicitly.",glossary:["pep-735-dependency-groups"],heard:["PEP 735 dependency groups","dependency-groups table","--all-groups","docs group"],warn:"A group is not an extra. `pip install tacat[dev]` does not work and is not…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["def-dependency-group-no-dev","def-uv","def-lock-file","def-multi-stage-build","def-build-backend","def-ci-cd"],points:["`pyproject.toml` declares `dev` (pytest, pytest-cov, pytest-xdist, httpx, ruff, mypy, bandit, pre-commit) and `docs` (sphinx, myst-parser, sphinx-autobuild). CI installs `uv sync --frozen --all-groups`; the Dockerfile installs `--no-dev`. The table's own comment records why the form was chosen.",'`[dependency-groups]` with `dev = ["pytest>=8.0", ...]`; `uv sync --no-dev` omits it']},Ah={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"pH 7.3 (the Rhea reference pH) — what is it?",short:"the pH Rhea balances its equations at, which decides which ChEBI entry each participant gets",say:"Rhea writes every equation for the major microspecies present at pH 7.3, a stand-in for conditions inside a cell. That one convention fixes which ChEBI entry names each participant: whether a carboxyl is deprotonated, whether an amino group holds its extra proton, and so what charge the species carries and what identifier it is given. At a different reference pH a different set of identifiers would be correct.",glossary:["ph-7-3"],heard:["pH 7.3 (the Rhea reference pH)","pH 7.3","physiological pH","reference pH","Rhea reference pH","major microspecies at pH 7.3"],warn:"Not 7.4. The blood-plasma figure a biochemist reaches for is 7.4; the database…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:57972"}],see:["microspecies","identifiers-verified","def-rhea","def-pka","def-microspecies","def-zwitterion","def-conjugate-acid-base","def-dianion-and-neutral-parent"],points:["Why every charge in `reference_data.py` is what it is: L-alanine is the zwitterion CHEBI:57972, the cofactor the dianion CHEBI:597326, L-aspartate (1−). The number itself appears nowhere in the submitted tree — the identifiers follow the convention, but nothing in the repository records it.",'`ChemicalEntity(57972, "L-alanine zwitterion", "L-alanine", "C3H7NO2", 0)` — the species that predominates at 7.3']},Ch={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ping-pong bi-bi — what is it?",short:"two substrates in, two products out, the first product leaving before the second binds",say:"A two-substrate kinetic mechanism. *Bi-bi* means two substrates in and two products out; *ping-pong* means the first product departs before the second substrate arrives, so the two substrates are never on the enzyme together. Between the halves the enzyme sits in a modified form carrying the transferred group. Contrast a ternary-complex mechanism, where both substrates bind before anything leaves.",glossary:["ping-pong-bi-bi"],heard:["ping-pong bi-bi","ping-pong mechanism","substituted-enzyme mechanism","bi-bi","double displacement"],warn:"Curated, never inferred. The defined class is a net-reaction pattern over…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["ping-pong-mechanism","plp-cofactor","def-pmp","def-kineticmechanism","def-sequential-mechanism-ternary-complex","def-half-reaction","def-plp","def-hascofactor","def-signature"],points:["Carried as a curated string on the enzyme: `kineticMechanism` is a functional data property domained on `Enzyme`, and `reference_data.PING_PONG_BI_BI` holds its single value. It is the reason `hasCofactor` sits on the enzyme rather than on the reaction.",'`tacat:EC_2_6_1_2 tacat:kineticMechanism "ping-pong bi-bi"^^xsd:string`']},xh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"pKa — what is it?",short:"the pH at which one ionisable group is half deprotonated",say:'The pH at which an ionisable group is half protonated and half not — the negative logarithm of its acid dissociation constant. Below its pKa the protonated form predominates, above it the deprotonated one, and every ionisable group in a molecule has its own value. It is what turns "the major species at this pH" from an assertion into a calculation.',glossary:["pka"],heard:["pKa","pKa value","acid dissociation constant","Ka","side-chain pKa"],warn:"BACKGROUND — A pKa belongs to a group, not to a molecule. An amino acid has at…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["microspecies","def-ph-7-3","def-conjugate-acid-base","def-zwitterion","def-microspecies","def-thiol-sulfanyl-group","def-dianion-and-neutral-parent"],points:["The reasoning behind every charge in `reference_data.py`, though no pKa is recorded there: an α-carboxyl near 2 and an α-amino near 9.5 leave both groups charged at pH 7.3, which is a zwitterion; aspartate's side chain near 3.9 adds the further negative that makes it (1−).","cysteine's thiol pKa ≈ 8.3, so at pH 7.3 it is mostly protonated and CHEBI:35235 is charge 0"]},Th={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"PLP fold types (fold type I) — what is it?",short:"the structural families PLP enzymes fall into — transaminases sit in types I and IV",say:"PLP-dependent enzymes arose several times and are grouped by protein fold rather than by reaction: seven fold types, of which type I, the aspartate aminotransferase family, is much the largest. The fold determines how the cofactor is held and which face of it the chemistry happens on, so two enzymes of one fold type share an architecture even when they catalyse different reactions.",glossary:["plp-fold-types"],heard:["PLP fold types (fold type I)","fold type I","fold type IV","PLP fold type","aspartate aminotransferase family"],warn:"BACKGROUND — Fold type is neither EC class nor mechanism. One fold type spans…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["omega-transaminase","plp-cofactor","def-plp-reaction-families","def-omega-transaminase-vs-alpha-transaminase","def-plp","def-transaminase","def-active-site","def-enzyme"],points:["The structural axis of the α-versus-ω question. All three modelled enzymes are fold-type-I α-transaminases, while the (R)-selective amine transaminases industry uses are fold type IV. Nothing in the graph records fold: an enzyme carries an EC number, a mechanism string and a cofactor, and no structural class."]},Eh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"PLP reaction families — what is it?",short:"transamination is one of several reactions PLP runs from the same intermediate",say:"From one carbanion intermediate, PLP enzymes can transaminate, decarboxylate, racemise, or eliminate and replace a group at the β or γ position. Which of them happens is decided by the protein — by which bond at the α-carbon it holds perpendicular to the cofactor ring — and not by the cofactor, which is the same molecule in every case.",glossary:["plp-reaction-families"],heard:["PLP reaction families","decarboxylation","racemisation","β-elimination","beta-elimination","PLP-dependent reactions","what else PLP does"],warn:'BACKGROUND — PLP does not choose the reaction. "PLP catalyses transamination"…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["plp-cofactor","defined-class","def-plp-fold-types","def-plp","def-defined-class","def-transaminationreaction","def-hascofactor","def-half-reaction"],points:["Why the defined class is written over participant roles, not over PLP's presence: a decarboxylase carries the same cofactor and would be swept in by any definition keyed on it. The `TransaminationReaction` docstring says as much — the conjuncts constrain neither atom transfer, mass balance nor PLP dependence."]},Rh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"PLP — what is it?",short:"pyridoxal 5'-phosphate, the vitamin-B6 cofactor all three enzymes require",say:"Pyridoxal 5'-phosphate, the catalytically active derivative of vitamin B6 and the cofactor of nearly every enzyme that moves an amino group. It works through a Schiff base that stabilises the carbanion intermediate. Across one transamination it is aminated to PMP and then returned to PLP, so it is regenerated inside the catalytic cycle rather than consumed by the reaction.",glossary:["plp"],heard:["PLP","pyridoxal 5'-phosphate","pyridoxal phosphate","vitamin B6 cofactor","CHEBI:597326","PLP -> PMP -> PLP"],warn:"Model PLP as a fourth substrate and every check still passes — the graph…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_plp_is_not_a_reaction_participant"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"}],see:["plp-cofactor","ping-pong-mechanism","def-cofactor","def-prosthetic-group","def-pmp","def-hascofactor","def-dianion-and-neutral-parent","def-ping-pong-bi-bi"],points:["CHEBI:597326 — the dianion, which is what UniProt’s `COFACTOR` line cites. `hasCofactor` is domained on `Enzyme`, never on `BiochemicalReaction`, so PLP is never a participant: Rhea’s equations for all three reactions have four participants and none is PLP.","`tacat:EC_2_6_1_2 tacat:hasCofactor tacat:CHEBI_597326`, itself typed `a obo:CHEBI_597326`"]},Sh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"PMP — what is it?",short:"the aminated form of PLP — the cofactor state carrying the amino group between half-reactions",say:"PMP is pyridoxamine 5'-phosphate, the amine form of the vitamin-B6 cofactor: PLP's aldehyde group replaced by an aminomethyl group. In a ping-pong bi-bi transamination the donor amino acid hands its amino group to PLP, converting it to PMP; the acceptor 2-oxo acid then takes that group back, regenerating PLP. It is the carrier state of a cofactor, not a participant in the reaction.",glossary:["pmp"],heard:["PMP","pyridoxamine 5'-phosphate","pyridoxamine phosphate","the aminated cofactor"],warn:"PMP is not modelled. ChEBI does identify it (CHEBI:18335; CHEBI:58451 for the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_plp_is_not_a_reaction_participant"}],see:["plp-cofactor","ping-pong-mechanism","def-ping-pong-bi-bi","def-half-reaction","def-cofactor","def-plp","def-prosthetic-group","def-hascofactor"],points:["The `PLP -> PMP -> PLP` cycle is the stated reason `hasCofactor` is domained on `Enzyme` rather than on `BiochemicalReaction`. It appears in the `schema.py` docstring, in `reference_data.py`, in CQ04's rationale and in the regression test — always as prose.","half 1: `PLP + donor amino acid -> PMP + 2-oxo acid`"]},Oh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"PolicyViolation — what is it?",short:"the domain error the query rules raise, carrying a coarse kind the HTTP layer maps",say:"An exception that carries a coarse category alongside its message, so a transport layer can pick a status code without parsing prose. The pattern keeps a rule from knowing the protocol it is enforced over: the layer that decides what may be asked raises, and the layer that speaks HTTP maps. It is what lets the rules be tested with no client at all.",glossary:["policyviolation"],heard:["PolicyViolation","violation.kind","_POLICY_STATUS","service-refused","not-read-only"],warn:"All four kinds map to 400 today, so the split is a seam rather than a behaviour…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_update_is_refused_with_a_reason"}],see:["why-own-policy-layer","weak-readonly","def-seam","def-ssrf","def-querypolicy","def-query-form","def-notacceptable-406","def-whitelist-vs-keyword-blacklist"],points:["`PolicyViolation(reason, kind=...)` in `src/tacat/api/policy.py`, which imports no web framework. Four kinds are raised — `empty`, `not-read-only`, `service-refused`, `too-large` — and `_POLICY_STATUS` in `app.py` maps them. `reason` becomes the HTTP `detail` the caller reads.",'`raise PolicyViolation("...", kind="service-refused")` -> 400']},Ph={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"prefixed name / local part — what is it?",short:"prefix label plus local part — `tacat:REACT_0000001` — the abbreviated way to write an IRI",say:"Turtle and SPARQL let an IRI be written as a declared prefix label, a colon and a *local part*, expanded by plain string concatenation. The local part's grammar is restricted: `/`, `#`, `(`, `)` and several other characters must be backslash-escaped, and an unescaped one makes the name invalid rather than merely odd. The prefix is an import alias with no meaning of its own — the expansion is the identifier.",glossary:["prefixed-name-local-part"],heard:["prefixed name / local part","PN_LOCAL","qname","abbreviated name","prefix label","prefixed IRI"],warn:"A prefix label is not a namespace. Two files may bind the same label to…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/namespaces.py"}],see:["scanner-guard-failures","sparql-protocol","def-curie","def-turtle","def-iriref","def-sparql","def-iri","def-scanner-tokeniser"],points:["Two defects turn on the local part. v0's landing page advertised `res:reaction/ALT`, which does not parse. And the scanner in `policy.py` consumes a prefixed name whole before testing for `PREFIX`: resuming on the local part read `ex:service` as `SERVICE`, and `ex:prefix` swallowed a following `SERVICE` clause.","`tacat:REACT_0000001` expands to `https://w3id.org/bitspark/tacat/REACT_0000001`"]},jh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"primitive class — what is it?",short:"a class stated only by what follows from membership, so membership must be asserted",say:"A primitive class carries necessary conditions and no sufficient ones: `rdfs:subClassOf` says that *if* something is a member *then* it satisfies the superclass, and gives no way to determine membership. A reasoner can propagate what follows from being one, but can never conclude that an individual is one. Most classes in most ontologies are primitive, and membership arrives by hand or from a loop in the loader.",glossary:["primitive-class"],heard:["primitive class","partial class","necessary-only class","asserted class"],warn:"Primitive is not lesser. The mistake is expecting classification from it: a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","owl-vs-rdfs","def-defined-class","def-necessary-and-sufficient-conditions","def-subsumption","def-reasoner","def-rdfs","def-chemicalentity"],points:["Every class in `schema.py` except `TransaminationReaction` is primitive — `AminoAcid`, `TwoOxoAcid`, `Enzyme`, `ReactionParticipant`. Which molecules are amino acids and which are 2-oxo acids is therefore asserted from the curated list in `reference_data.py`: the hand-asserted premise the open items name.","`class TwoOxoAcid(ChemicalEntity)` — subclass only, no `equivalent_to`"]},Lh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"product inhibition — what is it?",short:"a product slowing the enzyme that made it by rebinding to one of its forms",say:"A reaction's own product binds the enzyme and competes with a substrate for one of its forms, so the rate falls as conversion rises. Which product is competitive against which substrate differs between ping-pong and ternary-complex mechanisms, so the pattern is a second line of evidence for a mechanism, independent of the double-reciprocal plots.",glossary:["product-inhibition"],heard:["product inhibition","inhibition by product","product inhibition pattern","product build-up"],warn:"BACKGROUND — Neither modelled nor derivable here. The mechanism string is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["ping-pong-mechanism","signature-not-mechanism","def-equilibrium","def-ping-pong-bi-bi","def-sequential-mechanism-ternary-complex","def-kineticmechanism","def-km-kcat-catalytic-efficiency","def-enzyme-immobilisation"],points:['Why a transaminase stalls short of completion: both products here are substrates of the reverse direction, and with an equilibrium constant near one the reaction settles at a mixture. The graph asserts `kineticMechanism "ping-pong bi-bi"` as a curated string and carries no kinetics, so none of it is derivable.']},Nh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"property-based test — what is it?",short:"asserts an invariant that must hold over every case, instead of one input against one answer",say:"A test that states a property the data or the code must satisfy no matter which case you look at — mass balances, a round-trip returns the original, a sorted list is ordered — and checks it across many cases rather than pinning one input to one expected output. The property is written once; the cases come from a generator or from the whole data set.",glossary:["property-based-test"],heard:["property-based test","invariant test","property test","mass and charge balance"],warn:"An invariant over the values says nothing about whether the values belong to…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["mistake-owned","identifiers-verified","def-common-mode-failure","def-mass-balance-charge-balance","def-parametrised-test","def-test-oracle","def-microspecies","def-regression-test"],points:["Mass and charge balance are presented as this project's property-based test. The submitted tree does not contain one: `reference_data.py` carries a `formula` and a `charge` per species, and nothing sums them. The v0 predecessor did test it, and it passed while every identifier was wrong."]},Dh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"property graph (Neo4j, Cypher) — what is it?",short:"a graph model where edges are objects carrying their own key/value properties",say:"In a property graph both nodes and *relationships* carry labels and arbitrary key/value properties, so a fact about an edge — a weight, a role, a timestamp — lives on the edge. Neo4j is the best-known implementation and Cypher its query language. Identifiers are local to one database and a relationship type means whatever its team decided, so joining two property graphs is an integration project rather than a merge.",glossary:["property-graph"],heard:["property graph (Neo4j, Cypher)","Neo4j","Cypher","labelled property graph","LPG"],warn:"NOT USED HERE — Do not present RDF's lack of edge properties as a virtue in…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","federated-payoff","def-rdf","def-graph","def-n-ary-relation","def-bridge-node","def-reactionparticipant","def-iri","def-fair"],points:["Not used, and the contrast is the argument for RDF. A triple has three slots and no attachment point on the predicate, which forces the bridge node `ReactionParticipant` to carry role and coefficient. RDF buys back that every node and predicate is a globally resolvable IRI, so this graph joins live against Rhea.","Cypher `-[:HAS_PARTICIPANT {role: 'reactant', coefficient: 1.0}]->` has no direct RDF form"]},Bh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"property path — what is it?",short:"multi-hop traversal written into one SPARQL triple pattern, with regex-like operators",say:"A property path puts a whole route between two nodes into a single SPARQL triple pattern instead of a chain of them. `/` sequences predicates, `|` alternates, `^` reverses direction, and `*` or `+` repeats a step to arbitrary depth. The recursive forms have no plain-SQL equivalent — `+` is a recursive CTE written as one character, which is why deep classifications like the EC hierarchy are cheap to query.",glossary:["property-path"],heard:["property path","a/rdfs:subClassOf*","path expression","SPARQL path","the + operator"],warn:"A path matches but binds nothing. You cannot ask which predicate or which…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/statistics.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"}],see:["federated-payoff","def-sparql","def-rdfs","def-subsumption","def-federation","def-triple-pattern-binding","def-up-enzyme"],points:["The entity count in `src/tacat/store/statistics.py` walks `a/rdfs:subClassOf*`, because amino acids and 2-oxo acids are subclasses of ChemicalEntity and Owlready2 does not write those entailed types back out. The federated query traverses `up:annotation/up:catalyticActivity/up:catalyzedReaction` at UniProt.","?e a/rdfs:subClassOf* tacat:ChemicalEntity"]},Mh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"prosthetic group — what is it?",short:"a cofactor that stays bound to its enzyme and is regenerated rather than consumed",say:"A prosthetic group is a non-protein component bound to an enzyme — often covalently — that is part of the catalytic machinery rather than a substrate. It is restored to its starting state within each catalytic cycle, so it is not consumed and does not appear in the reaction equation or its balance. Contrast a co-substrate cofactor such as NAD+, which changes state across the reaction and must be written in.",glossary:["prosthetic-group"],heard:["prosthetic group","tightly bound cofactor","enzyme-bound cofactor"],warn:"Cofactor is the wider word; a prosthetic group is one kind. NAD+ is a cofactor…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_plp_is_not_a_reaction_participant"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"}],see:["plp-cofactor","def-plp","def-cofactor","def-redox-cofactor","def-turnover-catalytic-cycle","def-hascofactor","def-mass-balance-charge-balance"],points:["The one-line reason PLP is attached to the enzyme: `hasCofactor` is domained on `Enzyme`, never on `BiochemicalReaction`, and `test_plp_is_not_a_reaction_participant` asserts CHEBI:597326 never appears as a `participatingEntity`. UniProt records PLP the same way, as a `COFACTOR` line on the protein."]},Hh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"PROV-O — what is it?",short:"W3C provenance vocabulary — which activity, using which inputs, by which agent, produced this",say:"PROV-O is the W3C ontology for provenance. Three core classes carry it: `prov:Entity` (a thing), `prov:Activity` (something that happened over an interval) and `prov:Agent` (something responsible). They are joined by `wasGeneratedBy`, `used`, `wasAssociatedWith` and `wasDerivedFrom`. It records where data came from in a form other tools can read rather than in a README sentence.",glossary:["prov-o"],heard:["PROV-O","W3C PROV","prov:","prov:Activity","prov:wasGeneratedBy"],warn:"Provenance here is dataset-level, not per-triple. With no named graphs it…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/provenance.py"}],see:["weak-provenance","def-dcat","def-dublin-core","def-reference-data-checksum","def-named-graph","def-commit-sha-and-checksum","def-graph"],points:["`src/tacat/ontology/provenance.py` writes the build into the graph it built: the dataset `prov:wasGeneratedBy` a build activity, which `prov:used` the reference data and was associated with a `prov:SoftwareAgent`. No generation timestamp, deliberately — a wall clock would break the byte-reproducibility gate.","tacat:build a prov:Activity ; prov:used tacat:reference-data ."]},zh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"punning / metamodelling — what is it?",short:"one IRI used as both class and individual — allowed in OWL 2 DL, read as two names",say:"Punning is using a single IRI in two entity positions at once: as a class and as an individual. OWL 2 DL permits it and reads the occurrences separately — the individual called `X` and the class called `X` share a name, not a meaning, so nothing inferred about one carries to the other. OWL 1 DL forbade it. Metamodelling is the wider aim it is reached for: saying something about a class as if it were a thing.",glossary:["punning-metamodelling"],heard:["punning / metamodelling","punning","metamodelling","metamodeling","class as individual","OWL 2 punning"],warn:"BACKGROUND — The give-away is one IRI in two positions, not two IRIs in a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["mint-vs-reuse","def-owl-2-dl","def-declaration-axiom","def-owl-namedindividual","def-chebi","def-universal-vs-particular","def-a-box"],points:["Not punning, though the graph invites the question. `tacat:CHEBI_29985` is an individual typed with `obo:CHEBI_29985`, a ChEBI class — plain instantiation, and two different IRIs. Punning would begin if `tacat:CHEBI_29985` were itself used as a class, or if the ChEBI IRI took property assertions as an individual.","tacat:CHEBI_29985 a obo:CHEBI_29985, owl:NamedIndividual, tacat:AminoAcid ."]},Fh={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"PURL — what is it?",short:"Persistent URL run by the curating institution, so the identifier outlives the hosting",say:"A PURL is a permanent URL: a stable address operated by the body that curates the resource, redirecting to wherever that resource currently lives. The identifier is the PURL itself, not the destination, so the hosting arrangement can change — new server, new site, new serialisation — without invalidating anything that cited it.",glossary:["purl"],heard:["PURL","persistent URL","purl.obolibrary.org","purl.uniprot.org"],warn:"UniProt's RDF PURL is `/uniprot/`, not the web REST path `/uniprotkb/`. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["mint-vs-reuse","def-iri","def-w3id-org","def-dereference","def-uniprot","def-chebi","def-obo-foundry"],points:["Every external anchor in the graph is one: `purl.obolibrary.org/obo/CHEBI_29985` for molecules, `purl.uniprot.org/enzyme/2.6.1.2` for EC classes, `purl.uniprot.org/uniprot/P24298` for proteins. `rdf.rhea-db.org/19453` is Rhea's institutionally operated equivalent.","http://purl.uniprot.org/uniprot/P24298"]},Uh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"pyruvate — what is it?",short:"the three-carbon 2-oxo acid alanine transaminase produces; ChEBI:15361, charge −1",say:"The simplest 2-oxo acid: three carbons, a ketone at position 2, a carboxylate at position 1. It is the keto counterpart of L-alanine and the hub where glycolysis meets the citric acid cycle, fermentation and gluconeogenesis, so an amino group handed off it enters carbon metabolism at once. In water at physiological pH it is the anion, charge −1, not the free acid.",glossary:["pyruvate"],heard:["pyruvate","CHEBI:15361","pyruvic acid","2-oxopropanoate","PYRUVATE","pyruvate anion"],warn:"ChEBI's accepted name is the bare `pyruvate` despite the −1 charge, unlike…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:15361"}],see:["identifiers-verified","why-three-reactions","def-2-oxo-acid","def-l-alanine","def-chebi-accepted-name","def-microspecies","def-2-oxoglutarate","def-amino-donor-amino-acceptor"],points:['Product of the alanine transamination: `tacat:CHEBI_15361`, labelled "pyruvate", typed `TwoOxoAcid`, carried as `PYRUVATE` with formula C3H3O3 and charge −1. Its participant node `PART_0000002_03` holds role `Product` and coefficient 1.0, which is the row CQ09 returns for it.','`ChemicalEntity(15361, "pyruvate", "pyruvate", "C3H3O3", -1)`']},Gh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"pySHACL — what is it?",short:"the Python SHACL engine — data graph plus shapes graph in, conformance and an RDF report out",say:"The reference SHACL implementation for the Python RDF stack. It takes a data graph and a shapes graph, both as rdflib graphs, and returns three things: a conformance boolean, the validation report as RDF, and the report rendered as text. `advanced=True` enables SHACL-AF (SPARQL-based constraints and node expressions); `meta_shacl=True` validates the shapes file itself against the SHACL-of-SHACL.",glossary:["pyshacl"],heard:["pySHACL","pyshacl","pyshacl.validate","shacl_validate","advanced=True"],warn:"pySHACL is the tool; SHACL is the language. A claim that 'SHACL passes' means…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"},{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_knowledge_graph_conforms"}],see:["why-both-owl-shacl","ci-data-gates","def-rdflib","def-shacl","def-metashacl","def-node-shape-vs-property-shape","def-sh-severity"],points:["Imported lazily inside `validate()` in `src/tacat/validation.py`, called with `advanced=True, meta_shacl=False`. The test suite's own `_validate` turns `meta_shacl` on, so the shapes file is checked for being well-formed SHACL as well as obeyed. A missing shapes file returns `conforms: None`, never `False`."]},Wh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"pytest fixture — what is it?",short:"named setup injected into any test that declares a parameter of the same name",say:"A function decorated `@pytest.fixture` whose return value is handed to any test declaring a parameter with that name. It is dependency injection for tests: the test asks for what it needs and never constructs it. `scope` decides how often it is built — per function by default, or once per session for something expensive.",glossary:["pytest-fixture"],heard:["pytest fixture","@pytest.fixture",'scope="session"',"conftest"],warn:"Two senses collide here. A pytest fixture is injected setup; the twelve…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_knowledge_graph_conforms"}],see:["why-both-owl-shacl","def-pytest","def-parametrised-test","def-shacl","def-test-oracle","def-pytest-marker"],points:["`tests/test_shapes.py` declares two session-scoped fixtures: `shapes`, which parses `data/shapes.ttl`, and `kg`, which runs the build into a temp directory and parses the reasoned graph. Session scope is why the SHACL suite is not dominated by repeated reasoner runs."]},Kh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"pytest marker — what is it?",short:"a label on a test, so `-m` can select or deselect a whole group at the command line",say:"A tag attached with `@pytest.mark.<name>` and selected at the command line with a `-m` expression. Markers carry no behaviour: they only make a group addressable, so a run can include or exclude it. They must be declared in configuration, otherwise pytest warns — which is what catches a mistyped mark that would silently match nothing.",glossary:["pytest-marker"],heard:["pytest marker","@pytest.mark","network mark","network marker","markers =","-m 'not network'","pytest -m network"],warn:"A deselected test is not a skipped test: it is never collected, so a bare…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_live_federation_summary"},{kind:"test",rel:"decided-in",at:"tests/README.md"}],see:["federated-payoff","ci-data-gates","def-pytest","def-federation","def-sib","def-pytest-fixture","def-parametrised-test"],points:["One marker is declared, `network`, in `pyproject.toml`: \"hits a live external SPARQL endpoint; deselected by default so CI does not fail when SIB does maintenance\". `addopts` carries `-m 'not network'`. Three tests wear it — one in `test_competency.py`, two in `test_federated.py`.","pytest -m network   # run only the three live-endpoint tests"]},Qh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"pytest — what is it?",short:"the Python test framework: plain `test_*` functions, bare `assert`, fixtures and markers",say:"The de facto testing tool for Python. Tests are plain functions named `test_*`; assertions use the bare `assert` statement, which pytest rewrites so a failure prints both sides. Setup arrives by dependency injection through fixtures, groups of tests are selected with markers, and plugins supply coverage and parametrisation. Configuration lives in `pyproject.toml`.",glossary:["pytest"],heard:["pytest","py.test","pytest -m","addopts"],refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"test",rel:"decided-in",at:"tests/README.md"}],see:["ci-data-gates","def-pytest-fixture","def-pytest-marker","def-parametrised-test","def-branch-coverage","def-src-layout","def-regression-test"],points:["Configured under `[tool.pytest.ini_options]`: `pythonpath = [\"src\"]` so the src-layout package imports, `--cov=tacat` with branch coverage on, and `-m 'not network'` baked into `addopts` so live-endpoint tests are deselected unless asked for. Eight test files under `tests/`."]},Vh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"python-multipart / FastAPI Form() — what is it?",short:"FastAPI's form-field declaration, and the third-party parser it fails to import without",say:"`Form()` declares a parameter that arrives in a form body — `application/x-www-form-urlencoded` or `multipart/form-data`. FastAPI does not parse those itself; it delegates to `python-multipart`, and raises when the application is *constructed* if the package is absent. That failure is import-time and total: the process does not start, so it cannot be a test-only dependency.",glossary:["python-multipart-fastapi-form"],heard:["python-multipart / FastAPI Form()","Form()","python-multipart","x-www-form-urlencoded"],warn:"The dependency's stated reason no longer matches the code: nothing in the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_form_post_missing_query_field_is_400_not_500"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["sparql-protocol","def-fastapi","def-sparql-1-1-protocol","def-notacceptable-406","def-api","def-uvicorn"],points:["`pyproject.toml` pins `python-multipart>=0.0.20` as a runtime dependency for that reason — but the submitted `app.py` no longer declares `Form()`. `sparql_post` reads the body once and parses it with `parse_qs`, because a `Form` parameter consumed the stream and the fallback then raised `RuntimeError: Stream consumed`."]},Jh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"sh:qualifiedValueShape — what is it?",short:"count only the values of a path that match a sub-shape — cardinality over a filtered subset",say:'`sh:minCount` counts every value of a property path. A qualified constraint filters first: `sh:qualifiedValueShape` gives a sub-shape, and `sh:qualifiedMinCount` / `sh:qualifiedMaxCount` bound how many values conform to it. That is how a shape says "at least one value must look like this" on a path that also legitimately carries values that do not.',glossary:["qualified-value-shape"],heard:["sh:qualifiedValueShape","sh:qualifiedMinCount","sh:qualifiedMaxCount","qualified cardinality"],warn:"Inside a qualified shape `sh:pattern` selects rather than constrains — a…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"}],see:["mint-vs-reuse","identifiers-verified","def-shacl","def-cardinality","def-sh-pattern","def-node-shape-vs-property-shape","def-obo-foundry-fp-005","def-lexical-form"],points:['It makes the README’s "reuse identifiers, do not mint them" executable. `data/shapes.ttl` puts qualified constraints on `rdf:type`: a chemical entity needs exactly one type matching the ChEBI PURL pattern, a role one matching SBO — necessary because `rdf:type` also carries `owl:NamedIndividual` and the local class.','sh:qualifiedValueShape [ sh:nodeKind sh:IRI ; sh:pattern "…/obo/CHEBI_[0-9]+$" ] ; sh:qualifiedMinCount 1 ; sh:qualifiedMaxCount 1 ;']},Yh={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"QUDT / OM-2 — what is it?",short:"the two rival RDF vocabularies for quantities and units — the choice a kinetics model forces",say:"QUDT (Quantities, Units, Dimensions and Types) and OM-2 (the Ontology of units of Measure) are the two established RDF vocabularies for saying that a number is a measured quantity with a unit and a dimension. Both supply unit IRIs, quantity kinds and conversion factors. They disagree on structure, so a graph committed to one does not join cleanly to a graph committed to the other, and picking is unavoidable.",glossary:["qudt-om-2"],heard:["QUDT / OM-2","QUDT","OM-2","Ontology of units of Measure","units ontology"],warn:"BACKGROUND — Never offer this graph as having units. Its only number is a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["def-emmo","def-km-kcat-catalytic-efficiency","def-out-of-scope-questions","def-stoichiometric-coefficient","def-nfdi4cat","def-typed-literal-language-tag"],points:['Not used: no measured quantity is modelled at all. DECISIONS.md lists "No quantities" among the known limitations and names QUDT versus OM-2 versus EMMO as the unresolved choice — NFDI consortia have not converged. `OUT_OF_SCOPE_QUESTIONS` records KM and kcat as the questions that force it.']},Xh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"query form — what is it?",short:"which of SPARQL's four query shapes a request is — the first bare keyword decides",say:"The kind of a SPARQL query, fixed by the first keyword after the prologue. SELECT returns a table of bindings, ASK a boolean, CONSTRUCT a graph built from a template, DESCRIBE a graph the server chooses. Update operations — INSERT, DELETE, LOAD, CLEAR — are a separate grammar in SPARQL 1.1 Update with forms of their own.",glossary:["query-form"],heard:["query form","SELECT","ASK","CONSTRUCT","DESCRIBE","read form"],warn:"The form is whitelisted, not filtered. The endpoint never scans for INSERT…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_query_form"}],see:["weak-readonly","scanner-guard-failures","def-bare-keyword","def-scanner-tokeniser","def-sparql","def-querypolicy","def-whitelist-vs-keyword-blacklist","def-sparql-results-media-types-and-406"],points:["`READ_ONLY_FORMS` in `src/tacat/api/policy.py` is those four. `query_form()` returns the first bare keyword the scanner yields if it is one of them and `None` otherwise, and `QueryPolicy.check` turns `None` into a `PolicyViolation` of kind `not-read-only`, which the API maps to 400.","SELECT ?insert WHERE { ?s ?p ?o }   # form is SELECT; a blacklist would refuse it"]},Zh={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"QueryPolicy — what is it?",short:"the read-only contract as a value: which forms, how many rows, whether SERVICE runs",say:"The rules a submitted query must satisfy, held as one object rather than scattered through handlers: which query forms may be asked, how large a SELECT result may be, and whether federated SERVICE clauses are executed. It imports no web framework and raises `PolicyViolation`; mapping that to a status code is the transport layer's job, which is what makes the rules testable without a client.",glossary:["querypolicy"],heard:["QueryPolicy","read-only contract","allow_service","max_result_rows"],warn:"Read-only is the policy's guarantee, not rdflib's. Update forms also happen to…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_read_forms_are_accepted"}],see:["weak-readonly","ssrf-service","def-policyviolation","def-query-form","def-scanner-tokeniser","def-ssrf","def-application-factory-injectable-dependency","def-graphrepository"],points:["A frozen dataclass in `src/tacat/api/policy.py`, defaulting to the four read forms, `max_result_rows=10_000` and `allow_service=False`. `create_app` accepts one, so a test can inject a permissive policy. The row cap is not a timeout — rdflib gives no way to interrupt a running query, and the README says so."]},ef={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"quinonoid intermediate — what is it?",short:"the resonance-stabilised carbanion left once the α-proton comes off",say:"Removing the α-proton from a PLP external aldimine leaves a negative charge on the α-carbon. It does not stay there: it delocalises into the cofactor's conjugated ring, giving a planar, deeply coloured intermediate named for its quinone-like electron distribution. Every PLP reaction that breaks a bond at the α-carbon passes through it, and they diverge from it.",glossary:["quinonoid-intermediate"],heard:["quinonoid intermediate","quinonoid","quinonoid carbanion","resonance-stabilised carbanion","carbanion intermediate"],warn:"BACKGROUND — An intermediate, not a transition state. It has a lifetime and a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["plp-cofactor","ping-pong-mechanism","def-half-reaction","def-plp-reaction-families","def-internal-external-aldimine","def-plp","def-pmp","def-ping-pong-bi-bi"],points:["The step between the two things the project's material does describe — the external aldimine at the start of a half-reaction, and PMP at its end. Nothing in the graph represents mechanism at all: it is one curated string on the enzyme."]},tf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"RDF/XML — what is it?",short:"the 1999 XML syntax for RDF — verbose, still the OWL-tooling default, and what Owlready2 writes",say:"RDF/XML was the first standardised serialisation of RDF, encoding triples as nested XML elements. It is verbose next to Turtle — one short line becomes several elements — and awkward to read, but it remains the default output of much OWL tooling and of many ontology registries, so it is unavoidable rather than obsolete.",glossary:["rdf-xml"],heard:["RDF/XML","rdf:RDF","rdf:Description","application/rdf+xml","XML serialisation of RDF"],warn:"`application/sparql-results+xml`, which the endpoint does serve, is not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["def-rdf","def-turtle","def-json-ld","def-n-triples","def-owlready2","def-sparql-results-media-types-and-406"],points:["Owlready2 serialises RDF/XML, so `build_reasoned_graph` in `src/tacat/ontology/builder.py` round-trips the reasoned world through rdflib and writes Turtle instead. No RDF/XML file is shipped: the published artefact is `data/reactions.ttl`.",'<rdf:Description rdf:about="…/CHEBI_57972"><rdfs:label>L-alanine</rdfs:label></rdf:Description>']},af={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"RDF — what is it?",short:"the data model where every fact is a subject-predicate-object triple and a set of them is a graph",say:"RDF is the W3C model in which every statement is three terms: subject, predicate, object. A predicate is always an IRI, a subject an IRI or a blank node, an object either of those or a literal. A set of triples is a graph, and because nodes are globally unique identifiers rather than table-local keys, two graphs from different sources merge by putting the triples together. It is a model, not a file format.",glossary:["rdf"],heard:["RDF","Resource Description Framework","triple","subject-predicate-object"],warn:"RDF is the model; Turtle, N-Triples, RDF/XML and JSON-LD are syntaxes for it.…",see:["def-turtle","def-literal","def-graph","def-rdf-xml","def-property-graph","def-triple-pattern-binding","def-iri"],points:["The graph ships as Turtle in `data/reactions.ttl` and is loaded into an in-memory rdflib graph. Every external identifier is attached as an `rdf:type` rather than copied into a string, which is exactly what makes a triple here and a triple at Rhea meet on the same IRI without an agreement between the two.",'tacat:CHEBI_57972 rdfs:label "L-alanine" .']},sf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"rdflib — what is it?",short:"the Python RDF library — parses, serialises, holds triples in process and answers SPARQL",say:"The standard RDF toolkit for Python. It parses and serialises Turtle, N-Triples, RDF/XML and JSON-LD, holds triples behind a pluggable store, and evaluates SPARQL 1.1 queries over them. The default store is in-process memory; the same `Graph` API can sit in front of a remote endpoint via `SPARQLStore`.",glossary:["rdflib"],heard:["rdflib","rdflib 7","in-memory store"],warn:"A library, not a server. It is not comparable to Fuseki or GraphDB, and the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/memory.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["rdflib-scaling","def-lazy-evaluation","def-uriref","def-triplestore-products","def-triplestore","def-graphrepository","def-sparql-clients"],points:["Specified in the brief. It holds the built graph in process and answers every query the endpoint serves — there is no separate triplestore. Its results are lazy, so `app.py` forces evaluation inside the handler; and it cannot interrupt a running query, which is why the policy caps rows instead of setting a timeout."]},nf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"RDFS — what is it?",short:"the light schema layer over RDF — classes, subclasses, subproperties, domain, range, labels",say:"RDF Schema adds a small vocabulary for describing RDF data: `rdfs:Class`, `rdfs:subClassOf`, `rdfs:subPropertyOf`, `rdfs:domain`, `rdfs:range`, plus `rdfs:label` and `rdfs:comment`. Its entailments are inheritance ones — if A is a subclass of B and x is an A, then x is a B. It gives a hierarchy and simple typing, and stops there.",glossary:["rdfs"],heard:["RDFS","RDF Schema","rdfs:Class","rdfs:label","rdfs:comment"],warn:'Do not answer that question with "more expressivity". The specific thing RDFS…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/statistics.py"}],see:["owl-vs-rdfs","def-owl","def-domain-and-range","def-defined-class","def-necessary-and-sufficient-conditions","def-subsumption","def-property-path"],points:['Used everywhere: every label is `rdfs:label`, and `rdfs:subClassOf` is the edge the property paths in `src/tacat/store/statistics.py` and the UniProt EC query walk. It is also the benchmark question — "what does OWL buy you that RDFS wouldn\'t" — whose honest answer in v0 was "nothing".',"rdfs:subClassOf inherits a type; equivalent_to recognises one"]},of={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"Reac4Cat — what is it?",short:"NFDI4Cat’s own reaction ontology, which took a BFO-style role pattern rather than n-ary bridge nodes",say:"Reac4Cat is a reaction ontology developed inside NFDI4Cat. It says what takes part in a reaction with a BFO-style role pattern — educt-mixture and product-component-set groupings — instead of one bridge node per participation. That is a reasonable fit for reaction data often written withou
