alue-restriction","def-alldifferent","def-arity","def-necessary-and-sufficient-conditions","def-signature"],points:["The defined class has four conjuncts, one per role-slot: an amino acid consumed, a 2-oxo acid consumed, a 2-oxo acid produced, an amino acid produced. The four switches in the primer's classifier widget are exactly those four.","hasParticipant.some(ReactionParticipant & participatingEntity.some(AminoAcid) & participantRole.value(reactant))"]},Qc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"ConjunctiveGraph — what is it?",short:"rdflib's multi-graph container — the class whose name leaked into a user-facing error",say:"An rdflib class holding a set of named graphs plus a default graph, as against a plain `Graph`, which holds triples in a single unnamed graph. Only a multi-graph container can satisfy SPARQL's `GRAPH ?g` and `FROM NAMED`, so asking a plain `Graph` for one raises — with a message naming the class the caller never used.",glossary:["conjunctivegraph"],heard:["ConjunctiveGraph","rdflib.ConjunctiveGraph"],warn:"Such a query is legal SPARQL 1.1. The 400 says this endpoint cannot satisfy it…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["def-named-graph","def-rdflib","def-lazy-evaluation","def-graph","def-sparql"],points:["The endpoint serves one plain `Graph`. rdflib reports a named-graph query against it as a bare `Exception` mentioning `ConjunctiveGraph`; `_explain()` in `src/tacat/api/app.py` matches that string and rewrites it into a sentence about this endpoint having no named graphs. The request answers 400 rather than 500.","GRAPH ?g { ?s ?p ?o }  →  400 with an explanation, not a 500"]},Vc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"container / image — what is it?",short:"an image is the frozen, exactly-defined artefact; a container is a running instance of it",say:"An image is a frozen filesystem plus the metadata needed to start it — interpreter, libraries, system tools, data files — built once and identified by its content. A container is one running instance of an image; many containers can run from the same image, and each is disposable. The image is the artefact you ship and cite.",glossary:["container-image"],heard:["container / image","Docker image","OCI image"],warn:"A container runs much more reproducibly on any compatible host, not identically…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["build-time-reasoning","def-multi-stage-build","def-base-image-digest-pinning","def-container-registry-image-tag-latest","def-liveness-probe","def-jvm-java-runtime","def-uvicorn"],points:["`Dockerfile` builds two stages. The runtime image carries the reasoned graph, the virtual environment, an unprivileged `tacat` user and no JVM; it exposes 8000, declares a `HEALTHCHECK` against `/health`, and starts `uvicorn tacat.api:app`. It answers queries with no network."]},Jc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"container registry / image tag / :latest — what is it?",short:"a server that stores images by name:tag — and a tag can be repointed at any time",say:"A container registry stores built images and serves them by `name:tag`. A tag is a mutable label: whoever pushes can repoint `:latest`, so the same pull command may give different software on different days. Only the content digest is stable. A pull is therefore reproducible exactly as far as the reference is immutable.",glossary:["container-registry-image-tag-latest"],heard:["container registry / image tag / :latest",":latest","CI_REGISTRY_IMAGE","image tag"],warn:"`:latest` is a convenience for a demo. Naming it as the artefact under…",see:["weak-reproducibility","def-base-image-digest-pinning","def-container-image","def-commit-sha-and-checksum","def-ci-cd","def-kaniko","def-services"],points:["The `container` job pushes `$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA` on every branch and adds `:latest` only on the default branch. It fails with an explanation when `CI_REGISTRY` is unset, because the registry is enabled per instance and project rather than always present.","registry.gitlab.com/k.sachikonye/tacat:latest"]},Yc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"content negotiation — what is it?",short:"the caller states what format it wants via Accept; the server obliges or returns 406",say:"One resource, several representations. The client names the media types it will take in the `Accept` header, optionally ranked by `q` values, and the server returns the best it can produce. If it can produce none of them the correct answer is 406 — not a different format with a 200, which a tolerant client survives and a strict one does not.",glossary:["content-negotiation"],heard:["content negotiation","Accept header","conneg","q-value"],warn:"A results type asked of a CONSTRUCT is answered `text/turtle` with a 200, not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/negotiation.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_content_negotiation_csv"}],see:["sparql-protocol","def-sparql-results-media-types-and-406","def-notacceptable-406","def-sparql-1-1-protocol","def-api","def-query-form"],points:["`serialise()` in `src/tacat/api/negotiation.py` ranks the header by `q`, then serves JSON and XML for SELECT and ASK, CSV for SELECT only, and Turtle for CONSTRUCT and DESCRIBE. `*/*` and an absent header mean JSON, because that is what curl sends. `GET /` negotiates HTML for a browser, JSON otherwise."]},Xc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"Conventional Commits / python-semantic-release — what is it?",short:"a commit-message grammar a tool reads to derive the next version and the changelog",say:"Conventional Commits fixes the first line of a commit message as `type(scope): summary`, with types such as `feat`, `fix`, `docs`, `chore`. The point is that the history becomes machine-readable. python-semantic-release reads it, derives the next semantic version, writes the changelog entry and tags — so the version is a function of the history rather than a number someone remembers to bump.",glossary:["conventional-commits"],heard:["Conventional Commits / python-semantic-release","semantic release","feat:","fix:","SemVer"],warn:"Configured, not exercised. The version is still `0.1.0` and the top of…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"code",rel:"decided-in",at:"CHANGELOG.md"}],see:["def-commit-sha-and-checksum","def-citation-cff","def-build-backend","def-container-registry-image-tag-latest","def-ci-cd"],points:["`[tool.semantic_release]` in `pyproject.toml`: `feat` bumps the minor, `fix`/`perf`/`refactor` the patch. The version lives only there, because `tacat.__version__` is read from installed metadata. `upload_to_pypi = false` — releases tag the repository and the image, they do not publish."]},Zc={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"CORS — what is it?",short:"browser rule deciding whether a page on one origin may read a response from another",say:"Cross-Origin Resource Sharing. A browser will not let JavaScript on one origin read a response from another unless that response carries `Access-Control-Allow-Origin` headers permitting it. The server opts in; the browser enforces. Non-browser clients — curl, a Python script — are unaffected, because the restriction belongs to the browser, not to the server.",glossary:["cors"],heard:["CORS","cross-origin resource sharing","Access-Control-Allow-Origin","CORSMiddleware","preflight"],warn:"An open CORS policy is not access control and is not a hole here: it grants a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_the_cors_preflight_is_answered"}],see:["def-yasgui","def-fastapi","def-api","def-sparql-1-1-protocol"],points:['`create_app` adds FastAPI\'s `CORSMiddleware` with `allow_origins=["*"]`, methods GET/POST/OPTIONS and the `accept` and `content-type` headers. Open deliberately: CORS restricts what a page does with *ambient credentials*, and there are none here — no cookies, no auth, a read-only policy.']},ed={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"coupled enzyme assay (NADH at 340 nm) — what is it?",short:"measuring a reaction with no optical signal by chaining it to one that has",say:"Many reactions produce nothing a spectrophotometer can see. A coupled assay chains the product into a second, indicator reaction that does: for a transaminase the 2-oxo-acid product is fed to a dehydrogenase — lactate dehydrogenase for pyruvate, malate dehydrogenase for oxaloacetate — and NADH consumption is followed as falling absorbance at 340 nm. The coupling enzyme must be in excess.",glossary:["coupled-enzyme-assay"],heard:["coupled enzyme assay (NADH at 340 nm)","coupled assay","NADH 340 nm","A340","LDH-coupled","MDH-coupled","spectrophotometric assay"],warn:"BACKGROUND — The rate measured is the coupled system's unless the indicator…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["explain-to-biochemists","def-alt-ast","def-km-kcat-catalytic-efficiency","def-out-of-scope-questions","def-redox-cofactor","def-glutamate-dehydrogenase"],points:["How the ALT and AST figures on a blood panel are actually produced, and the working answer to 'how would you measure this?'. None of it is modelled: no assay, no conditions, no quantities — the boundary the first `OUT_OF_SCOPE_QUESTIONS` entry records."]},td={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"covalent catalysis — what is it?",short:"the catalyst bonds to the substrate, then lets go — a transient covalent intermediate",say:"A catalytic strategy in which the catalyst forms a genuine covalent bond with the substrate, passes through a chemically modified state, and is regenerated at the end. The nucleophile may be an amino-acid side chain or a cofactor. It is what makes a two-stage mechanism possible: the group being transferred is parked on the catalyst between the departure of one substrate and the arrival of the next.",glossary:["covalent-catalysis"],heard:["covalent catalysis","covalent intermediate","nucleophilic catalysis","substituted enzyme","double-displacement catalysis"],warn:"BACKGROUND — Transient by definition. A cofactor that kept its bond to the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["plp-cofactor","ping-pong-mechanism","def-ping-pong-bi-bi","def-internal-external-aldimine","def-plp","def-pmp","def-half-reaction","def-turnover-catalytic-cycle"],points:["Why the three enzymes run a ping-pong mechanism at all. Between the halves the amino group sits on the cofactor as PMP, the substituted enzyme form — which is the argument for domaining `hasCofactor` on `Enzyme`. The submission carries the consequence as `kineticMechanism` and never the cause."]},ad={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"CURIE — what is it?",short:"a prefix-plus-local-part abbreviation of an IRI — text, not a resolvable identifier",say:"A Compact URI writes an IRI as `prefix:localpart`, where the prefix stands for a namespace declared elsewhere. It is an abbreviation for humans and for serialisations: expanding it requires the prefix binding, and without that binding it is an ordinary string. A parser expands prefixed names as it reads, so a CURIE never survives into the parsed graph — what lands there is the full IRI.",glossary:["curie"],heard:["CURIE","compact URI","prefix:local","compact IRI"],warn:"A CURIE sitting in a data value is a string. Federation joins on IRIs, so a…",see:["mint-vs-reuse","identifiers-verified","def-iri","def-prefixed-name-local-part","def-turtle","def-shacl","def-accession","def-purl"],points:["`data/shapes.ttl` names a Rhea CURIE among the malformed anchors its reaction shape must reject. A shape that only counts well-formed identifiers lets a wrong-shaped one conform in silence, and something that looks present is worse than something absent.","`CHEBI:29985` expands to `http://purl.obolibrary.org/obo/CHEBI_29985` — note the underscore, not a colon"]},sd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"D-amino acid transaminase (EC 2.6.1.21) — what is it?",short:"the mirror-image sibling — a PLP transaminase that acts on D-amino acids",say:"A PLP-dependent transaminase acting on D- rather than L-amino acids, moving an amino group between a D-amino acid and a 2-oxo acid. Bacteria need it to make the D-alanine and D-glutamate of peptidoglycan, which makes it an antibacterial target. Structurally it is not a relative of the L-specific α-transaminases: a different PLP fold family, holding the substrate the other way round.",glossary:["d-amino-acid-transaminase"],heard:["D-amino acid transaminase (EC 2.6.1.21)","D-amino acid aminotransferase","DAAT","EC 2.6.1.21","D-alanine transaminase","D-transaminase"],warn:"BACKGROUND — Not something the reasoner could catch. `AminoAcid` membership is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"source",rel:"cited-as",at:"EC 2.6.1.21"}],see:["defined-class","omega-transaminase","def-chirality-chiral-amine","def-defined-class","def-transaminationreaction","def-amino-acid","def-omega-transaminase-vs-alpha-transaminase"],points:["Not modelled, and the obvious 'what about the mirror image?' probe on a graph in which every amino acid is `L-`. Stereochemistry is carried by the ChEBI identifier alone — no property expresses it — so the four conjuncts of `TransaminationReaction` would classify a D-transamination exactly as readily."]},nd={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"data gate vs code gate — what is it?",short:"a CI check on the artefact produced, not on the source that produces it",say:"A code gate asserts a property of the source: it lints, type-checks or runs unit tests, and it passes when the code is well formed. A data gate asserts a property of the artefact the code produced. The distinction matters wherever the output is data, because an image can build and every unit test can pass while the data inside it is wrong.",glossary:["data-gate-vs-code-gate"],heard:["data gate vs code gate","data gate","code gate","quality gate","verify stage"],warn:"A green pipeline is not evidence the graph is right. A consistency check alone…",see:["ci-data-gates","def-negative-control","def-graph-isomorphism-vs-byte-equality","def-metashacl","def-hermit","def-shacl","def-smoke-test"],points:["`.gitlab-ci.yml` runs the gates before the image is built. Its header names three data gates — HermiT consistency, an assertion that the inference fires, and pyshacl over the graph and the dataset description — and a fourth builds twice and compares bytes. `lint`, `typecheck` and `security` are the code gates.",'`assert len(result["inferred_after"]) == 3` — the inference gate, in `ontology-consistency`']},od={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"DCAT-AP+ — what is it?",short:"NFDI application profile of DCAT-AP that makes a dataset name what produced it",say:"DCAT-AP+ is the NFDI application profile extending DCAT-AP 3.0 — itself the European profile of the W3C DCAT catalogue vocabulary — with the activities and agents that produced a dataset, expressed in PROV-O and specified in LinkML. Its distinguishing requirement is that `prov:wasGeneratedBy` is mandatory: a dataset must say what made it, not only what it contains.",glossary:["dcat-ap-plus"],heard:["DCAT-AP+","DCAT-AP plus","nfdi-de/dcat-ap-plus","NFDI metadata profile"],warn:"No conformance is claimed and none should be: `tacat:DatasetShape` mirrors…",see:["dcat-undocumented","weak-provenance","def-dcat","def-prov-o","def-dublin-core","def-meta4cat","def-nfdi4cat","def-cc-by-4-0"],points:["`data/dataset.ttl` is a self-description in the profile NFDI4Cat and NFDI4Chem maintain jointly, with conventions copied from its worked example: the persistent identifier is the subject IRI, sub-resources are hash fragments not blank nodes, identifiers are wrapped as `adms:Identifier`, and the licence is an IRI.","`prov:wasGeneratedBy <https://w3id.org/bitspark/tacat/dataset/transaminase-kg#generation>`"]},id={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"DCAT — what is it?",short:"W3C vocabulary for describing datasets and their distributions in a catalogue",say:"DCAT is the W3C Data Catalog Vocabulary: a small RDF vocabulary for saying what a dataset is, who published it, under what licence, and where its concrete forms live. A `dcat:Dataset` is the abstract thing; each `dcat:Distribution` is one downloadable file or queryable endpoint of it. Communities constrain it further with application profiles such as DCAT-AP.",glossary:["dcat"],heard:["DCAT","Data Catalog Vocabulary","dcat:Dataset","dcat:Distribution"],warn:"It describes the dataset, not the chemistry. Nothing in the reaction graph…",see:["dcat-undocumented","def-dcat-ap-plus","def-meta4cat","def-dublin-core","def-fair","def-nfdi4cat","def-prov-o"],points:["`data/dataset.ttl` describes this graph in DCAT-AP+, the profile NFDI4Cat and NFDI4Chem maintain jointly, with two distributions: the Turtle file and the SPARQL endpoint. `DatasetShape` in `data/shapes.ttl` mirrors the profile's mandatory `prov:wasGeneratedBy` and licence-as-IRI rules.",'<...#turtle> a dcat:Distribution ; dcat:mediaType "text/turtle" .']},rd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"declaration axiom — what is it?",short:"the axiom typing an IRI as class, property or individual — OWL 2 DL wants one for each",say:"OWL 2 asks that every IRI an ontology uses be declared as exactly one kind of entity — a class, an object property, a data property or an individual. The declaration asserts nothing about the world; it fixes which position the name may occupy, so a reasoner knows how to read the axioms mentioning it. Typing an individual against an IRI nothing declares falls outside OWL 2 DL, however cleanly the triples parse.",glossary:["declaration-axiom"],heard:["declaration axiom","declaration","a owl:Class","owl:Class declaration","undeclared IRI"],warn:"A declaration claims nothing. `obo:CHEBI_15361 a owl:Class` does not import…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["mint-vs-reuse","def-axiom","def-owl-namedindividual","def-owl-2-dl","def-punning-metamodelling","def-owl-imports","def-chebi"],points:["`_type_as` in `linking.py` writes two triples per external link, not one: the class membership, then `?external a owl:Class`. The second is why `data/reactions.ttl` carries eighteen bare lines like `obo:CHEBI_15361 a owl:Class .`, one per reused ChEBI, SBO, Rhea and EC IRI.","obo:CHEBI_29985 a owl:Class ."]},cd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"deductive closure — what is it?",short:"everything that follows from a set of statements, added to the statements themselves",say:"The deductive closure of a set of axioms is that set plus every statement entailed by it. Computing it is what a reasoner does — it derives rather than searches or matches, and the result is complete for the logic it implements. Once computed, the closure can be written out as ordinary triples, and queries over those need no reasoner at all.",glossary:["deductive-closure"],heard:["deductive closure","closure","entailed set"],warn:"A closure is not a closed world: what is absent from it is unproven, not false.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"}],see:["build-time-reasoning","signature-not-mechanism","def-reasoner","def-entailment","def-materialise","def-hermit","def-open-world-assumption","def-realisation"],points:["HermiT computes the closure at build time and the derived `rdf:type` triples are materialised into `data/reactions.ttl`, where REACT_0000001 to REACT_0000003 each carry `tacat:TransaminationReaction` nobody asserted. The API answers `?r a tacat:TransaminationReaction` by plain triple matching."]},dd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"defined class — what is it?",short:"a class with necessary and sufficient conditions, so a reasoner can recognise its members",say:"Most classes are primitive: membership is asserted, the conditions are only necessary, and a reasoner can check an individual but never conclude it belongs. A defined class states conditions that are necessary *and* sufficient, so anything meeting them is a member whether or not anyone said so. That is what turns a reasoner from a checker into a classifier, computing membership instead of being told it.",glossary:["defined-class"],heard:["defined class","equivalence class","class with sufficient conditions"],warn:"Sufficiency is the point and the risk at once. A definition keyed on which…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","signature-not-mechanism","def-primitive-class","def-transaminationreaction","def-necessary-and-sufficient-conditions","def-conjunct","def-reasoner","def-subsumption"],points:["`TransaminationReaction` is the only one: `equivalent_to` a BiochemicalReaction with four existential participant conditions, written over chemical classes and participant roles rather than over specific molecules, so it generalises instead of enumerating the three reactions it was built from.","class TransaminationReaction(BiochemicalReaction): equivalent_to = [ ... ]"]},ld={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"dependency group / --no-dev — what is it?",short:"named sets of development-only packages, and the flag that keeps them out of an install",say:"PEP 735 adds `[dependency-groups]` to `pyproject.toml`: named sets of packages a project needs for development — tests, linters, docs — which are not runtime requirements and are not shipped with the distribution. An installer selects between them, and `uv sync --no-dev` resolves and installs without the `dev` group.",glossary:["dependency-group-no-dev"],heard:["dependency group / --no-dev","--no-dev","dev group","[dependency-groups]","uv sync --no-dev"],warn:"The flag was present and correct on `uv sync` and was still undone by a later…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["uv-lockfile","def-pep-735-dependency-groups","def-uv","def-multi-stage-build","def-lock-file","def-container-image"],points:["The Dockerfile builder runs `uv sync --frozen --no-dev`, then `uv run --no-dev tacat build`. The second `--no-dev` is load-bearing: a bare `uv run` re-syncs with the default groups, reinstating `dev` — and the runtime stage's `COPY /app/.venv` then carried pytest, ruff, mypy and bandit into the shipped image.","RUN uv run --no-dev tacat build"]},hd={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"dereference — what is it?",short:"fetch what an IRI points at over HTTP — a separate act from using it as a name",say:"To dereference an IRI is to send an HTTP request to it and get a representation back. An IRI is an identifier first and a locator second: it can name a thing perfectly well while resolving to nothing. In linked-data practice dereferenceability is a quality goal, not a condition for the identifier to be valid or for a join on it to work.",glossary:["dereference"],heard:["dereference","dereference an IRI","resolve an IRI","follow the link"],warn:'"The IRI does not dereference" is a disclosure about hosting. "The test never…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/namespaces.py"}],see:["weak-namespace","identifiers-verified","def-iri","def-purl","def-w3id-org","def-fair","def-test-oracle","def-opaque-identifier"],points:["Two senses appear. Locally minted IRIs sit under `https://w3id.org/bitspark/tacat/`, which is not registered, so following one gives a 404 — `DECISIONS.md` calls that deliberate. Separately, the first submission's balance test never dereferenced the ChEBI identifiers; it read the formula and charge written beside them.","`GET https://w3id.org/bitspark/tacat/REACT_0000001` -> 404"]},fd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"description logic — what is it?",short:"the decidable fragment of first-order logic OWL's class expressions are written in",say:"Description logics are a family of formal languages for describing classes, individuals and the relations between them. They trade expressive power for decidability — reasoning is guaranteed to terminate — which is what makes a reasoner a theorem prover rather than a pattern matcher. Class expressions are built from intersection, union, negation and quantified restrictions over properties.",glossary:["description-logic"],heard:["description logic","description logics","SROIQ"],warn:"Expressiveness costs time: description-logic reasoning is at least EXPTIME for…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["owl-vs-rdfs","build-time-reasoning","def-owl-2-dl","def-owl","def-reasoner","def-existential-restriction-and-value-restriction","def-exptime","def-hasvalue-restriction"],points:["Owlready2 exposes the operators as Python: `&` is intersection, `.some()` an existential restriction, `.value()` a hasValue restriction on a named individual. The `equivalent_to` in `schema.py` is a description-logic expression written that way, and HermiT is the description-logic reasoner that evaluates it."]},pd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"dianion / neutral parent — what is it?",short:"the charged species a database identifies, versus the uncharged compound it derives from",say:"A dianion carries two negative charges — a compound that has lost two protons. Chemical databases identify the neutral parent and each charged species separately, with different identifiers, formulae and charges. Which one an annotation means is decided by that annotation's own convention, not by the name, because parent and ion usually share a display name.",glossary:["dianion-and-neutral-parent"],heard:["dianion / neutral parent","dianion","neutral parent","parent compound"],warn:"The tautomer trap in a different shape: both identifiers print as `pyridoxal…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"},{kind:"source",rel:"identified-as",at:"CHEBI:18405"}],see:["plp-cofactor","identifiers-verified","microspecies","def-chebi","def-plp","def-conjugate-acid-base","def-microspecies","def-tautomer","def-uniprot"],points:["PLP is cited as CHEBI:597326, `pyridoxal 5'-phosphate(2−)`, C8H8NO6P, charge −2, because that is what UniProt's COFACTOR annotation uses. CHEBI:18405 is the neutral parent and is the wrong citation. The comment saying so sits directly above the constant in `reference_data.py`.",`PLP = ChemicalEntity(597326, "pyridoxal 5'-phosphate(2−)", ..., "C8H8NO6P", -2)`]},$d={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"directed evolution / engineered enzyme — what is it?",short:"improving an enzyme by rounds of mutation and screening, or by designed substitutions",say:"Directed evolution improves an enzyme by iterating one cycle: mutate the gene, express the variants, screen or select for the property wanted, keep the winners, repeat. Rational design instead makes targeted substitutions from a structural hypothesis. Either route yields an *engineered enzyme* — a variant that does not occur in nature, often accepting substrates, solvents or temperatures the wild type will not.",glossary:["directed-evolution-engineered-enzyme"],heard:["directed evolution / engineered enzyme","directed evolution","engineered enzyme","rational design","protein engineering","enzyme variant"],warn:"BACKGROUND — Nothing in the graph is sequence-level. Enzymes are named by EC…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["def-high-throughput-screening","def-sitagliptin","def-out-of-scope-questions","def-lara-larasuite","def-omega-transaminase-vs-alpha-transaminase"],points:['Recorded as unanswerable rather than ignored. `OUT_OF_SCOPE_QUESTIONS` carries "what is the directed evolution / rational design / screening strategy of enzyme X ?" against "Requires sequence and variant modelling plus a campaign structure. Out of scope for a reaction ontology at any size."']},ud={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"domain and range — what is it?",short:"declaring a domain infers a type on whatever appears there — it never rejects the wrong one",say:"In RDFS and OWL, `rdfs:domain` on a property says every subject of that property is an instance of the domain class, and `rdfs:range` says the same of every object. A reasoner reads both as licences to infer a type, not as checks: a subject of the wrong kind is not rejected, it silently acquires the declared type. OWL rejects nothing, which is why SHACL exists as a separate standard.",glossary:["domain-and-range"],heard:["domain and range","rdfs:domain","rdfs:range","property domain","property range"],warn:"A typo does not raise an error, it adds a type. Never offer a domain…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["owl-vs-rdfs","why-both-owl-shacl","plp-cofactor","def-rdfs","def-shacl","def-hascofactor","def-reasoner","def-open-world-assumption","def-owl"],points:["`hasCofactor` is deliberately domained on `Enzyme` rather than `BiochemicalReaction` in `src/tacat/ontology/schema.py` — the PLP placement decision written as a property axiom. Every property in the T-Box declares both a domain and a range.","`domain = [Enzyme]` on hasCofactor means: anything with a cofactor is *thereby inferred* to be an Enzyme"]},yd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"Dublin Core — what is it?",short:"the general vocabulary for bibliographic metadata — title, creator, licence, source",say:"A small, long-established vocabulary of general descriptive properties — title, description, creator, publisher, date, licence, rights, source — maintained by the Dublin Core Metadata Initiative. The modern terms live under `http://purl.org/dc/terms/`, prefixed `dcterms:`. It commits to no domain, which is why richer profiles such as DCAT build their descriptive layer out of it.",glossary:["dublin-core"],heard:["Dublin Core","dcterms","dcterms:title","dcterms:license","dcterms:source","DCMI Metadata Terms"],warn:"Two namespaces exist: the legacy `dc:` elements (`purl.org/dc/elements/1.1/`)…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["dcat-undocumented","def-dcat","def-dcat-ap-plus","def-cc-by-4-0","def-spdx-licence-iri","def-prov-o","def-skos"],points:["`data/dataset.ttl` carries the dataset's title, description, licence, rights, publisher, creator and its four `dcterms:source` databases. `build_reasoned_graph` also injects `dcterms:license` and `dcterms:title` onto the ontology header, because Owlready2 will not carry them through.","`dcterms:license <http://creativecommons.org/licenses/by/4.0/>`"]},md={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"Dunathan hypothesis — what is it?",short:"which bond breaks at the α-carbon is set by which one points perpendicular to the ring",say:"Harmon Dunathan's 1966 proposal that a PLP enzyme chooses its reaction stereoelectronically. The substrate is held so the bond about to break at the α-carbon lies perpendicular to the plane of the pyridine ring; only that alignment lets the developing negative charge overlap the ring's π system. Rotate the substrate and a different bond breaks, so the protein, not the cofactor, picks the chemistry.",glossary:["dunathan-hypothesis"],heard:["Dunathan hypothesis","Dunathan stereoelectronic hypothesis","Dunathan","stereoelectronic control","perpendicular alignment"],warn:"BACKGROUND — It explains which reaction, not which substrate. Substrate scope…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["plp-cofactor","def-plp","def-electron-sink","def-alpha-carbon","def-active-site","def-internal-external-aldimine","def-hascofactor"],points:["Not in the tree, and the structural argument behind a modelling choice: `hasCofactor` and `kineticMechanism` both sit on `Enzyme`, because what a PLP enzyme does is decided by the geometry the protein imposes and not by the cofactor it carries."]},gd={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"EBI — what is it?",short:"EMBL's bioinformatics institute — the curating body behind ChEBI",say:"The European Bioinformatics Institute, EMBL's outstation at Hinxton, is a public research infrastructure that curates and hosts much of the reference data in molecular biology — ChEBI, Ensembl, PDBe, the Ontology Lookup Service, and UniProt jointly with SIB and PIR. Its relevance to identifiers is institutional: a PURL persists because a body of this kind commits to keeping it resolving.",glossary:["ebi"],heard:["EBI","European Bioinformatics Institute","EMBL-EBI"],warn:"BACKGROUND — The UniProt SPARQL endpoint this project federates against is…",see:["def-chebi","def-uniprot","def-ols","def-purl","def-sib","def-obo-foundry"],points:["Named only in the dataset's attribution: `data/dataset.ttl` requires citing ChEBI as Hastings et al., EMBL-EBI. No EBI service is called at build or request time — ChEBI identifiers were verified by hand and then frozen into `reference_data.py`."]},wd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"EC 1.4.1.2 vs 1.4.1.3 vs 1.4.1.4 — what is it?",short:"three glutamate dehydrogenases, separated by which redox cofactor each accepts",say:"IUBMB splits glutamate dehydrogenase by cofactor specificity: EC 1.4.1.2 uses NAD+, EC 1.4.1.4 uses NADP+, and EC 1.4.1.3 accepts either — the dual-specificity form, which is the human mitochondrial enzyme. The chemistry is the same oxidative deamination of L-glutamate in each. They are separate classes because EC classifies by the reaction catalysed, and the cofactor is part of that reaction.",glossary:["ec-1-4-1-2-vs-1-4-1-3-vs-1-4-1-4"],heard:["EC 1.4.1.2 vs 1.4.1.3 vs 1.4.1.4","EC 1.4.1.3","EC 1.4.1.4","NAD+ vs NADP+","GDH cofactor specificity","dual-cofactor GDH"],warn:"The graph names an NAD+-specific class while carrying no NAD+: only two species…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["negative-control","def-glutamate-dehydrogenase","def-ec-number","def-iubmb","def-negative-control","def-redox-cofactor","def-cofactor"],points:["The negative control is specifically EC 1.4.1.2, held once as `reference_data.NEGATIVE_CONTROL_EC` and labelled `glutamate dehydrogenase (NAD+)` on `tacat:EC_1_4_1_2`. Why that member rather than 1.4.1.3 is nowhere recorded in the tree — a deliberate-looking choice with no written rationale behind it.",'`tacat:EC_1_4_1_2 a ec:1.4.1.2 ; rdfs:label "glutamate dehydrogenase (NAD+)"`']},bd={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"EC number — what is it?",short:"four-level classification of an enzyme *activity*, not of a protein",say:"An Enzyme Commission number is a four-level dotted code assigned by the IUBMB that classifies a catalysed transformation: class, subclass, sub-subclass, then a serial number for the specific reaction. Because it names an activity, its relation to real proteins is many-to-many — unrelated proteins in different organisms share one EC number, and one protein can carry several.",glossary:["ec-number"],heard:["EC number","Enzyme Commission number","EC 2.6.1.1","enzyme:2.6.1.2"],warn:"Three reactions is not three proteins. GOT1 carries both 2.6.1.1 and 2.6.1.3…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["weak-got1","mint-vs-reuse","def-iubmb","def-uniprot","def-got1-p17174","def-transferase","def-up-enzyme","def-systematic-name"],points:["The three reactions are EC 2.6.1.1, 2.6.1.2 and 2.6.1.3; the negative control is 1.4.1.2. IRIs come from UniProt rather than ExPASy or IntEnz, because that is a real `up:Enzyme` OWL class with the hierarchy materialised as `rdfs:subClassOf` and because Rhea already emits it. There is no OBO ontology for EC numbers.","`<http://purl.uniprot.org/uniprot/P24298> up:enzyme <http://purl.uniprot.org/enzyme/2.6.1.2>`"]},vd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"electron sink — what is it?",short:"PLP's ring pulling charge away — how the cofactor stabilises the carbanion",say:"A group that absorbs negative charge developing elsewhere in a molecule by delocalising it over itself. In PLP catalysis the protonated ring nitrogen makes the pyridine strongly electron-withdrawing, so the charge left behind when the α-proton is removed is spread into the ring instead of sitting on carbon. Without that, removing the proton would cost far too much.",glossary:["electron-sink"],heard:["electron sink","pyridinium nitrogen","electron withdrawal","carbanion stabilisation","electrophilic catalyst"],warn:"BACKGROUND — The sink is the ring, not the Schiff base. The imine only connects…",see:["plp-cofactor","def-plp","def-internal-external-aldimine","def-alpha-carbon","def-cofactor","def-dunathan-hypothesis","def-half-reaction"],points:["The mechanism under the wording the bank already uses. The PLP entry says the cofactor works through a Schiff base that stabilises the carbanion intermediate; the electron sink is *how* — the Schiff base connects substrate to ring, and the ring takes the charge. The submitted tree describes no mechanism at this depth."]},_d={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"EMMO — what is it?",short:"a large OWL 2 DL upper ontology for materials science — considered, not imported",say:"A top-level ontology for materials science, modelling and manufacturing, written in OWL 2 DL with opaque `EMMO_<uuid>` identifiers over a foundational layer of mereotopology and semiotics. It is the reference upper ontology across several European materials-modelling and NFDI efforts, and domain vocabularies are expected to be aligned beneath it rather than to stand alone.",glossary:["emmo"],heard:["EMMO","Elementary Multiperspective Material Ontology","European Materials Modelling Ontology"],warn:"NOT USED HERE — The claim is awareness recorded in the decision record, not…",refs:[{kind:"code",rel:"decided-in",at:"DECISIONS.md"},{kind:"source",rel:"cited-as",at:"EMMO"}],see:["why-not-emmo","nary-vs-reac4cat","def-upper-ontology","def-bfo","def-reac4cat","def-owl-2-dl","def-opaque-identifier","def-qudt-om-2"],points:["Not imported. `DECISIONS.md` records the ontology as standalone rather than aligned to EMMO or Reac4Cat: for a three-reaction demo, clarity beat alignment, and it is named as the first thing to fix for real use. Importing an upper ontology means honouring every axiom it brings."]},kd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"enantiomeric excess (ee) — what is it?",short:"how far a product is from a 50/50 mixture of mirror images, as a percentage",say:"Enantiomeric excess states how much one enantiomer exceeds the other: the difference between the two amounts as a fraction of their total, given as a percentage. A racemic mixture is 0% ee, a single enantiomer 100%. It is the figure a chiral synthesis is judged on, because a regulator wants to know how much of the unwanted mirror image a drug substance carries.",glossary:["enantiomeric-excess"],heard:["enantiomeric excess (ee)","ee","enantiopurity","optical purity","enantiomeric ratio","e.e."],warn:"BACKGROUND — A property of a process, not of an enzyme, and a measurement — the…",see:["omega-transaminase","ask-lara-or-alongside","def-chirality-chiral-amine","def-sitagliptin","def-directed-evolution-engineered-enzyme","def-omega-transaminase-vs-alpha-transaminase","def-km-kcat-catalytic-efficiency"],points:["Not in the tree, and not modellable here — the graph holds no quantities of any kind. It is the number in which the industrial case for transaminases is actually stated: the enzyme is itself chiral, so it delivers one enantiomer where an ordinary catalyst delivers a mixture to be separated."]},qd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"entailment — what is it?",short:"everything a graph commits you to beyond the triples it literally states",say:"A graph entails a triple when that triple must hold given the asserted triples plus the semantics of the vocabulary they use. An *entailment regime* names which semantics are in force — simple, RDFS, OWL RL, OWL 2 DL — and therefore how much a query or a validator sees beyond the raw data. Adding one axiom adds facts everywhere it applies, whether or not those facts were wanted.",glossary:["entailment"],heard:["entailment","entailment regime","entails","RDFS entailment","OWL entailment"],warn:"An entailment you did not want is still yours. `skos:semanticRelation` entails…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["why-both-owl-shacl","open-world-caveat","def-shacl","def-skos-mapping-property","def-deductive-closure","def-reasoner","def-materialise","def-owl"],points:['The SHACL run is over the asserted graph with no entailment, and three upper-bound shapes in `data/shapes.ttl` say so in comments because they hold only under that assumption: importing ChEBI would give every entity several matching `CHEBI_nnnn` types and turn "exactly one" into a violation everywhere.',"`sh:qualifiedMaxCount 1` on a ChEBI type — true today, false the moment ChEBI's own subclass hierarchy is imported"]},Id={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"enzyme immobilisation — what is it?",short:"fixing an enzyme to a solid support so it stays in the reactor and can be reused",say:"Attaching an enzyme to a solid carrier — adsorbed, covalently coupled, entrapped in a gel, or cross-linked into aggregates — so it stays put while substrate flows past and product flows out. It makes an expensive catalyst recoverable and reusable and usually raises its stability, at some cost in activity because the support restricts access to the active site. It is a property of the preparation, not of the protein.",glossary:["enzyme-immobilisation"],heard:["enzyme immobilisation","immobilised enzyme","immobilization","carrier binding","entrapment","CLEA"],warn:"BACKGROUND — An immobilised enzyme is the same protein with the same EC number…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["def-out-of-scope-questions","def-lara-larasuite","def-km-kcat-catalytic-efficiency","def-active-site","def-directed-evolution-engineered-enzyme"],points:['Not modelled, and said so. `OUT_OF_SCOPE_QUESTIONS` pairs purification and immobilisation with "Requires a laboratory-process model — protocols, steps, materials, equipment. This is precisely LARA’s domain and the natural direction of extension."']},Ad={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"Enzyme — what is it?",short:"the class of the catalysts — one individual per EC number here, not per protein",say:"A reaction model needs a class for the catalyst, kept separate from the reaction it catalyses and from the molecules that react. What its members stand for is a modelling decision with consequences: keyed on an activity, one member covers every protein carrying that activity; keyed on a protein, one activity is spread across many members. The two cannot both be true of one class.",glossary:["enzyme"],heard:["Enzyme","tacat:Enzyme","EnzymeShape","EC_2_6_1_2","enzyme individual"],warn:"One individual per EC number, so the model cannot say GOT1 carries both 2.6.1.1…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["weak-got1","plp-cofactor","def-ec-number","def-got1-p17174","def-biochemicalreaction","def-hascofactor","def-kineticmechanism","def-systematic-name"],points:["`tacat:Enzyme` in `schema.py`, reached from a reaction by `catalysedBy`. It is the domain of `hasCofactor`, `kineticMechanism` and `systematicName` — the properties belonging to the catalyst rather than the transformation. Four individuals, one per EC number, and `EnzymeShape` targets it.","tacat:EC_2_6_1_2 a ec:2.6.1.2, tacat:Enzyme ; tacat:hasCofactor tacat:CHEBI_597326 ."]},Cd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"equilibrium (position vs rate) — what is it?",short:"where forward and reverse rates match — set by thermodynamics, never by the catalyst",say:"A reversible reaction reaches equilibrium when the forward and reverse rates are equal and the concentrations stop changing. Where that point lies is fixed by the free-energy difference between the two sides and by the concentrations present. How fast it is reached is a separate question. A catalyst answers only the second: it accelerates both directions equally and emerges unchanged, so it cannot shift the position.",glossary:["equilibrium"],heard:["equilibrium (position vs rate)","chemical equilibrium","equilibrium position","reversibility","thermodynamic control"],warn:'"Reversible" does not mean "runs both ways in the cell". Which way material…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["weak-direction","direction-alaa","def-km-kcat-catalytic-efficiency","def-product-inhibition","def-reversibilitykind","def-rhea-master-and-directional-children","def-transaminase","def-half-reaction"],points:['This is why reversibility is modelled on the reaction and not on the enzyme: `hasReversibility` is domained on `BiochemicalReaction`, and its range is `ReversibilityKind` — a controlled term rather than a boolean, because "reversible in principle, irreversible physiologically" is a real distinction for transaminases.']},xd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"ETL — what is it?",short:"pull data out of a source, reshape it, load it into your own store — the copy federation avoids",say:"Extract, Transform, Load. The standard data-integration pattern: pull records out of a source system, reshape them, and write them into a store you control. It buys query speed and independence from the source's uptime, and costs a copy that goes stale plus a licence question about redistributing someone else's data.",glossary:["etl"],heard:["ETL","extract-transform-load","ELT","data copy","harvesting"],warn:"NOT USED HERE — The claim is about the federated question. The build pipeline…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"}],see:["federated-payoff","def-federation","def-sib","def-uniprot","def-rhea","def-notjoinable"],points:['Not the route taken for the organism question. `queries/federated.py` joins the local graph to SIB\'s live Rhea and UniProt endpoints, so no UniProt rows are held here — its docstring says "no ETL, no data copy, no agreement with anyone". What is copied is a small set of hand-verified identifiers in `reference_data.py`.']},Td={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"EU Publications Office authority tables — what is it?",short:"the EU's published controlled vocabularies — one IRI per code, which DCAT-AP requires you cite",say:"Named Authority Lists — 'authority tables' — are the controlled vocabularies the Publications Office of the European Union maintains for values that recur in European metadata: frequencies, file types, languages, licences. Each code is a dereferenceable IRI under `publications.europa.eu/resource/authority/`, published as SKOS, so a profile can demand an IRI where a bare string would sit.",glossary:["eu-publications-office-authority-tables"],heard:["EU Publications Office authority tables","Named Authority List","NAL","EU Vocabularies","publications.europa.eu/resource/authority","authority table","EU controlled vocabulary"],warn:"The IRIs are `http://`, not `https://`; normalising the scheme breaks the join.…",see:["dcat-undocumented","def-dcat-ap-plus","def-dcat","def-skos","def-shacl","def-purl","def-iri"],points:["`data/dataset.ttl` cites two codes: `frequency/NEVER` on `dcterms:accrualPeriodicity` — the code for a dataset never updated — and `file-type/RDF_TURTLE` on the Turtle distribution's `dcterms:format`. `data/shapes.ttl` says why the full DCAT-AP shapes were not imported: they need these tables preloaded to pass.","`dcterms:accrualPeriodicity <http://publications.europa.eu/resource/authority/frequency/NEVER>`"]},Ed={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"event loop / thread pool — what is it?",short:"one thread runs every async handler in turn, so blocking work must move to worker threads",say:"An async server runs all of its coroutines on a single event-loop thread, switching between them at `await` points. A call that blocks — CPU-bound work, synchronous I/O — never yields, so it stalls every other request on that loop rather than only its own. A thread pool is the escape: the blocking call runs on a worker thread and the loop keeps serving.",glossary:["event-loop-and-thread-pool"],heard:["event loop / thread pool","asyncio","async def","run_in_threadpool","blocking the event loop"],warn:"Moving the query off the loop is not a timeout. rdflib offers no way to…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["def-fastapi","def-uvicorn","def-liveness-probe","def-rdflib","def-api"],points:["`POST /sparql` is `async def`, so it defers to `run_in_threadpool`: rdflib's query engine is synchronous and CPU-bound. `GET /sparql` is a plain `def`, which Starlette already runs in a thread pool. Earlier, a slow query blocked every request including `/health`, so the container could call itself unhealthy."]},Rd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"exfiltration / blind vs non-blind SSRF — what is it?",short:"whether the attacker gets the fetched response back, or only its side effects",say:"In a blind SSRF the server makes the attacker's request but the response never reaches them; they infer what happened from timing, error text or an out-of-band callback. In a non-blind one the response body comes back, so the server is a proxy into whatever it can reach and the data leaves — that is exfiltration. The severity of the two differs sharply.",glossary:["exfiltration-blind-vs-non-blind-ssrf"],heard:["exfiltration / blind vs non-blind SSRF","blind SSRF","non-blind SSRF","data exfiltration","out-of-band"],warn:"State the precise severity, not a larger one. The fix lives on a branch that…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"}],see:["ssrf-service","scanner-guard-failures","def-ssrf","def-scanner-tokeniser","def-iriref","def-querypolicy","def-bare-keyword"],points:["The submitted scanner does not handle a backslash-escaped quote, so a literal closes one character early and a following `SERVICE` clause is never seen. Verified end to end: the server fetched a caller-chosen host, and against a target that speaks SPARQL the caller gets 200 and its data. Non-blind, with exfiltration."]},Sd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"existential and value restrictions — what is it?",short:"`.some(C)` means at least one link to a C; `.value(i)` means a link to that one individual",say:"In OWL a class can be built from a restriction on a property rather than named outright. An *existential* restriction — `owl:someValuesFrom`, written `p.some(C)` in Owlready2 — is the set of things with at least one `p` link to a member of C. A *value* restriction — `owl:hasValue`, `p.value(i)` — is the set of things with a `p` link to one named individual. Both are class expressions, usable anywhere a class name is.",glossary:["existential-restriction-and-value-restriction"],heard:["existential and value restrictions","existential restriction","owl:someValuesFrom",".some()","class expression","exists"],warn:'`.some` is not "exactly one" and not "only". It sets no upper bound and forbids…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","signature-not-mechanism","def-hasvalue-restriction","def-owl","def-defined-class","def-cardinality","def-necessary-and-sufficient-conditions","def-signature"],points:["Every conjunct of `TransaminationReaction` is an existential restriction whose filler is itself a conjunction containing a value restriction: some participant, whose entity is an amino acid, whose role is *that* reactant individual (`src/tacat/ontology/schema.py`).","`hasParticipant.some(ReactionParticipant & participatingEntity.some(AminoAcid) & participantRole.value(reactant))`"]},Od={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"EXPTIME — what is it?",short:"problems solvable in time exponential in input size — the worst case for expressive DL reasoning",say:"The class of decision problems a deterministic machine solves in time bounded by an exponential in the input size. Description-logic reasoning sits at or above it for the expressive dialects: deciding consistency in SROIQ, the logic behind OWL 2 DL, is N2ExpTime-complete, while the lightweight EL profile is polynomial. It is a worst-case bound over a whole ontology.",glossary:["exptime"],heard:["EXPTIME","ExpTime","exponential time","N2ExpTime"],warn:"BACKGROUND — A worst-case class is not this ontology's cost — the T-Box here is…",see:["build-time-reasoning","def-reasoner","def-hermit","def-owl-2-dl","def-description-logic","def-materialise"],points:["Cited as the reason reasoning runs once at image-build time rather than in the request path. The derived types are materialised into `data/reactions.ttl`, so the endpoint answers `?r a tacat:TransaminationReaction` by plain triple matching with no reasoner near a request."]},Pd={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"FAIR — what is it?",short:"Findable, Accessible, Interoperable, Reusable — the research-data principles",say:"Findable, Accessible, Interoperable, Reusable: four principles for publishing research data, set out by Wilkinson and colleagues in 2016 and adopted across the NFDI. They are aimed at machines as much as at people — data is findable and interoperable because it carries globally unique persistent identifiers and uses shared vocabularies, not because a human can download it.",glossary:["fair"],heard:["FAIR","FAIR principles","FAIR data","Findable Accessible Interoperable Reusable"],warn:"FAIR is not open. `data/dataset.ttl` licences the graph CC BY 4.0, but a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["mint-vs-reuse","federated-payoff","def-chebi","def-rhea","def-uniprot","def-iri","def-dcat-ap-plus","def-cc-by-4-0"],points:["The claim rests on reusing identifiers rather than minting them: ChEBI, Rhea and UniProt IRIs are carried on the individuals, which is what makes the federated query possible at all. CQ10 and CQ11 exist because those identifiers are the FAIR claim, so they belong in the specification and not only in the data."]},jd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"FastAPI — what is it?",short:"Python ASGI web framework deriving validation and an OpenAPI schema from type hints",say:"A Python web framework built on Starlette and Pydantic. Route handlers are ordinary functions whose type annotations declare the request parameters, and the framework derives parsing, validation and an OpenAPI description from them — so the API documentation is generated from the code rather than maintained beside it.",glossary:["fastapi"],heard:["FastAPI","ASGI","Starlette"],warn:"A plain `def` handler runs in a thread pool; an `async def` one runs on the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["def-uvicorn","def-application-factory-injectable-dependency","def-event-loop-and-thread-pool","def-openapi","def-api","def-cors"],points:["`create_app()` builds the application with an injectable repository and policy. `/docs` is the Swagger UI FastAPI ships free, but it loads its assets from a CDN, so the self-contained console at `/` exists for a container that must run with no network."]},Ld={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"federation — what is it?",short:"one query answered across several endpoints, joined automatically over HTTP",say:"Federation evaluates part of a SPARQL query against a remote endpoint and joins the result into the local answer. The `SERVICE` keyword names the endpoint. The join happens on shared IRIs, so it only works where both sides use the same identifier for the same thing — which makes identifier reuse the precondition, not a style preference. No data is copied and no agreement with the remote operator is needed.",glossary:["federation"],heard:["federation","SERVICE","federated query","cross-database join"],warn:"The served endpoint refuses a plain `SERVICE`, but the scanner mishandles a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"}],see:["federated-payoff","ssrf-service","scanner-guard-failures","def-sparql","def-rhea","def-uniprot","def-ssrf","def-etl","def-iri","def-notjoinable"],points:["`SUMMARY_QUERY` in `queries/federated.py` joins the local graph's Rhea master IRIs against live UniProt at SIB, counting reviewed proteins per reaction. `run()` falls back to a cached summary and says so loudly. `NotJoinable` is raised when the built graph carries no Rhea IRI, rather than quietly using the constants.","`SERVICE <https://sparql.uniprot.org/sparql> { ?protein up:annotation/up:catalyticActivity/up:catalyzedReaction ?rhea }`"]},Nd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"FOAF — what is it?",short:"Friend of a Friend — the small, old vocabulary for naming people and organisations",say:"A lightweight RDF vocabulary for describing people, organisations and the ties between them: `foaf:Person`, `foaf:Organization`, `foaf:name`, and `foaf:mbox` for an email address. It predates most of the W3C metadata stack and survives inside dataset catalogues because Dublin Core and DCAT name the creator relation without saying anything about the agent at the far end of it.",glossary:["foaf"],heard:["FOAF","foaf:","friend of a friend","foaf:Person","foaf:Organization","foaf:name","foaf:mbox"],warn:"`dcterms:creator` and `dcterms:publisher` do the pointing; FOAF only says what…",refs:[{kind:"source",rel:"identified-as",at:"http://xmlns.com/foaf/0.1/"}],see:["weak-provenance","dcat-undocumented","def-dcat","def-dublin-core","def-prov-o","def-dcat-ap-plus","def-shacl","def-iri"],points:["`data/dataset.ttl` uses it for two nodes only: `#creator`, typed `foaf:Person` and `prov:Agent`, and `#publisher`, typed `foaf:Organization` and `prov:Agent`. It is the fourth metadata vocabulary in that file after DCAT, Dublin Core and PROV-O, and the only one no shape in `data/shapes.ttl` mentions.",'<...#publisher> a foaf:Organization, prov:Agent ; foaf:name "Bitspark" .']},Dd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"frozen dataclass — what is it?",short:"a Python record class whose fields cannot be reassigned after construction",say:"A class built by `@dataclass(frozen=True)`. Its generated `__setattr__` raises `FrozenInstanceError`, so an instance cannot be mutated after `__init__`, and the class gets a `__hash__` so instances work as dict keys and set members. Adding `slots=True` also forbids attributes the class did not declare.",glossary:["frozen-dataclass"],heard:["frozen dataclass","@dataclass(frozen=True)","FrozenInstanceError","slots=True","immutable record"],warn:"Frozen is shallow. A mutable field — a list, a dict — held by a frozen instance…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"}],see:["def-querypolicy","def-chemicalentity","def-reference-data-checksum","def-accession"],points:["`reference_data.py` declares its record types `@dataclass(frozen=True, slots=True)`: every external identifier in the graph is constructed once, in one module, and no later stage can edit it. `QueryPolicy` is frozen for the same reason — the rules a request is checked against cannot be altered by a handler."]},Bd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ΔG°′ and Keq ≈ 1 for transamination — what is it?",short:"swapping an amino group for a keto group costs almost nothing, so the reaction sits near 1:1",say:"The equilibrium constant Keq and the standard free-energy change ΔG°′ are two ways of saying where a reaction settles. In an α-transamination both sides carry the same bonds rearranged — an amino group and a keto group exchanged between two carbon skeletons — so ΔG°′ is close to zero and Keq close to one. Which way material actually flows is then set by concentrations.",glossary:["g-and-keq-1-for-transamination"],heard:["ΔG°′ and Keq ≈ 1 for transamination","Keq","equilibrium constant","standard free-energy change","delta G","near-equilibrium reaction"],warn:"BACKGROUND — Near-equilibrium is not the same as bidirectional in a cell.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["weak-direction","direction-alaa","def-equilibrium","def-reversibilitykind","def-km-kcat-catalytic-efficiency","def-rhea-master-and-directional-children","def-alaa-alt1","def-transaminase"],points:["Why all three reactions can carry `hasReversibility tacat:Reversible` and have that be defensible rather than a guess. No number backs it in the graph: reversibility is a controlled term of `ReversibilityKind`, and the model holds no thermodynamic or kinetic quantity at all."]},Md={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"geminal diamine — what is it?",short:"the tetrahedral intermediate of transaldimination, two amines on one PLP carbon",say:"In a PLP enzyme the cofactor's imine is handed from the active-site lysine to the incoming substrate. Halfway through that exchange both nitrogens are bonded to the same carbon — the cofactor's C4' — giving a tetrahedral sp3 intermediate carrying two amine substituents: the geminal diamine. It can collapse either way, which is why transaldimination is reversible, and it is traversed again when the lysine is restored.",glossary:["geminal-diamine"],heard:["geminal diamine","gem-diamine","transaldimination intermediate","diamine intermediate"],warn:"BACKGROUND — Not the external aldimine and not the quinonoid. It is the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"decided-in",at:"CHANGELOG.md"}],see:["plp-cofactor","def-half-reaction","def-internal-external-aldimine","def-plp","def-active-site","def-quinonoid-intermediate","def-ketimine"],points:['The mechanistic step behind a correction the project already volunteers. The submitted `hasCofactor` docstring says PLP cycles "while covalently bound to an active-site lysine", which describes the resting state; CHANGELOG.md records the corrected wording. The geminal diamine is where that bond is actually broken.']},Hd={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"gene symbol vs protein accession — what is it?",short:"three naming systems at once — a gene symbol, a protein accession and an EC number",say:"A gene symbol is a short mnemonic for a gene, assigned by a nomenclature body such as HGNC, or by a genome annotation: `GOT1`, `aspC`, `alaC`. A UniProt accession such as `P17174` names one protein entry. An EC number names a catalytic activity. The three are not interchangeable — one gene can yield several protein entries, one protein several EC numbers, and one EC number spans every organism with the activity.",glossary:["gene-symbol-vs-protein-accession"],heard:["gene symbol vs protein accession","gene symbol","gene name","HGNC symbol","locus tag","gene vs protein"],warn:"A gene symbol is not unique across organisms, and its casing carries meaning…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["mint-vs-reuse","def-accession","def-ec-number","def-up-mnemonic","def-uniprot","def-isozyme-isoenzyme","def-orthologue-paralogue"],points:["The graph carries accessions and EC numbers only: no gene symbol appears anywhere in `reactions.ttl`. Two are named in `reference_data.py` comments — `aspC` for `P00509` and `alaA` for `P0A959` — so a question asked in gene symbols has to be translated by hand before the data can answer it.","`GOT1` names the gene, `P17174` the protein, `EC 2.6.1.1` the activity"]},zd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"GitLab runner — what is it?",short:"the agent process that claims CI jobs and executes them, on a chosen executor",say:"A daemon registered to a GitLab instance that picks up queued CI jobs and runs them. Its executor decides how — a Docker container per job, a shell on the host, a Kubernetes pod. Shared runners are multi-tenant machines the instance provides; a self-hosted runner is yours, and only it can be given elevated privileges such as a Docker socket.",glossary:["gitlab-runner"],heard:["GitLab runner","shared runner","self-hosted runner","executor","runner tags"],warn:"A green pipeline on one instance is not evidence about another. That is the…",see:["ci-data-gates","def-ci-cd","def-kaniko","def-services","def-container-registry-image-tag-latest","def-smoke-test"],points:["`.gitlab-ci.yml` is deliberately instance-independent: no runner tags, and no privileged runner needed. Kaniko builds the image rather than Docker-in-Docker, and the smoke job reaches the pushed image through `services:` rather than a Docker socket, so the same file runs unchanged on gitlab.com shared runners."]},Fd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"glucose–alanine (Cahill) cycle — what is it?",short:"muscle exports nitrogen as alanine; the liver turns it back into pyruvate for glucose",say:"A two-organ loop. Working muscle transaminates pyruvate to L-alanine so that surplus nitrogen leaves the tissue without free ammonia ever forming; the liver runs alanine transaminase the other way, recovering pyruvate for gluconeogenesis and passing the nitrogen into the urea cycle. The glucose made returns to muscle. One enzyme, one reaction, opposite directions in two tissues.",glossary:["glucose-alanine-cycle"],heard:["glucose–alanine (Cahill) cycle","Cahill cycle","glucose-alanine cycle","alanine cycle"],warn:"BACKGROUND — Not modelled and not claimed. Direction lives in UniProt's…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["direction-alaa","weak-direction","def-alaa-alt1","def-l-alanine","def-pyruvate","def-alt-ast","def-equilibrium","def-reversibilitykind"],points:["The physiological setting for the direction argument the submission makes: the same reaction genuinely runs both ways, which is what CQ07 shows formally when L-glutamate comes back as both reactant and product. The graph itself asserts only `hasReversibility tacat:Reversible` — no tissue, no compartment, no direction."]},Ud={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"glutamate dehydrogenase (GDH, EC 1.4.1.2) — what is it?",short:"the negative control — it strips the amino group off as ammonia instead of transferring it",say:"An enzyme that oxidatively deaminates L-glutamate: L-glutamate + H2O + NAD+ ⇌ 2-oxoglutarate + NH4+ + NADH + H+ (RHEA:15133). The amino group is not handed to a partner molecule, it leaves as free ammonium, and the electrons go to a redox cofactor. So it consumes an amino acid and produces a 2-oxo acid, but there is no 2-oxo-acid substrate and no amino-acid product: a deamination, not a group transfer.",glossary:["glutamate-dehydrogenase"],heard:["glutamate dehydrogenase (GDH, EC 1.4.1.2)","GDH","EC 1.4.1.2","glutamate dehydrogenase (NAD+)","oxidative deamination"],warn:"Only two of its seven species are modelled; the cofactors were left out, and…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_negative_control_is_excluded"}],see:["negative-control","def-negative-control","def-redox-cofactor","def-ammonia-ammonium","def-2-oxoglutarate","def-transferase","def-arity","def-defined-class"],points:["The negative control, `REACT_0000099`, added by `_add_negative_control`. It carries both headline molecules of the transaminations with their roles reversed — L-glutamate consumed, 2-oxoglutarate produced — so any definition keyed on which molecules are present would have swallowed it whole.",'`tacat:REACT_0000099 rdfs:label "glutamate dehydrogenase reaction (negative control, partial)"`']},Gd={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"GOT1 / P17174 — what is it?",short:"the human aspartate transaminase protein, which also carries the cysteine activity",say:"GOT1 is the gene symbol for human cytosolic glutamic-oxaloacetic transaminase — the aspartate transaminase, EC 2.6.1.1, UniProt accession `P17174`. In mammals EC 2.6.1.3, cysteine transaminase, is not a distinct gene product: it is a secondary activity of that same protein. One protein therefore carries two EC numbers.",glossary:["got1-p17174"],heard:["GOT1 / P17174","P17174","glutamic-oxaloacetic transaminase 1","cytosolic AST"],warn:"Volunteer this rather than defend it. It is a divergence between reference data…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"source",rel:"identified-as",at:"UniProt:P17174"}],see:["weak-got1","def-uniprot","def-ec-number","def-enzyme","def-p00505","def-up-enzyme","def-alaa-alt1","def-accession","def-universal-vs-particular"],points:["`reference_data.py` records this correctly — `P17174` appears in the UniProt tuple of both the aspartate and the cysteine reaction, and `linking.py` emits two `up:enzyme` triples for it. The builder nevertheless mints three Enzyme individuals keyed on EC number, so the data knows something the model cannot express.",'`uniprot=("P17174", "P13221")` on the cysteine reaction, and `P17174` again on the aspartate one']},Wd={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"graph isomorphism vs byte equality — what is it?",short:"two reproducibility claims — the same graph, or the same file",say:"Two RDF graphs are isomorphic when their blank nodes can be matched one-to-one so that the triple sets are identical — the same graph, whatever the blank nodes are called and whatever order the triples were written in. Byte equality is the stronger, purely syntactic claim that two serialisations are the same file. Isomorphism is the semantic property; byte equality is what a checksum or an image digest depends on.",glossary:["graph-isomorphism-vs-byte-equality"],heard:["graph isomorphism vs byte equality","isomorphic","rdflib.compare.isomorphic","byte-for-byte","deterministic build"],warn:"Neither can see a difference that varies between processes: both build twice…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_reproducibility.py::test_build_is_byte_reproducible"}],see:["weak-reproducibility","def-blank-node","def-container-registry-image-tag-latest","def-turtle","def-reference-data-checksum","def-commit-sha-and-checksum","def-data-gate-vs-code-gate"],points:["`tests/test_reproducibility.py` asserts both — `test_build_is_semantically_reproducible` compares two builds with `rdflib.compare.isomorphic`, `test_build_is_byte_reproducible` compares their bytes. The `reproducible-build` CI job builds twice and runs `cmp`, because byte equality is what a registry tag depends on.","`assert isomorphic(build_reasoned_graph(), build_reasoned_graph())`"]},Kd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"graph — what is it?",short:"a set of triples — that is the entire definition",say:"A set of RDF triples. Nothing more: no ordering, no schema, no container beyond the set itself. Merging two graphs is set union, which is why data from separate sources composes without anyone negotiating a schema first, and nodes are shared by identity — two triples are about the same thing exactly when they use the same IRI.",glossary:["graph"],heard:["graph","RDF graph","knowledge graph","rdflib.Graph"],warn:"An RDF graph is a set of edges, not a diagram and not a property graph — an…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["rdflib-scaling","def-rdf","def-named-graph","def-n-ary-relation","def-property-graph","def-triple-pattern-binding","def-triplestore"],points:["One `rdflib.Graph` holds all of it. `build_reasoned_graph` assembles it from the reasoned Owlready2 world and writes `data/reactions.ttl`; the service loads that file and serves it as its single default graph, in memory, in process.","`tacat:EC_2_6_1_2 tacat:hasCofactor tacat:CHEBI_597326 .` — one triple; a graph is a set of these"]},Qd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"GraphRepository — what is it?",short:"the three operations the service needs of a graph store, stated in one place",say:"The repository pattern applied to an RDF store: a small interface naming exactly what a service asks of its data, so the service depends on that interface rather than on a concrete database. In Python it is naturally a `typing.Protocol` — structural, so an implementation satisfies it by having the right methods rather than by inheriting.",glossary:["graphrepository"],heard:["GraphRepository","repository pattern","as_rdflib_graph","store contract","Protocol"],warn:"Not a portability layer. rdflib already ships `SPARQLStore`, so pointing at…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/repository.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/store/memory.py"}],see:["rdflib-scaling","def-seam","def-rdflib","def-sparql-clients","def-triplestore-products","def-triplestore","def-pyshacl"],points:["`store/repository.py` declares three members: `query`, `__len__` and `as_rdflib_graph`, the last a named escape hatch because pySHACL needs a concrete `Graph`. Read-only by omission — no `add`, `remove` or `update` — so a handler holding one cannot mutate the graph. `InMemoryGraphRepository` is the implementation."]},Vd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"Haldane relationship — what is it?",short:"the kinetics of the two directions are tied to Keq — they are not independently free",say:"For a reversible enzyme the forward and reverse kinetic constants cannot be chosen separately: their combination is fixed by the reaction's equilibrium constant, because a catalyst accelerates both directions equally and cannot move the equilibrium. Any complete set of measured parameters must therefore reproduce Keq, which makes the relationship a consistency check on kinetic data as much as a piece of theory.",glossary:["haldane-relationship"],heard:["Haldane relationship","Haldane equation","Haldane relation"],warn:"BACKGROUND — It constrains parameters, not flux. Which way material actually…",see:["weak-direction","def-equilibrium","def-km-kcat-catalytic-efficiency","def-reversibilitykind","def-michaelis-menten-equation-vmax-initial-rate-assumption","def-rhea-master-and-directional-children"],points:["The quantitative form of a claim the graph makes qualitatively. All three reactions carry `hasReversibility tacat:Reversible` and no kinetics at all, so asked *reversible in what sense*, the honest answer is thermodynamic — nothing in the submission constrains the two directions numerically.","`Keq = (kcat_f · KM_r) / (kcat_r · KM_f)`"]},Jd={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"half-reaction — what is it?",short:"one of the two self-contained stages a ping-pong mechanism is split into",say:"In enzyme kinetics, a half-reaction is one of the two stages a ping-pong mechanism divides into. The first consumes one substrate and releases one product, leaving the enzyme in a chemically modified state; the second consumes the other substrate and restores the enzyme to how it started. Each half is a complete chemical step, which is why the two substrates are never bound at the same time.",glossary:["half-reaction"],heard:["half-reaction","half reaction","two half-reactions","first half-reaction","second half-reaction"],warn:"Not an electrochemical half-reaction. Nothing here is an oxidation or reduction…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["ping-pong-mechanism","def-ping-pong-bi-bi","def-plp","def-pmp","def-turnover-catalytic-cycle","def-internal-external-aldimine","def-amino-donor-amino-acceptor"],points:["For a transamination the first half puts the donor’s amino group onto PLP, making PMP, and releases the 2-oxo acid; the second half hands that group to 2-oxoglutarate, restoring PLP and releasing L-glutamate. Two halves, so the cofactor’s net change across the pair is zero and it does not enter the equation."]},Yd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"hasCofactor — what is it?",short:"object property linking an *enzyme* — not a reaction — to the cofactor it needs",say:"An object property relating a biological catalyst to a chemical species it requires in order to work. Where such a property is attached is a modelling decision with consequences: hung off the reaction, the cofactor becomes a participant that has to balance; hung off the enzyme, it is a standing property of the catalyst that survives from one turnover to the next.",glossary:["hascofactor"],heard:["hasCofactor","tacat:hasCofactor"],warn:"The domain is an inference rule, not a guard. Putting a reaction on the left of…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"source",rel:"identified-as",at:"CHEBI:597326"}],see:["plp-cofactor","ping-pong-mechanism","def-cofactor","def-plp","def-prosthetic-group","def-domain-and-range","def-kineticmechanism","def-object-property-vs-data-property"],points:["Declared in `src/tacat/ontology/schema.py` with `domain = [Enzyme]` and `range = [ChemicalEntity]`, so PLP hangs off each of the three enzymes and never enters an equation. That is why Rhea's equations for all three reactions have exactly four participants and none of them is PLP.","`tacat:EC_2_6_1_2 tacat:hasCofactor tacat:CHEBI_597326 .`"]},Xd={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"hasValue restriction — what is it?",short:"a class defined by a link to one *named individual* rather than to a class",say:"`owl:hasValue` builds a class expression from a property and a single named individual: the set of things with at least one link along that property to that individual — no upper bound, and no other value forbidden. Unlike an existential restriction it names an instance rather than a class, so that instance becomes part of the vocabulary: the class definition cannot be read, or satisfied, without it.",glossary:["hasvalue-restriction"],heard:["hasValue restriction","owl:hasValue",".value()","nominal"],warn:"OWL does n
