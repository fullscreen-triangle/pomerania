t explicit stoichiometry.",glossary:["reac4cat"],heard:["Reac4Cat","NFDI4Cat reaction ontology"],warn:'NOT USED HERE — The framing is "diverged, with a named trade-off", not…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","def-bfo","def-reactionparticipant","def-nfdi4cat","def-biopax-sbml","def-bridge-node","def-n-ary-relation","def-stoichiometric-coefficient","def-emmo"],points:["Not imported and not aligned to. DECISIONS.md records the divergence and the reason: a bridge node carries a stoichiometric coefficient for each participation and a role grouping does not. It also records the cost — contributing this model upstream would mean aligning to Reac4Cat first."]},rf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"ReactionParticipant — what is it?",short:"the bridge node binding one entity, one role and one coefficient into a single participation",say:'RDF triples are binary, so "L-alanine takes part in this reaction as a reactant, at one equivalent" cannot be one statement. The n-ary pattern introduces a node standing for the participation itself and hangs the entity, the role and the coefficient off it. W3C calls this Use Case 1 — a relation with attributes of its own — and BioPAX and SBML use the same shape.',glossary:["reactionparticipant"],heard:["ReactionParticipant","tacat:ReactionParticipant","participatingEntity","PART_0000002_01","hasParticipant"],warn:"All fourteen coefficients in the shipped data are 1.0. The bridge node makes…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","def-stoichiometric-coefficient","def-reac4cat","def-n-ary-relation","def-bridge-node","def-participantrole","def-biochemicalreaction","def-blank-node"],points:["`tacat:ReactionParticipant` in `src/tacat/ontology/schema.py`, reached from a reaction by `hasParticipant`. Each carries exactly one `participatingEntity`, one `participantRole` and one `stoichiometricCoefficient` — functional in OWL, required by `ReactionParticipantShape`. Named, not blank, so a report can cite it.","tacat:PART_0000002_01 tacat:participatingEntity tacat:CHEBI_57972 ; tacat:participantRole tacat:Reactant ; tacat:stoichiometricCoefficient 1.0 ."]},cf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"realisation — what is it?",short:"the reasoner step that computes, for every individual, every class it belongs to",say:"A reasoner does three things. Consistency checking asks whether all the axioms can hold at once. Classification computes the subclass lattice, including subsumptions nobody declared. Realisation is the third: for each individual, derive every class it is an instance of. It is the step that turns a defined class from a description into a recogniser.",glossary:["realisation"],heard:["realisation","realization","instance classification","individual classification"],warn:"Realisation is the A-Box step and needs individuals; classification is the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"}],see:["build-time-reasoning","step-2-infer","def-reasoner","def-hermit","def-defined-class","def-a-box","def-subsumption","def-materialise"],points:["The step the whole demonstration rests on. `tacat infer` (`src/tacat/ontology/inference.py`) lists the instances of `TransaminationReaction` before and after `sync_reasoner_hermit`: none asserted, three realised into the class afterwards, and the glutamate dehydrogenase control reported as correctly excluded.","asserted before: (none) — inferred after: alanine, aspartate, cysteine transaminase reactions"]},df={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"reasoner — what is it?",short:"a program that derives everything else that must be true from a set of logical statements",say:"A reasoner is a theorem prover for a description logic. Given a set of axioms it checks consistency, computes classification — the full subclass lattice, including subsumptions nobody wrote down — and performs realisation, working out every class each individual belongs to. It derives what must follow. It does not rank, guess, or measure similarity the way a sequence search does.",glossary:["reasoner"],heard:["reasoner","theorem prover","DL reasoner","inference engine"],warn:"Not a search and not a heuristic. If it derives nothing, the axioms did not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["build-time-reasoning","def-hermit","def-blast","def-realisation","def-entailment","def-description-logic","def-materialise"],points:['HermiT, run by Owlready2 as a Java subprocess, and only at build time. `build_reasoned_graph` materialises the inferred types into the Turtle artefact, so the runtime image ships no JVM and the SPARQL endpoint answers "which reactions are transaminations?" without reasoning at all.',"sync_reasoner_hermit(onto.world, infer_property_values=True, debug=0)"]},lf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"redox cofactor — what is it?",short:"an electron-carrying cofactor consumed by the reaction and regenerated elsewhere, not within it",say:"A redox cofactor carries electrons between reactions. NAD+ is the oxidised form and NADH the reduced form; an oxidation converts NAD+ to NADH, and the pair is regenerated elsewhere in metabolism rather than within the same catalytic cycle. Because it changes state across the reaction it is a co-substrate: it is written into the equation and counts in the mass and charge balance.",glossary:["redox-cofactor"],heard:["redox cofactor","NAD+","NADH","NAD(H)","nicotinamide adenine dinucleotide","electron carrier"],warn:"The omission weakens the control: with two participants it cannot fill four…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["negative-control","def-cofactor","def-prosthetic-group","def-glutamate-dehydrogenase","def-negative-control","def-arity","def-ammonia-ammonium"],points:["Glutamate dehydrogenase runs `L-glutamate + H2O + NAD+ = 2-oxoglutarate + NH4+ + NADH + H+`, seven species (RHEA:15133). The submitted control models two — L-glutamate in, 2-oxoglutarate out; `_add_negative_control` says why, and writes the equation without the H+.","`L-glutamate + H2O + NAD(+) = 2-oxoglutarate + NH4(+) + NADH + H(+)` — RHEA:15133; charge −2 both sides"]},hf={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"reference-data checksum — what is it?",short:"SHA-256 over the curated source module, written into the graph as what the build consumed",say:"A digest of a build’s inputs, recorded in its output so a consumer can tell which inputs produced it. Hashing the input source directly, rather than a serialised copy of it, avoids keeping a second representation that can drift from the first.",glossary:["reference-data-checksum"],heard:["reference-data checksum","reference_data_checksum()","input checksum","sha256 of reference_data.py","dcterms:identifier"],warn:"The reproducibility gate cannot catch the line-ending bug. It builds twice on…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/provenance.py"},{kind:"test",rel:"verified-by",at:"tests/test_reproducibility.py::test_reference_data_checksum_is_independent_of_line_endings"}],see:["weak-provenance","weak-reproducibility","def-commit-sha-and-checksum","def-prov-o","def-graph-isomorphism-vs-byte-equality","def-w3id-org","def-frozen-dataclass","def-smoke-test"],points:["`reference_data_checksum()` (`src/tacat/ontology/provenance.py:32`) hashes `reference_data.py` and attaches it as `dcterms:identifier` on the PROV entity for the inputs. CRLF is normalised to LF first: the raw bytes made the digest a property of the developer’s platform, not of the data.",'<https://w3id.org/bitspark/tacat/reference-data> dcterms:identifier "sha256:…" .']},ff={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"regression test — what is it?",short:"A test written from a specific bug, so that bug cannot come back unnoticed",say:"A test that stops a fixed bug from coming back. It is written after the fact, from the defect itself rather than from the specification, and its whole value is in the failure it would produce: a regression test that would still pass with the bug reintroduced is decoration.",glossary:["regression-test"],heard:["regression test","regression guard","guarding the guard"],warn:"It first asserts the corruption applied (`repointed >= 15`); without that guard…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_a_wrong_identifier_fails_at_least_one_competency_question"}],see:["identifiers-verified","mistake-owned","def-common-mode-failure","def-test-oracle","def-competency-question","def-smoke-test","def-pytest","def-parametrised-test"],points:["`test_no_identifier_is_carried_as_a_literal` guards the removed string copies of every PURL. `test_a_wrong_identifier_fails_at_least_one_competency_question` repoints every external link to `CHEBI_99999999` and asserts the suite notices — a regression test for the test suite itself.","assert repointed >= 15  # otherwise this test would pass vacuously"]},pf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"ReversibilityKind — what is it?",short:"a controlled term for reaction directionality, deliberately not a boolean",say:'Directionality is not a yes/no. BioPAX draws a three-way distinction, and biochemistry needs the reading "reversible in principle, irreversible under physiological conditions" as well. Modelling it as a class whose members are named individuals leaves room for those terms and makes the value joinable, because each term is a node other data can point at rather than a flag.',glossary:["reversibilitykind"],heard:["ReversibilityKind","tacat:ReversibilityKind","tacat:Reversible","hasReversibility"],warn:"It does not express physiological direction. That lives on Rhea’s directional…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["weak-direction","direction-alaa","def-biochemicalreaction","def-rhea-master-and-directional-children","def-equilibrium","def-alaa-alt1","def-biopax-sbml","def-object-property-vs-data-property"],points:["`tacat:ReversibilityKind` in `src/tacat/ontology/schema.py`, reached by the functional property `hasReversibility`. The submitted graph mints exactly one member — `tacat:Reversible` — given to all three transaminase reactions; the glutamate dehydrogenase control carries none. The vocabulary is one term wide.","tacat:REACT_0000002 tacat:hasReversibility tacat:Reversible ."]},$f={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"rh:equation — what is it?",short:"Rhea's own rendering of a reaction as a string, written with `=` because the master is undirected",say:"`rh:equation` is the property in Rhea's RDF vocabulary carrying the reaction written out in ChEBI display names. A master reaction is joined by `=` rather than an arrow, because the master asserts no direction; the directional children are what carry one. It is a label meant for a human reader, not a structure anything parses.",glossary:["rh-equation"],heard:["rh:equation","Rhea equation","equation string","reaction equation","?equation"],warn:"The names in it are Rhea display names, not ChEBI accepted names — `L-alanine`…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/cli.py"}],see:["federated-payoff","rhea-four-ids","def-rhea","def-rhea-master-and-directional-children","def-federation","def-accepted-name-vs-display-name","def-chebi-accepted-name","def-mass-balance-charge-balance"],points:["Projected by both federated queries and printed by `tacat federate`, so it is the string on screen when the join is demonstrated live. It is also the external corroboration of the local model: Rhea names the same four participants the builder wrote, from a database that never saw the code.","`L-cysteine + 2-oxoglutarate = 2-oxo-3-sulfanylpropanoate + L-glutamate`"]},uf={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"Rhea master / directional children — what is it?",short:"Four IDs per reaction at consecutive offsets: an undirected master plus three directed children",say:"Rhea mints four identifiers for every reaction at consecutive offsets: an undirected *master*, then a left-to-right child, a right-to-left child and a bidirectional one. UniProt's `Reaction=` annotation line always cites the master, while its `PhysiologicalDirection=` line cites a child. Conflating the two mixes up *this reaction* with *this reaction, run this way*.",glossary:["rhea-master-and-directional-children"],heard:["Rhea master / directional children","PhysiologicalDirection","master identifier","directional child","RHEA:19453 vs 19454"],warn:"The master is undirected about *physiological* direction but still has written…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_query_targets_master_identifiers_only"}],see:["rhea-four-ids","direction-alaa","weak-direction","def-rhea","def-alaa-alt1","def-uniprot","def-reversibilitykind","def-participantrole","def-federation"],points:["The graph anchors on masters only — 21824, 19453, 17441. The children are derived properties on the `Reaction` dataclass and are never written into the graph; a test asserts none of them reaches the federated query, because querying UniProt with a child silently returns nothing.","19453 master · 19454 L→R · 19455 R→L · 19456 bidirectional"]},yf={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"Rhea — what is it?",short:"Expert-curated reference set of balanced biochemical reactions, run at the SIB",say:"Rhea is the reference database of biochemical reactions, curated at the Swiss Institute of Bioinformatics on ChEBI identifiers, so its equations are mass- and charge-balanced by construction. It is what UniProt cites to say what an enzyme does, which makes it the natural anchor for anything reaching towards protein data. It mints four identifiers per reaction and serves the lot over SPARQL.",glossary:["rhea"],heard:["Rhea","rhea-db","RHEA:19453","rdf.rhea-db.org","rh:"],warn:"`?rhea a rh:Reaction` returns zero rows with no error: Rhea models a reaction…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_query_treats_rhea_reactions_as_classes"},{kind:"source",rel:"identified-as",at:"RHEA:19453"}],see:["rhea-four-ids","federated-payoff","def-rhea-master-and-directional-children","def-sib","def-federation","def-biochemicalreaction","def-kegg","def-chebi","def-uniprot"],points:["Each of the three reactions is typed against its Rhea master class — RHEA:21824, 19453 and 17441 — and the federated query joins those IRIs against `sparql.rhea-db.org`. `tacat` models its own reactions as individuals, so a local node is an *instance* of Rhea's class rather than a copy of it.","?rhea rdfs:subClassOf rh:Reaction ."]},mf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"RUF001 — what is it?",short:"ruff's ambiguous-Unicode-in-a-string rule, ignored here for one file on purpose",say:"A ruff lint rule that flags a Unicode character inside a string literal which looks like an ASCII one — U+2212 MINUS SIGN where a hyphen is expected, a Greek question mark for a semicolon. Rule codes are how ruff is configured: selected, ignored globally, or ignored for one path under `per-file-ignores`, which is the narrowest form and the one that leaves the rest of the tree guarded.",glossary:["ruf001"],heard:["RUF001","ruff rule code","ambiguous-unicode-character-string","per-file-ignores"],warn:"The ignore does not say the character is a tolerated mistake. It says the…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["minus-sign","def-ruff","def-minus-sign-vs-hyphen","def-chebi-accepted-name","def-chebi","def-accepted-name-vs-display-name"],points:["`pyproject.toml` ignores `RUF001` for `src/tacat/reference_data.py` alone, with the reason written above it: ChEBI's accepted names really do use U+2212, and ASCII-folding them would silently break joins against ChEBI's own data. The divergence is recorded in `NAME_DIVERGENCES`.",'"src/tacat/reference_data.py" = ["RUF001"]']},gf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"ruff — what is it?",short:"a Rust-fast Python linter and formatter, one tool and one config for many rule sets",say:"A Python linter and formatter written in Rust, fast enough to run on every save. It reimplements the rules of flake8, isort, pydocstyle, pyupgrade and others behind a single tool and a single configuration block, each rule addressed by a short code such as `D415` or `RUF001`. Rules are opted into by prefix, not enabled wholesale.",glossary:["ruff"],heard:["ruff","ruff check","ruff format","[tool.ruff]"],warn:"Selecting `S` runs bandit's rules inside ruff, but the pipeline also runs…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["ci-data-gates","def-ruf001","def-ci-cd","def-mypy","def-bandit","def-lara-larasuite"],points:["`[tool.ruff]` sets `line-length = 120` rather than black's 88 and the Google docstring convention, matching the assessor's own packages, and carries his ignore list. `D415` is ignored because the LARAsuite module banner opens with a rule of underscores. CI runs `ruff check` and `ruff format --check` in the `lint` job."]},wf={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"RXNO — what is it?",short:"OBO ontology of named organic reactions — the Diels-Alder, the Suzuki coupling, by name",say:"RXNO, the Name Reaction Ontology, is the OBO Foundry ontology of named reactions in synthetic chemistry: one class per recognised transformation, with the usual `PREFIX_0000123` opaque identifiers under `purl.obolibrary.org/obo/RXNO_`. It is meant to be used alongside MOP, the molecular-process ontology, which carries the mechanism where RXNO carries the name.",glossary:["rxno"],heard:["RXNO","Name Reaction Ontology","obo:RXNO_","purl.obolibrary.org/obo/RXNO_","named reactions"],warn:"BACKGROUND — RXNO covers *named* reactions from synthetic chemistry; it is not…",refs:[{kind:"source",rel:"identified-as",at:"http://purl.obolibrary.org/obo/RXNO_"}],see:["nary-vs-reac4cat","identifier-opportunity","def-obo-foundry","def-reac4cat","def-rhea","def-chebi","def-opaque-identifier","def-n-ary-relation"],points:["Not used: these reactions are biochemical and Rhea names them, so `REACT_0000001` is typed with `rhea:21824`, not an RXNO class. It is worth knowing because Reac4Cat — NFDI4Cat's own reaction ontology — reuses RXNO alongside AFO, BFO, MOP and ChEBI, so 'why not RXNO?' has a consortium-shaped answer.","`@prefix rxno: <http://purl.obolibrary.org/obo/RXNO_> .`"]},bf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"SBO — what is it?",short:"Systems Biology Ontology — where the participant-role terms come from, as classes not strings",say:"SBO is a set of controlled vocabularies for systems-biology models, curated at the EBI and used by SBML. Its branches cover participant roles, modelling frameworks, mathematical expressions and physical entities. Terms are numbered `SBO:nnnnnnn` and modelled as OWL classes, so asserting that something is an SBO term is a class assertion and nothing weaker.",glossary:["sbo"],heard:["SBO","Systems Biology Ontology","SBO:0000013","SBO:0000014","biomodels.net/SBO"],warn:"SBO IRIs live at `http://biomodels.net/SBO/SBO_…`, not on an OBO PURL. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"cited-as",at:"SBO:0000010 — reactant"}],see:["identifiers-verified","def-participantrole","def-biopax-sbml","def-chebi","def-ec-number","def-reactionparticipant","def-sh-pattern"],points:['Two roles are typed as SBO classes: `SBO:0000010` reactant, `SBO:0000011` product. `ROLE_CATALYST` (`SBO:0000013`) is a constant nothing uses — no catalyst role individual exists. `SBO:0000014` "enzyme" is excluded, and `data/shapes.ttl` enforces the seven-digit form and that exclusion at both ends.',"tacat:Reactant a sbo:SBO_0000010, tacat:ParticipantRole ."]},vf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"scanner / tokeniser — what is it?",short:"left-to-right pass that consumes text as tokens, where a regex cannot be correct",say:"A pass over source text that decides at each character what kind of thing starts there and skips to that thing's end, emitting the tokens in between. It is the right tool wherever the constructs to be skipped can contain each other's delimiters — a comment marker inside an IRI, a quote inside a comment — because that is exactly the point at which a regular expression stops being able to give a correct answer.",glossary:["scanner-tokeniser"],heard:["scanner / tokeniser","lexer","tokenizer","skip-and-scan","bare-keyword scanner"],warn:"Every failure has been one skip running too far. This scanner ignores backslash…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_iri_containing_a_hash_does_not_truncate_the_prologue"}],see:["scanner-guard-failures","ssrf-service","weak-readonly","def-whitelist-vs-keyword-blacklist","def-bare-keyword","def-iriref","def-query-form","def-ssrf","def-exfiltration-blind-vs-non-blind-ssrf"],points:["`_bare_keywords` in `src/tacat/api/policy.py` yields upper-cased keywords appearing outside IRIs, string literals, comments, variables and prefixed names. Both the read-only check and the SERVICE check read from it. It replaced a regex that refused `SELECT ?service WHERE {...}`, a legal query with no federated clause.","PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>   # the '#' is inside the IRI"]},_f={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"SciDatS — what is it?",short:"the assessor's JSON-LD scientific-data tooling — the seam to an ordinary web stack",say:"SciDatS is Mark Dörr's scientific-data package, from his `opensourcelab` group: tooling that represents scientific metadata as JSON-LD, so one record is plain JSON to an ordinary web client and RDF to a semantic one. It sits at the data-capture end of the same stack LARA automates, and the two are presented together.",glossary:["scidats"],heard:["SciDatS","SciDat","opensourcelab/scidats"],warn:"BACKGROUND — SciDatS is a dependency of nothing here and appears in no file in…",see:["def-json-ld","def-lara-larasuite","def-turtle","def-seam","def-content-negotiation","def-rdf"],points:["Named in both primers at the JSON-LD point, as the reason JSON-LD is worth attention specifically: it is the format a full-stack developer already reaches for, and the assessor's own tooling speaks it. It is the seam offered for bridging this graph to a normal web application."]},kf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"seam — what is it?",short:"a boundary where behaviour can be changed without editing the code either side of it",say:"Michael Feathers' term: a place in a system where you can alter behaviour without editing the code on either side, because what crosses the boundary is small and stated. Naming a seam is a claim about where the system comes apart — not a claim that anything has been swapped there, and not on its own a claim of portability.",glossary:["seam"],heard:["seam","architectural seam","repository seam","build-time / run-time seam"],warn:"Do not sell the repository seam as portability. rdflib already ships…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/repository.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/artefacts.py"}],see:["rdflib-scaling","def-graphrepository","def-tacat-data-dir","def-multi-stage-build","def-json-ld","def-sparql-clients","def-rdflib"],points:["Used in four senses. `GraphRepository` is the store seam — three operations, so the query layer is testable without a web client. `artefacts.py` and `TACAT_DATA_DIR` are the build-time/run-time seam: reasoner one side, served graph the other. JSON-LD is the seam to an ordinary web stack."]},qf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"sequential mechanism / ternary complex — what is it?",short:"both substrates bound before any product leaves — the alternative to ping-pong",say:"A two-substrate mechanism in which both substrates sit on the enzyme at once, as a ternary complex, before either product departs. Binding may be *ordered*, one substrate obligatorily first, or *random*. It is the contrast class to ping-pong, and the two are told apart experimentally by whether double-reciprocal lines come out intersecting or parallel.",glossary:["sequential-mechanism-ternary-complex"],heard:["sequential mechanism / ternary complex","ternary complex","ternary-complex mechanism","ordered bi-bi","random bi-bi","sequential mechanism"],warn:'BACKGROUND — "Sequential" means both substrates bind before any product leaves…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["ping-pong-mechanism","negative-control","def-ping-pong-bi-bi","def-kineticmechanism","def-glutamate-dehydrogenase","def-half-reaction","def-product-inhibition","def-redox-cofactor"],points:["What the curated string `ping-pong bi-bi` is being contrasted with. The negative control runs one: glutamate dehydrogenase needs L-glutamate and NAD+ present together for the hydride transfer, which is part of why its equation has more species than a transamination and why only two of them are modelled."]},If={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"services: (GitLab CI) — what is it?",short:"images started beside a CI job and reached over its network by hostname alias",say:"A GitLab CI keyword listing container images to start alongside a job and attach to the job's network. Each is reachable by hostname — derived from the image name, or set explicitly with `alias` — so the script talks to it over ordinary HTTP. It is a core feature of the docker and kubernetes executors: no Docker socket, no docker-in-docker, no privileged runner.",glossary:["services"],heard:["services: (GitLab CI)","service container","network alias","alias: tacat"],warn:"The build stage proves the image compiles; only this proves it runs. The…",see:["ci-data-gates","step-6-pipeline","def-gitlab-runner","def-kaniko","def-smoke-test","def-container-registry-image-tag-latest","def-ci-cd","def-commit-sha-and-checksum"],points:["The `smoke` stage runs the image it just pushed as a service under the alias `tacat` and asserts against it with `python ci/smoke.py http://tacat:8000`. That is why the job is identical on a self-hosted runner and on gitlab.com shared runners, which offer no socket binding at all.",`services:
  - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    alias: tacat`]},Af={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"sh:pattern — what is it?",short:"SHACL constraint matching a regular expression against the value node’s lexical form",say:"A SHACL constraint whose regular expression is matched against the *lexical form* of each value node. For a literal that is the string it is written as; for an IRI it is the IRI string. A blank node has no lexical form and so always produces a result. `sh:flags` supplies regex flags such as `i`.",glossary:["sh-pattern"],heard:["sh:pattern","sh:flags","SHACL regex constraint"],warn:"Four datatype properties (`chebiIRI`, `ecIRI`, `rheaIRI`, `sboIRI`) existed on…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"}],see:["why-both-owl-shacl","identifiers-verified","def-shacl","def-lexical-form","def-literal","def-iri","def-qualified-value-shape","def-blank-node"],points:['Used inside `sh:qualifiedValueShape` to pin the exact shape of each external PURL — `"^http://purl\\.obolibrary\\.org/obo/CHEBI_[0-9]+$"` at `data/shapes.ttl:156` — with a paired negative rule that rejects a near-miss such as an `https://` twin or a trailing fragment.','sh:pattern "^http://rdf\\.rhea-db\\.org/[0-9]+$"']},Cf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"sh:severity — what is it?",short:"The level stamped on a SHACL result: sh:Violation (the default), sh:Warning or sh:Info",say:"A shape may declare `sh:severity`, which is copied onto every validation result it produces. SHACL defines three levels — `sh:Info`, `sh:Warning` and `sh:Violation`, the default — and gives them no built-in force beyond a label in the report. Whether a non-violation still counts as failure is the consuming tool’s decision.",glossary:["sh-severity"],heard:["sh:severity","sh:Violation","sh:Warning","sh:Info"],warn:"The rule is a `sh:qualifiedMaxCount 1` with no minimum, so an absent anchor…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"}],see:["negative-control","why-both-owl-shacl","def-shacl","def-negative-control","def-pyshacl","def-rhea","def-qualified-value-shape","def-sh-pattern"],points:["One rule carries it: the Rhea-anchor rule at `data/shapes.ttl:205-211`, whose message says reactions SHOULD be an instance of a Rhea master and that the glutamate dehydrogenase negative control deliberately carries none. Every other rule in the file takes the default `sh:Violation`.","sh:qualifiedMaxCount 1 ; sh:severity sh:Warning ;"]},xf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"SHACL — what is it?",short:"Shapes Constraint Language — closed-world validation of RDF against shapes written as RDF",say:"SHACL declares constraints — shapes — as RDF, then validates a data graph against them and returns conformance plus a machine-readable report naming every violation. It works under a closed world: what is absent from the graph is absent, so a missing required property is an error. It is the RDF world’s JSON Schema, and it asks the opposite question to OWL.",glossary:["shacl"],heard:["SHACL","Shapes Constraint Language","shapes.ttl","sh:","node shape"],warn:"OWL and SHACL are not redundant. Two licences on a node with…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"},{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"}],see:["why-both-owl-shacl","step-5-validate","def-node-shape-vs-property-shape","def-sh-severity","def-open-world-assumption","def-owl","def-qualified-value-shape","def-domain-and-range","def-entailment","def-pyshacl"],points:["`data/shapes.ttl`, run by `pyshacl` from `src/tacat/validation.py` and gated in CI. Twelve negative fixtures in `tests/test_shapes.py` assert each rule actually fires, and three positive ones assert it does not overreach. Messages are written as full sentences, because the report is what a data producer reads.","sh:path tacat:stoichiometricCoefficient ; sh:minCount 1 ; sh:datatype xsd:decimal ; sh:minExclusive 0 ;"]},Tf={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"SIB (Swiss Institute of Bioinformatics) — what is it?",short:"operator of Rhea and UniProt and of the public SPARQL endpoints this project joins against",say:"The SIB Swiss Institute of Bioinformatics is Switzerland's national bioinformatics organisation. It curates Rhea and, with EMBL-EBI and PIR, UniProt, and it runs the public SPARQL endpoints for both — `sparql.rhea-db.org` and `sparql.uniprot.org` — which are open, unauthenticated and free, with capacity governed by the operator rather than by any agreement with a caller.",glossary:["sib"],heard:["SIB (Swiss Institute of Bioinformatics)","SIB","Swiss Institute of Bioinformatics"],warn:"A live third party is a dependency you do not control. `run()` falls back to a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_query_federates_to_uniprot"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["federated-payoff","def-rhea","def-uniprot","def-federation","def-pytest-marker","def-notjoinable","def-ebi"],points:["The other side of the federated query. `federated.py` runs at `sparql.rhea-db.org/sparql` and puts a `SERVICE` clause to `sparql.uniprot.org/sparql` inside it; nothing is copied and no agreement exists or is needed. The three tests that hit them carry the `network` marker and are deselected by default.","`SERVICE <https://sparql.uniprot.org/sparql> { ?protein up:annotation/up:catalyticActivity/up:catalyzedReaction ?rhea }`"]},Ef={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"side chain (R group) — what is it?",short:"the part that differs between amino acids — the backbone is identical in all of them",say:"Every α-amino acid has the same backbone: an α-carbon carrying an amino group, a carboxyl group and a hydrogen. The fourth substituent, the side chain or R group, is the only thing that distinguishes one amino acid from another, and it sets charge, polarity, size and reactivity. Transamination happens on the backbone, so the side chain passes through the reaction untouched.",glossary:["side-chain"],heard:["side chain (R group)","R group","R-group","amino-acid side chain","variable group"],warn:"BACKGROUND — Not represented anywhere. Which side chains an enzyme tolerates…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["defined-class","why-three-reactions","def-amino-acid","def-thiol-sulfanyl-group","def-alpha-carbon","def-defined-class","def-chemicalentity","def-amino-group"],points:["Why one transaminase can accept several donors, and how little these four differ: L-alanine is C3H7NO2 and L-cysteine C3H7NO2S, the same formula plus one sulfur. Membership of `AminoAcid` is asserted from `reference_data.AMINO_ACIDS`; no structure is represented, so nothing in the graph knows a side chain exists.","L-alanine `C3H7NO2` (−CH3) and L-cysteine `C3H7NO2S` (−CH2SH) differ by one sulfur atom"]},Rf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"signature — what is it?",short:"the pattern of which entity classes fill which roles — a shape of slots, with no chemistry in it",say:"A signature is who plays which part, and nothing more — the sense in which a function signature says how many arguments of what type without saying what the function does. Defining a reaction class by signature means naming which classes of entity must appear in which roles, and leaving atom transfer, mass balance, extra participants and mechanism entirely unconstrained.",glossary:["signature"],heard:["signature","participant-role signature","role signature"],warn:"The counterexample falls straight out: a reaction whose products equal its…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["signature-not-mechanism","defined-class","def-defined-class","def-atom-mapping","def-necessary-and-sufficient-conditions","def-conjunct","def-transaminationreaction","def-arity"],points:['`TransaminationReaction`’s four conjuncts are exactly that: an amino acid consumed, a 2-oxo acid consumed, a 2-oxo acid produced, an amino acid produced. The schema docstring says it in those words — "a signature, not a mechanism". Mechanism is carried as a datum on the enzyme, `kineticMechanism`, not as an axiom.',"alanine + 2-oxoglutarate → 2-oxoglutarate + alanine — classifies, and nothing happened"]},Sf={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"SiLA 2 — what is it?",short:"the open standard for talking to laboratory instruments — gRPC services, not a data model",say:"SiLA (Standardization in Lab Automation) is the open standard for instrument control: a device exposes typed Features over gRPC, and any client that speaks SiLA can drive it without a vendor-specific driver. Version 2 is the current one. Its subject is the *device interface* — commands, properties, observable results — not the meaning of the chemistry a device is used to study.",glossary:["sila"],heard:["SiLA 2","SiLA","sila_python","sila2lib","lab device standard","SiLA server"],warn:"BACKGROUND — Volunteer the absence. Dörr is the first-listed author of…",see:["why-no-sila","ask-lara-or-alongside","def-lara-larasuite","def-out-of-scope-questions","def-scidats","def-high-throughput-screening","def-enzyme-immobilisation"],points:["Absent, and deliberately: a reaction ontology has no device surface to talk to. The SiLA-shaped work is the laboratory-process layer, deferred in `OUT_OF_SCOPE_QUESTIONS` — the purification and immobilisation question, whose recorded reason names LARA's domain as the natural direction of extension.","a SiLA Feature declares `StartTemperatureControl(TargetTemperature)`; nothing in it says what a transamination is"]},Of={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"sitagliptin — what is it?",short:"diabetes drug whose chiral amine step an engineered transaminase took over from a metal catalyst",say:"Sitagliptin is an oral type-2 diabetes drug (a DPP-4 inhibitor) built around a single chiral amine centre. Its manufacture is the standard industrial example of biocatalysis displacing metal catalysis: a rhodium-catalysed high-pressure asymmetric hydrogenation, plus a downstream step to strip the metal out, was replaced by a directed-evolution-engineered transaminase that installs the amine directly.",glossary:["sitagliptin"],heard:["sitagliptin","Januvia","DPP-4 inhibitor","prositagliptin ketone"],warn:"BACKGROUND — The sitagliptin enzyme is an omega-transaminase acting on a…",see:["omega-transaminase","def-directed-evolution-engineered-enzyme","def-omega-transaminase-vs-alpha-transaminase","def-chirality-chiral-amine","def-transaminase","def-high-throughput-screening","def-lara-larasuite"],points:[`Cited once, in the primer's "Why industry cares", as evidence that the three shipped reactions sit in a commercially live field rather than being demo data. Nothing about sitagliptin is in the graph.`]},Pf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"SKOS mapping property — what is it?",short:"a SKOS link between concepts in two schemes — and it types both ends `skos:Concept`",say:"SKOS is a vocabulary for thesauri and classification schemes. Its mapping properties — `skos:exactMatch`, `skos:closeMatch`, `skos:broadMatch`, `skos:narrowMatch`, `skos:relatedMatch` — say that a concept in one scheme corresponds to a concept in another. All five are sub-properties of `skos:semanticRelation`, whose domain and range are both `skos:Concept`, so asserting one entails that both ends are concepts.",glossary:["skos-mapping-property"],heard:["SKOS mapping property","skos:exactMatch","skos:closeMatch","skos:broadMatch","SKOS mapping"],warn:"NOT USED HERE — A different rejection from `owl:sameAs`. sameAs was refused for…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"code",rel:"decided-in",at:"DECISIONS.md"},{kind:"code",rel:"decided-in",at:"CHANGELOG.md"}],see:["exactmatch-vs-sameas","mint-vs-reuse","def-skos","def-owl-sameas","def-domain-and-range","def-entailment","def-up-enzyme","def-opaque-identifier"],points:["Rejected for every identifier link. `skos:exactMatch` would entail that ChEBI, Rhea, EC and SBO terms are thesaurus concepts, and it pointed an `owl:NamedIndividual` at an `owl:Class`. `skos:closeMatch` left the protein links in 0.1.0 for the same reason. The shipped graph carries the identifier as `rdf:type`.","rejected: `tacat:CHEBI_29985 skos:exactMatch obo:CHEBI_29985` — shipped: `tacat:CHEBI_29985 a obo:CHEBI_29985`"]},jf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"SKOS — what is it?",short:"W3C vocabulary for thesauri and concept schemes — concepts, labels, and mappings between schemes",say:"SKOS models knowledge organisation systems: thesauri, taxonomies, subject headings. Its unit is `skos:Concept`, labelled with `skos:prefLabel` and `skos:altLabel`, arranged by `broader` and `narrower`, and joined across schemes by mapping properties such as `skos:exactMatch`. Those mapping properties are sub-properties of `skos:semanticRelation`, whose domain and range are both `skos:Concept`.",glossary:["skos"],heard:["SKOS","skos:Concept","skos:prefLabel","skos:notation","skos:broader"],warn:"The objection to `skos:exactMatch` is an entailment over its domain and range…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["exactmatch-vs-sameas","def-skos-mapping-property","def-owl-sameas","def-dcat","def-domain-and-range","def-chebi","def-dublin-core"],points:["Used only in `data/dataset.ttl` — DCAT themes as `skos:Concept` with `skos:prefLabel`, and an `adms:Identifier` carrying `skos:notation`. It is not how the graph links to ChEBI, Rhea, UniProt or SBO: `skos:exactMatch` was used for a while and removed, because it pointed an individual at a class.",'dcat:theme [ a skos:Concept ; skos:prefLabel "biocatalysis"@en ]']},Lf={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"smoke test — what is it?",short:"A short run against the shipped artefact, asserting it works rather than that it built",say:"A small check performed on a deployed or packaged artefact rather than on the source it was built from. It asks whether the thing actually works — starts, answers, carries what it should — which is a different claim from *it compiled*. The name is from hardware: power it on and see whether smoke comes out.",glossary:["smoke-test"],heard:["smoke test","ci/smoke.py","smoke stage"],warn:"Its absence is how the provenance defect — a graph shipped with no commit SHA…",see:["ci-data-gates","weak-provenance","step-6-pipeline","def-services","def-container-registry-image-tag-latest","def-liveness-probe","def-regression-test","def-data-gate-vs-code-gate","def-reference-data-checksum"],points:["`ci/smoke.py` waits for `/health`, then asserts five properties of the running image: 3 inferred transaminations in the loaded graph, SHACL conformance, 3 rows from a real SPARQL query, an `INSERT DATA` refused with 400, and a `prov:wasRevisionOf` naming the commit it was built from.","python ci/smoke.py http://tacat:8000"]},Nf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"SPARQL 1.1 Protocol — what is it?",short:"the W3C rules for carrying a SPARQL query over HTTP — three bindings, one endpoint",say:"The W3C recommendation that says how a query travels over HTTP: `GET /sparql?query=…`; `POST` with the query as a field named `query` in an `application/x-www-form-urlencoded` body; or `POST` with the query as the raw body under `application/sparql-query`. It also defines an update operation. Implementing it, rather than a bespoke JSON API, is what makes stock clients work unmodified.",glossary:["sparql-1-1-protocol"],heard:["SPARQL 1.1 Protocol","read subset","SPARQL Protocol","application/sparql-query","GET ?query="],warn:"The protocol says how a query arrives, not which queries are allowed. The…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_query_via_post_raw_body"}],see:["sparql-protocol","def-sparql","def-content-negotiation","def-sparql-results-media-types-and-406","def-querypolicy","def-yasgui","def-sparql-clients"],points:["`src/tacat/api/app.py` serves all three query bindings — `sparql_get` reads the parameter, `sparql_post` reads the body once and dispatches on Content-Type — and runs the query in a threadpool so a slow one does not block the event loop. The update half is not implemented; that is the read subset.","curl -G http://localhost:8000/sparql --data-urlencode 'query=ASK { ?s ?p ?o }'"]},Df={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"SPARQLWrapper / rdflib SPARQLStore — what is it?",short:"Two stock Python clients for a remote SPARQL endpoint — a thin wrapper, and an rdflib store",say:"SPARQLWrapper is a small Python library that posts a query string to a SPARQL endpoint over HTTP and hands back the parsed results. rdflib's `SPARQLStore` is the same capability behind rdflib's own interface: a `Graph` backed by a remote endpoint, so code written against a local graph queries a remote one unchanged. `SPARQLUpdateStore` adds the write forms.",glossary:["sparql-clients"],heard:["SPARQLWrapper / rdflib SPARQLStore","SPARQLWrapper","SPARQLStore","SPARQLUpdateStore",'Graph(store="SPARQLStore")'],warn:"`sparqlwrapper` is a runtime dependency here because `queries/federated.py`…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_offline_failure_is_explicit_not_silent"}],see:["rdflib-scaling","sparql-protocol","def-rdflib","def-sparql-1-1-protocol","def-graphrepository","def-yasgui","def-federation","def-triplestore"],points:["Both are why implementing the protocol beats a bespoke API — they work against `/sparql` unmodified. `SPARQLStore` also defeats the tempting claim that `GraphRepository` is a portability seam: rdflib already ships the remote store, so migrating means constructing the graph differently, not implementing an interface.","`SPARQLWrapper(RHEA_ENDPOINT); sparql.setReturnFormat(JSON)` — queries/federated.py"]},Bf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"SPARQL results media types — what is it?",short:"The formats a SPARQL result may be served as, picked from Accept; 406 when none fits",say:"SPARQL 1.1 defines its own serialisations for results: JSON and XML for the bindings of a SELECT or the boolean of an ASK, CSV for a SELECT table only, and an RDF syntax such as Turtle for the graph a CONSTRUCT or DESCRIBE returns. The server chooses between them from the `Accept` header. When nothing the caller accepts can be produced, the answer is `406 Not Acceptable` — understood and refused, not mishandled.",glossary:["sparql-results-media-types-and-406"],heard:["SPARQL results media types","application/sparql-results+json","application/sparql-results+xml","text/csv","text/turtle","SPARQL Query Results XML Format"],warn:"A media type is not a query form. CSV is refused for an ASK because CSV has no…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/negotiation.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_csv_requested_for_ask_is_406_not_500"}],see:["sparql-protocol","def-sparql-1-1-protocol","def-turtle","def-content-negotiation","def-notacceptable-406","def-query-form","def-sparql-clients"],points:["`negotiation.py` serves all four. `*/*` and an absent header mean JSON, because that is what curl sends. XML was added after a stock client asked for it and got JSON with a `200`. `text/csv` on an ASK raises `NotAcceptable`, which `app.py` turns into a 406 rather than the 500 rdflib's serialiser would have caused.","`Accept: application/sparql-results+xml` on a SELECT returns XML; on a CONSTRUCT it is read as no informed preference and answered `text/turtle`"]},Mf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"SPARQL — what is it?",short:"the query language for RDF, and the HTTP protocol for asking a graph over the wire",say:"SPARQL is the W3C query language for RDF: you write triple patterns with variables in them and the engine returns every set of bindings that makes all the patterns true at once. Joins happen implicitly, through a variable name repeated across patterns, rather than through a named JOIN. SPARQL is also an HTTP protocol, so the same query can be sent to a remote endpoint and results returned in a standard format.",glossary:["sparql"],heard:["SPARQL","SPARQL 1.1",".rq","SPARQL Query Language"],warn:"SPARQL queries a graph; it does not reason. `?r a tacat:TransaminationReaction`…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["sparql-protocol","competency-questions","def-sparql-1-1-protocol","def-triple-pattern-binding","def-property-path","def-query-form","def-rdf","def-federation"],points:["Both the interface and the test suite. The competency questions are SPARQL queries with expected answer sets in `src/tacat/queries/competency.py`, and the service exposes the read subset of the SPARQL 1.1 Protocol at `/sparql`, so YASGUI, curl and rdflib's `SPARQLStore` work against it unmodified.","SELECT ?label WHERE { ?r a tacat:TransaminationReaction ; rdfs:label ?label }"]},Hf={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"SPDX licence IRI — what is it?",short:"A licence cited by IRI from the SPDX register, so a machine can act on it",say:"SPDX is a standard register of software licences, each with a short identifier such as `MIT` or `CC-BY-4.0` and a stable page under `spdx.org/licenses/`. Citing that IRI instead of the bare string makes the licence a node another graph can join on and reason about, rather than a label every consumer has to parse and guess at.",glossary:["spdx-licence-iri"],heard:["SPDX licence IRI","SPDX","spdx.org/licenses/MIT.html","SPDX-License-Identifier"],warn:"Code and data carry different licences here: MIT for the software, CC BY 4.0…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"}],see:["def-cc-by-4-0","def-oops-pitfall","def-iri","def-dublin-core","def-dcat","def-owl-ontology-header"],points:["`builder.py` writes `dcterms:license <https://spdx.org/licenses/MIT.html>` into the ontology header — a missing licence is OOPS! pitfall P41. The dataset description states a Creative Commons IRI instead, and `DatasetShape` enforces `sh:nodeKind sh:IRI` on `dcterms:license` so a string cannot pass.","<https://w3id.org/bitspark/tacat> dcterms:license <https://spdx.org/licenses/MIT.html>"]},zf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"specific activity / unit (U) / katal — what is it?",short:"how enzyme activity is quantified — μmol per minute, per milligram, or in SI",say:"One enzyme unit (U) is the amount of enzyme converting one micromole of substrate per minute under stated conditions. Specific activity is units per milligram of protein, so it measures purity as much as catalysis. The SI unit is the katal, one mole per second; 1 U is about 16.67 nanokatal. All three are meaningless without the assay conditions attached to them.",glossary:["specific-activity-enzyme-unit-katal"],heard:["specific activity / unit (U) / katal","enzyme unit","unit (U)","katal","kat","specific activity","international unit"],warn:"BACKGROUND — An activity is a measurement of a preparation, not a property of…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["ask-lara-or-alongside","why-not-emmo","def-qudt-om-2","def-km-kcat-catalytic-efficiency","def-out-of-scope-questions","def-reac4cat","def-emmo","def-high-throughput-screening"],points:["The units the model would have had to carry. The first `OUT_OF_SCOPE_QUESTIONS` entry rules out kinetic quantities precisely because they need units and measurement provenance, and names QUDT, OM-2 and EMMO as the unresolved choice — with Reac4Cat using OM-2.","1 U = 1 μmol min⁻¹ ≈ 16.67 nkat; specific activity = U per mg protein"]},Ff={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"src-layout — what is it?",short:"The package lives under src/, so the repository root is not importable by accident",say:"A Python project layout in which the importable package sits under a `src/` directory rather than at the repository root. Because the root is then not on `sys.path` by default, an `import` finds an installed distribution instead of the working copy — so the tests exercise what a user would actually get, and a missing package-data file or a broken entry point fails in CI rather than at someone else's first install.",glossary:["src-layout"],heard:["src-layout","src/ layout",'pythonpath = ["src"]',"mypy_path"],warn:'`pythonpath = ["src"]` puts the source tree back on `sys.path`, so this suite…',refs:[{kind:"code",rel:"decided-in",at:"src/README.md"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["def-pytest","def-mypy","def-build-backend","def-pep-735-dependency-groups","def-lara-larasuite"],points:['The package is `src/tacat/`, with `pythonpath = ["src"]` under `[tool.pytest.ini_options]` and `mypy_path = "src/"` to match. It is one of the house-style choices copied from Dörr\'s own packages, alongside the `uv_build` backend, `requires-python = "==3.13.*"` and PEP 735 dependency groups.']},Uf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"SSRF — what is it?",short:"Making a server issue outbound requests of the caller's choosing, from inside its network",say:"Server-side request forgery: an attacker supplies a target that the server then fetches on their behalf. The server's position is what makes it valuable — it can reach hosts the caller cannot, such as an internal service or a cloud metadata endpoint, and it carries whatever trust its network address confers. Whether the response is returned to the attacker decides the severity, not whether the flaw exists.",glossary:["ssrf"],heard:["SSRF","server-side request forgery","SERVICE clause"],warn:'"SERVICE is refused" states the intent, not the submitted behaviour: an escaped…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_service_clause_is_refused_by_default"}],see:["ssrf-service","scanner-guard-failures","weak-readonly","def-exfiltration-blind-vs-non-blind-ssrf","def-federation","def-scanner-tokeniser","def-querypolicy","def-bare-keyword","def-whitelist-vs-keyword-blacklist"],points:["A SPARQL `SERVICE` clause is exactly this shape: it names a URL the endpoint must go and query. `QueryPolicy` refuses `SERVICE` for that reason, and federation is a CLI command that never sits in the request path. The guard is a scanner over the query text, and one of its skips is still wrong in the submitted code.","`SELECT * WHERE { SERVICE <http://attacker/sparql> { ?s ?p ?o } }` — refused when the scanner sees it"]},Gf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"stoichiometric coefficient — what is it?",short:"how many equivalents of a species take part — the number a binary predicate has nowhere to put",say:"The number written in front of a species in a balanced chemical equation: how many equivalents of it are consumed or produced. It belongs to the *participation*, not to the species and not to the reaction, so a binary predicate such as `hasSubstrate` has nowhere to record it. That is the standard argument for reifying participation as a node of its own.",glossary:["stoichiometric-coefficient"],heard:["stoichiometric coefficient","stoichiometry","tacat:stoichiometricCoefficient","equivalents"],warn:"Every coefficient in the shipped graph is 1.0, so the pattern is demonstrated…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","def-reactionparticipant","def-bridge-node","def-n-ary-relation","def-arity","def-mass-balance-charge-balance","def-object-property-vs-data-property"],points:["A functional data property on `ReactionParticipant`, constrained by SHACL to exactly one positive `xsd:decimal`. Decimal rather than double because coefficients are exact ratios: binary floating point cannot hold a third of an equivalent, and silent rounding inside a balance check is a bug nobody finds.","tacat:PART_0000001_01 tacat:participatingEntity tacat:CHEBI_29991 ; tacat:stoichiometricCoefficient 1.0 ."]},Wf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"substrate / product — what is it?",short:"what goes in and what comes out — roles held in a direction, not kinds of molecule",say:"Substrate and product name the part a chemical entity plays in a reaction as written: the substrate is consumed, the product is formed. They are roles, not properties of the compound — the same molecule is a product one way round and a substrate the other, and reversing the reaction swaps every label. Reactant is the neutral synonym for substrate, and the one SBO uses.",glossary:["substrate-product"],heard:["substrate / product","reactant","educt","SBO:0000010","SBO:0000011"],warn:"The defined class discriminates on roles: GDH holds the same two headline…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["direction-alaa","nary-vs-reac4cat","signature-not-mechanism","def-reactionparticipant","def-participantrole","def-sbo","def-n-ary-relation","def-stoichiometric-coefficient","def-negative-control"],points:["A role is a node, not a predicate: participation goes through an n-ary `ReactionParticipant` carrying the entity, a role and a coefficient. `tacat:Reactant` and `tacat:Product` are typed as SBO:0000010 and SBO:0000011. There is no `hasSubstrate` — a binary property has nowhere to put the coefficient.","`tacat:Reactant a <http://biomodels.net/SBO/SBO_0000010>`"]},Kf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"substrate specificity — what is it?",short:"which substrates an enzyme accepts and how well — a ranking, not a list",say:"An enzyme's specificity is the set of substrates it will turn over together with the relative efficiency with which it does so, properly expressed as a ranking of kcat/KM values. It is a measured, quantitative property: a broad-specificity enzyme accepts many substrates with a strong preference among them, which a bare list of accepted substrates cannot express.",glossary:["substrate-specificity-substrate-scope"],heard:["substrate specificity","substrate scope","specificity","enzyme specificity","substrate range","CQ03"],warn:"The graph does not answer this question as asked. It returns substrates of…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","open-world-caveat","def-competency-question","def-amino-donor-amino-acceptor","def-km-kcat-catalytic-efficiency","def-open-world-assumption","def-out-of-scope-questions","def-2-oxoglutarate"],points:['CQ03 is the NFDI4Cat question "what is the substrate specificity of enzyme X ?", and the query returns the reactants of the reactions modelled for that enzyme — seven (enzyme, substrate) pairs. That is the substrate set curated into the graph, not a specificity, and not the substrates the enzyme would accept.','`("cysteine transaminase", "L-cysteine")` — one of CQ03\'s seven expected rows']},Qf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"subsumption — what is it?",short:"one class contains another — every instance of B is necessarily an instance of A",say:"A subsumes B when every instance of B is necessarily an instance of A, written `B rdfs:subClassOf A`. It relates two classes, and is not instantiation, which relates an individual to a class. Classification is the reasoner step computing the full subsumption lattice, including inclusions nobody declared: if one class's conditions entail another's, the subsumption holds whether or not it was asserted.",glossary:["subsumption"],heard:["subsumption","subClassOf","class inclusion","subsumes","classification"],warn:"The Rhea trap fails silently. Asking for instantiation where the relation is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"}],see:["rhea-four-ids","owl-vs-rdfs","def-rdfs","def-reasoner","def-realisation","def-defined-class","def-rhea","def-universal-vs-particular"],points:["Three places. HermiT's classification step; ChEBI's OBO hierarchy, where a compound sits under its parent classes; and Rhea, where a reaction is a *class* of chemical events — so the federated query matches `?rhea rdfs:subClassOf rh:Reaction` and a query written with `a` matches nothing.","?rhea rdfs:subClassOf rh:Reaction   # not: ?rhea a rh:Reaction"]},Vf={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"Swiss-Prot / TrEMBL — what is it?",short:"UniProt's two halves: manually curated (Swiss-Prot) and automatically annotated (TrEMBL)",say:"UniProtKB is split in two. A Swiss-Prot entry is *reviewed*: a curator has read the literature and asserted the function, catalytic activity and cofactors by hand. A TrEMBL entry is *unreviewed*, annotated automatically from sequence similarity, and TrEMBL outnumbers Swiss-Prot by orders of magnitude. In UniProt's RDF the distinction is one boolean, `up:reviewed`.",glossary:["swiss-prot-trembl"],heard:["Swiss-Prot / TrEMBL","reviewed entry","unreviewed","up:reviewed","UniProtKB"],warn:"Reviewed does not mean correct or complete, and the count is not stable…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_the_cache_records_when_it_was_captured"}],see:["federated-payoff","def-uniprot","def-sib","def-up-enzyme","def-federation","def-accession","def-alaa-alt1"],points:["The federated query filters `?protein up:reviewed true`. Without it the per-reaction protein counts inflate with machine predictions and stop meaning anything. The representative accessions carried per reaction in `reference_data.py` are reviewed entries.","?protein up:reviewed true ."]},Jf={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"systematicName — what is it?",short:"The IUBMB systematic name of an enzyme, distinct from its accepted name and its label",say:"The IUBMB systematic name states what an enzyme does in a fixed donor:acceptor:activity form — `L-alanine:2-oxoglutarate aminotransferase` — as against the short accepted name, `alanine transaminase`. Nomenclature is the systematic name; a label is whatever string a vocabulary chose to display. They answer different questions and neither substitutes for the other.",glossary:["systematic-name"],heard:["systematicName","tacat:systematicName","IUBMB systematic name","systematic name"],warn:"Not a synonym for the accepted name and not the EC number. Alanine transaminase…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","def-iubmb","def-ec-number","def-chebi-accepted-name","def-competency-question","def-object-property-vs-data-property","def-transaminase"],points:["A functional datatype property on `Enzyme`, carried alongside `rdfs:label` because NFDI4Cat's CQ02 asks for the *nomenclature* of an enzyme and a label alone does not answer that. The negative control has no systematic name and correctly returns no row.",'tacat:systematicName "L-alanine:2-oxoglutarate aminotransferase"']},Yf={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"T-Box — what is it?",short:"the class layer — classes, properties and axioms, as opposed to the facts about individuals",say:"In description logic an ontology splits into a T-Box and an A-Box. The T-Box is the terminology: the classes, the properties, and the axioms relating them — subclass, disjointness, domain and range, restrictions. It is schema-shaped without being a schema: it constrains what may be *inferred*, not what may be written, so data contradicting it makes the ontology inconsistent rather than rejected.",glossary:["t-box"],heard:["T-Box","TBox","terminological box","the schema layer"],warn:"T-Box axioms are not validation. Nothing in them rejects a bad graph…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["why-both-owl-shacl","owl-vs-rdfs","def-a-box","def-ontology","def-owl","def-axiom","def-description-logic","def-shacl"],points:["`src/tacat/ontology/schema.py` is the whole T-Box, in one function because Owlready2's DSL needs the classes declared inside a single `with onto:` block. The two role individuals live there too: the defined class restricts on them by value, so they are vocabulary despite being individuals."]},Xf={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"TACAT_DATA_DIR — what is it?",short:"The environment variable naming where the built graph lives — the build/run-time seam",say:"An environment variable that names the directory holding a project's build artefacts, so the code producing them and the code consuming them agree on a location without either hard-coding a path. A fallback applies when it is unset, which is what lets the same code run from a development checkout and from an image that materialised the artefact somewhere else entirely.",glossary:["tacat-data-dir"],heard:["TACAT_DATA_DIR","DATA_DIR_ENV","$TACAT_DATA_DIR","data_dir()","artefacts.py"],refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/artefacts.py"},{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["build-time-reasoning","def-seam","def-multi-stage-build","def-materialise","def-container-image","def-turtle","def-owlready2"],points:["`DATA_DIR_ENV` in `artefacts.py`: `data_dir()` returns `$TACAT_DATA_DIR` if set, otherwise `<cwd>/data`. The Dockerfile sets it to `/app/data` in the builder, where `tacat build` puts `reactions.ttl`; the runtime stage copies it. `artefacts.py` imports nothing from `tacat.ontology`, so serving never pulls in Owlready2.",'`ENV TACAT_DATA_DIR=/app/data` (Dockerfile) → `data_dir() / "reactions.ttl"`']},Zf={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"tautomer — what is it?",short:"same formula, a hydrogen in a different place, interconverting spontaneously — separate ChEBI id",say:"Two tautomers share a molecular formula and a net charge but differ in where a hydrogen atom sits, and they interconvert spontaneously in solution. Chemical databases treat them as distinct entities with distinct identifiers, because the structures differ. That makes them a naming trap: a common name usually resolves to one tautomer, and not necessarily the one meant.",glossary:["tautomer"],heard:["tautomer","tautomerism","tautomeric form","keto-enol tautomer"],warn:"Not the microspecies or conjugate acid/base trap — those differ in protonation…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"source",rel:"identified-as",at:"CHEBI:35235"}],see:["tautomer-trap","microspecies","identifiers-verified","def-microspecies","def-conjugate-acid-base","def-chebi","def-mercaptopyruvate-naming","def-zwitterion","def-chebi-accepted-name","def-dianion-and-neutral-parent"],points:["The bare accepted name `L-cysteine` belongs to CHEBI:17561, a tautomer of CHEBI:35235, which is the species these reactions actually use. The comment in `reference_data.py` states the rule that follows: never resolve a ChEBI identifier from a name string.",'`CHEBI:17561` ("L-cysteine") is not `CHEBI:35235` ("L-cysteine zwitterion")']},ep={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"test oracle — what is it?",short:"The part of a test that supplies the right answer the observed one is judged against",say:"In testing, the oracle is whatever supplies the correct answer a test compares against — a literal expected value, a reference implementation, an invariant. A test is only as strong as its oracle: if the oracle can be wrong in the same way as the thing under test, the test agrees with the defect instead of catching it.",glossary:["test-oracle"],heard:["test oracle","oracle","expected answer","identifier oracle"],warn:"Say the measurement, not the care: *the oracle and the subject came from the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_a_wrong_identifier_fails_at_least_one_competency_question"}],see:["identifiers-verified","competency-questions","mistake-owned","def-common-mode-failure","def-competency-question","def-regression-test","def-chebi-accepted-name","def-tautomer","def-microspecies"],points:["Each competency question carries an `expected` frozenset as its oracle. Before CQ10 every one projected a *label*, and a label and its identifier are two fields of one `reference_data` row — so repointing all 15 identifier links to `CHEBI_99999999` left 9 of 9 passing. CQ10 and CQ11 project the PURL.",'("L-cysteine", "http://purl.obolibrary.org/obo/CHEBI_35235")']},tp={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"thiol / sulfanyl group — what is it?",short:"sulfur bonded to hydrogen on a carbon — the group that makes cysteine cysteine",say:"A sulfur atom carrying a hydrogen, attached to carbon. Sulfur's larger, softer electron cloud makes a thiol a far better nucleophile than the alcohol it resembles and gives it a lower pKa, near 8 in cysteine; two thiols oxidise to a disulfide, which is how protein chains are cross-linked. *Sulfanyl* is the current IUPAC prefix, *mercapto* the older one, *sulfhydryl* the biochemists' word.",glossary:["thiol-sulfanyl-group"],heard:["thiol / sulfanyl group","thiol","sulfanyl","sulfhydryl","mercapto","SH group","thiol group"],warn:"The two prefixes name one group, not two chemistries. And neither names a…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:57678"}],see:["identifiers-verified","tautomer-trap","def-mercaptopyruvate-naming","def-l-cysteine","def-accepted-name-vs-display-name","def-side-chain","def-systematic-name","def-chebi-accepted-name"],points:["Why CHEBI:57678 has two names. ChEBI's accepted name `3-mercaptopyruvate` uses the old prefix; the string Rhea prints, which is also the label in the graph, is `2-oxo-3-sulfanylpropanoate` and uses the current one. Both are carried, and the pair is listed in `NAME_DIVERGENCES`.",'`tacat:CHEBI_57678 rdfs:label "2-oxo-3-sulfanylpropanoate"^^xsd:string`']},ap={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"transaminase — what is it?",short:"an enzyme that moves an amino group from an amino acid onto a 2-oxo acid",say:"A transaminase (aminotransferase) transfers an amino group from a donor to an acceptor, leaving the donor as a 2-oxo acid and the acceptor as an amino acid. No nitrogen is released — the group is handed over intact, which is what makes it a transfer rather than a deamination. They are EC 2.6.1.x, nearly all use pyridoxal 5'-phosphate, and the PLP-dependent ones run a ping-pong bi-bi mechanism.",glossary:["transaminase"],heard:["transaminase","aminotransferase","EC 2.6.1.-","ATA"],warn:"The defined class covers alpha-transaminations only. An omega-transaminase runs…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["omega-transaminase","why-three-reactions","plp-cofactor","def-omega-transaminase-vs-alpha-transaminase","def-plp","def-ec-number","def-transaminationreaction","def-amino-donor-amino-acceptor","def-ping-pong-bi-bi"],points:["Three are modelled — alanine (EC 2.6.1.2), aspartate (2.6.1.1) and cysteine (2.6.1.3) transaminase — all sharing 2-oxoglutarate as acceptor and so all producing L-glutamate. `TransaminationReaction` is defined over the four participant roles, not over the enzyme."]},sp={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"TransaminationReaction — what is it?",short:"the defined class nothing asserts and HermiT derives — the demonstration the build turns on",say:"A subclass of `BiochemicalReaction` given necessary *and sufficient* conditions: an amino acid consumed, a 2-oxo acid consumed, a 2-oxo acid produced, an amino acid produced. The conjuncts are written over chemical classes and participant roles rather than named molecules, so the class is a net participant-role signature — it says what a transamination looks like from outside, not how it happens.",glossary:["transaminationreaction"],heard:["TransaminationReaction","tacat:TransaminationReaction","the defined class"],warn:"A signature, not a mechanism. Nothing in the definition constrains atom…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["defined-class","signature-not-mechanism","build-time-reasoning","step-2-infer","def-defined-class","def-biochemicalreaction","def-hermit","def-necessary-and-sufficient-conditions","def-negative-control","def-conjunct"],points:["Declared in `schema.py` as `equivalent_to`; nothing is asserted to be one. HermiT classifies the three transaminase reactions into it at build time and excludes the glutamate dehydrogenase control. `/health` returns 503 when the served graph carries no instances — that means it was built with `--no-reason`.","?r a tacat:TransaminationReaction   # three rows, none of them asserted"]},np={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"transdeamination — what is it?",short:"transaminase then GDH — how nitrogen from many amino acids leaves as ammonium",say:"Amino acids do not each have their own deaminase. Transaminases move the amino group from many different donors onto 2-oxoglutarate, concentrating the nitrogen into a single pool of L-glutamate; glutamate dehydrogenase then deaminates that pool oxidatively, releasing the nitrogen as free ammonium and regenerating the 2-oxoglutarate. The two steps together are transdeamination.",glossary:["transdeamination"],heard:["transdeamination","transamination-deamination couple","transaminase–GDH couple","nitrogen funnelling","coupled deamination"],warn:"BACKGROUND — The control is excluded on arity, not on roles: only two of its…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["negative-control","why-three-reactions","def-glutamate-dehydrogenase","def-l-glutamate","def-2-oxoglutarate","def-ammonia-ammonium","def-negative-control","def-amino-donor-amino-acceptor"],points:["Why glutamate dehydrogenase is a fair negative control and not a straw man: `REACT_0000099` is the next step of the same pathway. It shares both headline molecules with the three transaminations, with the roles reversed, so a definition keyed on which molecules are present would have swallowed it whole."]},op={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"transferase — what is it?",short:"EC class 2 — an enzyme that moves a chemical group from one molecule to another",say:"A transferase moves a functional group from a donor molecule to an acceptor. It is top-level class 2 of the seven Enzyme Commission classes — EC 7, translocases, was added in 2018 — and each further digit narrows: 2.6 transfers nitrogenous groups, 2.6.1 is the transaminases, and the fourth digit is a serial number within that. Nothing is oxidised, hydrolysed or cleaved — the group arrives on the acceptor intact.",glossary:["transferase"],heard:["transferase","EC 2","EC class 2","group-transfer enzyme"],warn:"The hierarchy is not in the graph. An enzyme node carries only its full…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["why-three-reactions","def-ec-number","def-transaminase","def-iubmb","def-glutamate-dehydrogenase","def-uniprot","def-up-enzyme"],points:["Why every real enzyme here carries an EC number beginning 2: `2.6.1.1`, `2.6.1.2`, `2.6.1.3`. The negative control is EC 1.4.1.2 — class 1, an oxidoreductase — so it differs from the three at the very first digit, not the fourth.","`tacat:EC_2_6_1_2 a <http://purl.uniprot.org/enzyme/2.6.1.2>`"]},ip={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"triple pattern / binding — what is it?",short:"a triple with variables in it, and the values that make it true",say:"A triple pattern is an RDF triple with variables (`?x`) in any of its three positions. A binding assigns one term — an IRI, a literal or a blank node — to a variable, and a solution is a full set of bindings that makes every pattern in the query true at the same time. SELECT returns a table of solutions, one row each. Joins are implicit: a variable repeated across two patterns must take the same value in both.",glossary:["triple-pattern-binding"],heard:["triple pattern / binding","basic graph pattern","BGP","bindings","solution","?variable"],warn:"A pattern that matches nothing is not an error. It yields zero rows silently…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","sparql-protocol","def-sparql","def-graph","def-literal","def-iri","def-blank-node","def-property-path"],points:["The competency-question oracles compare bound values, and that is where the identifier defect hid: the expected answers projected labels only, so repointing all fifteen identifier links at a nonexistent ChEBI id left every question passing. CQ10 and CQ11 now put the identifier itself in the oracle.","?reaction tacat:hasParticipant ?p . ?p tacat:participatingEntity ?e ."]},rp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"Fuseki / Oxigraph / GraphDB / Stardog / Virtuoso",short:"server-grade RDF stores — where you go when an in-process graph stops fitting",say:"RDF databases that run as servers and answer SPARQL over HTTP. Apache Jena Fuseki is the Java reference server; Oxigraph is a small Rust one; GraphDB, Stardog and Virtuoso are commercial stores that also ship built-in reasoning. All scale far past an in-process library, and none of them enforces shape — validation is always a separate SHACL pass.",glossary:["triplestore-products"],heard:["Fuseki / Oxigraph / GraphDB / Stardog / Virtuoso","Apache Jena Fuseki","Oxigraph","GraphDB","Stardog","Virtuoso"],warn:"BACKGROUND — Do not claim rdflib is comparable to these. The honest answer…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/store/memory.py"}],see:["rdflib-scaling","def-rdflib","def-triplestore","def-graphrepository","def-sparql-clients","def-seam"],points:["None is used. The brief specified rdflib, which holds this graph in process; `store/memory.py` names Oxigraph or Fuseki as the replacement past roughly a million triples, reached through rdflib's own `SPARQLStore` plugin — a different constructor, not a new implementation of `GraphRepository`."]},cp={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"triplestore — what is it?",short:"A database whose unit of storage is the RDF triple and whose query language is SPARQL",say:"A database built to hold RDF triples and answer SPARQL over them, indexed on subject, predi
