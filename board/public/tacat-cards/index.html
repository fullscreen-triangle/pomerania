ot assume distinct names denote distinct things. Without…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","def-existential-restriction-and-value-restriction","def-unique-name-assumption","def-participantrole","def-alldifferent","def-defined-class","def-t-box"],points:["`participantRole.value(reactant)` appears in all four conjuncts of the defined class, so the role individuals `Reactant` and `Product` are declared in `src/tacat/ontology/schema.py` beside the classes rather than with the instance data. Moving them into the A-Box would break the definition.","`participantRole.value(reactant)` — owl:hasValue on the individual `tacat:Reactant`"]},Zd={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"HermiT — what is it?",short:"an OWL 2 DL reasoner written in Java, run here as a subprocess from Python",say:"An OWL 2 DL reasoner built on a hypertableau calculus. It checks an ontology for consistency, computes the class hierarchy (classification) and works out which individuals belong to which classes (realisation). It is a Java program, so whatever drives it needs a JVM on `PATH`.",glossary:["hermit"],heard:["HermiT","sync_reasoner_hermit","hypertableau","HermiT reasoner"],warn:'HermiT not deriving a type is not a proof of the negative. Say "it did not…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/inference.py"},{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["build-time-reasoning","open-world-caveat","def-reasoner","def-jvm-java-runtime","def-open-world-assumption","def-blast","def-pellet-elk","def-owlready2","def-realisation","def-world-http-inferrences"],points:["`inference.py` calls `sync_reasoner_hermit(onto.world, infer_property_values=True, debug=0)` and Owlready2 runs it as a subprocess. It runs at build time only: the Dockerfile installs `default-jre-headless` in the builder stage, and if HermiT fails, the image does not build."]},el={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"high-throughput screening — what is it?",short:"assaying thousands of variants or conditions in parallel, usually by robot",say:"Running very many small experiments in parallel — enzyme variants, substrates or reaction conditions across microplate wells — under one automated protocol with a readout cheap enough to apply to every well. It is how a round of directed evolution is scored and how a substrate scope is mapped. The output is a table of measurements whose worth depends entirely on the metadata recorded beside it.",glossary:["high-throughput-screening"],heard:["high-throughput screening","HTS","high throughput protein screening","screening campaign","microplate assay"],warn:'BACKGROUND — The graph holds no measurements at all. Do not let "his robots…',see:["why-three-reactions","def-directed-evolution-engineered-enzyme","def-lara-larasuite","def-km-kcat-catalytic-efficiency","def-out-of-scope-questions","def-omega-transaminase-vs-alpha-transaminase"],points:['LARA describes its purpose as "fully automatized transaminase high throughput protein screening", which is why three transaminases are not arbitrary demo data — they are the assessor’s daily subject matter. What such a campaign produces is out of scope here: it needs quantities with units and assay conditions.']},tl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"homodimer / active site at the subunit interface",short:"AST is a two-chain enzyme whose active sites are each built from both subunits",say:"Many enzymes are functional only as an oligomer. Aspartate aminotransferase is a homodimer: two identical chains, and each of its two active sites is lined by residues contributed by *both* of them. The catalytic unit is therefore the dimer rather than the chain — an isolated monomer has no complete active site — so quaternary structure is part of the enzyme's identity and not a detail of it.",glossary:["homodimer-active-site-at-the-subunit-interface"],heard:["homodimer / active site at the subunit interface","homodimer","dimer","subunit interface","quaternary structure","two active sites"],warn:"BACKGROUND — Do not answer *how many active sites does your enzyme have* from…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"}],see:["explain-to-biochemists","weak-got1","def-active-site","def-enzyme","def-ec-number","def-uniprot","def-got1-p17174","def-l-aspartate"],points:["Not modelled, and there is nowhere to put it. `population.py` mints one `Enzyme` individual per EC number, so the graph has no protein chain, no subunit and no active-site count; the several UniProt accessions attached to one EC number are links out, not structure.","`onto.Enzyme(f\"EC_{rxn.ec.replace('.', '_')}\")` — one individual per EC number"]},al={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"internal / external aldimine (Schiff base) — what is it?",short:"the C=N bond PLP forms — to a lysine at rest, to the substrate during catalysis",say:"A Schiff base, or imine, is the C=N bond formed when an aldehyde condenses with an amine. In a resting PLP enzyme, PLP’s aldehyde is bound to the side-chain amino group of an active-site lysine: the *internal* aldimine. When substrate binds, its own amino group displaces the lysine — transaldimination — giving the *external* aldimine, PLP bound to the substrate. The lysine link is remade at the end of the cycle.",glossary:["internal-external-aldimine"],heard:["internal / external aldimine (Schiff base)","Schiff base","internal aldimine","external aldimine","transaldimination","imine"],warn:'"Covalently bound throughout" is wrong: that bond is broken during turnover.…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"decided-in",at:"CHANGELOG.md"}],see:["plp-cofactor","def-turnover-catalytic-cycle","def-half-reaction","def-plp","def-active-site","def-pmp","def-prosthetic-group"],points:['The submitted `hasCofactor` docstring says PLP "cycles PLP -> PMP -> PLP while covalently bound to an active-site lysine", which describes the resting state only. CHANGELOG.md records the corrected wording; the words *internal* and *external aldimine* appear nowhere else in the tree.',"`enzyme-Lys=PLP + substrate-NH2  ⇌  enzyme-Lys-NH2 + PLP=substrate`"]},sl={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"IRI — what is it?",short:"a globally unique name that is also a web address",say:"An Internationalised Resource Identifier is a URL used as a globally unique key; it extends URI syntax to allow non-ASCII characters. In RDF every predicate is an IRI, and so is every subject and object that is not a blank node or a literal. That is what lets two graphs written by strangers join without negotiation: agreeing on an identifier is the whole of the agreement.",glossary:["iri"],heard:["IRI","Internationalised Resource Identifier","URI","URL"],warn:"An IRI is an identifier first and a locator second. That one does not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/namespaces.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["mint-vs-reuse","opaque-iris","def-curie","def-purl","def-uriref","def-literal","def-blank-node","def-dereference","def-w3id-org"],points:["Reused IRIs anchor the graph — ChEBI OBO PURLs, Rhea masters, UniProt protein and enzyme IRIs, SBO role terms. Locally minted ones sit under `https://w3id.org/bitspark/tacat/` with opaque numeric local names. Carrying an identifier as a literal instead is the trap `linking.py` guards: a query matches IRIs, not strings.","`http://rdf.rhea-db.org/19453` — the alanine transaminase master reaction"]},nl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"IRIREF — what is it?",short:"SPARQL's production for an IRI in angle brackets, and the characters it forbids inside",say:"Rule [139] of the SPARQL 1.1 grammar: an IRI written between `<` and `>`. The production excludes `<`, `>`, the double quote, `{`, `}`, `|`, `^`, the backtick, the backslash and every character from U+0000 to U+0020. So a run of text between angle brackets containing any of those is not an IRI, and that `<` is a less-than operator instead.",glossary:["iriref"],heard:["IRIREF","SPARQL grammar rule [139]","_NOT_IN_IRIREF","angle-bracket IRI"],warn:"A character-set test, not an IRI parser. It decides whether angle brackets…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/policy.py"},{kind:"test",rel:"verified-by",at:"tests/test_policy.py::test_a_real_service_clause_is_still_refused"}],see:["scanner-guard-failures","def-iri","def-sparql","def-prefixed-name-local-part","def-scanner-tokeniser","def-bare-keyword","def-querypolicy","def-exfiltration-blind-vs-non-blind-ssrf"],points:["`policy.py` compiles the forbidden set as `_NOT_IN_IRIREF` and applies it at every `<`: if a forbidden character appears before the next `>`, the scanner advances one character instead of skipping to it. Without that test `FILTER(?a < ?b)` read as an IRI opener and the skip to `>` swallowed a following `SERVICE`.","SELECT ?o WHERE { FILTER(?a < ?b) SERVICE <http://e/> { ?s ?p ?o } }"]},ol={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"isozyme / isoenzyme — what is it?",short:"distinct proteins in one organism catalysing the same reaction — one EC number, different genes",say:"Isozymes, or isoenzymes, are distinct proteins within one organism that catalyse the same reaction. They are separate gene products with different sequences, and usually differ in tissue distribution, subcellular compartment or kinetics, yet they share an EC number because EC classifies the activity rather than the molecule. Clinically it is which isozyme is elevated in blood that identifies the damaged tissue.",glossary:["isozyme-isoenzyme"],heard:["isozyme / isoenzyme","isoenzyme","isozyme","GOT1 vs GOT2","isoform","cytosolic vs mitochondrial"],warn:"Not isoforms — those are variants of one gene product. Isozymes are different…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["weak-got1","def-p00505","def-got1-p17174","def-orthologue-paralogue","def-ec-number","def-up-enzyme","def-alt-ast"],points:["Human aspartate transaminase is two isozymes and the published graph carries both: `P17174` (GOT1, cytosolic) and `P00505` (GOT2, mitochondrial), each linked by `up:enzyme` to the same `ec:2.6.1.1`. The builder mints one Enzyme individual per EC number, so both are visible in the links but not distinguished as enzymes.","`uniprot:P17174 up:enzyme ec:2.6.1.1 .` and `uniprot:P00505 up:enzyme ec:2.6.1.1 .`"]},il={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"IUBMB — what is it?",short:"the body that assigns EC numbers and fixes enzyme nomenclature",say:"The International Union of Biochemistry and Molecular Biology is the standards body whose Nomenclature Committee classifies enzymes. It issues the EC number, an accepted name and a systematic name for each entry — the systematic name being the formulaic donor:acceptor construction, which is a different string from the short accepted name people actually use.",glossary:["iubmb"],heard:["IUBMB","International Union of Biochemistry","Enzyme Commission","NC-IUBMB"],warn:"The IUBMB defines EC numbers but mints no IRIs for them. `obo:EC_2_6_1_2` does…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["mint-vs-reuse","def-ec-number","def-systematic-name","def-uniprot","def-transferase","def-competency-question"],points:["`Reaction.systematic_name` holds the IUBMB systematic name and `Reaction.name` the accepted one; the `systematicName` data property exists because NFDI4Cat's biocatalysis competency questions ask for an enzyme's nomenclature, which the accepted name alone does not answer.","`L-alanine:2-oxoglutarate aminotransferase` (systematic) vs `alanine transaminase` (accepted)"]},rl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"JSON-LD — what is it?",short:"RDF serialised as valid JSON — the format that survives a normal web stack",say:"An RDF serialisation that is also ordinary JSON. An `@context` maps short JSON keys onto IRIs, so an RDF tool reads the bytes as triples while a consumer that ignores the context still gets usable JSON. It is the serialisation a web developer would actually reach for: `JSON.parse` handles it and a document store will hold it unchanged.",glossary:["json-ld"],heard:["JSON-LD","@context",".jsonld","application/ld+json"],warn:"BACKGROUND — Do not offer JSON-LD in the demo. The endpoint has four…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/negotiation.py"}],see:["sparql-protocol","def-rdf","def-rdf-xml","def-turtle","def-n-triples","def-scidats","def-content-negotiation","def-sparql-results-media-types-and-406"],points:["Not served. Content negotiation offers SPARQL results as JSON and XML, CSV for SELECT, and Turtle for graph queries (`src/tacat/api/negotiation.py`), and the artefact ships as Turtle. JSON-LD is named in the primers as the seam to an ordinary web application and to the assessor's SciDatS, not as something implemented.",'`{"@id": "https://w3id.org/bitspark/tacat/CHEBI_57972", "rdfs:label": "L-alanine"}`']},cl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"JVM / Java runtime — what is it?",short:"the runtime that executes Java bytecode — needed for HermiT, and only at build time",say:"The Java Virtual Machine executes compiled Java bytecode; a JRE is the JVM plus the standard library. Any Java program needs one installed and on `PATH`, whatever language is calling it — a Python process shelling out to a Java tool depends on the JVM just as directly as a Java process does.",glossary:["jvm-java-runtime"],heard:["JVM / Java runtime","JVM","JRE","default-jre-headless","Java"],warn:'"The runtime ships no JVM" is true of the image, not of a source checkout.…',refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"}],see:["build-time-reasoning","def-hermit","def-multi-stage-build","def-owlready2","def-container-image","def-liveness-probe"],points:["HermiT is Java and Owlready2 runs it as a subprocess, so the Dockerfile installs `default-jre-headless` in the builder stage only; the runtime stage copies the reasoned Turtle and installs no Java. With no JVM on a checkout, `build_app` logs what to run and serves an empty graph, so `/health` reports 503."]},dl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"Kaniko / Docker-in-Docker / privileged container",short:"building a container image in CI without a Docker daemon, so no privileged runner is needed",say:"Docker-in-Docker (dind) runs a full Docker daemon inside the CI job, which requires the job container to be *privileged* — near-root access to the host kernel, granted to whatever the build then does. Kaniko is a userspace image builder: it executes a Dockerfile's instructions and pushes the result without a daemon and without privilege, so it works on shared runners that refuse privileged mode.",glossary:["kaniko"],heard:["Kaniko / Docker-in-Docker / privileged container","Kaniko","dind","Docker-in-Docker","privileged runner","/kaniko/executor"],warn:"Kaniko removes the need for a privileged runner. It is not a sandbox — it does…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["step-6-pipeline","def-gitlab-runner","def-container-registry-image-tag-latest","def-container-image","def-services","def-multi-stage-build","def-ci-cd"],points:["The `container` job in `.gitlab-ci.yml` runs `gcr.io/kaniko-project/executor:v1.23.2-debug`, writes a registry credential to `/kaniko/.docker/config.json`, and pushes the short-SHA tag plus `:latest` on the default branch. No Docker socket, no dind.","`/kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA`"]},ll={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"KEGG — what is it?",short:"the pathway database the first submission anchored on, and the cause of its identifier error",say:"The Kyoto Encyclopedia of Genes and Genomes is a long-established database of compounds, reactions and metabolic pathways, with its own compound identifiers such as `C00025` and a REST API whose `conv/chebi` operation cross-references them to ChEBI. It has no public SPARQL endpoint, and its ChEBI mapping lands on the neutral parent compound rather than the physiological microspecies.",glossary:["kegg"],heard:["KEGG","Kyoto Encyclopedia of Genes and Genomes","conv/chebi","C00025"],warn:'NOT USED HERE — The story is not "I typed the wrong number". A defensible…',see:["microspecies","identifiers-verified","federated-payoff","mistake-owned","def-chebi","def-rhea","def-dianion-and-neutral-parent","def-microspecies","def-federation","def-common-mode-failure"],points:["Rejected after the first submission anchored on it. `conv/chebi` returning neutral parents is the systematic cause of six of nine chemical identifiers being wrong; and with no Rhea identifier anywhere, the federated join was not unimplemented but impossible. No KEGG identifier is in the submitted repository.","`C00025` is KEGG's L-glutamate; `conv/chebi` maps it to the neutral parent, not to `CHEBI:29985`"]},hl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ketimine — what is it?",short:"the second Schiff base of a PLP half-reaction, hydrolysed to release the 2-oxo acid",say:"A Schiff base whose C=N bond comes from a ketone rather than an aldehyde. In PLP catalysis it is the isomer of the external aldimine reached once the α-proton has been removed and a proton delivered to the cofactor's C4': the double bond has moved onto the substrate carbon. Hydrolysing the ketimine releases the 2-oxo acid and leaves the amino group behind on the cofactor, as PMP.",glossary:["ketimine"],heard:["ketimine","ketimine intermediate","ketimine Schiff base"],warn:"BACKGROUND — Not the external aldimine. Both are Schiff bases between the same…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["plp-cofactor","def-half-reaction","def-internal-external-aldimine","def-quinonoid-intermediate","def-pmp","def-plp","def-geminal-diamine"],points:["The step the submission's account of the mechanism skips. `hasCofactor` says only that PLP cycles PLP -> PMP -> PLP, so the presenter can name the start (internal and external aldimine) and the end (PMP) of the first half-reaction, but not the intermediate that connects them."]},fl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"kineticMechanism — what is it?",short:"a datum on the enzyme naming how it works — here, `ping-pong bi-bi`",say:"A data property recording the kinetic mechanism of a catalyst: the order in which substrates bind and products leave. It belongs to the catalyst rather than to the transformation — the same net reaction run by a different enzyme can proceed by a different mechanism, and the mechanism is what makes a claim about cofactor behaviour testable.",glossary:["kineticmechanism"],heard:["kineticMechanism","tacat:kineticMechanism"],warn:"Free text, not a term from a controlled vocabulary, and no part of the defined…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["ping-pong-mechanism","signature-not-mechanism","def-ping-pong-bi-bi","def-hascofactor","def-signature","def-half-reaction","def-object-property-vs-data-property","def-defined-class"],points:["Declared functional in `src/tacat/ontology/schema.py` with `domain = [Enzyme]`, `range = [str]`, and carrying the literal `ping-pong bi-bi` on all three enzymes. It is what makes the `hasCofactor` placement correct: the cofactor leaves the first half-reaction as PMP, so it is the enzyme's, not the equation's.",'`tacat:EC_2_6_1_2 tacat:kineticMechanism "ping-pong bi-bi"^^xsd:string .`']},pl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"KM / kcat / catalytic efficiency — what is it?",short:"the Michaelis-Menten kinetic parameters — each a measured number with units",say:"`KM` is the substrate concentration at which an enzyme runs at half its maximum rate, in units of concentration; a low value means it saturates early. `kcat`, the turnover number, is molecules converted per active site per second, in s⁻¹. Their ratio `kcat/KM` is the catalytic efficiency, in M⁻¹s⁻¹, and is what you compare to say which substrate an enzyme actually prefers.",glossary:["km-kcat-catalytic-efficiency"],heard:["KM / kcat / catalytic efficiency","Km","Michaelis constant","kcat","kcat (turnover number)","kcat/KM","specificity constant"],warn:"BACKGROUND — These are measurements, not properties of a reaction: each is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["def-equilibrium","def-g-and-keq-1-for-transamination","def-out-of-scope-questions","def-qudt-om-2","def-reac4cat","def-emmo","def-high-throughput-screening"],points:['The first entry in `OUT_OF_SCOPE_QUESTIONS`, whose rationale reads: "Requires quantities with units and measurement provenance. This is where the choice between QUDT, OM-2 and EMMO’s unit classes stops being academic — NFDI consortia have not converged, and Reac4Cat uses OM-2."']},$l={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"L-alanine — what is it?",short:"the amino donor of EC 2.6.1.2 — ChEBI:57972, C3H7NO2, charge 0",say:"The simplest chiral amino acid: a methyl side chain on the α-carbon and nothing else. It transaminates to pyruvate, its three-carbon 2-oxo partner, and in animals it is the form in which muscle ships surplus nitrogen to the liver. Free in water at physiological pH the molecule is a zwitterion — carboxyl deprotonated, amino group protonated — so its net charge is zero.",glossary:["l-alanine"],heard:["L-alanine","CHEBI:57972","alanine","Ala","L-Ala"],warn:"Charge 0 means the zwitterion, not the uncharged structure a textbook draws.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:57972"}],see:["identifiers-verified","microspecies","why-three-reactions","def-zwitterion","def-amino-acid","def-pyruvate","def-accepted-name-vs-display-name","def-alt-ast","def-carbon-count-pairing"],points:['`L_ALANINE`, CHEBI:57972, C3H7NO2, charge 0 — the reactant of `REACT_0000002`, typed `tacat:AminoAcid` and labelled "L-alanine". ChEBI\'s accepted name is the zwitterion form while Rhea prints the bare one, so the pair sits in `NAME_DIVERGENCES`: both strings are carried, neither is chosen.','`ChemicalEntity(57972, "L-alanine zwitterion", "L-alanine", "C3H7NO2", 0)`']},ul={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"L-aspartate — what is it?",short:"the amino donor of EC 2.6.1.1 — ChEBI:29991, C4H6NO4, charge −1",say:"A four-carbon amino acid whose side chain is a second carboxyl group. Transaminating it gives oxaloacetate, which is how amino-acid nitrogen and its carbon skeleton meet central carbon metabolism. At physiological pH the backbone is a zwitterion and the side-chain carboxyl is deprotonated as well, so the species present carries a net charge of −1 rather than 0.",glossary:["l-aspartate"],heard:["L-aspartate","CHEBI:29991","aspartate","Asp","L-Asp","aspartic acid"],warn:"Aspartate at −1 beside alanine at 0 is not an inconsistency — the side-chain…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:29991"}],see:["identifiers-verified","minus-sign","why-three-reactions","def-microspecies","def-minus-sign-vs-hyphen","def-amino-acid","def-oxaloacetate","def-l-glutamate","def-alt-ast"],points:["`L_ASPARTATE`, CHEBI:29991, C4H6NO4, charge −1 — the reactant of `REACT_0000001`, the headline reaction, typed `tacat:AminoAcid`. ChEBI's accepted name is `L-aspartate(1−)`, whose charge suffix is U+2212 MINUS SIGN and not an ASCII hyphen; Rhea prints the bare `L-aspartate`.",'`ChemicalEntity(29991, "L-aspartate(1−)", "L-aspartate", "C4H6NO4", -1)`']},yl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"L-cysteine — what is it?",short:"the amino donor of EC 2.6.1.3 — ChEBI:35235, C3H7NO2S, charge 0",say:"Alanine with one sulfur: the side chain is a thiol, −CH2−SH. That group is what makes cysteine unusual — it is redox-active, it forms the disulfide bridges that hold protein folds together, and most of sulfur metabolism passes through it. Transaminating it gives 3-mercaptopyruvate, from which the sulfur can be taken off downstream.",glossary:["l-cysteine"],heard:["L-cysteine","CHEBI:35235","cysteine","Cys","L-Cys"],warn:"Never resolve this one from its name. As a string `L-cysteine` is CHEBI:17561…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"source",rel:"identified-as",at:"CHEBI:35235"}],see:["tautomer-trap","identifiers-verified","why-three-reactions","def-zwitterion","def-mercaptopyruvate-naming","def-amino-acid","def-tautomer","def-thiol-sulfanyl-group","def-3-mercaptopyruvate-downstream"],points:["`L_CYSTEINE`, CHEBI:35235, C3H7NO2S, charge 0 — the reactant of `REACT_0000003`, typed `tacat:AminoAcid`. ChEBI's accepted name is the zwitterion form; the bare name `L-cysteine` belongs to CHEBI:17561, a *tautomer*, which `reference_data.py` flags as a trap.",'`ChemicalEntity(35235, "L-cysteine zwitterion", "L-cysteine", "C3H7NO2S", 0)`']},ml={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"L/D (Fischer) vs R/S (CIP) — what is it?",short:"the L- on every label is Fischer's relative convention, not the absolute R/S descriptor",say:"Two systems for naming a stereocentre. Fischer's L/D is *relative*: it assigns a molecule to the family of L- or D-glyceraldehyde by a drawing convention, and biochemistry still uses it for sugars and amino acids. Cahn-Ingold-Prelog R/S is *absolute*: it ranks the four substituents by priority and reads the handedness off directly. Neither prefix can be translated into the other by rule.",glossary:["l-d-vs-r-s"],heard:["L/D (Fischer) vs R/S (CIP)","Fischer convention","Cahn-Ingold-Prelog","CIP","R/S","L- prefix"],warn:"L does not mean S. L-cysteine is R while the other three L-amino acids here are…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["identifiers-verified","def-chirality-chiral-amine","def-l-cysteine","def-d-amino-acid-transaminase","def-amino-acid","def-chebi","def-systematic-name"],points:['Every amino acid in the graph carries the Fischer prefix — "L-aspartate", "L-alanine", "L-cysteine", "L-glutamate" — because that is the string ChEBI and Rhea use. No property expresses stereochemistry: it is carried by the identifier and the label alone, and nothing in the model would notice a D- species.',"`L-cysteine` is (R)-cysteine; `L-alanine` is (S)-alanine"]},gl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"L-glutamate — what is it?",short:"product of all three transaminations — ChEBI:29985, C5H8NO4, charge −1",say:"The five-carbon amino acid whose keto partner is 2-oxoglutarate, and the cell's central nitrogen carrier: amino groups stripped from many different amino acids are handed to 2-oxoglutarate, so they converge on glutamate before the nitrogen is reused or disposed of. Like aspartate it has an acidic side chain, deprotonated at physiological pH, so the species present is the (1−) anion.",glossary:["l-glutamate"],heard:["L-glutamate","glutamate","Glu","L-Glu","L-glutamate(1−)","glutamic acid"],warn:"Not glutamine and not glutamic acid: the amide is another molecule and the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"source",rel:"identified-as",at:"CHEBI:29985"}],see:["why-three-reactions","negative-control","competency-questions","def-amino-acid","def-microspecies","def-2-oxoglutarate","def-glutamate-dehydrogenase","def-substrate-product","def-l-aspartate"],points:["`L_GLUTAMATE`, CHEBI:29985, C5H8NO4, charge −1 — the product of all three transaminations and the reactant of the negative control, so it holds four `ReactionParticipant` nodes. That is exactly what CQ05, CQ06 and CQ07 interrogate: four reactions *have* it, three *produce* it, and it plays both roles in the graph.",'`tacat:CHEBI_29985 a obo:CHEBI_29985, tacat:AminoAcid ; rdfs:label "L-glutamate"`']},wl={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"LARA / LARAsuite — what is it?",short:"the assessor's open-source lab-automation platform, and the house style this package copies",say:"LARA (LARAsuite) is Mark Dörr's open-source laboratory-automation platform at the University of Greifswald: a family of Python packages, Django-based, that plan, schedule and run robotic experiments and capture the resulting data in FAIR form, with SiLA 2 device drivers underneath. Its own statement of purpose is *fully automatized transaminase high throughput protein screening*.",glossary:["lara-larasuite"],heard:["LARA / LARAsuite","LARA","LARAsuite","lara.uni-greifswald.de","opensourcelab"],warn:"BACKGROUND — LARA screens ω-transaminases, and the defined class does not…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["ask-lara-or-alongside","omega-transaminase","why-three-reactions","def-omega-transaminase-vs-alpha-transaminase","def-high-throughput-screening","def-nfdi4cat","def-scidats","def-out-of-scope-questions","def-defined-class"],points:["Two contacts. The `_____` module banner with `:PROJECT:` / `:details:` / `:authors:` is the LARAsuite house format, and `pyproject.toml` ignores ruff's D415 rather than abandon it. The out-of-scope purification and immobilisation questions are answered *precisely LARA's domain and the natural direction of extension*.","`#  :PROJECT: tacat — transaminase catalysis knowledge graph`"]},bl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"lazy evaluation (rdflib Result) — what is it?",short:"a result computed when its rows are consumed, so a query can parse and still fail later",say:"Work deferred until its value is actually needed. rdflib's `Graph.query` returns a `Result` object once the query has parsed; the rows are produced when the result is iterated or serialised, not before. A query can therefore be accepted, return an object, and only raise later — wherever the caller first touches it, which may be well outside the code that ran it.",glossary:["lazy-evaluation"],heard:["lazy evaluation (rdflib Result)","rdflib Result","deferred evaluation","forcing a result"],warn:"Forcing evaluation is what makes the failure a 400. It is not a timeout: rdflib…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_named_graph_queries_are_a_bad_request_not_a_server_error"}],see:["def-rdflib","def-conjunctivegraph","def-querypolicy","def-notacceptable-406","def-graphrepository","def-event-loop-and-thread-pool"],points:["`run_query` in `src/tacat/api/app.py` forces evaluation inside its own `try`: `len(result)` for a SELECT, `len(result.graph)` for CONSTRUCT and DESCRIBE. Without that, a legal `GRAPH ?g {...}` — which this single-graph endpoint cannot satisfy — escapes the handler as a 500 instead of a 400.",'`row_count = len(result) if result.type == "SELECT" else 0`']},vl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"lexical form — what is it?",short:"the string a node reduces to for matching — and for an IRI, that is the IRI itself",say:"The string representation of an RDF node: for a literal, the characters before any datatype or language tag; for an IRI, the IRI string. SHACL constraints that take a regular expression, `sh:pattern` among them, match against the lexical form of the value node, so a pattern works on an IRI exactly as it works on a string.",glossary:["lexical-form"],heard:["lexical form","lexical form of a value node","value node string"],warn:"Inside `sh:qualifiedValueShape` a pattern does not constrain the value, it…",see:["identifiers-verified","mistake-owned","def-sh-pattern","def-shacl","def-literal","def-iri","def-typed-literal-language-tag","def-qualified-value-shape"],points:["The false premise that cost a redesign was that `sh:pattern` needs a literal, so an earlier graph carried every identifier twice — an IRI to join on, a string to validate. `data/shapes.ttl` now patterns the `rdf:type` IRIs directly and the duplicate string is gone.",'`sh:pattern "^http://purl\\\\.obolibrary\\\\.org/obo/CHEBI_[0-9]+$"` on `sh:path rdf:type`']},_l={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"Lineweaver-Burk plot — what is it?",short:"plot 1/v against 1/[S] — parallel lines mean ping-pong, intersecting lines mean ternary",say:"A linearisation of the Michaelis-Menten equation: the reciprocal of the rate plotted against the reciprocal of substrate concentration gives a straight line whose intercepts read off 1/Vmax and −1/KM. For a two-substrate enzyme the diagnostic is the family of lines got by varying one substrate at several fixed concentrations of the other — parallel for ping-pong, intersecting for a ternary complex.",glossary:["lineweaver-burk-plot"],heard:["Lineweaver-Burk plot","double-reciprocal plot","1/v vs 1/[S]","reciprocal plot"],warn:"BACKGROUND — Superseded for fitting: taking reciprocals distorts the error…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["ping-pong-mechanism","signature-not-mechanism","def-ping-pong-bi-bi","def-km-kcat-catalytic-efficiency","def-michaelis-menten-equation-vmax-initial-rate-assumption","def-sequential-mechanism-ternary-complex","def-product-inhibition","def-kineticmechanism"],points:['How the string the graph asserts was earned elsewhere. `kineticMechanism "ping-pong bi-bi"` is curated reference data, neither measured nor inferred here — so *how do you know?* is answered from the literature, by parallel double-reciprocal lines, and not from anything in this repository.']},kl={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"LinkML — what is it?",short:"YAML schema language that generates SHACL, JSON Schema and Python from one model",say:"LinkML is a schema language for linked data: you write classes and slots in YAML, and generators emit SHACL shapes, JSON Schema, Pydantic models, OWL and documentation from that one source. Its classes are shapes rather than ontology classes — `is_a` inherits slots, it does not assert `rdfs:subClassOf` — so several LinkML classes may carry the same `class_uri`, one per usage context.",glossary:["linkml"],heard:["LinkML","Linked Data Modeling Language","linkml.io","LinkML schema","schema YAML","LinkML class","LinkML slot"],warn:"BACKGROUND — A LinkML `is_a` is not `rdfs:subClassOf`, and a LinkML class is…",see:["dcat-undocumented","anchor-sentence","def-dcat-ap-plus","def-shacl","def-meta4cat","def-scidats","def-owl","def-node-shape-vs-property-shape"],points:["Not used. `data/shapes.ttl` is hand-written and commented — one file, an `sh:message` on every constraint — where DCAT-AP+, CoreMeta4Cat and ChemDCAT-AP all generate their shapes from LinkML. That is the divergence to name if asked why the shapes are not generated.","`is_a: EvaluatedEntity` inherits slots; it emits no `rdfs:subClassOf` axiom"]},ql={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"literal — what is it?",short:"a plain value — text, number, date — and a dead end in the graph",say:"One of the things the object of a triple can be; the others are an IRI and a blank node. A literal is a value: characters plus a datatype IRI, or characters plus a language tag. It can never be the subject of a triple, so nothing hangs off it — a literal is where a path through the graph stops.",glossary:["literal"],heard:["literal","RDF literal","plain value"],warn:"A correct-looking identifier stored as a literal passes every pattern test and…",see:["identifiers-verified","mint-vs-reuse","def-iri","def-typed-literal-language-tag","def-rdf","def-uriref","def-lexical-form","def-graph","def-curie"],points:["The distinction that mattered most. An earlier version stored every ChEBI, Rhea and EC identifier as a literal string: well formed, present, tested, and joinable to nothing. They are now the individual's `rdf:type`, which is an IRI.",'`tacat:EC_2_6_1_2 tacat:kineticMechanism "ping-pong bi-bi"^^xsd:string .` — nothing links out of the object']},Il={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"HEALTHCHECK / liveness probe — what is it?",short:"a periodic self-test that sets a container's health status — and does not act on it",say:"A command a platform runs against a running container on a schedule to ask whether it still works. Docker's `HEALTHCHECK` sets a status — starting, healthy, unhealthy — and nothing more; acting on it is the job of a restart policy, a Compose dependency or an orchestrator. Kubernetes splits the idea: a liveness probe restarts, a readiness probe removes from load balancing.",glossary:["liveness-probe"],heard:["HEALTHCHECK / liveness probe","HEALTHCHECK","/health","liveness","readiness probe","unhealthy"],warn:"Do not say the health check restarts anything or that the service is…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_health_503_when_graph_is_empty"}],see:["def-container-image","def-event-loop-and-thread-pool","def-materialise","def-hermit","def-api"],points:["The Dockerfile probe requests `/health` every 30s, with a 5s timeout, a 10s start period and 3 retries. `/health` answers 503 for an empty graph *and* for a graph carrying no inferred types: a `--no-reason` build parses and serves, so non-emptiness alone would pass while the whole point of the deployment was missing."]},Al={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"lock file — what is it?",short:"the exact resolved versions a build used — the lot number, not the catalogue number",say:"A file recording the exact resolved version of every direct and transitive dependency, produced by the package manager from the looser ranges declared in the project metadata. The declaration says what is acceptable; the lock file says what was actually installed. Installing from it reproduces one environment instead of re-resolving to whatever is newest today.",glossary:["lock-file"],heard:["lock file","uv.lock","lockfile","uv sync --frozen"],warn:"It pins Python packages and nothing else. The base images are referenced by tag…",refs:[{kind:"code",rel:"implemented-in",at:"uv.lock"}],see:["uv-lockfile","def-vendored","def-uv","def-base-image-digest-pinning","def-pep-735-dependency-groups","def-multi-stage-build","def-commit-sha-and-checksum","def-ci-cd"],points:["`uv.lock`, committed. Every install is `uv sync --frozen` — in the CI `before_script`, and twice in the `Dockerfile` — which fails rather than quietly updating the lock, so the pipeline, the image and a developer's checkout resolve identically.","`uv sync --frozen` — install exactly what `uv.lock` says, never re-resolve"]},Cl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"malate–aspartate shuttle — what is it?",short:"how NADH reaches the mitochondrion — GOT1 and GOT2 run one reaction both ways",say:"The inner mitochondrial membrane is impermeable to NADH, so reducing equivalents cross as malate: oxaloacetate is reduced in the cytosol, oxidised back inside, and the carbon returns to the cytosol as aspartate because oxaloacetate cannot cross either. Aspartate transaminase catalyses the aspartate/oxaloacetate step on both sides of the membrane, in opposite directions.",glossary:["malate-aspartate-shuttle"],heard:["malate–aspartate shuttle","malate shuttle","MAS","aspartate shuttle"],warn:"BACKGROUND — The two isozymes are not the two directions in the model.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["weak-got1","explain-to-biochemists","def-oxaloacetate","def-l-aspartate","def-got1-p17174","def-alt-ast","def-citric-acid-cycle-intermediates","def-equilibrium"],points:["Why two aspartate-transaminase accessions with different compartments sit on one EC number: `P17174` (GOT1, cytosolic) and `P00505` (GOT2, mitochondrial) are both asserted `up:enzyme ec:2.6.1.1`. Compartment is not modelled, so the graph records the accessions and nothing about where they act."]},xl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"mass balance / charge balance — what is it?",short:"the same atom counts and the same total charge on both sides of an equation",say:"Two invariants every chemical equation must satisfy: each element occurs the same number of times on both sides, because atoms are neither created nor destroyed, and the total electric charge is the same on both sides. They hold for any reaction whatever, so they can be checked mechanically — which makes them the natural property-based test over curated reaction data.",glossary:["mass-balance-charge-balance"],heard:["mass balance / charge balance","mass balance","charge balance","balanced equation","atom conservation"],warn:"A balance check is not an identity check. v0 carried correct microspecies…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["def-property-based-test","def-microspecies","def-stoichiometric-coefficient","def-plp","def-chemicalentity","def-test-oracle"],points:["`reference_data.ChemicalEntity` carries a `formula` and a `charge` for every participant, but the submitted tree never uses either: no module reads the fields, they are not written into the graph, and `tests/` contains no balance check. The data is there and the arithmetic is not done.","`C3H7NO2 + C5H4O5  →  C3H3O3 + C5H8NO4` — C8H11NO7 both sides, charge −2 both sides"]},Tl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"materialise — what is it?",short:"write computed triples into the stored graph so queries need no reasoner",say:"To compute the consequences of a graph once and store them as ordinary triples, instead of deriving them again for every query. A materialised view in the database sense: reads become cheap and uniform, and the cost moves to build time where it is paid once and can be checked.",glossary:["materialise"],heard:["materialise","materialised","materialisation","materialised view"],warn:"A materialised graph is only as current as its last build. Nothing at query…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/builder.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/artefacts.py"}],see:["build-time-reasoning","def-reasoner","def-hermit","def-entailment","def-deductive-closure","def-world-http-inferrences","def-multi-stage-build"],points:["`build_reasoned_graph` runs HermiT and then serialises the whole Owlready2 *world*, not the ontology — the reasoner files its output into a separate `http://inferrences/` ontology, so `onto.save()` would drop every inferred type. The result is `data/reactions.ttl`, and the runtime image ships no Java."]},El={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"3-mercaptopyruvate vs 2-oxo-3-sulfanylpropanoate",short:"one compound, two names — ChEBI's accepted name and the string Rhea prints",say:"Two names for one species: the 2-oxo acid produced when cysteine is transaminated, a pyruvate skeleton carrying a thiol. `3-mercaptopyruvate` is ChEBI's accepted name; `2-oxo-3-sulfanylpropanoate` is the systematic form Rhea and UniProt print. Nothing chemical distinguishes them — same identifier, same formula C3H3O3S, same charge −1.",glossary:["mercaptopyruvate-naming"],heard:["3-mercaptopyruvate vs 2-oxo-3-sulfanylpropanoate","3-mercaptopyruvate","2-oxo-3-sulfanylpropanoate","mercaptopyruvate","CHEBI:57678"],warn:"Not a tautomer pair and not a conjugate acid/base — one identifier, two labels.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:57678"}],see:["identifiers-verified","tautomer-trap","def-accepted-name-vs-display-name","def-tautomer","def-2-oxo-acid","def-chebi-accepted-name","def-chebi","def-microspecies"],points:['Both strings are carried rather than reconciled: `MERCAPTOPYRUVATE` holds accepted_name "3-mercaptopyruvate" and display_name "2-oxo-3-sulfanylpropanoate", and the pair is listed in `NAME_DIVERGENCES`. The two primers print different ones — Kundai\'s reaction table the systematic name, Julian\'s the ChEBI one.','ChemicalEntity(57678, "3-mercaptopyruvate", "2-oxo-3-sulfanylpropanoate", "C3H3O3S", -1)']},Rl={kind:"definition",area:"context",stance:"fact",icon:"compass",q:"Meta4Cat — what is it?",short:"NFDI4Cat's harvester — it pulls DCAT-AP descriptions into a searchable knowledge graph",say:"Meta4Cat is NFDI4Cat's metadata service: it harvests DCAT-AP descriptions of catalysis datasets and loads them into a knowledge graph, so a dataset that describes itself in the profile becomes findable across the consortium without anyone copying its contents. CoreMeta4Cat is the associated reference collection of metadata terms, built on DCAT-AP+ and LinkML.",glossary:["meta4cat"],heard:["Meta4Cat","CoreMeta4Cat","NFDI4Cat metadata service"],warn:"BACKGROUND — The dataset is not registered with, harvested by, or known to…",see:["dcat-undocumented","def-nfdi4cat","def-fair","def-dcat-ap-plus","def-dcat","def-prov-o"],points:["The named reason `data/dataset.ttl` exists rather than being decoration. Its header says Meta4Cat harvests DCAT-AP into its knowledge graph, so this is the format that would let the dataset be discovered — the consortium's own infrastructure is the intended consumer."]},Sl={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"metashacl — what is it?",short:"validating the shapes file itself before trusting what it reports about the data",say:"SHACL shapes are written in RDF, so a shapes graph can itself be validated against the shapes that define SHACL. Without that step a misspelled constraint parameter is not an error but an unrecognised triple: it is ignored, the shape it belongs to constrains nothing, and the validation report still says the data conforms.",glossary:["metashacl"],heard:["metashacl","--metashacl","meta_shacl","SHACL-SHACL","shapes validation"],warn:"A green SHACL report is worth only what the shapes are worth. `sh:minCounts`…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_knowledge_graph_conforms"},{kind:"code",rel:"implemented-in",at:"src/tacat/validation.py"}],see:["why-both-owl-shacl","step-5-validate","def-shacl","def-pyshacl","def-node-shape-vs-property-shape","def-sh-severity","def-mutation-testing","def-data-gate-vs-code-gate"],points:["`pyshacl --metashacl` runs over both `data/reactions.ttl` and `data/dataset.ttl` in the `shacl-validation` CI job, and `tests/test_shapes.py` passes `meta_shacl=True`. The served report does not: `src/tacat/validation.py` calls `shacl_validate(..., meta_shacl=False)`, so `GET /validation` checks data, not shapes.","`uv run pyshacl -s data/shapes.ttl -f human --metashacl data/reactions.ttl`"]},Ol={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"Michaelis-Menten equation / Vmax — what is it?",short:"the rate law KM and kcat are defined by, and the conditions it only holds under",say:"The standard single-substrate rate law: rate rises with substrate concentration and saturates at Vmax, reaching half of it at [S] = KM. Vmax is the rate with every active site occupied, so Vmax = kcat·[E]total and kcat is what remains once enzyme concentration is divided out. The parameters are defined only for *initial* rates, before product accumulates and the reverse reaction starts to matter.",glossary:["michaelis-menten-equation-vmax-initial-rate-assumption"],heard:["Michaelis-Menten equation / Vmax","Vmax","initial-rate assumption","steady-state assumption","v0","saturation kinetics","Michaelis-Menten kinetics"],warn:"BACKGROUND — Vmax is not a property of the enzyme; it scales with how much…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["def-km-kcat-catalytic-efficiency","def-lineweaver-burk-plot","def-out-of-scope-questions","def-qudt-om-2","def-haldane-relationship","def-specific-activity-enzyme-unit-katal"],points:["The equation underneath the first `OUT_OF_SCOPE_QUESTIONS` entry. Nothing in the submission carries a quantity at all: no unit vocabulary, no measurement provenance, no numeric property on an enzyme — which is the scope boundary that entry exists to record.","`v0 = Vmax · [S] / (KM + [S])`, with `Vmax = kcat · [E]total`"]},Pl={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"microspecies — what is it?",short:"one protonation state of a compound, given an identifier of its own",say:"A compound in water exists as a set of protonation states whose proportions depend on pH. Each individual state is a microspecies; the uncharged form drawn in a textbook is the *neutral parent*. ChEBI gives many microspecies their own entries, and Rhea writes its equations in microspecies exclusively, because only then does the charge balance. The Unicode normalisation form of chemistry.",glossary:["microspecies"],heard:["microspecies","protonation state","microspecies vs parent","CHEBI microspecies","protonation microspecies"],warn:"A microspecies is not a tautomer: tautomers differ in where a proton sits…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"source",rel:"identified-as",at:"CHEBI:29985"}],see:["microspecies","tautomer-trap","def-tautomer","def-zwitterion","def-chebi","def-kegg","def-dianion-and-neutral-parent","def-conjugate-acid-base"],points:["Every participant is carried as the microspecies, not the parent — `L-glutamate(1−)` is CHEBI:29985, charge −1, not the neutral CHEBI:16015. v0 resolved its identifiers through KEGG’s `conv/chebi`, which returns the neutral parent, so it was systematically off by one hydrogen per unit of charge.","`CHEBI:29985` L-glutamate(1−), charge −1 — what is carried; `CHEBI:16015` L-glutamic acid, the neutral parent — what is not"]},jl={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"U+2212 MINUS SIGN vs U+002D HYPHEN-MINUS — what is it?",short:"Two near-identical dash characters in one ChEBI name; joining on the wrong one fails silently",say:"U+2212 MINUS SIGN is the typographic minus; U+002D HYPHEN-MINUS is the ASCII hyphen on the keyboard. They render almost identically and are different codepoints, so two strings differing only in which one they use are unequal to every string comparison, sort and hash. ChEBI writes charge suffixes with U+2212 while a stereochemistry prefix is ASCII, so one name contains both.",glossary:["minus-sign-vs-hyphen"],heard:["U+2212 MINUS SIGN vs U+002D HYPHEN-MINUS","minus sign","hyphen-minus","U+2212","U+002D","dash normalisation"],warn:'A "normalise the dashes" pass corrupts rather than fixes: matching ChEBI means…',refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["minus-sign","identifiers-verified","def-chebi","def-chebi-accepted-name","def-accepted-name-vs-display-name","def-ruf001","def-ruff","def-microspecies"],points:["`reference_data.py` stores ChEBI's accepted names verbatim, `L-glutamate(1−)` among them — ASCII hyphen after the L, MINUS SIGN inside the charge. `pyproject.toml` carries a per-file `RUF001` ignore for exactly that module, with the reason written down, so ruff does not ASCII-fold the character.",'"L-glutamate(1−)"  # U+002D after the L, U+2212 in the charge']},Ll={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"multi-stage build (builder / runtime stage) — what is it?",short:"a Dockerfile with several FROM stages, where the last copies only what it names from earlier ones",say:"A Dockerfile with more than one `FROM`. Each stage is its own build on its own base image, and a later stage takes only the files it names with `COPY --from=`. Everything an earlier stage installed and did not hand over is absent from the final image rather than deleted from it, so build toolchains never reach the shipped layers.",glossary:["multi-stage-build"],heard:["multi-stage build (builder / runtime stage)","builder stage","runtime stage","AS builder","COPY --from="],warn:"The runtime having no JVM is a property of this Dockerfile, not of the package.…",refs:[{kind:"code",rel:"implemented-in",at:"Dockerfile"}],see:["build-time-reasoning","def-container-image","def-jvm-java-runtime","def-hermit","def-seam","def-tacat-data-dir","def-materialise"],points:["Two stages. `AS builder` installs `default-jre-headless`, runs `uv run --no-dev tacat build` — Owlready2 driving HermiT — and asserts `data/reactions.ttl` is non-empty. `AS runtime` copies `.venv`, `src/` and `data/` from it and installs no Java. If reasoning fails, the image does not build.","`COPY --from=builder --chown=tacat:tacat /app/data /app/data`"]},Nl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"mutation testing — what is it?",short:"break the input or the code on purpose and check that the suite notices",say:"Testing the tests. Something is deliberately changed — a mutated line of source, a corrupted input — and the suite is run: if nothing fails, the suite was not making that claim. Dedicated tools generate mutants of the source automatically; done by hand it is a set of fixtures broken on purpose, each asserted to be rejected.",glossary:["mutation-testing"],heard:["mutation testing","mutant","testing the tests","negative fixture suite"],warn:"BACKGROUND — The twelve cases assert non-conformance only, never the text of…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"}],see:["def-branch-coverage","def-parametrised-test","def-shacl","def-pyshacl","def-negative-control","def-test-oracle","def-regression-test"],points:["The framing for the negative SHACL suite, not a tool that runs. `tests/test_shapes.py` carries twelve deliberately broken graphs — `no_role`, `rhea_curie`, `malformed_ec` among them — and asserts each fails validation. Nothing mutates `src/`, and no mutation-testing tool is installed.",'`assert not conforms, f"shapes failed to catch it: {why}"`']},Dl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"mypy — what is it?",short:"checks that Python type annotations are consistent, before the code runs",say:"The static type checker for Python. It reads the annotations on functions, arguments and variables and reports the inconsistencies — an `int` where a `str` is declared, a value that may be `None` — without executing anything. Python ignores annotations at runtime, so without a checker they are documentation; mypy is what turns them into a constraint. Roughly `tsc --strict`.",glossary:["mypy"],heard:["mypy","[tool.mypy]","static type checker","mypy src ci"],warn:"It checks the Python, never the graph. A wrong ChEBI IRI is perfectly well…",refs:[{kind:"code",rel:"implemented-in",at:"pyproject.toml"}],see:["ci-data-gates","def-ruff","def-bandit","def-ci-cd","def-frozen-dataclass","def-owlready2","def-data-gate-vs-code-gate"],points:["Strict in `pyproject.toml`: `disallow_untyped_defs`, `disallow_incomplete_defs`, `disallow_any_generics`, `warn_unreachable`. An override relaxes it for `owlready2`, `pyshacl`, `SPARQLWrapper` and the tests, which ship no type stubs. The `typecheck` CI job runs `uv run mypy src ci`.","`disallow_untyped_defs = true` under `[tool.mypy]`"]},Bl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"n-ary relation — what is it?",short:"a relationship among more than two things, or one carrying attributes of its own",say:"A relationship with more than two participants, or with properties belonging to the relationship rather than to either end. A triple holds exactly two, so RDF introduces a node standing for the relationship instance and hangs every participant and every attribute off that node — the W3C Semantic Web Best Practices n-ary relation pattern, Use Case 1.",glossary:["n-ary-relation"],heard:["n-ary relation","n-ary pattern","n-ary","W3C n-ary relation pattern"],warn:"The cost is join length — every question about a reaction's chemistry traverses…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["nary-vs-reac4cat","blank-nodes","def-bridge-node","def-reactionparticipant","def-property-graph","def-biopax-sbml","def-stoichiometric-coefficient","def-arity"],points:["Participation is n-ary: a `ReactionParticipant` bridge node carries the entity, the role and the stoichiometric coefficient, because a plain `hasSubstrate` has nowhere to put a coefficient. BioPAX (`Stoichiometry`) and SBML (`SpeciesReference`) both do the same thing.","one participation, three attributes: `tacat:PART_0000002_01 tacat:participatingEntity tacat:CHEBI_57972 ; tacat:participantRole tacat:Reactant ; tacat:stoichiometricCoefficient 1.0 .`"]},Ml={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"N-Triples — what is it?",short:"one complete triple per line, in full, with no prefixes and no abbreviations",say:"The simplest RDF serialisation. Every line is one statement written out completely — subject, predicate and object as absolute IRIs in angle brackets, `_:` blank-node labels or quoted literals, ended by a full stop. No prefixes and no nesting, which makes it line-oriented, streamable and trivially diffable, at the cost of being unreadable in bulk.",glossary:["n-triples"],heard:["N-Triples",".nt","ntriples"],warn:"BACKGROUND — Format is not content: parse N-Triples, emit Turtle, and the graph…",see:["def-turtle","def-graph","def-rdf","def-rdf-xml","def-json-ld","def-graph-isomorphism-vs-byte-equality"],points:["Not used. The project reads and writes Turtle (`data/reactions.ttl`, `data/shapes.ttl`) and the endpoint serves Turtle for graph queries. The CS primer shows N-Triples once, to demonstrate that the serialisations carry the same triples.",'`<https://w3id.org/bitspark/tacat/CHEBI_57972> <http://www.w3.org/2000/01/rdf-schema#label> "L-alanine" .`']},Hl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"named graph / default graph — what is it?",short:"a graph with an IRI inside a dataset, versus the one graph a query reads by default",say:"A SPARQL dataset is one *default graph* plus zero or more *named graphs*, each identified by an IRI. `GRAPH ?g { … }` and `FROM NAMED` address the named ones; a pattern outside a `GRAPH` block reads the default graph. Named graphs are how provenance is attached per source or per batch without reifying individual triples — the fourth element that turns a triple into a quad.",glossary:["named-graph"],heard:["named graph / default graph","named graph","default graph","GRAPH ?g","FROM NAMED","quad"],warn:"A `GRAPH` query here is well-formed SPARQL 1.1 and answered 400, not 404 or 500…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_named_graph_queries_are_a_bad_request_not_a_server_error"}],see:["sparql-protocol","weak-provenance","def-graph","def-sparql","def-conjunctivegraph","def-prov-o","def-sparql-1-1-protocol","def-triplestore"],points:["There are none. The endpoint serves a single default graph, so provenance is dataset-level, recorded as a known limitation in `DECISIONS.md`. `_explain` in `src/tacat/api/app.py` catches rdflib's bare `ConjunctiveGraph` failure and returns a 400 saying so, rather than a 500.","`SELECT ?o FROM NAMED <http://e/n.ttl> WHERE { GRAPH ?g { ?s ?p ?o } }` — 400 with an explanation"]},zl={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"NCBI Taxonomy / up:organism — what is it?",short:"how UniProt names an organism — a taxonomy IRI keyed on an NCBI taxid, plus the Latin name",say:"NCBI Taxonomy is the curated classification of organisms that the sequence databases key on, each taxon carrying a numeric identifier. UniProt models an organism as an IRI under `purl.uniprot.org/taxonomy/` built from that number, links a protein to it with `up:organism`, and hangs the Latin name off it with `up:scientificName`. Getting a readable organism therefore takes two triples, not one.",glossary:["ncbi-taxonomy-up-organism-up-scientificname"],heard:["NCBI Taxonomy / up:organism","up:organism","up:scientificName","taxon","taxid","organism IRI","NCBI Taxonomy"],warn:"`up:organism` binds an IRI, not a name. Omitting the `up:scientificName` hop…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/cli.py"}],see:["federated-payoff","def-uniprot","def-federation","def-up-mnemonic","def-rh-equation","def-sib","def-iri"],points:["The organism half of `DETAIL_QUERY` in `federated.py`, which follows `up:organism` and then reads `up:scientificName`. The local graph carries no organism at all — that is the demonstration: *which organism expresses enzyme X* is answered by federating, not by the data.","`?protein up:organism ?organism . ?organism up:scientificName ?organismName .`"]},Fl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"necessary and sufficient conditions — what is it?",short:"conditions that both follow from membership and establish it, so a reasoner can classify",say:"A necessary condition holds of every member of a class; a sufficient condition makes anything satisfying it a member. `rdfs:subClassOf` states necessity only, so membership has to be asserted by hand. `owl:equivalentClass` states both, so a reasoner derives membership from the facts about an individual. Without sufficiency nothing is ever concluded — the ontology can only check what you already said.",glossary:["necessary-and-sufficient-conditions"],heard:["necessary and sufficient conditions","equivalent_to","owl:equivalentClass","if and only if","iff","defining conditions"],warn:"Sufficiency is a property of the definition, not a guarantee of truth: anything…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["defined-class","signature-not-mechanism","owl-vs-rdfs","def-primitive-class","def-defined-class","def-subsumption","def-reasoner","def-existential-restriction-and-value-restriction","def-transaminationreaction"],points:["`TransaminationReaction` is declared with Owlready2's `equivalent_to`, a conjunction of four existential restrictions over participant roles. That is what lets HermiT type the three Rhea reactions at build time and leave the glutamate dehydrogenase control unclassified.","`equivalent_to = [BiochemicalReaction & hasParticipant.some(…) & …]`"]},Ul={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"negative control — what is it?",short:"a case included because it must NOT be recognised, so a positive result means something",say:"A case added to an experiment or a test suite precisely because the expected outcome is negative. It measures the discriminating power of the procedure: a definition that recognises everything it was written for, with nothing it is required to reject, is indistinguishable from a definition that recognises everything.",glossary:["negative-control"],heard:["negative control","control","must-not-classify case","REACT_0000099","correctly_excluded"],warn:"It is excluded on arity, not on roles. Two of seven species are modelled and…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/population.py"},{kind:"test",rel:"verified-by",at:"tests/test_competency.py::test_negative_control_is_excluded"}],see:["negative-control","defined-class","def-glutamate-dehydrogenase","def-defined-class","def-signature","def-necessary-and-sufficient-conditions","def-test-oracle","def-data-gate-vs-code-gate"],points:["`REACT_0000099` — glutamate dehydrogenase, EC 1.4.1.2 — added by `_add_negative_control` in `src/tacat/ontology/population.py`. It carries both headline molecules of the transaminations with the roles reversed: L-glutamate consumed, 2-oxoglutarate produced. The CI inference gate asserts one reaction is excluded.",'`assert len(result["correctly_excluded"]) == 1, "the negative control must not be derived"`']},Gl={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"NeOn methodology / Grüninger & Fox 1995 — what is it?",short:"the ontology-engineering methods that make competency questions a specification",say:"Grüninger and Fox (1995) proposed evaluating an ontology by the questions it must answer, each formalised as a query with an expected result — the origin of the competency question. The NeOn methodology, from the EU NeOn project, is a later and broader framework for building ontologies from existing resources through scenarios rather than one waterfall, and it keeps competency questions as its requirements step.",glossary:["neon-methodology"],heard:["NeOn methodology / Grüninger & Fox 1995","NeOn","Gruninger & Fox 1995","Grüninger and Fox","ontology engineering methodology"],warn:"The citation justifies the method, not the questions. CQ01-CQ04 come from…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","def-competency-question","def-out-of-scope-questions","def-ontology","def-nfdi4cat"],points:["Cited once, in the module docstring of `src/tacat/queries/competency.py`, as the reason the questions are treated as a specification rather than as documentation. Nothing else from NeOn is followed — there is no ontology requirements specification document and no reuse-and-reengineering scenario."]},Wl={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"NFDI4Cat — what is it?",short:"the German national research-data infrastructure consortium for catalysis",say:"One consortium of the Nationale Forschungsdateninfrastruktur (NFDI), the German federated programme building research-data infrastructure discipline by discipline. NFDI4Cat covers catalysis in all its forms — heterogeneous, homogeneous, bio- and electrocatalysis — and produces shared vocabularies, metadata profiles and ontologies for the field rather than one central database.",glossary:["nfdi4cat"],heard:["NFDI4Cat","NFDI","Nationale Forschungsdateninfrastruktur","NFDI4Chem"],warn:"NFDI4Cat is the consortium; Meta4Cat, Reac4Cat and voc4cat are its artefacts.…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/competency.py"}],see:["competency-questions","framing","def-voc4cat","def-meta4cat","def-reac4cat","def-dcat-ap-plus","def-competency-question","def-lara-larasuite"],points:["The context for the assessment, and three of its artefacts are used directly: CQ01-CQ04 are quoted from its biocatalysis question set in `nfdi4cat/ontology-development`, `data/dataset.ttl` follows the DCAT-AP+ profile it maintains jointly with NFDI4Chem, and the opaque `REACT_0000001` IRI shape copies voc4cat."]},Kl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"node shape vs property shape — what is it?",short:"a node shape constrains the node itself; a property shape constrains values down one path",say:"In SHACL a *node shape* constrains a focus node as a whole — its node kind, its class, whether it is closed — and says which nodes it applies to through a target such as `sh:targetClass`. A *property shape* carries an `sh:path` and constrains the values reached along it: how many, of what datatype, drawn from what set. A node shape reaches its property shapes through `sh:property`, usually as inline blank nodes.",glossary:["node-shape-vs-property-shape"],heard:["node shape vs property shape","sh:NodeShape","sh:PropertyShape","sh:property","sh:targetClass","sh:path"],warn:"`sh:message` means different things at the two levels: on a node shape it…",refs:[{kind:"test",rel:"verified-by",at:"tests/test_shapes.py::test_shapes_reject_bad_data"}],see:["why-both-owl-shacl","blank-nodes","def-shacl","def-sh-pattern","def-sh-severity","def-qualified-value-shape","def-blank-node","def-reactionparticipant"],points:["`data/shapes.ttl` declares six node shapes — one per target class plus one for `dcat:Dataset` — each with its property shapes inline. The participant node shape's own `sh:nodeKind sh:IRI` forbids blank-node bridge nodes; its property shapes pin entity, role and coefficient to exactly one each.","`sh:property [ sh:path tacat:participantRole ; sh:minCount 1 ; sh:maxCount 1 ]`"]},Ql={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"NotAcceptable / 406 — what is it?",short:"the Accept header asks for a representation that does not exist for this result",say:"HTTP 406 Not Acceptable answers a request whose `Accept` header names only representations the server cannot produce. It is a client error: the resource exists and the request is well formed, but the *format* asked for does not exist for it. Distinct from 400, where the request itself is wrong, and from 500, where the server broke.",glossary:["notacceptable-406"],heard:["NotAcceptable / 406","NotAcceptable","HTTP 406","406 status"],warn:"406 is about representations, not query forms. A CONSTRUCT asking for…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/api/negotiation.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/api/app.py"},{kind:"test",rel:"verified-by",at:"tests/test_api.py::test_csv_requested_for_ask_is_406_not_500"}],see:["sparql-protocol","def-content-negotiation","def-sparql-results-media-types-and-406","def-query-form","def-policyviolation","def-sparql-1-1-protocol","def-lazy-evaluation"],points:["`NotAcceptable` is raised in `src/tacat/api/negotiation.py` and mapped to 406 in `app.py`. The case that produced it: CSV is defined for SELECT only, so asking `text/csv` of an ASK made rdflib raise mid-serialisation and surfaced as a 500 for what is the caller's mistake.","`text/csv is only available for SELECT results, not ASK`"]},Vl={kind:"definition",area:"engineering",stance:"fact",icon:"container",q:"NotJoinable — what is it?",short:"raised when the built graph carries no identifier to federate on, instead of falling back",say:"An exception for the case where local data cannot supply the keys a federated join is built on. Naming it makes the absence of join keys a failure rather than a fallback: code that quietly substitutes its own constants when the graph has nothing to offer still returns rows, and those rows say nothing about the data that was actually published.",glossary:["notjoinable"],heard:["NotJoinable","rhea_iris_from_graph","no join key","LOCAL_RHEA_IRIS"],warn:"It proves the graph carries join keys, not that the join returns anything. A…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/queries/federated.py"},{kind:"test",rel:"verified-by",at:"tests/test_federated.py::test_an_unjoinable_graph_is_refused_not_papered_over"}],see:["federated-payoff","def-federation","def-rhea","def-rhea-master-and-directional-children","def-sib","def-uriref","def-etl"],points:["`NotJoinable` in `src/tacat/queries/federated.py`. `rhea_iris_from_graph()` reads the Rhea master IRIs out of the built artefact and raises if the file is missing or the result is empty. That defect has occurred twice — identifiers stored as strings, then behind a link property a federated query does not follow.","`?reaction a <https://w3id.org/bitspark/tacat/BiochemicalReaction> ; a ?rhea`"]},Jl={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"object property vs data property — what is it?",short:"an object property points at an individual; a data property points at a literal",say:"OWL splits binary relations by what may stand on the right. An object property relates an individual to another individual, so its range is a class and the value can be followed onward to more triples. A data property relates an individual to a literal — a string, a number, a date — and the value is a dead end. OWL 2 DL keeps the two vocabularies apart, and reasoners treat them differently.",glossary:["object-property-vs-data-property"],heard:["object property vs data property","owl:ObjectProperty","owl:DatatypeProperty","ObjectProperty","DataProperty","datatype property"],warn:"The identifier argument turns on this split: an external identifier carried as…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["what-the-role-is","identifiers-verified","def-literal","def-domain-and-range","def-participantrole","def-kineticmechanism","def-hascofactor","def-owl-2-dl"],points:["`src/tacat/ontology/schema.py` declares six object properties (`hasParticipant`, `participatingEntity`, `participantRole`, `catalysedBy`, `hasCofactor`, `hasReversibility`) and three data properties (`stoichiometricCoefficient`, `systematicName`, `kineticMechanism`). Roles point at individuals precisely so they join.","`class participantRole(ObjectProperty, FunctionalProperty)` vs `class kineticMechanism(DataProperty, FunctionalProperty)`"]},Yl={kind:"definition",area:"method",stance:"fact",icon:"checklist",q:"OBO Foundry FP-005 — what is it?",short:"OBO Foundry principle 5 — import terms that are out of scope, do not mint your own",say:"OBO Foundry principle 5, *Scope*: an ontology states the domain it covers, and terms outside that domain are imported from the ontology that owns them rather than reinvented. It is the orthogonality rule — two identifiers for one substance split a community across a join that then returns nothing, silently.",glossary:["obo-foundry-fp-005"],heard:["OBO Foundry FP-005","FP-005","principle 5","Scope","delineated content","orthogonality"],warn:"It is enforced for chemicals, reactions and enzymes. tacat still mints local…",refs:[{kind:"code",rel:"decided-in",at:"DECISIONS.md"},{kind:"source",rel:"cited-as",at:"OBO Foundry principle FP-005"}],see:["mint-vs-reuse","identifiers-verified","def-obo-foundry","def-shacl","def-chebi","def-purl","def-opaque-identifier","def-qualified-value-shape"],points:["Cited by name in the SHACL message requiring every chemical entity to be an instance of exactly one `CHEBI_nnnn` class (`data/shapes.ttl:159`), so minting a local `:Water` fails the build rather than merely contradicting a stated intention. `DECISIONS.md` records the same rule.","tacat:CHEBI_29985  a  <http://purl.obolibrary.org/obo/CHEBI_29985> , tacat:AminoAcid ."]},Xl={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"OBO Foundry — what is it?",short:"The biomedical ontology community and its shared principles",say:"OBO Foundry is a collaborative of biomedical ontology developers and the set of principles their ontologies commit to: one shared IRI pattern under `purl.obolibrary.org/obo/`, orthogonal scope so two ontologies do not both define the same term, open licensing, and versioning. Its numbered principles are cited by number — FP-005 is *Scope*, from which the rule to import a term rather than mint a rival for it follows.",glossary:["obo-foundry"],heard:["OBO Foundry","Open Biological and Biomedical Ontologies","OBO","obolibrary"],warn:"Membership is a property of the ontology, not of the URL shape. Copying the…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"},{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/linking.py"}],see:["mint-vs-reuse","def-obo-foundry-fp-005","def-purl","def-opaque-identifier","def-chebi","def-ec-number","def-ontology"],points:["ChEBI is an OBO Foundry ontology, which is why every molecule in the graph is typed against a `purl.obolibrary.org/obo/CHEBI_` class. There is no OBO ontology for EC numbers, so enzyme classes come from UniProt instead — an absence worth being able to state.","http://purl.obolibrary.org/obo/CHEBI_29985"]},Zl={kind:"definition",area:"identity",stance:"fact",icon:"purl-tag",q:"OLS — what is it?",short:"EBI's search interface and API over the OBO ontologies, including ChEBI",say:"The Ontology Lookup Service is the EBI's browser and REST API over the ontologies it hosts — ChEBI, GO, EFO and the rest of the OBO set. It resolves a term to its definition, synonyms, parents and cross-references, and is the usual programmatic route to ChEBI, which does not publish a SPARQL endpoint of its own the way Rhea and UniProt do.",glossary:["ols"],heard:["OLS","Ontology Lookup Service","EBI OLS","ols4"],warn:"BACKGROUND — Not an identifier source here. Resolving a chemical from a name…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/reference_data.py"}],see:["identifiers-verified","def-ebi","def-chebi","def-obo-foundry","def-sparql","def-tautomer","def-federation"],points:["Named once, in the database landscape table, as ChEBI's query route. Nothing in the submission calls it: the federation joins Rhea and UniProt only, and ChEBI enters the graph as identifiers verified by hand into `reference_data.py`."]},eh={kind:"definition",area:"chemistry",stance:"fact",icon:"cofactor-cycle",q:"ω-transaminase vs α-transaminase — what is it?",short:"which amino group moves — the one beside the carboxylate, or one further away",say:"In an α-transaminase the amino group transferred sits on the α-carbon, the carbon carrying the carboxylate, so donor and acceptor are an amino acid and a 2-oxo acid. An ω-transaminase (amine transaminase, ATA) acts on an amino group remote from any carboxylate, or on a plain amine with none at all, running amine + keto acid ⇌ ketone + amino acid. Same cofactor, same ping-pong mechanism, different substrate classes.",glossary:["omega-transaminase-vs-alpha-transaminase"],heard:["ω-transaminase vs α-transaminase","ATA (amine transaminase)","alpha-transaminase","ω-TA","α-TA"],warn:"The likeliest hard question, because LARA screens ATAs. Answer with the fix: α…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["omega-transaminase","defined-class","def-transaminase","def-defined-class","def-conjunct","def-transaminationreaction","def-chirality-chiral-amine","def-sitagliptin"],points:["All three shipped reactions are α-transaminations. The defined class requires an amino-acid reactant and a 2-oxo-acid product, so for an ω reaction two of the four conjuncts fail and HermiT does not classify it. What overclaims is the class *name*, `TransaminationReaction`, not the axioms under it."]},th={kind:"definition",area:"modelling",stance:"fact",icon:"triple",q:"ontology — what is it?",short:"a shared vocabulary plus logical statements about it that a machine can compute over",say:"An ontology names the classes, properties and individuals of a domain and states axioms relating them — subclass, disjointness, domain and range, definitions. The axioms are what separates it from a schema or a data dictionary: they are premises a reasoner draws conclusions from, not rules a database enforces on write. In RDF an ontology is itself a graph, and the word covers both the model and the file carrying it.",glossary:["ontology"],heard:["ontology","domain ontology","vocabulary plus axioms"],warn:"An ontology enforces nothing. Data contradicting it is not rejected; it is…",refs:[{kind:"code",rel:"implemented-in",at:"src/tacat/ontology/schema.py"}],see:["owl-vs-rdfs","why-both-owl-shacl","def-owl","def-t-box","def-a-box","def-axiom","def-reasoner","def-shacl"],points:["The vocabulary is written in Pyt
